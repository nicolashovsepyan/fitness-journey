/* ---- the deck itself ---- */
function deck(s){
  const set=deckSet();
  const res={}; let k=0;
  const d=el(`<div class="deckwrap">
      <div class="dkdots"></div>
      <div class="dkstack"></div>
      <div class="dkbtns">
        <button class="dkbtn no">Not really</button>
        <button class="dkbtn yes">I do this</button>
      </div>
      <div class="dkhint">Or swipe the card</div>
    </div>`);
  setFoot('');
  const stackEl=d.querySelector('.dkstack'), dotsEl=d.querySelector('.dkdots');
  const btnNo=d.querySelector('.dkbtn.no'), btnYes=d.querySelector('.dkbtn.yes');
  const btnRow=d.querySelector('.dkbtns'), hintEl=d.querySelector('.dkhint');

  function dots(){ dotsEl.innerHTML=set.map((_,j)=>
    `<i class="${j<k?'done':(j===k?'now':'')}"></i>`).join(''); }

  function card(j){
    const c=set[j];
    const e=document.createElement('div');
    e.className='dkcard';
    e.innerHTML=`<div class="dkvid">${deckArt(c.id)
        ? `<img class="dkart" src="${deckArt(c.id)}" alt="">`
        : poseSvg(c.a)}
        <div class="dkstamp yes">I do this</div><div class="dkstamp no">Not really</div></div>
      <div class="dkcap"><b>${c.n}</b><span>${c.hint}</span></div>
      <div class="dkbands">
        <div class="bq">${bandQ(c)}</div><div class="bh">${c.n} — rough is fine.</div>
        ${bandsFor(c).map(v=>`<button data-v="${v}">${v}</button>`).join('')}
      </div>`;
    return e;
  }

  function paint(){
    stackEl.innerHTML='';
    if(k>=set.length){ finish(); return; }
    if(k+1<set.length){
      const back=card(k+1);
      back.style.transform='scale(.955) translateY(9px)';
      back.style.opacity='.5'; back.style.pointerEvents='none';
      stackEl.appendChild(back);
    }
    const top=card(k);
    stackEl.appendChild(top);
    wire(top, set[k]);
    dots();
    btnRow.style.display=''; hintEl.style.display='';
  }

  function wire(e,c){
    const yes=e.querySelector('.dkstamp.yes'), no=e.querySelector('.dkstamp.no');
    const bandsEl=e.querySelector('.dkbands');
    let sx=0,sy=0,dx=0,dy=0,on=false,lock=null,armed=true;

    e.addEventListener('pointerdown',function(ev){
      if(!armed) return;
      on=true;lock=null;sx=ev.clientX;sy=ev.clientY;dx=0;dy=0;
      e.style.transition='none';
      try{e.setPointerCapture(ev.pointerId);}catch(err){}
    });
    e.addEventListener('pointermove',function(ev){
      if(!on) return;
      dx=ev.clientX-sx; dy=ev.clientY-sy;
      if(lock===null && (Math.abs(dx)>6||Math.abs(dy)>6)) lock=Math.abs(dx)>Math.abs(dy)?'x':'y';
      if(lock!=='x') return;
      e.style.transform='translateX('+dx+'px) rotate('+(dx*0.042)+'deg)';
      yes.style.opacity = dx>0?Math.min(1,dx/88):0;
      no.style.opacity  = dx<0?Math.min(1,-dx/88):0;
    });
    function release(){
      if(!on) return; on=false;
      e.style.transition='transform .28s cubic-bezier(.3,.8,.3,1),opacity .28s';
      if(lock==='x' && Math.abs(dx)>80) fly(dx>0);
      else { e.style.transform=''; yes.style.opacity=0; no.style.opacity=0; }
    }
    e.addEventListener('pointerup',release);
    e.addEventListener('pointercancel',release);

    function fly(does){
      if(!armed) return;
      armed=false;
      if(!does){
        e.style.transform='translateX(-460px) rotate(-20deg)'; e.style.opacity='0';
        res[c.id]={does:false}; haptic(12); k++; later(paint,180); return;
      }
      haptic(9);
      e.style.transition='transform .2s'; e.style.transform='';
      yes.style.opacity=0; no.style.opacity=0;
      btnRow.style.display='none'; hintEl.style.display='none';
      bandsEl.classList.add('on');
      bandsEl.querySelectorAll('button').forEach(function(b){
        b.onclick=function(){ haptic(14); b.classList.add('on');
          res[c.id]={does:true, band:b.dataset.v};
          later(function(){ e.style.transition='transform .28s,opacity .28s';
            e.style.transform='translateX(460px) rotate(20deg)'; e.style.opacity='0';
            k++; later(paint,180); },130);
        };
      });
    }
    e._fly=fly;
  }

  btnNo.onclick=function(){ const t=stackEl.lastElementChild; if(t&&t._fly) t._fly(false); };
  btnYes.onclick=function(){ const t=stackEl.lastElementChild; if(t&&t._fly) t._fly(true); };

  function finish(){
    A[s.key]=res; deriveLevels();
    const does=Object.keys(res).filter(function(x){return res[x].does;}).length;
    btnRow.style.display='none'; hintEl.style.display='none';
    dotsEl.innerHTML=set.map(()=>'<i class="done"></i>').join('');
    stackEl.innerHTML=`<div class="dkcard" style="border-color:var(--line2);align-items:center;justify-content:center;padding:26px;text-align:center">
      <div style="font-size:24px;font-weight:600;letter-spacing:-.02em;margin-bottom:10px">That's your baseline.</div>
      <div style="font-size:14.5px;line-height:1.5;color:var(--ink2);max-width:250px">
        ${does} of ${set.length} movements, with numbers. Everything I build starts from these.</div></div>`;
    setFoot(`<button class="cta accent">Continue</button>`);
    foot.querySelector('.cta').onclick=()=>{haptic(400);next();};
  }

  paint();
}

/* ================= SILHOUETTE SCALE =================
   A pictorial figure-rating scale. Validated instruments of this kind track
   measured body composition far better than asking someone their weight —
   and they need one tap, no scale, and no number to be ashamed of. */
const SIL_M = [
  {sh:25, ch:23, wa:15, hi:19, th:10, t:'Thin'},
  {sh:33, ch:29, wa:16, hi:22, th:15, t:'Athletic'},
  {sh:30, ch:29, wa:24, hi:27, th:15, t:'Average'},
  {sh:33, ch:34, wa:33, hi:34, th:19, t:'Soft'},
  {sh:36, ch:40, wa:42, hi:42, th:24, t:'Overweight'}
];
const SIL_F = [
  {sh:21, ch:20, wa:14, hi:22, th:11, t:'Thin'},
  {sh:27, ch:25, wa:15, hi:26, th:15, t:'Athletic'},
  {sh:25, ch:25, wa:21, hi:31, th:16, t:'Average'},
  {sh:28, ch:29, wa:28, hi:37, th:20, t:'Soft'},
  {sh:31, ch:35, wa:38, hi:44, th:26, t:'Overweight'}
];
function silScale(){ return (A.sex==='f') ? SIL_F : SIL_M; }

/* ---- avatar artwork ----------------------------------------
   Rendered body types: five figures per sheet, one sheet per sex per
   age band, transparent background. Parsed out of a JSON island the
   first time this screen is reached — same reasoning as the deck
   artwork, and the same reason it is not a JS object literal.

   Built by tools/build-avatars.mjs. A sheet that does not exist yet
   is not an error: avatarArt returns nothing and the drawn silhouette
   renders instead, in the same box, so the screen never breaks while
   the artwork is still being made.

   The band edges are the ones the sheets were drawn to. Age is asked
   in Chapter 1, three screens before this one, so it is always known
   by the time we need to choose. */
const AVATAR_TYPES = ['thin','athletic','average','soft','overweight'];
function ageBand(a){ return a>=55 ? 'a3' : a>=38 ? 'a2' : 'a1'; }
let _avatarart=null;
function avatarArt(k){
  if(_avatarart===null){
    const n=document.getElementById('avatarart');
    try{ _avatarart = n ? JSON.parse(n.textContent) : {}; }
    catch(e){ _avatarart={}; }
  }
  const sex = (A.sex==='f') ? 'f' : 'm';
  return _avatarart[sex+'_'+ageBand(A.age||38)+'_'+AVATAR_TYPES[k]];
}
/* Parametric placeholder. To drop in real artwork, return an <img>/<svg>
   keyed on the rung index and the athletic flag — nothing else changes. */
function silSvg(f){
  const cx=58, yTop=27, yWa=74, yHi=104, yFoot=170;
  const maxW=Math.max(f.sh,f.ch,f.wa,f.hi);
  const aw=f.th*0.62;                                  /* arm thickness */
  const torso =
    `M${cx-f.sh} ${yTop}`+
    `C${cx-f.ch} ${yTop+17},${cx-f.wa} ${yWa-15},${cx-f.wa} ${yWa}`+
    `C${cx-f.wa} ${yWa+13},${cx-f.hi} ${yHi-11},${cx-f.hi} ${yHi}`+
    `L${cx+f.hi} ${yHi}`+
    `C${cx+f.hi} ${yHi-11},${cx+f.wa} ${yWa+13},${cx+f.wa} ${yWa}`+
    `C${cx+f.wa} ${yWa-15},${cx+f.ch} ${yTop+17},${cx+f.sh} ${yTop}`+
    `Q${cx} ${yTop-13} ${cx-f.sh} ${yTop}Z`;
  const arm=(sgn)=>{
    const oT=cx+sgn*(f.sh-1), iT=cx+sgn*(f.sh-1-aw);
    const oB=cx+sgn*(maxW+0.5), iB=cx+sgn*(maxW+0.5-aw*1.1);
    return `M${oT} ${yTop+9}L${iT} ${yTop+11}L${iB} ${yWa+34}L${oB} ${yWa+36}Z`;
  };
  const leg=(sgn)=>`M${cx+sgn*f.hi} ${yHi-2}L${cx+sgn*1.6} ${yHi-2}`+
    `L${cx+sgn*1.6} ${yFoot}L${cx+sgn*f.th*0.95} ${yFoot}Z`;
  const nw=Math.max(5.5,f.wa*0.26);
  return `<svg viewBox="0 0 116 176" preserveAspectRatio="xMidYMid meet">`+
    `<circle cx="${cx}" cy="12" r="${9+(f.wa-15)*0.075}"/>`+
    `<path d="M${cx-nw} 19L${cx+nw} 19L${cx+nw} ${yTop+3}L${cx-nw} ${yTop+3}Z"/>`+
    `<path d="${arm(-1)}"/><path d="${arm(1)}"/>`+
    `<path d="${torso}"/><path d="${leg(-1)}"/><path d="${leg(1)}"/></svg>`;
}
const SHAPE_NOTE = {
  0:'Light frame. Building tissue matters more than losing anything.',
  1:'Trained already. We push performance, not composition.',
  2:'Middle of the range. The most trainable place to start from.',
  3:'Common starting point. Strength moves fast from here.',
  4:'Plenty to work with. Joints get loaded carefully, volume builds slowly.'
};
function shape(s){
  const scale=silScale();
  let pick={};
  const cards=(w)=>scale.map((f,k)=>{
    const art=avatarArt(k);
    const fig = art ? `<img src="${art}" alt="" draggable="false">` : silSvg(f);
    return `<button class="sil" data-w="${w}" data-k="${k}">${fig}<b>${f.t}</b></button>`;
  }).join('');
  const d=el(`${head(s)}
    <div class="silsec"><div class="sillabel">You, now</div>
      <div class="silrow" id="rowNow">${cards('now')}</div>
      <div class="silnote" id="noteNow">Tap the closest one.</div></div>
    <div class="silsec"><div class="sillabel">Where you would like to be</div>
      <div class="silrow" id="rowGoal">${cards('goal')}</div>
      <div class="silnote" id="noteGoal">Optional — skip it if you would rather not say.</div></div>`);
  const noteNow=d.querySelector('#noteNow'), noteGoal=d.querySelector('#noteGoal');
  setFoot(`<button class="cta ghost">Skip for now</button>`);
  const cta=foot.querySelector('.cta');
  const sync=()=>{
    const has = pick.now!==undefined;
    cta.classList.toggle('accent',has); cta.classList.toggle('ghost',!has);
    cta.textContent = has?'Continue':'Skip for now';
    if(has) noteNow.textContent = SHAPE_NOTE[pick.now];
    if(pick.goal!==undefined && has){
      const gap = pick.now - pick.goal;
      noteGoal.textContent = gap<=0 ? 'Noted. We build, we do not shrink.'
        : gap>=3 ? 'That is a real distance. I will give you an honest timeline, not a fast one.'
        : gap===1 ? 'Close. That is a matter of months, not years.'
        : 'Reachable. It will take longer than the internet tells you, and it will hold.';
    }
  };
  d.querySelectorAll('.sil').forEach(b=>b.onclick=()=>{haptic(13);
    const w=b.dataset.w;
    d.querySelectorAll('.sil[data-w="'+w+'"]').forEach(x=>x.classList.remove('on'));
    b.classList.add('on'); pick[w]=+b.dataset.k; sync();});
  cta.onclick=()=>{haptic(14);A[s.key]={now:pick.now, goal:pick.goal};next();};
  sync();
}

/* ================= PROFILE PAYLOAD + HANDOFF ================= */
/* Drop a form endpoint here (Formspree, Google Apps Script, anything that
   accepts a JSON POST) and finished profiles land in the inbox automatically.
   Left blank, the link-based handoff below still works with no backend. */
const ENDPOINT = '';

function payload(){
  return {v:6, at:new Date().toISOString(), a:A};
}
function encodeProfile(o){
  const j=JSON.stringify(o);
  const b=btoa(unescape(encodeURIComponent(j)));
  return b.replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function profileLink(){
  const base=location.href.split('#')[0].replace(/onboarding\.html.*$/,'');
  return base+'profile.html#'+encodeProfile(payload());
}
function saveLocal(){
  try{
    const all=JSON.parse(localStorage.getItem('fj_profiles')||'[]');
    all.push(payload());
    localStorage.setItem('fj_profiles',JSON.stringify(all));
    localStorage.setItem('fj_current',JSON.stringify(payload()));
    return true;
  }catch(e){ return false; }
}
function postEndpoint(){
  if(!ENDPOINT) return Promise.resolve(false);
  return fetch(ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify(payload())}).then(r=>r.ok).catch(()=>false);
}

/* reveal — a proposal, not a prediction. They edit it before it is built. */
const DAYNAME=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const DEFAULT_WEEK={1:[2],2:[0,3],3:[0,2,5],4:[0,1,3,5],5:[0,1,3,4,6],6:[0,1,2,3,4,6]};
const SLOTS=[['early','Early morning','6:15am'],['lunch','Midday','12:30pm'],
             ['after','After work','5:45pm'],['evening','Evening','8:30pm'],
             ['flex','Whenever I can','']];
function reveal(){
  let picked = (A.trainDays && A.trainDays.length)
    ? A.trainDays.slice()
    : (DEFAULT_WEEK[A.days||3]||DEFAULT_WEEK[3]).slice();
  let slot = A.when || 'after';
  const len=({'20':'22','35':'35','55':'50','75':'60'})[A.length]||'35';

  const d=el(`<h1 class="q">Here's the week I'd give you.</h1>
    <p class="sub">Tap to change it. This is the version I build.</p>
    <div class="wkpick" id="wk">${DAYNAME.map((n,k)=>
      `<button data-k="${k}"><span class="wd">${n[0]}</span><span class="wm"></span></button>`).join('')}</div>
    <p class="wkcount" id="wkc"></p>
    <div class="sillabel" style="margin-bottom:9px">Usually at</div>
    <div class="segrow" id="slots" style="flex-wrap:wrap">${SLOTS.map(t=>
      `<button data-t="${t[0]}" style="flex:1 1 44%">${t[1]}</button>`).join('')}</div>
    <div id="preds" style="margin-top:22px"></div>`);

  const wk=d.querySelector('#wk'), wkc=d.querySelector('#wkc'), preds=d.querySelector('#preds');
  setFoot(`<button class="cta accent">This is my week</button>`);
  const cta=foot.querySelector('.cta');

  function paint(){
    picked.sort((a,b)=>a-b);
    wk.querySelectorAll('button').forEach(b=>b.classList.toggle('on',picked.indexOf(+b.dataset.k)>-1));
    d.querySelectorAll('#slots button').forEach(b=>b.classList.toggle('on',b.dataset.t===slot));
    const names=picked.map(k=>DAYNAME[k]);
    wkc.innerHTML = picked.length
      ? `<b>${picked.length} ${picked.length===1?'day':'days'}</b> · ${names.join(', ')} · ${len} min`
      : 'Pick at least one day.';
    const t=(SLOTS.filter(x=>x[0]===slot)[0]||[])[2];
    const first=names[0], second=names[1], last=names[names.length-1];
    let h='';
    if(picked.length){
      h+=`<div class="pred"><span class="pd">${first}</span><span class="pt">Session one${t?', <b>'+t+'</b>':''}, ${len} min. You'll finish thinking it was too easy. <b>That's the plan.</b></span></div>`;
      if(second) h+=`<div class="pred"><span class="pd">${second}</span><span class="pt">This one feels easier than the first. That's your nervous system, not fitness. Fitness starts week three.</span></div>`;
      if(picked.length>1) h+=`<div class="pred"><span class="pd">${last}</span><span class="pt">The one that matters. <b>You'll want to skip it.</b> Do it anyway and your odds of still being here in six months roughly double.</span></div>`;
    }
    preds.innerHTML=h;
    cta.disabled = picked.length===0;
    syncFootPad();
  }
  wk.querySelectorAll('button').forEach(b=>b.onclick=()=>{haptic(12);
    const k=+b.dataset.k, i=picked.indexOf(k);
    if(i>-1) picked.splice(i,1); else picked.push(k);
    paint();});
  d.querySelectorAll('#slots button').forEach(b=>b.onclick=()=>{haptic(12);slot=b.dataset.t;paint();});
  cta.onclick=()=>{ if(!picked.length) return; haptic(400);
    A.trainDays=picked.slice(); A.days=picked.length; A.when=slot; next(); };
  paint();
}

/* pattern + roadmap */
function patternscreen(){
  const p=pattern();
  const gate=(A.patterns||[]).includes('squat')?'':
    `<div class="pred"><span class="pd">Note</span><span class="pt">You haven't trained a <b>squat pattern</b> regularly, so I'm not loading one yet. You'll earn it — unassisted, then eccentric, then loaded.</span></div>`;
  el(`<div class="eyebrow ctr">What I already think I know</div>
    <div class="patcard"><div class="pl">Your pattern</div><div class="pn">${p.n}</div><div class="pb">${p.b}</div></div>
    <button class="notme" id="notme">That's not me →</button>
    ${gate}
    <div class="later"><h4>And what I don't know yet.</h4>
      <div class="li"><span>Day 3</span><span>Whether session one was the right load. One tap.</span></div>
      <div class="li"><span>Week 2</span><span>What time you <em>really</em> train — from your logs.</span></div>
      <div class="li"><span>Week 4</span><span>How much you recover from. Solved, never asked.</span></div>
      <div class="li"><span>Month 2</span><span>Sleep, stress, food — once I've earned the right to ask.</span></div>
      <div class="li"><span>Ongoing</span><span>Which exercises you quietly avoid.</span></div></div>`);
  document.getElementById('notme').onclick=()=>{haptic(14);
    toast('Good. Tell me what I got wrong and I rebuild it — the model changes, not the label.',3400);};
  setFoot(`<button class="cta accent">This is right</button>`);
  foot.querySelector('.cta').onclick=()=>{haptic(400);next();};
}

/* building — 24h, human review, and the deck to do meanwhile */
function building(){
  const dt=new Date(); dt.setDate(dt.getDate()+1);
  const when=dt.toLocaleDateString('en-GB',{weekday:'long'})+' morning';
  el(`<div class="eyebrow ctr">What happens next</div>
    <h1 class="q">Your program is being written.</h1>
    <div style="text-align:center"><span class="eta">${ico('clock')} Ready ${when}</span></div>
    <p class="sub">Not generated and forgotten. Built from your answers, then <b>read line by line by a human coach</b>. That's why it takes a day and not a second.</p>
    <div class="byline"><div class="avatar">N</div>
      <div><b>Nico</b>Reviews and adjusts every program before it ships</div></div>
    <div class="todo"><h4>Twenty cards while you wait</h4>
      <p>One exercise per card. Swipe right if you know it, left if you want me to show you. A minute, and it decides what I explain and what I assume.</p></div>
    <p class="micro" style="text-align:center">You'll get a notification the moment it's ready.</p>`);
  setFoot(`<button class="cta accent">Start the cards</button><button class="skip">Later</button>`);
  foot.querySelector('.cta').onclick=()=>{haptic(400);A.cardsNow=true;next();};
  foot.querySelector('.skip').onclick=()=>{haptic(14);A.cardsNow=false;next();};
}

/* entry 001 — the Log opens, and the profile goes to the coach */
function entry(){
  const dt=new Date(), ds=dt.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
  const nPat=(A.patterns||[]).length, totPat=A.patternsTotal||8;
  const saved=saveLocal();
  const link=profileLink();
  el(`<div class="hero" style="justify-content:flex-start;padding-top:4px">
    <div class="mark" style="width:44px;margin-bottom:16px">${MARK}</div>
    <div class="eyebrow">${A.name?A.name+"'s Log":'Your Log'} &middot; Entry 001</div>
    <h1 style="font-size:30px">That's the<br><em>first rep.</em></h1>
    <p style="font-size:15px">It counts, and it's logged. Everything from here is just the next one.</p>
    <div class="logcard">
      <div class="lgrow"><span>Opened</span><b>${ds}</b></div>
      <div class="lgrow"><span>Horizon</span><b>Age ${horizonAge(A.age||38)}</b></div>
      <div class="lgrow"><span>Profile</span><b>78% complete</b></div>
      <div class="lgrow"><span>Movements logged</span><b>${nPat} of ${totPat} patterns</b></div>
      <div class="lgrow"><span>Check-in</span><b>${({sun:'Sundays',mon:'Mondays',fri:'Fridays',wed:'Wednesdays'})[A.checkin]||'Sundays'}</b></div>
    </div>
    <div class="sendbox">
      <h4>Send it to your coach</h4>
      <p>Everything you just answered, in one link. Nico reads it, builds the program, and it comes back within 24 hours.</p>
      <div class="sendrow">
        <button class="pri" id="sendBtn">Send my profile</button>
        <button id="copyBtn">Copy link</button>
      </div>
      <div id="sentMark"></div>
    </div>
    <p class="micro">Nothing gets overwritten. When something changes it becomes a new entry with a new date.${saved?'':' <b>Note:</b> this browser blocked local saving — use the link.'}</p></div>`);

  const mark=document.getElementById('sentMark');
  const done=(t)=>{ mark.innerHTML='<div class="sentmark"><svg viewBox="0 0 24 24"><path d="M4 12l5 5L20 6"/></svg>'+t+'</div>'; };

  postEndpoint().then(function(ok){ if(ok) done('Sent to your coach.'); });

  document.getElementById('sendBtn').onclick=function(){
    haptic(400);
    const subject='Fitness Journey profile — '+(A.name||'new client');
    const body='Profile for '+(A.name||'a new client')+
      (A.email?' ('+A.email+')':'')+':\n\n'+link+'\n\nOpen the link to see the full intake.';
    if(navigator.share){
      navigator.share({title:subject, text:'My Fitness Journey profile', url:link})
        .then(function(){ done('Sent.'); })
        .catch(function(){});
      return;
    }
    location.href='mailto:?subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(body);
    done('Opening your mail app…');
  };
  document.getElementById('copyBtn').onclick=function(){
    haptic(14);
    const fin=function(){ done('Link copied. Paste it anywhere.'); };
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(link).then(fin).catch(fallback);
    } else fallback();
    function fallback(){
      const ta=document.createElement('textarea'); ta.value=link;
      ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.select();
      try{document.execCommand('copy'); fin();}catch(e){ prompt('Copy this link:', link); }
      document.body.removeChild(ta);
    }
  };

  setFoot(`<button class="cta accent">Open my Log</button>`);
  foot.querySelector('.cta').onclick=()=>{haptic(400);toast('This is where the app opens. End of prototype.',4000);};
}

/* dev index */
const idx=document.getElementById('idx');
document.getElementById('dev').onclick=()=>{
  if(!idx.innerHTML){let h='',last=-1;
    FLOW.forEach((s,k)=>{ if(s.ch!==last){h+=`<h5>${CHAPTERS[s.ch]}</h5>`;last=s.ch;}
      const l=s.title||(s.h?s.h.replace(/<[^>]+>/g,' ').slice(0,48):s.type);
      h+=`<button data-k="${k}"><b>${String(k).padStart(2,'0')}</b>${l}</button>`;});
    idx.innerHTML=h;
    idx.querySelectorAll('button').forEach(b=>b.onclick=()=>{idx.classList.remove('on');go(+b.dataset.k);});}
  idx.classList.toggle('on');
};
render();progress();
</script>
