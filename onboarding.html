<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fitness Journey">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="4 minutes. No typing. Then we build your program.">

<meta property="og:description" content="4 minutes. No typing. Then we build your program.">
<meta property="og:url" content="https://nicolashovsepyan.github.io/fitness-journey/onboarding.html">

<title>Fitness Journey</title>
<style>
:root{
  --bg:#171A1E;
  --bg2:#1E232A;
  --card:#212630;
  --surface:#212630;
  --surface2:#282E38;
  --line:#2F3640;
  --line2:#3B434E;
  --ink:#ECEFF3;
  --ink2:#A9B2BC;
  --ink3:#858E99;
  --accent:#3ECBA8;
  --accent-soft:rgba(62,203,168,.13);
  --accent-2:#D9A94C;
  /* The 80s layer. Two more colours from spine/theme.json, each with one
     job — the whole point of the system is that they never drift into
     decoration.
       neon  (Miami)   rails, rules, the heartbeat
       coach (Voltage) only ever a message from a human
     The base above already matched the spine exactly; this is what the
     survey was missing. */
  --neon:#FF5FA2;
  --neon-soft:rgba(255,95,162,.13);
  --neon-line:rgba(255,95,162,.32);
  --neon-glow:0 0 22px rgba(255,95,162,.26);
  --coach:#FFE24A;
  --coach-soft:rgba(255,226,74,.13);
  --coach-line:rgba(255,226,74,.34);
  --red:#F0857A;
  --shadow:0 1px 2px rgba(0,0,0,.30),0 8px 24px rgba(0,0,0,.28);
  --shadow-lift:0 2px 6px rgba(0,0,0,.32),0 18px 44px rgba(62,203,168,.16);
  --r:18px;
  --maxw:820px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
button,.opt,.choice,label,a{touch-action:manipulation}
input[type=range]{touch-action:none}
html{height:100%;-webkit-text-size-adjust:100%}
body{
  height:100%;
  background:#0B0D0F;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",Roboto,sans-serif;
  color:var(--ink);
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;
}
.serif{font-family:"New York","Iowan Old Style",ui-serif,Georgia,serif;font-weight:400}

/* ---------- device frame (desktop only) ---------- */
#device{
  width:min(100vw,402px);
  height:min(874px, calc(100vh - 36px));
  background:var(--bg);position:relative;overflow:hidden;
  border-radius:44px;box-shadow:0 0 0 10px #05070A,0 30px 80px rgba(0,0,0,.6);
}
/* Real touch devices, or a genuinely narrow window: go full-bleed and use the
   REAL visible viewport (100vh on mobile Safari includes the address bar). */
@media (pointer:coarse), (max-width:560px){
  body{align-items:stretch;background:var(--bg)}
  #device{
    width:100%;
    height:100vh;
    height:calc(var(--vh, 1vh) * 100);
    height:100dvh;
    max-height:none;border-radius:0;box-shadow:none;
  }
}
/* Desktop: a small hint that this is a phone prototype */
@media (pointer:fine) and (min-width:900px){
  body::after{
    content:"Phone prototype \2014 resize freely, it stays phone-shaped";
    position:fixed;bottom:18px;left:50%;transform:translateX(-50%);
    font-size:11.5px;color:#8A9098;letter-spacing:.02em;
  }
}

/* ---------- shown only when scripts don't run ---------- */
#nojs{position:fixed;top:0;right:0;bottom:0;left:0;z-index:999;background:var(--bg);
  display:flex;flex-direction:column;justify-content:center;
  padding:calc(env(safe-area-inset-top) + 34px) 26px calc(env(safe-area-inset-bottom) + 34px);
  font-family:inherit}
#nojs .nj-mark{width:min(78%,300px);margin:0 0 34px}
#nojs .nj-mark svg{width:100%;height:auto;display:block}
#nojs .nj-mark path{fill:none;stroke:url(#njGrad);stroke-linecap:round}
#nojs .nj-kick{font-size:11px;letter-spacing:.2em;text-transform:uppercase;
  font-weight:700;color:var(--accent);margin-bottom:14px}
#nojs .nj-h1{margin:0 0 30px;white-space:nowrap;font-size:min(9.2vw,37px);line-height:1.1;
  letter-spacing:-.028em;font-weight:550;color:var(--ink)}
#nojs .nj-note{background:var(--card);border:1px solid var(--line);
  border-left:3px solid var(--accent);border-radius:0 14px 14px 0;padding:16px 18px}
#nojs .nj-note b{color:var(--ink);font-size:14.5px}
#nojs .nj-note p{margin:8px 0 0;font-size:13.5px;line-height:1.5;color:var(--ink2)}
#nojs .nj-url{font-size:12px;color:var(--ink3);word-break:break-all}

/* ---------- chrome ---------- */
#chrome{pointer-events:none;position:absolute;top:0;left:0;right:0;padding:calc(16px + env(safe-area-inset-top)) 20px 10px;z-index:20;background:linear-gradient(var(--bg) 62%,rgba(23,26,30,0))}
#bars{display:flex;gap:4px;height:3px}
.bar{flex:1;background:var(--line);border-radius:2px;overflow:hidden}
/* The rail is the one thing on screen for the whole four minutes, so it is
   where the neon lives. Glow only on the chapter being filled — a glow on
   all eight is a lightshow, and theme.json budgets three per screen. */
.bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:2px;
  transition:width .55s cubic-bezier(.22,1,.36,1)}
.bar.now i{background:var(--neon);box-shadow:0 0 10px var(--neon-line)}
#chapline{display:flex;justify-content:space-between;align-items:center;margin-top:11px;height:16px}
#chapname{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);font-weight:600;transition:opacity .3s}
#back{pointer-events:auto;font-size:12.5px;color:var(--ink3);cursor:pointer;padding:15px 12px;margin:-15px -12px;border:none;background:none;font-family:inherit;opacity:0;pointer-events:none;transition:opacity .3s}
#back.on{opacity:1;pointer-events:auto}

/* ---------- stage ---------- */
#stage{position:absolute;top:0;right:0;bottom:0;left:0;padding:74px 20px 0;overflow:hidden}
.screen{position:absolute;top:calc(74px + env(safe-area-inset-top));left:20px;right:20px;bottom:0;display:flex;flex-direction:column;overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y;
  scroll-padding-bottom:var(--footpad,150px)}
/* A real element, not padding. iOS Safari drops padding-bottom on flex scroll
   containers, which is what let option lists hide behind the button bar. */
.footspacer{flex:0 0 auto;height:var(--footpad,150px);width:100%;pointer-events:none}
/* "there is more below" cue — only when the screen actually scrolls */
#moretag{position:absolute;left:50%;transform:translateX(-50%) translateY(6px);
  bottom:calc(var(--footpad,150px) - 16px);z-index:16;opacity:0;pointer-events:none;
  transition:opacity .3s,transform .3s;
  font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);
  display:flex;align-items:center;gap:6px}
#moretag.on{opacity:1;transform:translateX(-50%) translateY(0)}
#moretag svg{width:13px;height:13px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.screen::-webkit-scrollbar{display:none}
.enter{animation:enter .46s cubic-bezier(.22,1,.36,1) both}
.exit{animation:exit .26s ease-in both}
@keyframes enter{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes exit{from{opacity:1}to{opacity:0;transform:translateY(-10px)}}

/* ---------- type ---------- */
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:14px}
h1.q{font-size:27px;line-height:1.22;letter-spacing:-.022em;font-weight:550;margin-bottom:10px}
h1.q.big{font-size:33px}
.sub{font-size:15px;line-height:1.5;color:var(--ink2);margin-bottom:22px}
.sub.tight{margin-bottom:16px}
.micro{font-size:12.5px;color:var(--ink3);line-height:1.5}

/* ---------- options ---------- */
.opts{display:flex;flex-direction:column;gap:9px}
.opts>*+*{margin-top:0}
@supports not (gap:1px){.opts>*+*{margin-top:9px}.week>*+*{margin-left:5px}.badges>*+*{margin-left:8px}}
/* Options are a wash and a hairline, not a raised card. Filled boxes with drop
   shadows made every list read as heavy furniture; this lets the page breathe. */
.opt{
  background:rgba(255,255,255,.030);border:1px solid var(--line);border-radius:15px;
  padding:15px 16px;display:flex;align-items:center;gap:13px;cursor:pointer;
  box-shadow:none;transition:transform .16s cubic-bezier(.22,1,.36,1),border-color .16s,background .18s;
  min-height:58px;text-align:left;font-family:inherit;width:100%;
}
.opt:active{transform:scale(.975)}
.opt.on{border-color:var(--accent);background:var(--accent-soft);box-shadow:none}
/* while a press-and-drag is picking options up, the list stops scrolling */
.picking{touch-action:none;cursor:grabbing}
.picking .opt,.picking .kit{transition:background .12s,border-color .12s}
.pickhint.top{margin:0 0 12px}
.pickhint{margin-top:11px;font-size:12px;color:var(--ink3);display:flex;align-items:center;gap:7px}
.pickhint b{font-weight:600;color:var(--ink2)}
.opt .ico{font-size:21px;flex:none;width:26px;text-align:center;line-height:1}
.opt .tx{flex:1;min-width:0}
.opt .tx b{display:block;font-size:15.5px;font-weight:550;letter-spacing:-.01em;line-height:1.3;color:var(--ink)}
.opt .tx small{display:block;font-size:12.5px;color:var(--ink3);margin-top:3px;line-height:1.4}
.opt .tick{width:21px;height:21px;border-radius:50%;border:1.5px solid var(--line2);flex:none;position:relative;transition:all .18s}
.opt.on .tick{background:var(--accent);border-color:var(--accent)}
.opt.on .tick:after{content:"";position:absolute;left:6.5px;top:3.5px;width:5px;height:9px;border:solid #0C1512;border-width:0 2px 2px 0;transform:rotate(45deg)}
.opt.none{background:var(--accent-soft);box-shadow:none}
.opt.none .tx b{color:var(--accent)}

/* ---------- footer cta ---------- */
#foot:empty{padding:0;background:none}
#foot{position:absolute;left:0;right:0;bottom:0;padding:14px 20px calc(24px + env(safe-area-inset-bottom));
  background:linear-gradient(rgba(23,26,30,0),var(--bg) 34%);z-index:15;pointer-events:none}
#foot.on{pointer-events:auto}
.cta{
  width:100%;background:var(--accent);color:#0C1512;border:none;border-radius:16px;
  padding:17px;font-size:16px;font-weight:600;font-family:inherit;cursor:pointer;letter-spacing:-.01em;
  transition:transform .16s,opacity .25s,background .2s;opacity:0;transform:translateY(8px);
}
#foot.on .cta{opacity:1;transform:none}
.cta:active{transform:scale(.98)}
.cta[disabled]{background:#2A303A;color:#5C646E;cursor:default}
.cta.accent{background:var(--accent);color:#0C1512}
.cta[disabled],.cta.accent[disabled]{background:#2A303A;color:#5C646E;cursor:default}
.cta.ghost{background:transparent;color:var(--ink3);border:1.5px solid var(--line2);font-weight:500}
.cta.ghost:active{background:rgba(255,255,255,.04)}
.skip{display:block;width:100%;text-align:center;margin-top:8px;font-size:13.5px;color:var(--ink3);background:none;border:none;font-family:inherit;cursor:pointer;padding:14px 6px;min-height:46px}

/* ---------- hero: the dumbbell ---------- */
body.opening #bars,body.opening #chapline{opacity:0;pointer-events:none}
#bars,#chapline{transition:opacity .4s}
.heroA{position:absolute;top:0;right:0;bottom:0;left:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;overflow:hidden;
  margin:calc(-74px - env(safe-area-inset-top)) -20px 0;
  padding:calc(74px + env(safe-area-inset-top)) 20px calc(var(--footpad,150px) + 3vh)}
.heroA .lock{display:flex;flex-direction:column;align-items:center;width:100%;position:relative}
/* The triangle sits BEHIND everything rather than above it, and is anchored
   to the dumbbell rather than to the block as a whole — so it frames the
   mark and stays framing it no matter what the copy below does. -37% rather
   than -50% drops the dumbbell below the triangle's midline; a percentage
   because it has to hold at every width, where a pixel offset would not. */
.heroA .tri{position:absolute;left:50%;top:50%;transform:translate(-50%,-37.5%);
  width:min(82%,315px);height:auto;overflow:visible;z-index:0;pointer-events:none}
.heroA .tri path{fill:none;stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}
.heroA .tri-l{stroke:url(#triGrad);filter:drop-shadow(0 0 7px rgba(255,95,162,.45))}
/* One short bright dash chasing the perimeter. Hidden until the mark has
   landed — a light running around an outline that is still being drawn
   reads as two animations fighting. */
.heroA .tri-spark{stroke:#fff;stroke-width:3.5;opacity:0;
  filter:drop-shadow(0 0 9px #FF5FA2) drop-shadow(0 0 3px #fff)}
.heroA.lit .tri-spark{opacity:1;
  animation:triRun var(--beat,4400ms) linear -1650ms infinite}
.heroA.lit .tri-l{animation:triBeat var(--beat,4400ms) ease-in-out -1650ms infinite}
@keyframes triRun{ from{stroke-dashoffset:0} to{stroke-dashoffset:-777} }
/* A real heartbeat — lub, then a smaller dub — and it only happens while the
   light is on the long top edge. That window is the first 24% of the lap, so
   the whole thump is over by 20% and the outline sits quiet for the three
   sides where nothing is passing. One event per lap, in one place. */
@keyframes triBeat{
  0%      {filter:drop-shadow(0 0 7px rgba(255,95,162,.45))}
  5%      {filter:drop-shadow(0 0 18px rgba(255,95,162,.88))}
  10%     {filter:drop-shadow(0 0 9px  rgba(255,95,162,.52))}
  15%     {filter:drop-shadow(0 0 14px rgba(255,95,162,.72))}
  22%,100%{filter:drop-shadow(0 0 7px  rgba(255,95,162,.45))}
}
@media (prefers-reduced-motion:reduce){
  .heroA.lit .tri-spark{animation:none;opacity:.85}
  .heroA.lit .tri-l{animation:none}
}
.heroA .art{z-index:2}
.heroA .hcopy{z-index:3}
/* A starting value only. placeCopy() below measures the real gap, so that
   the words end up exactly halfway between the point of the triangle and
   the top of the button. */
.heroA .art{position:relative;display:flex;align-items:center;justify-content:center;
  width:100%;margin-bottom:80px}
/* the mark carries the screen; the words sit under it, deliberately smaller */
.heroA .db{width:min(70%,277px);height:auto;overflow:visible;position:relative;z-index:2}
/* B's silhouette is narrower than A's, so it gets a little more of the width
   to land at the same optical size */
.heroA .db.mb{width:min(79%,313px)}
.heroA .dbglow{position:absolute;width:210px;height:210px;border-radius:50%;z-index:1;
  background:radial-gradient(circle,rgba(62,203,168,.26),rgba(62,203,168,0) 66%);
  opacity:0;will-change:opacity,transform}
/* The glow fades up before it starts breathing, so it never pops in at
   full strength the instant the mark finishes drawing. */
.heroA .art.alive .dbglow{
  animation:dbGlowIn .55s cubic-bezier(.22,1,.36,1) both,
            dbGlow 4.4s ease-in-out .55s infinite}
@keyframes dbGlowIn{from{opacity:0;transform:scale(.88)}to{opacity:.40;transform:scale(.95)}}
@keyframes dbGlow{0%,100%{opacity:.40;transform:scale(.95)}50%{opacity:.86;transform:scale(1.06)}}

.heroA .db path.stroked{fill:none;stroke:url(#dbGrad);stroke-linecap:round}
.heroA .db path.bar{stroke:url(#dbBar)}
/* the clip rectangles that wipe B's plates into place */
.heroA .db .wipe{transform-box:fill-box;transform:scaleY(0)}

/* The whole thing does a slow rep, forever. The cycle STARTS and ENDS at zero
   because that is where the mark already sits when the drawing finishes — a
   keyframe list that opens at translateY(9px) makes the group jump 9px the
   instant the animation is attached, which is the catch-up you could see.

   But adding the two zero-crossings created a second problem: with one easing
   curve applied BETWEEN EVERY PAIR of keyframes, the motion decelerated to a
   stop at 0, -9, 0, +9 and 0 — five dead stops per cycle instead of two. That
   is the stutter. A real bob is a sine wave: it only rests at the top and the
   bottom and moves fastest through the middle. So each segment gets its own
   half-sine curve — decelerating into an extreme, accelerating out of it —
   and the crossings are no longer stops at all. */
.heroA .art.alive .rep{will-change:transform;animation:rep 4.4s linear infinite}
@keyframes rep{
  0%  {transform:translateY(0);    animation-timing-function:cubic-bezier(.39,.575,.565,1)}
  25% {transform:translateY(-9px); animation-timing-function:cubic-bezier(.47,0,.745,.715)}
  50% {transform:translateY(0);    animation-timing-function:cubic-bezier(.39,.575,.565,1)}
  75% {transform:translateY(9px);  animation-timing-function:cubic-bezier(.47,0,.745,.715)}
  100%{transform:translateY(0)}
}

/* the button breathes on the same clock as the mark */
.ctawrap{position:relative}
.ctawrap .cta{position:relative;z-index:1}
.ctaglow{position:absolute;left:50%;top:50%;z-index:0;width:104%;height:280%;
  border-radius:50%;pointer-events:none;opacity:0;
  transform:translate(-50%,-50%) scale(.95);
  background:radial-gradient(ellipse at center,
    rgba(62,203,168,.46) 0%,rgba(62,203,168,.20) 38%,rgba(62,203,168,0) 68%);
  will-change:opacity,transform}
.ctawrap.alive .ctaglow{
  animation:ctaGlowIn .55s cubic-bezier(.22,1,.36,1) both,
            ctaGlow 4.4s ease-in-out .55s infinite}
@keyframes ctaGlowIn{
  from{opacity:0;transform:translate(-50%,-50%) scale(.86)}
  to  {opacity:.40;transform:translate(-50%,-50%) scale(.95)}}
@keyframes ctaGlow{
  0%,100%{opacity:.40;transform:translate(-50%,-50%) scale(.95)}
  50%    {opacity:.86;transform:translate(-50%,-50%) scale(1.06)}}

/* words sit under the mark as one lockup */
.heroA .hcopy{display:flex;flex-direction:column;align-items:center;text-align:center;
  opacity:0;transform:translateY(12px);
  transition:opacity .42s cubic-bezier(.22,1,.36,1),transform .48s cubic-bezier(.22,1,.36,1)}
.heroA.ready .hcopy{opacity:1;transform:none}
.heroA h1{margin:0;white-space:nowrap;font-size:min(7.9vw,31px);line-height:1.12;
  letter-spacing:-.022em;font-weight:550;color:var(--ink)}
.heroA .hsub{margin-top:13px;font-size:11.5px;letter-spacing:.22em;text-transform:uppercase;
  font-weight:600;color:var(--accent);opacity:.9}

@media (max-height:720px){
  .heroA .art{margin-bottom:64px}
  .heroA .db{width:min(61%,228px)}
  .heroA .db.mb{width:min(69%,259px)}
  .heroA h1{font-size:min(7.9vw,28px)}
}
@media (prefers-reduced-motion:reduce){
  .heroA .db path.stroked{stroke-dashoffset:0 !important;transition:none !important}
  .heroA .db .wipe{transform:scaleY(1) !important;transition:none !important}
  .heroA .art.alive .rep,.heroA .art.alive .dbglow,.ctawrap.alive .ctaglow{animation:none}
  .ctaglow{opacity:.42}
  .heroA .hcopy{opacity:1;transform:none;transition:none}
  .heroA .dbglow{opacity:.5}
}

/* ---------- insight ---------- */
.insight{flex:1;display:flex;flex-direction:column;justify-content:center}
.ins-tag{display:inline-flex;align-items:center;gap:7px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--accent);font-weight:650;margin-bottom:20px}
.ins-tag i{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(1.5)}}
.ins-line{font-size:23px;line-height:1.35;letter-spacing:-.018em;font-weight:500;margin-bottom:16px;opacity:0}
.ins-line.s{font-size:16px;font-weight:400;color:var(--ink2);line-height:1.55}
.ins-num{font-size:56px;font-weight:600;letter-spacing:-.035em;color:var(--accent);line-height:1;margin-bottom:6px;opacity:0}
.fadein{animation:fi .6s cubic-bezier(.22,1,.36,1) both}
@keyframes fi{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ---------- slider ---------- */
.slwrap{margin:24px 0 8px}
.slval{font-size:64px;font-weight:600;letter-spacing:-.04em;line-height:1;color:var(--ink);text-align:center}
.slcap{text-align:center;font-size:15px;color:var(--accent);margin-top:12px;font-weight:550;min-height:44px;line-height:1.4;padding:0 10px;transition:opacity .2s}
input[type=range]{-webkit-appearance:none;width:100%;height:44px;background:none;margin-top:22px}
input[type=range]::-webkit-slider-runnable-track{height:6px;background:var(--line);border-radius:99px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:32px;height:32px;border-radius:50%;background:#EDEFF3;
  box-shadow:0 2px 10px rgba(0,0,0,.4),0 0 0 1.5px var(--accent) inset;margin-top:-13px;cursor:pointer}
.slends{display:flex;justify-content:space-between;font-size:12px;color:var(--ink3);margin-top:2px}

/* ---------- body map ---------- */
/* ---- where it hurts: a grid of named zones, no diagram ----------------
   Two columns of large targets. Every label is unambiguous on its own, so
   there is no viewpoint to choose and no toggle to explain. */
.zgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.zone{position:relative;min-height:66px;border-radius:14px;border:1.5px solid var(--line);
  background:var(--card2);color:var(--ink);font:inherit;font-size:15px;font-weight:600;
  text-align:left;padding:0 38px 0 15px;display:flex;align-items:center;
  transition:border-color .15s,background .15s,color .15s}
.zone:active{transform:scale(.985)}
.zone.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
/* the last one sits alone on its row, so it takes the full width */
.zone:last-child{grid-column:1 / -1}
.ztick{position:absolute;right:13px;top:50%;width:19px;height:19px;margin-top:-9.5px;
  border-radius:50%;border:1.5px solid var(--line2,#333B46);transition:.15s}
.zone.on .ztick{border-color:var(--accent);background:var(--accent)}
.zone.on .ztick::after{content:'';position:absolute;left:5.5px;top:2.5px;width:5px;height:9px;
  border:solid #10120f;border-width:0 2px 2px 0;transform:rotate(45deg)}
/* Neutral until it is actually the answer. Styled like the zones so the
   whole screen reads as one set of choices rather than a button above a list. */
.nonechip.big{width:100%;min-height:60px;border-radius:14px;font-size:15.5px;margin:2px 0 0;
  border-color:var(--line);background:var(--card2);color:var(--ink)}
.nonechip.big.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.painnote{width:100%;margin-top:12px;font-size:14px}
.zmicro{margin-top:14px;text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin-top:14px}
.chip{font-size:12.5px;background:var(--accent-soft);color:var(--accent);padding:7px 13px;border-radius:99px;font-weight:550}

/* ---------- loader ---------- */
.load{flex:1;display:flex;flex-direction:column;justify-content:center}
.ring{width:60px;height:60px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:spin 1s linear infinite;margin-bottom:30px}
.lline{display:flex;gap:11px;align-items:flex-start;font-size:14.5px;color:var(--ink3);margin-bottom:15px;opacity:0;line-height:1.45}
.lline.on{opacity:1;color:var(--ink2);transition:opacity .4s}
.lline .dot{width:16px;height:16px;flex:none;border-radius:50%;border:1.5px solid var(--line);margin-top:1px;position:relative;transition:all .3s}
.lline.done .dot{background:var(--accent);border-color:var(--accent)}
.lline.done .dot:after{content:"";position:absolute;left:4.5px;top:2px;width:4px;height:7.5px;border:solid #fff;border-width:0 1.8px 1.8px 0;transform:rotate(45deg)}
.lline.done{color:var(--ink)}

/* ---------- reveal ---------- */
.week{display:flex;gap:5px;margin:6px 0 22px}
.day{flex:1;background:var(--card);border-radius:12px;padding:11px 4px;text-align:center;box-shadow:var(--shadow);border:1.5px solid transparent}
.day.train{border-color:var(--accent);background:var(--accent-soft)}
.day .d{font-size:10px;letter-spacing:.06em;color:var(--ink3);text-transform:uppercase;font-weight:600}
.day .m{font-size:17px;margin-top:6px;line-height:1}
.pred{background:var(--card);border-radius:15px;padding:15px 16px;box-shadow:var(--shadow);margin-bottom:9px;display:flex;gap:12px;align-items:flex-start}
.pred .pd{font-size:11px;font-weight:700;color:var(--accent);letter-spacing:.06em;text-transform:uppercase;flex:none;width:38px;padding-top:2px}
.pred .pt{font-size:14px;line-height:1.5;color:var(--ink2)}
.pred .pt b{color:var(--ink);font-weight:600}
.patcard{background:linear-gradient(160deg,#123A32,#1E8A72);border-radius:19px;padding:24px 22px;color:#fff;margin:20px 0 14px;box-shadow:0 16px 40px rgba(0,0,0,.4)}
.patcard .pl{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;opacity:.7;margin-bottom:10px;font-weight:650}
.patcard .pn{font-size:26px;line-height:1.2;letter-spacing:-.02em;font-weight:600;margin-bottom:12px}
.patcard .pb{font-size:14px;line-height:1.55;opacity:.88}
.notme{display:block;width:100%;text-align:center;font-size:13px;color:var(--ink3);background:none;border:none;font-family:inherit;padding:14px 8px;min-height:46px;cursor:pointer;margin-bottom:14px}
.later{background:var(--card);border-radius:15px;padding:16px;box-shadow:var(--shadow);margin-bottom:20px}
.later h4{font-size:14px;font-weight:600;margin-bottom:12px}
.later .li{display:flex;gap:10px;font-size:13px;color:var(--ink2);margin-bottom:9px;line-height:1.45}
.later .li:last-child{margin-bottom:0}
.later .li>span:first-child{color:var(--accent);font-weight:650;flex:none;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;width:56px;padding-top:2px}
.later .li>span:last-child{flex:1}

/* ---------- toast / empathy ---------- */
#toast{position:absolute;left:20px;right:20px;bottom:110px;background:#2E3540;color:var(--ink);border:1px solid var(--line2);border-radius:14px;
  padding:14px 16px;font-size:13.5px;line-height:1.45;z-index:30;opacity:0;transform:translateY(12px);
  transition:all .4s cubic-bezier(.22,1,.36,1);pointer-events:none;box-shadow:0 12px 30px rgba(0,0,0,.22)}
#toast.on{opacity:1;transform:none}

/* ---------- dev index ---------- */
#dev{position:absolute;top:calc(env(safe-area-inset-top) + 6px);right:8px;bottom:auto;left:auto;z-index:60;font-size:9.5px;color:var(--ink3);background:rgba(40,46,56,.8);
  border:1px solid var(--line);border-radius:99px;padding:3px 8px;cursor:pointer;font-family:inherit;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);opacity:.28}
#dev:hover{opacity:1}
#idx{position:absolute;top:0;right:0;bottom:0;left:0;background:rgba(23,26,30,.985);z-index:59;padding:56px 18px 18px;overflow-y:auto;display:none;-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
#idx.on{display:block}
#idx h5{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);margin:16px 0 8px;font-weight:650}
#idx h5:first-child{margin-top:0}
#idx button{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:11px;
  padding:11px 13px;font-size:13.5px;font-family:inherit;margin-bottom:6px;cursor:pointer;color:var(--ink)}
#idx button b{color:var(--ink3);font-weight:600;font-size:11px;margin-right:8px}

/* ---------- compact phones (SE, and any short window) ---------- */
@media(max-height:700px){
  h1.q{font-size:23px}
  h1.q.big{font-size:28px}
  .sub{font-size:14px;margin-bottom:16px}
  .hero h1{font-size:31px}
  .hero p{font-size:15px;margin-bottom:9px}
  .orb{width:56px;height:56px;margin-bottom:18px}
  .opt{min-height:52px;padding:12px 14px}
  .opt .tx b{font-size:14.5px}
  .slval{font-size:46px}
  .slwrap{margin:12px 0 4px}
  input[type=range]{margin-top:12px}
  .slcap{font-size:14px;min-height:38px;margin-top:8px}
  .ins-num{font-size:44px}
  .ins-line{font-size:20px}
  .ins-line.s{font-size:15px}
  .eyebrow{margin-bottom:10px}
  .badges{margin-top:16px}
}
@media(max-height:600px){
  h1.q{font-size:21px}
  .hero h1{font-size:27px}
  .slval{font-size:40px}
  .opt .tx small{display:none}
}

/* ---------- chapter interstitial ---------- */
/* The synthwave horizon. One motif, on the eight chapter screens only —
   they are the pauses between questions, which is the one place a bit of
   theatre costs nothing. Pure CSS: two repeating gradients laid flat by a
   perspective rotation, faded out towards the horizon so it reads as
   distance rather than wallpaper. */
.chapwrap{flex:1;display:flex;flex-direction:column;justify-content:center;
  position:relative;isolation:isolate}
/* The synthwave floor, on the eight chapter screens only — they are the
   pauses between questions, the one place a bit of theatre costs nothing.
   Pure CSS: gradients laid flat by a perspective rotation.

   The horizon line is the TOP EDGE of the same element, not a separate
   rule. Drawn separately it landed wherever it was told and read as an
   underline beneath the subtitle; drawn as part of the floor it gets
   foreshortened with everything else and comes to rest exactly where the
   grid vanishes, which is the only place a horizon can be. */
.chapwrap::before{
  content:'';position:absolute;left:-45%;right:-45%;bottom:0;height:62%;
  background:
    linear-gradient(180deg,var(--neon) 0 2px,transparent 2px),
    repeating-linear-gradient(90deg,var(--neon-line) 0 1px,transparent 1px 40px),
    repeating-linear-gradient(0deg, var(--neon-line) 0 1px,transparent 1px 26px);
  transform:perspective(340px) rotateX(66deg);transform-origin:bottom center;
  -webkit-mask-image:linear-gradient(#000 0 62%,transparent);
  mask-image:linear-gradient(#000 0 62%,transparent);
  opacity:.62;pointer-events:none;z-index:-1}
.chapnum{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--neon);
  font-weight:650;margin-bottom:18px;text-shadow:0 0 12px var(--neon-line)}
/* Chrome, the other 80s signature — a bright top edge falling to a duller
   base, which is what makes eighties lettering look like metal. */
.chaptitle{font-size:44px;line-height:1.08;letter-spacing:-.03em;margin-bottom:16px;font-weight:400;
  background:linear-gradient(178deg,#FFFFFF 8%,#E6ECF2 38%,#9FB0C0 62%,#EAF0F6 92%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  -webkit-text-fill-color:transparent}
.chapsub{font-size:16px;line-height:1.55;color:var(--ink2);max-width:300px}
.chapdots{display:flex;gap:7px;margin-top:34px}
.cd{width:22px;height:4px;border-radius:2px;background:var(--line2)}
.cd.done{background:var(--accent);opacity:.42}
.cd.now{background:var(--accent);width:40px}
/* ---------- text + number inputs ---------- */
.tin{width:100%;background:var(--bg2);border:1.5px solid var(--line);border-radius:14px;
  padding:16px 16px;font-family:inherit;font-size:17px;color:var(--ink);box-shadow:var(--shadow);}
.tin:focus{outline:none;border-color:var(--accent)}
.tin::placeholder{color:var(--ink3)}
.tin.sm{padding:15px 14px;font-size:15px;min-height:48px}
.nrow{margin-bottom:12px}
.nrow label{display:block;font-size:13px;font-weight:600;color:var(--ink2);margin-bottom:6px}
.npair{display:flex;align-items:center;gap:9px}
.npair .tin{flex:1;text-align:center;-moz-appearance:textfield}
.npair .tin::-webkit-outer-spin-button,.npair .tin::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.nx{color:var(--ink3);font-size:15px;flex:none}
.slu{font-size:20px;font-weight:500;color:var(--ink3);letter-spacing:0}
/* ---------- log card ---------- */
.logcard{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:6px 16px;
  box-shadow:var(--shadow);margin:20px 0 16px}
.lgrow{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.lgrow:last-child{border-bottom:none}
.lgrow span{color:var(--ink3)}
.lgrow b{font-weight:600;color:var(--ink)}
@media(max-height:700px){ .chaptitle{font-size:36px} .chapsub{font-size:15px} .tin{padding:13px 14px;font-size:16px} }

/* ---------- icon system ---------- */
.ico{width:26px;height:26px;display:flex;align-items:center;justify-content:center;color:var(--accent);flex:none;opacity:.85}
.ico svg{width:23px;height:23px}
.opt.on .ico{opacity:1}
.opt.none .ico{color:var(--accent)}
/* ---------- chapter auto-advance ---------- */
.chaptime{height:2px;background:var(--line);border-radius:2px;margin-top:30px;overflow:hidden;max-width:240px}
/* One colour. It was a two-stop gradient and on a bar two pixels tall that
   reads as a rendering fault rather than a gradient. The glow carries the
   neon; the fill just needs to be the accent. */
.chaptime i{display:block;height:100%;width:0;animation:fill 1.5s linear forwards;
  background:var(--neon);box-shadow:0 0 8px var(--neon-line)}
@keyframes fill{to{width:100%}}
.chapskip{margin-top:18px;font-size:12.5px;color:var(--ink3)}
/* ---------- feelings grid (merged love / never) ---------- */
.frow{display:flex;align-items:center;gap:9px;background:var(--card);border-radius:13px;
  padding:8px 10px 8px 13px;box-shadow:var(--shadow);margin-bottom:7px;min-height:52px}
.fname{flex:1;font-size:14.5px;font-weight:500;line-height:1.25}
.fbtn{width:44px;height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg2);
  display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink3);flex:none;transition:all .15s}
.fbtn svg{width:17px;height:17px}
.fbtn.on.love{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.fbtn.on.never{border-color:var(--red);background:rgba(240,133,122,.13);color:var(--red)}
.flegend{display:flex;justify-content:flex-end;gap:16px;font-size:11px;color:var(--ink3);margin-bottom:8px;padding-right:4px}
/* ---------- build / today ---------- */
.todo{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 17px;box-shadow:var(--shadow);margin:14px 0}
.todo h4{font-size:15px;font-weight:600;margin-bottom:6px}
.todo p{font-size:13.5px;color:var(--ink2);line-height:1.5}
.eta{display:inline-flex;align-items:center;gap:7px;background:var(--accent-soft);color:var(--accent);
  font-size:12px;font-weight:600;padding:7px 13px;border-radius:99px;margin-bottom:16px}
.avatar{width:44px;height:44px;border-radius:50%;background:linear-gradient(140deg,#123A32,#1E8A72);
  display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;font-size:15px;flex:none}
.byline{display:flex;gap:12px;align-items:center;margin:16px 0 4px}
.byline div{font-size:13px;line-height:1.4;color:var(--ink2)}
.byline b{display:block;color:var(--ink);font-size:14px}

/* ---------- centred question block ---------- */
h1.q, .sub.ctr, .eyebrow.ctr{text-align:center}
h1.q{text-align:center}
.sub{text-align:center}
.opts,.brow,.frow,.nrow{text-align:left}
/* ---------- stepper ---------- */
.stepwrap{display:flex;align-items:center;justify-content:center;gap:20px;margin:26px 0 6px}
.stepbtn{width:60px;height:60px;border-radius:50%;border:1px solid var(--line);background:transparent;
  color:var(--ink);font-size:28px;font-family:inherit;line-height:1;cursor:pointer;display:flex;
  align-items:center;justify-content:center;box-shadow:var(--shadow);transition:all .14s;flex:none}
.stepbtn:active{transform:scale(.92);border-color:var(--accent);color:var(--accent)}
.stepval{font-size:60px;font-weight:600;letter-spacing:-.04em;line-height:1;min-width:120px;text-align:center}
.stepunit{font-size:19px;font-weight:500;color:var(--ink3);letter-spacing:0;margin-left:4px}
/* ---------- capability bands ---------- */
.brow{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:9px 11px;
  margin-bottom:7px;box-shadow:var(--shadow)}
.bname{font-size:13.5px;font-weight:600;margin-bottom:1px}
.bhint{font-size:11px;color:var(--ink3);margin-bottom:7px}
.bands{display:flex;gap:6px}
.band{flex:1;min-height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg2);
  color:var(--ink2);font-size:12.5px;font-family:inherit;cursor:pointer;display:flex;align-items:center;
  justify-content:center;transition:all .15s;padding:0 2px}
.band.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:650}
/* ---------- ranked multi ---------- */
.rank{position:absolute;right:14px;top:50%;transform:translateY(-50%);width:26px;height:26px;border-radius:50%;
  background:var(--accent);color:#0C1512;font-size:13px;font-weight:700;display:none;align-items:center;justify-content:center}
.opt.ranked{position:relative;border-color:var(--accent);background:var(--accent-soft)}
.opt.ranked .rank{display:flex}
.opt.ranked .tick{display:none}
/* ---------- two-axis level ---------- */
.lvl{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:10px;box-shadow:var(--shadow)}
.lvlname{font-size:14.5px;font-weight:600;margin-bottom:2px}
.lvlhint{font-size:11.5px;color:var(--ink3);margin-bottom:10px}
.lvlrow{display:flex;gap:6px}
.lvlbtn{flex:1;min-height:46px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg2);
  color:var(--ink2);font-size:12.5px;font-family:inherit;cursor:pointer;transition:all .15s;padding:4px}
.lvlbtn.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:650}
/* ---------- lift rows with confidence ---------- */
.conf{display:flex;gap:6px;margin-top:8px}
.confb{flex:1;min-height:44px;border-radius:9px;border:1px solid var(--line);background:var(--bg2);
  color:var(--ink3);font-size:11.5px;font-family:inherit;cursor:pointer;transition:all .15s}
.confb.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft);font-weight:650}
/* ---------- body front/back ---------- */
#chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:12px}
#chips .chip{display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--accent);
  background:var(--accent-soft);color:var(--accent);border-radius:99px;padding:7px 12px;
  font:inherit;font-size:13px;font-weight:600}
#chips .chip i{font-style:normal;opacity:.65;font-size:15px;line-height:1}
.bodytabs{display:flex;gap:8px;justify-content:center;margin-bottom:12px}
.btab{min-height:44px;padding:0 22px;border-radius:11px;border:1.5px solid var(--line);background:var(--bg2);
  color:var(--ink2);font-size:13.5px;font-family:inherit;cursor:pointer;transition:all .15s}
.btab.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:650}

/* ---------- opening: mark + steps ---------- */
.mark{width:64px;height:64px;margin-bottom:30px;color:var(--accent)}
.mark svg{width:100%;height:100%;stroke:currentColor;stroke-width:1.7;fill:none;
  stroke-linecap:round;stroke-linejoin:round}
.steps{display:flex;gap:9px;margin-top:26px}
.steps i{width:26px;height:3px;border-radius:2px;background:var(--line2);
  animation:stepOn 2.8s ease-in-out infinite}
.steps i:nth-child(2){animation-delay:.28s}
.steps i:nth-child(3){animation-delay:.56s}
.steps i:nth-child(4){animation-delay:.84s}
@keyframes stepOn{0%,8%{background:var(--line2)}18%,52%{background:var(--accent)}70%,100%{background:var(--line2)}}
@supports not (gap:1px){.steps>*+*{margin-left:9px}}
.metaline{margin-top:30px;font-size:12.5px;color:var(--ink3);letter-spacing:.02em}

/* ---------- the contract ---------- */
/* ---------- the opening, as a message thread ----------
   It was a table: label on the left, promise on the right, five rows. True,
   and it read like terms and conditions. The same five things arriving as
   messages from the coach say something the table could not — that there is
   a person on the other end — before a single question is asked. */
.chatwrap{flex:1;display:flex;flex-direction:column;justify-content:flex-end;
  padding:8px 0 4px;min-height:0}
.chathead{display:flex;align-items:center;gap:9px;padding-bottom:14px;margin-bottom:14px;
  border-bottom:1px solid var(--line);flex:0 0 auto}
.chathead i{width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:linear-gradient(145deg,var(--accent),#2f8f78);color:#0d1114;
  font-size:13px;font-weight:800;font-style:normal;box-shadow:0 0 14px rgba(123,227,196,.28)}
.chathead b{font-size:14.5px;font-weight:600;letter-spacing:-.01em}
.chathead span{font-size:11px;color:var(--accent);letter-spacing:.1em;text-transform:uppercase;
  font-weight:650;margin-left:auto;display:flex;align-items:center;gap:5px}
.chathead span::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--accent);
  box-shadow:0 0 8px var(--accent)}
.chat{display:flex;flex-direction:column;gap:8px;overflow:hidden}
.cbub{align-self:flex-start;max-width:84%;background:var(--card);border:1px solid var(--line);
  border-radius:19px 19px 19px 5px;padding:11px 15px;font-size:15px;line-height:1.42;
  color:var(--ink);opacity:0;transform:translateY(9px) scale(.97);transform-origin:0 100%;
  transition:opacity .32s cubic-bezier(.22,1,.36,1),transform .32s cubic-bezier(.22,1,.36,1)}
.cbub.on{opacity:1;transform:none}
/* The last one is the point of the screen, so it is the only one that glows. */
.cbub.key{border-color:rgba(123,227,196,.42);box-shadow:0 0 22px rgba(123,227,196,.13)}
.cbub b{color:var(--accent);font-weight:600}
.cbub small{display:block;margin-top:4px;font-size:12.5px;color:var(--ink3);line-height:1.4}
.typing{align-self:flex-start;display:none;gap:4px;background:var(--card);
  border:1px solid var(--line);border-radius:19px 19px 19px 5px;padding:13px 15px}
.typing.on{display:flex}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--ink3);
  animation:tdot 1.25s ease-in-out infinite}
.typing i:nth-child(2){animation-delay:.16s}
.typing i:nth-child(3){animation-delay:.32s}
@keyframes tdot{0%,60%,100%{opacity:.28;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
@media (prefers-reduced-motion:reduce){ .typing i{animation:none;opacity:.6} }

.promise{flex:1;display:flex;flex-direction:column;justify-content:center;padding:8px 0}
.promise h1{font-size:26px;line-height:1.22;letter-spacing:-.022em;font-weight:550;margin-bottom:24px}
/* a row with no label is a continuation of the one above it, so it sits closer */
.prow.cont{margin-top:-9px}
.prow{display:flex;gap:15px;align-items:flex-start;margin-bottom:18px;
  opacity:0;transform:translateY(10px);transition:opacity .5s cubic-bezier(.22,1,.36,1),transform .5s cubic-bezier(.22,1,.36,1)}
.prow.on{opacity:1;transform:none}
.prow .who{flex:0 0 auto;width:72px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  font-weight:650;color:var(--accent);padding-top:3px}
.prow .what{flex:1;min-width:0;font-size:15.5px;line-height:1.45;color:var(--ink)}
.prow .what small{display:block;margin-top:3px;font-size:12.5px;color:var(--ink3);line-height:1.4}
.prow.dim .who{color:var(--ink3)}

/* ---------- the deck ---------- */
.deckwrap{flex:1;display:flex;flex-direction:column;min-height:0}
.dkdots{display:flex;gap:4px;justify-content:center;margin-bottom:14px;flex:0 0 auto}
.dkdots i{width:6px;height:6px;border-radius:50%;background:var(--line2)}
.dkdots i.done{background:var(--accent)}
.dkdots i.now{background:var(--ink)}
.dkstack{flex:1 1 auto;position:relative;min-height:250px}
.dkcard{position:absolute;top:0;right:0;bottom:0;left:0;background:var(--card);
  border:1.5px solid var(--line);border-radius:20px;overflow:hidden;
  display:flex;flex-direction:column;box-shadow:var(--shadow-lift);touch-action:pan-y}
.dkvid{flex:1 1 auto;min-height:0;position:relative;overflow:hidden;
  background:linear-gradient(160deg,#242A34,#1A1F26)}
.dkvid .fig{width:100%;height:100%;padding:26px 0 18px;display:block}
/* real artwork sits in the same box as the line figure and never crops */
.dkvid .dkart{width:100%;height:100%;padding:16px 14px;display:block;
  object-fit:contain;-webkit-user-drag:none;user-select:none;pointer-events:none}
.dkvid .fig g{stroke:var(--ink);stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;fill:none}
.dkvid .fig .pa{animation:fA 1.15s steps(1,end) infinite}
.dkvid .fig .pb{animation:fB 1.15s steps(1,end) infinite}
@keyframes fA{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes fB{0%,49%{opacity:0}50%,100%{opacity:1}}
.dkcap{flex:0 0 auto;padding:14px 17px 17px;border-top:1px solid var(--line)}
.dkcap b{display:block;font-size:18px;font-weight:600;letter-spacing:-.015em}
.dkcap span{display:block;margin-top:3px;font-size:12.5px;color:var(--ink3)}
.dkstamp{position:absolute;top:16px;padding:7px 11px;border-radius:9px;border:2px solid;
  font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:0;pointer-events:none}
.dkstamp.yes{right:14px;color:var(--accent);border-color:var(--accent);transform:rotate(8deg)}
.dkstamp.no{left:14px;color:var(--ink3);border-color:var(--line2);transform:rotate(-8deg)}
.dkbands{position:absolute;top:0;right:0;bottom:0;left:0;background:var(--card);
  display:none;flex-direction:column;justify-content:center;padding:22px 18px}
.dkbands.on{display:flex}
/* Second panel on the same card: how much, then how they feel about it.
   Asked here rather than on a screen of its own at the end of the chapter —
   the exercise is in front of them, so the answer is about that movement
   instead of a name in a list. */
.dkfeel{position:absolute;top:0;right:0;bottom:0;left:0;background:var(--card);
  border-radius:inherit;padding:22px;display:none;flex-direction:column;justify-content:center}
.dkfeel.on{display:flex}
.dkfeel .bq{font-size:17px;font-weight:600;letter-spacing:-.015em;margin-bottom:5px}
.dkfeel .bh{font-size:12.5px;color:var(--ink3);margin-bottom:18px}
.dkfeel button{width:100%;min-height:62px;border-radius:13px;border:1.5px solid var(--line);
  background:var(--card2);color:var(--ink);font:inherit;
  display:grid;grid-template-columns:36px 1fr;grid-template-rows:auto auto;
  align-items:center;column-gap:12px;padding:10px 16px;margin-bottom:9px;text-align:left}
.dkfeel button .fe{grid-row:1/3;font-size:24px;color:var(--ink3);text-align:center;line-height:1}
.dkfeel button b{font-size:15.5px;font-weight:600}
.dkfeel button small{font-size:12px;color:var(--ink3)}
.dkfeel button:active{transform:scale(.985)}
.dkfeel button.on{border-color:var(--accent);background:var(--accent-soft)}
.dkfeel button.on .fe{color:var(--accent)}
/* The dreaded ones turn red rather than accent — this answer is a warning,
   not a preference, and it should not look like the happy one. */
.dkfeel button.on:has(.sk){border-color:#e2645b;background:rgba(226,100,91,.10)}
.dkfeel button.on .fe.sk{color:#e2645b}
.dkbands .bq{font-size:17px;font-weight:600;letter-spacing:-.015em;margin-bottom:5px}
.dkbands .bh{font-size:12.5px;color:var(--ink3);margin-bottom:18px}

/* ---- the level slider -------------------------------------------------
   Replaces a column of bands. Bands forced a choice between made-up
   brackets and capped everyone strong at the top one; worse, most people
   genuinely do not know whether their number is good. The slider answers
   that as they drag, using Nicolas's own benchmark table. */
.skval{display:flex;align-items:baseline;justify-content:center;gap:6px;margin-bottom:2px}
.skval b{font-size:44px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1}
.skval span{font-size:14px;color:var(--ink3);font-weight:600}
.sktier{text-align:center;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  margin-bottom:16px;transition:color .15s}
.sktier[data-t="0"]{color:var(--ink3)}
.sktier[data-t="1"]{color:#5fc9a0}
.sktier[data-t="2"]{color:#4fb0e8}
.sktier[data-t="3"]{color:#f0a24b}
.sktier[data-t="4"]{color:#c07bf0}
.skrange{-webkit-appearance:none;appearance:none;width:100%;height:34px;background:transparent;margin:0}
.skrange::-webkit-slider-runnable-track{height:8px;border-radius:99px;background:var(--line)}
.skrange::-moz-range-track{height:8px;border-radius:99px;background:var(--line)}
/* 34px thumb — a finger, not a mouse pointer */
.skrange::-webkit-slider-thumb{-webkit-appearance:none;width:34px;height:34px;border-radius:50%;
  background:var(--accent);border:3px solid var(--card);margin-top:-13px;
  box-shadow:0 2px 10px rgba(0,0,0,.5)}
.skrange::-moz-range-thumb{width:34px;height:34px;border-radius:50%;background:var(--accent);
  border:3px solid var(--card);box-shadow:0 2px 10px rgba(0,0,0,.5)}
/* Appears only when they run out of slider. Quiet — it is an escape hatch
   for the strong, not an invitation to everyone to keep dragging. */
.skmore{display:block;margin:2px auto 12px;background:none;border:none;color:var(--accent);
  font:inherit;font-size:13px;font-weight:600;padding:6px 10px}
.skmore[hidden]{display:none}
/* how many reps at that weight — one tap, only for the loaded movements */
.skreps{margin-bottom:14px}
.skreps .lbl{font-size:12.5px;color:var(--ink3);margin-bottom:7px}
.skreps .chips{display:flex;gap:6px}
.skreps button{flex:1;min-height:42px;border-radius:11px;border:1.5px solid var(--line);
  background:var(--card2);color:var(--ink);font:inherit;font-size:14px;font-weight:600;padding:0}
.skreps button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.dkbands .skgo{width:100%;min-height:52px;border-radius:13px;border:none;background:var(--accent);
  color:#10120f;font:inherit;font-size:16px;font-weight:700;margin-top:2px}
.dkbands .skgo[disabled]{opacity:.35}
.dkbands button{width:100%;min-height:50px;border-radius:13px;border:1.5px solid var(--line);
  background:var(--bg2);color:var(--ink);font-size:15px;font-weight:550;font-family:inherit;
  margin-bottom:8px;padding:13px 15px;text-align:left;cursor:pointer}
.dkbands button:active{transform:scale(.985)}
.dkbands button.on{border-color:var(--accent);background:var(--accent-soft)}
.dkbtns{display:flex;gap:10px;flex:0 0 auto;margin-top:12px}
.dkbtn{flex:1;min-height:54px;border-radius:14px;border:1.5px solid var(--line2);
  background:var(--card);color:var(--ink2);font-size:14.5px;font-weight:600;font-family:inherit;cursor:pointer}
.dkbtn.yes{border-color:rgba(62,203,168,.42);color:var(--accent)}
.dkhint{text-align:center;font-size:11.5px;color:var(--ink3);margin-top:10px;flex:0 0 auto}

/* ---------- units toggle ---------- */
.unitrow{display:flex;gap:10px;margin-top:6px}
.unitrow button{flex:1;min-height:56px;border-radius:14px;border:1.5px solid var(--line);
  background:var(--card);color:var(--ink);font-size:16px;font-weight:600;font-family:inherit;cursor:pointer}
.unitrow button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}

/* ---------- inline "none of this" chip ---------- */
.nonechip{width:100%;min-height:52px;border-radius:14px;border:1.5px solid rgba(62,203,168,.4);
  background:var(--accent-soft);color:var(--accent);font-size:15px;font-weight:600;
  font-family:inherit;cursor:pointer;margin-bottom:14px;padding:14px}
.nonechip.on{background:var(--accent);color:#0C1512;border-color:var(--accent)}


/* ---------- silhouette scale ---------- */
.silsec{margin-bottom:22px}
.sillabel{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink3);
  font-weight:650;margin-bottom:9px}
/* ---- body-shape carousel ----------------------------------------------
   .screen sets touch-action:pan-y so a sideways drag never fights the page.
   That is right everywhere else, but the browser intersects touch-action all
   the way up the tree, and pan-y above pan-x leaves nothing — the carousel
   would simply not move under a finger. This screen opts back in. */
.screen:has(.shcar){touch-action:auto}
.shcar{display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;
  touch-action:pan-x;-webkit-overflow-scrolling:touch;scrollbar-width:none;
  margin:4px -20px 0;padding:0 calc(50% - 100px)}
.shcar::-webkit-scrollbar{display:none}
.shslide{flex:0 0 200px;height:300px;scroll-snap-align:center;display:flex;
  align-items:flex-end;justify-content:center;
  opacity:.3;transform:scale(.78);transform-origin:bottom center;
  transition:opacity .2s,transform .2s}
.shslide.on{opacity:1;transform:scale(1)}
.shslide img{height:100%;width:auto;max-width:100%;object-fit:contain;object-position:bottom;
  -webkit-user-drag:none;user-select:none;pointer-events:none}
.shslide svg.fig{height:100%;width:auto}
.shname{text-align:center;font-size:22px;font-weight:700;letter-spacing:-.02em;margin-top:16px}
.shdots{display:flex;gap:6px;justify-content:center;margin:10px 0 10px}
.shdots i{width:6px;height:6px;border-radius:50%;background:var(--line);
  transition:background .16s,transform .16s}
.shdots i.on{background:var(--accent);transform:scale(1.3)}
.shdots + .silnote{text-align:center}
/* ---- both horizons on one screen ---- */
.gsec{margin-bottom:20px}
.glbl{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink3);
  font-weight:650;margin-bottom:9px}
.ggrid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.gopt{position:relative;min-height:58px;border-radius:13px;border:1.5px solid var(--line);
  background:var(--card2);color:var(--ink);font:inherit;font-size:13.5px;font-weight:600;
  text-align:left;padding:0 30px 0 13px;display:flex;align-items:center;line-height:1.25}
.gopt.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
/* the number IS the answer — order is the priority, not decoration */
.grank{position:absolute;right:9px;top:50%;transform:translateY(-50%);width:19px;height:19px;
  border-radius:50%;font-style:normal;font-size:11px;font-weight:800;display:grid;place-items:center;
  background:transparent;color:transparent;transition:.15s}
.gopt.on .grank{background:var(--accent);color:#0B0F14}

/* ---- the week ---- */
.wsec{margin-bottom:18px}
.wlbl{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink3);
  font-weight:650;margin-bottom:9px}
.wexp{margin:-4px 0 9px}
.wdays,.wlen{display:flex;gap:6px}
.wdays button,.wlen button{flex:1;min-height:50px;border-radius:12px;border:1.5px solid var(--line);
  background:var(--card2);color:var(--ink);font:inherit;font-size:14px;font-weight:650;padding:0}
.wdays button.on,.wlen button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
/* ten blocks, filled left to right — Galpin's split made tappable */
.wpts{display:flex;gap:4px}
.wpts button{flex:1;min-height:42px;border-radius:8px;border:1.5px solid var(--line);
  background:var(--card2);color:var(--ink3);font:inherit;font-size:12px;font-weight:700;padding:0}
.wpts button.on{border-color:var(--neon);background:var(--neon-soft);color:var(--neon);
  box-shadow:0 0 10px var(--neon-line)}
.wread{min-height:52px;border-radius:13px;border:1px solid var(--line);background:var(--bg2);
  padding:11px 14px;display:flex;flex-direction:column;gap:3px;justify-content:center}
.wread b{font-size:15px;font-weight:650}
.wread span{font-size:12.5px;color:var(--ink3);line-height:1.4}
.alrow{margin-bottom:20px}
.allbl{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink3);
  font-weight:650;margin-bottom:9px}
.alchips{display:flex;gap:6px}
.alchips button{flex:1;min-height:52px;border-radius:12px;border:1.5px solid var(--line);
  background:var(--card2);color:var(--ink);font:inherit;font-size:14px;font-weight:600;padding:0}
.alchips button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.silrow{display:flex;gap:6px;padding:2px 0 6px}
.silrow::-webkit-scrollbar{display:none}
@supports not (gap:1px){.silrow>*+*{margin-left:6px}}
.sil{flex:1 1 0;min-width:0;min-height:112px;border-radius:14px;border:1.5px solid var(--line);
  background:var(--card);padding:8px 4px 6px;cursor:pointer;font-family:inherit;
  display:flex;flex-direction:column;align-items:center;scroll-snap-align:center;
  transition:border-color .16s,transform .16s,background .16s}
.sil:active{transform:scale(.97)}
.sil.on{border-color:var(--accent);background:var(--accent-soft)}
.sil svg{width:100%;height:76px;display:block}
.sil svg path,.sil svg circle{fill:var(--ink3);transition:fill .16s}
.sil.on svg path,.sil.on svg circle{fill:var(--accent)}
/* Real artwork sits in exactly the same 76px box as the drawn silhouette, so a
   sheet that has not been rendered yet falls back without the row shifting.
   The drawn figure signals "selected" by changing fill; a photograph cannot,
   so it comes up muted and resolves to full colour on the one you pick. */
.sil img{width:100%;height:118px;display:block;object-fit:contain;object-position:bottom;
  -webkit-user-drag:none;user-select:none;pointer-events:none;
  filter:grayscale(.4) opacity(.78);transition:filter .16s}
.sil.on img{filter:none}
/* A whole standing body in a fifth of a phone's width is small. At the 76px
   the drawn silhouette uses, thin and average and soft are the same picture —
   which defeats the point of photographing them. The row grows to fit the
   artwork; there was empty screen below it either way. */
.sil:has(img){min-height:152px}
.sil b{font-size:10px;font-weight:600;color:var(--ink3);margin-top:5px;letter-spacing:.01em;
  text-align:center;line-height:1.2}
.sil.on b{color:var(--accent)}
.silnote{font-size:12.5px;line-height:1.5;color:var(--ink3);margin-top:2px;
  min-height:34px;transition:opacity .2s}

/* ---------- send / handoff ---------- */
.sendbox{background:var(--card);border:1.5px solid var(--line);border-radius:16px;
  padding:16px 17px;margin-top:4px}
/* Coach yellow marks a human, but a whole button of it shouted. A big
   yellow slab reads as a warning, not a person — and it fought the jade
   primary two inches below it. It is a tag and a name now: enough to say
   "this one goes to someone real", not enough to take over the screen. */
.coachtag{display:inline-flex;align-items:center;gap:7px;font-size:11px;font-weight:700;
  letter-spacing:.13em;text-transform:uppercase;color:var(--coach);margin-bottom:9px}
.coachtag i{width:20px;height:20px;border-radius:50%;background:var(--coach-soft);
  border:1px solid var(--coach-line);display:grid;place-items:center;
  font-style:normal;font-size:10px;font-weight:800;color:var(--coach)}
.sendto{margin-top:10px;text-align:center;color:var(--ink3);font-size:11.5px}
.sendto b{color:var(--coach);font-weight:600}
.prow .who{transition:color .3s}
.promise .prow:nth-child(4) .who,.promise .prow:nth-child(5) .who{color:var(--coach)}
.sendbox{border-color:var(--coach-line)!important;box-shadow:0 0 0 1px var(--coach-soft) inset}
.sendbox h4{margin:0 0 6px;font-size:14.5px;font-weight:600;letter-spacing:-.01em}
.sendbox p{margin:0;font-size:13px;line-height:1.5;color:var(--ink3)}
.sendrow{display:flex;gap:9px;margin-top:12px}
.sendrow button{flex:1;min-height:50px;border-radius:13px;border:1.5px solid var(--line2);
  background:var(--bg2);color:var(--ink);font-size:14px;font-weight:600;font-family:inherit;cursor:pointer}
.sendrow button.pri{background:var(--accent);color:#0C1512;border-color:var(--accent)}
.sentmark{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:13px;color:var(--accent)}
.sentmark svg{width:16px;height:16px;stroke:currentColor;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}


/* ---------- vitals: sex, age, height, weight on one screen ---------- */
.segrow{display:flex;gap:8px;margin-bottom:6px}
.segrow button{flex:1;min-height:52px;border-radius:14px;border:1px solid var(--line);
  background:rgba(255,255,255,.030);color:var(--ink2);font-size:14.5px;font-weight:600;
  font-family:inherit;cursor:pointer;padding:8px 4px;line-height:1.2}
.segrow button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.vrow{display:flex;align-items:center;gap:8px;padding:15px 0;border-bottom:1px solid var(--line)}
.vrow:last-of-type{border-bottom:none}
.vl{flex:0 0 54px;font-size:13.5px;color:var(--ink3);font-weight:600;letter-spacing:.01em}
.vb{width:46px;height:46px;flex:0 0 auto;border-radius:13px;border:1px solid var(--line);
  background:transparent;color:var(--ink);font-size:21px;font-family:inherit;cursor:pointer;
  display:flex;align-items:center;justify-content:center;line-height:1}
.vb:active{transform:scale(.94)}
.vv{flex:1 1 auto;text-align:center;font-size:23px;font-weight:600;letter-spacing:-.02em;
  font-variant-numeric:tabular-nums;min-width:0}
.vu{flex:0 0 auto;display:flex;gap:4px}
.vu button{min-width:46px;height:46px;border-radius:11px;border:1px solid var(--line);
  background:transparent;color:var(--ink3);font-size:12px;font-weight:700;font-family:inherit;
  cursor:pointer;letter-spacing:.04em}
.vu button.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}

/* ---------- the week, editable ---------- */
.wkpick{display:flex;gap:6px;margin:4px 0 6px}
@supports not (gap:1px){.wkpick>*+*{margin-left:6px}}
.wkpick button{flex:1;min-width:0;height:62px;border-radius:14px;border:1px solid var(--line);
  background:rgba(255,255,255,.030);color:var(--ink3);font-family:inherit;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}
.wkpick button .wd{font-size:12.5px;font-weight:650;letter-spacing:.02em}
.wkpick button .wm{width:7px;height:7px;border-radius:50%;background:var(--line2)}
.wkpick button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.wkpick button.on .wm{background:var(--accent)}
.wkcount{font-size:12.5px;color:var(--ink3);margin:0 0 20px}
.wkcount b{color:var(--accent);font-weight:650}
/* ---------- deck intro how-to ---------- */
.howto{margin-top:6px}
.hrow{display:flex;gap:14px;align-items:flex-start;padding:13px 0;border-bottom:1px solid var(--line)}
.hrow:last-child{border-bottom:none}
/* The deck intro's two arrows carry the whole instruction, so they are sized
   like a signpost rather than a bullet point. Everything else on that screen
   was cut back to let them do it. */
.howto.big .hrow{padding:18px 0;align-items:center;gap:18px}
.howto.big .hi{width:60px;height:60px;border-radius:18px;font-size:30px;font-weight:700}
.howto.big b{font-size:18px}
.hrow .hi{flex:0 0 auto;width:34px;height:34px;border-radius:11px;display:flex;
  align-items:center;justify-content:center;font-size:16px;font-weight:700;margin-top:1px}
.hrow .hi.yes{background:var(--accent-soft);color:var(--accent)}
.hrow .hi.no{background:rgba(255,255,255,.05);color:var(--ink2)}
.hrow .hi.neu{background:rgba(255,255,255,.05);color:var(--ink3);font-size:14px}
.hrow b{display:block;font-size:15.5px;font-weight:600;letter-spacing:-.01em}
.hrow small{display:block;margin-top:3px;font-size:12.5px;color:var(--ink3);line-height:1.4}

/* ---------- equipment grid ---------- */
.kitgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:2px}
@supports not (gap:1px){.kitgrid>*{margin:0 9px 9px 0}}
.kit{background:var(--card);border:1.5px solid var(--line);border-radius:15px;
  padding:13px 6px 11px;display:flex;flex-direction:column;align-items:center;gap:7px;
  cursor:pointer;font-family:inherit;min-height:92px;justify-content:center;
  transition:border-color .16s,background .16s,transform .16s}
.kit:active{transform:scale(.97)}
.kit svg{width:28px;height:28px;stroke:var(--ink2);stroke-width:1.6;fill:none;
  stroke-linecap:round;stroke-linejoin:round;transition:stroke .16s}
.kit span{font-size:11.5px;line-height:1.25;color:var(--ink2);text-align:center;font-weight:500}
.kit.on{border-color:var(--accent);background:var(--accent-soft)}
.kit.on svg{stroke:var(--accent)}
.kit.on span{color:var(--accent);font-weight:600}
.kitadd{margin-top:11px}
.kitadd .tin{margin-top:0}
.kitchips{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.kitchip{background:var(--accent-soft);color:var(--accent);border:1px solid rgba(62,203,168,.3);
  border-radius:9px;padding:7px 11px;font-size:12.5px;font-weight:600;
  display:flex;align-items:center;gap:7px}
.kitchip button{background:none;border:none;color:inherit;font-family:inherit;font-size:14px;
  padding:0 0 0 2px;cursor:pointer;line-height:1}

/* ---------- logo ---------- */
.logo{width:74%;max-width:280px;margin:0 auto 30px;display:block}

   carry on. Deliberately per-device rather than per-account: there is no
   account yet, and the honest scope of this is "do not lose my work",
   not "sign me in". The real profile arrives with the account handoff. */
const DRAFT_KEY = 'fj_draft';
function saveDraft(){
  try{ localStorage.setItem(DRAFT_KEY, JSON.stringify({ v:6, at:new Date().toISOString(), a:A, i:i, hist:hist })); }
  catch(e){}
}
function loadDraft(){
  try{ const r=localStorage.getItem(DRAFT_KEY); const d=r?JSON.parse(r):null;
       return (d && d.v===6 && d.a) ? d : null; }
  catch(e){ return null; }
}
function clearDraft(){ try{ localStorage.removeItem(DRAFT_KEY); }catch(e){} }

/* ---------------- insight ---------------- */
function insight1(){
  const h=A.horizon||[], f=(A.focus||[]), age=A.age||38, nm=A.name?A.name+', ':'';
  const first = H_LABEL[h[0]]||'staying capable';
  const g1 = FOCUS_LABEL[f[0]]||'getting stronger';
  const g2 = FOCUS_LABEL[f[1]];
  let head, body;

  /* Every branch names two things they said, then says what it changes. */
  if(f[0]==='lean' && (f[1]==='strong'||f[1]==='muscle')){
    head='Those two compete.';
    body='Leaning out and building muscle want opposite things from your recovery. I build the muscle first and let the leanness follow — that order works. The other one stalls at week six.';
  } else if(f[0]==='lean' && (h.includes('heavy')||h.includes('sport'))){
    head='Your 90 days and your '+horizonAge(age)+' disagree.';
    body='You want to lean out now and still be lifting at '+horizonAge(age)+'. Muscle is the thing that gets you there. So we train for it and let the leanness come off the back of it, not the other way round.';
  } else if(h.includes('floor') && age>=50){
    head='You picked the one that actually predicts things.';
    body='Getting off the floor unaided is one of the better markers of an independent old age — and unlike most markers, it stays trainable. It moves within eight weeks.';
  } else if((f[0]==='energy'||f[0]==='wind') && (f[1]==='strong'||f[1]==='muscle')){
    head='Same fix, different order.';
    body='"'+cap(g1)+'" and "'+cap(g2||'strength')+'" both sit on an aerobic base almost nobody builds. Twenty minutes of easy work a week buys both. It is the least glamorous thing I will ask you to do.';
  } else if(f[0]==='energy'||f[0]==='wind'){
    head='That one has a cause.';
    body='Tired and out of breath both trace back to an aerobic base nobody built. It is the fastest thing in fitness to change and the first thing I will put in your week.';
  } else if(h.includes('strongold')||(h.includes('heavy')&&age<35)){
    head='You are thinking about this earlier than most.';
    body='Muscle and bone built before 40 is the account you draw down from for the next 50 years. Almost nobody makes that deposit on purpose. It changes what I load and how hard.';
  } else if(g2){
    head=cap(g1)+' first. '+cap(g2)+' second.';
    body='You gave me two, in order, and the order is the useful part. Every session gets built around the first one. The second gets whatever is left — which is more than you would think.';
  } else {
    head='Specific enough to build on.';
    body='Most people answer this with a number on a scale. You gave me something testable, so I can tell you whether it is working instead of asking how you feel about it.';
  }
  return {tag:'Entry 001 · first thing I have learned',
    lines:[head, body,
      '<b>'+cap(first)+'</b> is now what every exercise has to earn its place against.']};
}
function cap(t){ return t? t[0].toUpperCase()+t.slice(1) : t; }
function pattern(){
  /* driver is a list now (up to three). Tolerate the old single value so a
     dossier link shared before this change still reads correctly. */
  const b=A.blockers||[];
  const dl=Array.isArray(A.driver)?A.driver:(A.driver?[A.driver]:[]);
  const d=v=>dl.includes(v);
  if(b.includes('toohard')||b.includes('week3'))
    return {n:'The Fast Starter', b:'Not a motivation problem — a pacing problem. You go too hard in week one and week three collects the bill. Your first fortnight will feel conservative. If you think "is this it?", that\'s the plan working.'};
  if(b.includes('life')||b.includes('time'))
    return {n:'First Thing Dropped', b:'Training sits at the bottom of the list, so it goes first when the list gets long. The fix isn\'t discipline — it\'s making the session small enough that dropping it stops being a decision.'};
  if(b.includes('lost'))
    return {n:'Needs to See the Map', b:'You stopped because you couldn\'t tell if it was working. You\'ll get the reason for every session before it, and a measure of whether it worked after.'};
  if(d('doctor'))
    return {n:'Started by Someone Else', b:'Someone else set this in motion, which is a fine way to begin and a poor way to continue. Over 90 days my job is to hand you a reason of your own.'};
  if(d('event'))
    return {n:'Deadline-Driven', b:'Something is pulling you forward, which works right until the day it passes. Watch for what replaces it around week six.'};
  return {n:'Quietly Consistent', b:'Nothing here suggests drama. You\'re building a habit, not chasing a transformation — and that profile outperforms almost everyone over two years. Your risk isn\'t quitting, it\'s plateauing politely.'};
}

/* ---- level slider ------------------------------------------------------
   The thresholds come from Nicolas's BENCHMARK_M/F.csv, baked in by
   tools/build-benchmarks.mjs. Three kinds of question, because one does
   not fit: how many, how long, how heavy. */
let _bm=null;
function benchmarks(){
  if(_bm===null){
    const n=document.getElementById('benchmarks');
    try{ _bm = n ? JSON.parse(n.textContent) : {}; }catch(e){ _bm={}; }
  }

const TIER_NAME=['Just starting','Beginner','Intermediate','Advanced','Elite'];

/* Everything the slider needs for one card, already converted into the
   units this person actually thinks in. */
/* How far the slider reaches, from what they told us about right now.
   Showing a deconditioned person a scale that ends at Elite does not
   inform them, it measures the gap and calls it a starting point. The
   scale stops one step past where they are and opens further only if
   they ask it to. */
const ACTIVITY_CAP={none:1, light:2, regular:3, serious:4};
function defaultCap(){ return ACTIVITY_CAP[A.activity] || 3; }

function scaleFor(c, cap){
  const b=benchmarks()[c.id];
  if(!b) return null;
  cap = Math.max(1, Math.min(4, cap || defaultCap()));
  const lb = A.unit==='lb';
  const bw = Number(A.weightKg)||75;
  const weight = b.mech==='WEIGHT';
  /* xBW is stored as a multiple so it fits any body. Turn it into real
     load here, then into pounds if that is what they use. */
  const conv = v => weight ? (v*bw)*(lb?2.20462:1) : v;
  const t=(A.sex==='f'?b.f:b.m).map(conv);
  const round = v => weight ? Math.round(v/(lb?5:2.5))*(lb?5:2.5) : Math.round(v);
  const marks=t.map(round);
  const step = weight ? (lb?5:2.5) : (b.mech==='HOLD' ? 5 : 1);
  const max = Math.max(round(marks[cap-1]*1.25), step*4);
  return {
    mech:b.mech, weight, marks, step, max, cap, canOpen: cap<4,
    unit: weight ? (lb?'lb':'kg') : (b.mech==='HOLD' ? 'sec' : (b.unit==='reps_per_side'?'reps each side':'reps')),
    q: weight ? 'How much can you lift?'
      : b.mech==='HOLD' ? 'How long can you hold it?'
      : (b.unit==='reps_per_side' ? 'How many, each side?' : 'How many, in one honest set?'),
  };
}
function tierOf(v,marks){
  let t=0; for(let i=0;i<4;i++) if(v>=marks[i]) t=i+1;
  return t;
}
function fmtVal(v,sc){
  if(sc.mech==='HOLD'){
    if(v<60) return v+'';
    const m=Math.floor(v/60), s=v%60;
    return s? m+':'+String(s).padStart(2,'0') : m+':00';
  }
  return String(v);
}

function bandQ(c){
  return c.kind==='w' ? 'How much, for about five reps?'
       : c.kind==='r' ? 'How many, in one honest set?'
       : c.kind==='t' ? 'How long can you hold it?'
       : 'How far do you take it?';
}
/* Gym literacy and bodyweight literacy fall out of the deck.
   Never ask what the answer already tells you. */
function deriveLevels(){
  const d=A.deck||{}, set=deckSet();
  let known=0, loaded=0;
  set.forEach(function(c){ const r=d[c.id]; if(!r||!r.does) return; known++;
    /* "loaded" means they actually put weight on it. With the slider that is
       simply a number above zero; the old bands had to be read as text. */
    if(c.kind==='w'){
      if(r.value>0) loaded++;
      else if(r.band && r.band.indexOf('Bar only')<0 && r.band.indexOf('Bodyweight')<0) loaded++;
    }});
  /* The slider gives something the bands never could: where each answer sits
     against the benchmark table. Averaging the movements they can actually do
     is a far better starting point than counting how many they ticked. */
  const tiers=set.map(c=>d[c.id]).filter(r=>r&&r.does&&typeof r.tier==='number').map(r=>r.tier);

   option flips is the direction every option under your finger follows, which
   means the same gesture also clears a run of selections. */
function dragPick(root, sel, toggle){
  var armed=false, mode=null, timer=null, last=null, sx=0, sy=0, painted=false;
  function cancelTimer(){ if(timer){clearTimeout(timer);timer=null;} }
  function disarm(){ armed=false; mode=null; last=null; cancelTimer(); root.classList.remove('picking'); }
  function optAt(x,y){ var e=document.elementFromPoint(x,y); return (e&&e.closest)?e.closest(sel):null; }

  root.addEventListener('pointerdown',function(ev){
    var b=ev.target.closest?ev.target.closest(sel):null; if(!b) return;
    sx=ev.clientX; sy=ev.clientY; painted=false;

    timer=setTimeout(function(){
      timer=null; armed=true; painted=true; last=b;
      mode=!b.classList.contains('on');       /* paint away from where we started */
      root.classList.add('picking'); haptic(24);
      toggle(b,mode);
    },240);
  },{passive:true});

  root.addEventListener('pointermove',function(ev){
    if(!armed){
      if(timer && (Math.abs(ev.clientX-sx)>8||Math.abs(ev.clientY-sy)>8)) cancelTimer();

  },true);

    /* the words rise and fade in across the same window, on the same clock */
    const q=clamp01((t-t3start)/Math.max(.35,t3end-t3start));
    const e=1-Math.pow(1-q,3);
    hcopy.style.opacity=e.toFixed(3);
    hcopy.style.transform='translateY('+(12*(1-e)).toFixed(2)+'px)';
    if(triL) triL.style.strokeDashoffset=(TRI_LEN*(1-e)).toFixed(1);
    cta.style.opacity=e.toFixed(3);
    cta.style.transform='translateY('+(8*(1-e)).toFixed(2)+'px)';
    if(!landedText && t>=t3start){ landedText=true; foot.classList.add('on'); syncFootPad(); }
    if(!landedArt  && t>=done)   { landedArt=true;  landArt(); }
  }
  function tick(now){
    if(!d.isConnected){ raf=0; return; }            /* screen left; stop the clock */
    if(!t0) t0=now;
    const t=(now-t0)/1000;
    paint(t);
    if(t<done+0.05){ raf=requestAnimationFrame(tick); }
    else { raf=0; finishNow(); }
  }
  function finishNow(){
    if(raf){ cancelAnimationFrame(raf); raf=0; }
    paint(done+1);                                   /* land every value exactly */
    /* Hand the strokes back to the stylesheet. The fade-in above is a
       function of drawn length over stroke width, so a path shorter than
       one and a half of its own widths would top out below 1 and stay
       faint for good. None are today; clearing it means none ever can be. */
    for(let k=0;k<strokes.length;k++){ strokes[k].el.style.opacity=''; }
    hcopy.style.opacity=''; hcopy.style.transform='';
    cta.style.opacity='';   cta.style.transform='';
    heroEl.classList.add('ready');
    /* Only now does the light start running. */
    heroEl.classList.add('lit');
    if(triL) triL.style.strokeDashoffset=0;
    if(!landedText){ landedText=true; foot.classList.add('on'); syncFootPad(); }
    landArt();
    /* A no-op unless syncFootPad changed the padding when the button came
       in. Left in so a footer that does resize cannot leave the copy off. */
    placeCopy();
  }

  /* THE WORDS SIT HALFWAY BETWEEN THE POINT OF THE TRIANGLE AND THE BUTTON.
     Both ends move: the triangle scales with the width of the screen and the
     button rides the safe-area inset, so a fixed margin that looks right on
     one phone is wrong on the next. Measured instead.

     It has to iterate. The block is vertically centred, so adding N to the
     gap pushes the words down by only N/2 — and drags the triangle, and with
     it the apex, up by the other half. Each pass halves the error, so three
     or four settle it; the loop exits on half a pixel. */
  function placeCopy(){
    const tri=d.querySelector('.tri'), lock=d.querySelector('.lock'),
          btn=foot.querySelector('.cta');
    if(!tri||!lock||!btn||!d.isConnected) return;
    let gap=parseFloat(getComputedStyle(art).marginBottom)||0;
    for(let i=0;i<10;i++){
      const t=tri.getBoundingClientRect();
      const apex=t.top+t.height*(252/268);          // the point, not the box
      const mid=(apex+btn.getBoundingClientRect().top)/2;
      /* offsetTop, not a rect: hcopy carries a transform on the way in and a
         rect would measure where it is flying from, not where it lands. */
      const at=lock.getBoundingClientRect().top+hcopy.offsetTop;
      const dy=mid-hcopy.offsetHeight/2-at;
      if(Math.abs(dy)<0.5) break;
      const next=Math.min(340,Math.max(16,gap+dy*2));
      if(next===gap) break;                          // clamped; stop rather than spin
      gap=next; art.style.marginBottom=gap+'px';
    }
  }
  window.addEventListener('resize',placeCopy);


  /* Settle the layout before the first frame. */
  placeCopy();
  requestAnimationFrame(placeCopy);        // again once fonts have settled

  if(REDUCED){ finishNow(); }
  else { raf=requestAnimationFrame(tick); }

  /* Nobody should have to wait out an animation, and once it has landed there
     is only one thing to do here — so the whole screen is the button. First
     tap finishes the mark, the next one moves on. Two taps through the opening
     without ever aiming at anything. */
  d.addEventListener('click', function(ev){
    if(ev.target.closest && ev.target.closest('#foot')) return;
    if(!art.classList.contains('alive')){ finishNow(); return; }
    haptic(16); next();
  });
}

/* the contract — as messages, arriving one at a time with the coach typing */
function promise(s){
  const d=el(`<div class="chatwrap">
    <div class="chathead"><i>${COACH.name[0]}</i><b>Coach ${COACH.name}</b><span>Online</span></div>
    <div class="chat" id="chat">
      ${s.msgs.map((m,k)=>`<div class="cbub${k===s.msgs.length-1?' key':''}">${m}</div>`).join('')}
      <div class="typing" id="typing"><i></i><i></i><i></i></div>
    </div></div>`);
  const bubs=[].slice.call(d.querySelectorAll('.cbub')), typing=d.querySelector('#typing');

  /* Typing indicator, then the bubble — the pause is what makes it read as a
     person rather than a list animating in. Longer messages take longer to
     "type", capped so nobody waits on the last one. */
  let k=0;
  function step(){
    if(k>=bubs.length){ typing.classList.remove('on'); showCta(); return; }
    typing.classList.add('on');
    const chars=bubs[k].textContent.trim().length;
    later(function(){
      typing.classList.remove('on');
      bubs[k].classList.add('on');
      typing.parentNode.appendChild(typing);      // stays at the bottom
      haptic(9); k++;
      later(step, 260);
    }, Math.min(900, 340 + chars*7));
  }
  function showCta(){
    if(foot.querySelector('.cta')) return;
    setFoot(`<button class="cta accent">${s.cta}</button>`);
    foot.querySelector('.cta').onclick=()=>{haptic(16);next();};
  }
  function skip(){
    clearPending(); typing.classList.remove('on');
    bubs.forEach(b=>b.classList.add('on')); k=bubs.length; showCta();
  }
  if(REDUCED) skip(); else later(step, 420);

  /* Same two-tap rhythm as the opening: first tap lands the whole thread,
     the next one moves on. */
  d.onclick=function(){
    if(k>=bubs.length){ haptic(16); next(); return; }
    haptic(12); skip();
  };
}
