# Static site. No build step — every file here is the app.
[build]
  publish = "."
  command = ""

# The survey and the app MUST be same-origin: the profile handoff is
# localStorage, with the link as a fallback. Splitting them across two
# hosts is what broke it the first time.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache"
