<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#171A1E" />
  <title>Labs</title>
  <link rel="icon" type="image/png" href="images/timer-icon/timer-192.png" />
  <!--
    LABS. Every design lab behind one link, for Nico, not for clients. Each
    lab is its own page; this page only switches between them. The tab last
    used opens next time; #voice etc. opens one directly.

    WHAT IS HERE, AND WHAT EACH ONE OWNS:
      Logo        logo/LOGO LAB.html   the hero mark: triangle, dumbbell, tube
      App icon    icon-lab.html        the home-screen tile: ground, brick, fj
      Timer icon  timer-icon-lab.html  the Quick Timer's chronograph tile
      Timer ring  ring-lab.html        the countdown circle inside work mode
      Weights     logo/DUMBBELL.html   the onboarding gauges: dumbbell,
                                       barbell and kettlebell, all three
      Voice       voice-lab.html       the coach voice
      Dashboard   dashboard-lab.html   dashboard layout experiments

    NOT LISTED, ON PURPOSE. logo/LOGO PREVIEW.html is a showreel of the mark
    in motion, not something with dials. logo/WEIGHT GAUGE.html is the
    barbell-only ancestor of the Weights lab and is kept only for reference.
    Neither takes a tab; both still open directly if you want them.

    NO LAB MAY LIVE ONLY IN A CHAT. The app icon lab was built as an artifact
    and was lost twice when the scratchpad was cleared, and had to be pulled
    back out of the published copy. If a lab is worth keeping it is worth a
    file in here.
  -->
  <style>
    :root { --bg:#171A1E; --box:#212630; --line:#2F3640; --text:#ECEFF3; --muted:#A9B2BC; --acc:#3ECBA8; --neon:#FF5FA2; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin:0; height:100%; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif; }
    body { display:flex; flex-direction:column; }
    header { display:flex; align-items:center; gap: 12px; padding: calc(10px + env(safe-area-inset-top)) 14px 10px; border-bottom: 1px solid var(--line); }
    header h1 { margin:0; font-size: 20px; letter-spacing: -0.02em; }
    header h1:after { content:""; display:block; width: 24px; height: 3px; border-radius: 3px; margin-top: 4px; background: var(--neon); box-shadow: 0 0 12px var(--neon); }
    nav { display:flex; gap: 6px; overflow-x:auto; scrollbar-width: none; flex: 1; }
    nav::-webkit-scrollbar { display:none; }
    nav button { flex: 0 0 auto; background: var(--box); border: 1px solid var(--line); color: var(--muted); border-radius: 999px; padding: 8px 14px; font-size: 14px; font-weight: 700; cursor:pointer; white-space: nowrap; }
    nav button.on { color: var(--text); border-color: var(--acc); background: color-mix(in srgb, var(--acc) 16%, transparent); box-shadow: 0 0 12px color-mix(in srgb, var(--acc) 30%, transparent); }
    a.open { color: var(--muted); font-size: 13px; text-decoration: none; white-space: nowrap; }
    iframe { flex: 1; width: 100%; border: 0; background: var(--bg); }
  </style>
</head>
<body>
  <header>
    <h1>Labs</h1>
    <nav id="tabs"></nav>
    <a class="open" id="open" target="_blank" rel="noopener" title="Open this lab on its own">↗</a>
  </header>
  <iframe id="frame" title="Lab"></iframe>
<script type="module">
  /* the labs get updates like the app: the same "Update ready · Refresh" bar */
  import { watchForUpdates, announceUpdate } from './js/update-banner.js';
  announceUpdate(); watchForUpdates(() => true);
</script>
<script>
  /* Order is by what the thing IS, not by when it was built: the three marks
     first, then the two moving parts, then voice, then the dashboard. */
  const LABS = [
    { id: 'logo', name: 'Logo', src: 'logo/LOGO%20LAB.html' },
    { id: 'icon', name: 'App icon', src: 'icon-lab.html' },
    { id: 'timericon', name: 'Timer icon', src: 'timer-icon-lab.html' },
    { id: 'ring', name: 'Timer ring', src: 'ring-lab.html' },
    { id: 'weights', name: 'Weights', src: 'logo/DUMBBELL.html' },
    { id: 'voice', name: 'Voice', src: 'voice-lab.html' },
    { id: 'dashboard', name: 'Dashboard', src: 'dashboard-lab.html' },
  ];
  try { localStorage.setItem('fj.coachDevice', '1'); } catch (e) {}
  const pick = id => {
    const lab = LABS.find(l => l.id === id) || LABS[0];
    document.getElementById('frame').src = lab.src;
    document.getElementById('open').href = lab.src;
    document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.id === lab.id));
    try { localStorage.setItem('fj.labsTab', lab.id); } catch (e) {}
    history.replaceState(null, '', '#' + lab.id);
  };
  document.getElementById('tabs').innerHTML = LABS.map(l => `<button data-id="${l.id}">${l.name}</button>`).join('');
  document.querySelectorAll('#tabs button').forEach(b => b.addEventListener('click', () => pick(b.dataset.id)));
  let start = location.hash.slice(1);
  if (!LABS.some(l => l.id === start)) { try { start = localStorage.getItem('fj.labsTab'); } catch (e) {} }
  pick(start);
</script>
</body>
</html>
