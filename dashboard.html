<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#171A1E">
<title>Fitness Journey - Dashboard</title>
<link rel="icon" href="icon.svg">
<style>
/* ============================================================
   FITNESS JOURNEY — THE DASHBOARD (prototype v1)

   The motherboard. Everything the person owns lives here: today,
   the program, the log, the library, the profile, the proof.

   Design language is inherited wholesale from onboarding.html so
   the seam between "answering questions" and "having an app" is
   invisible: same slate, same teal, same 402px frame, same
   understatement. Nothing here shouts.

   Four tabs, because four is the most a thumb can reach without
   looking: Today · Progress · Learn · Me. The program is not a
   tab — it is a card inside Today, because a program you have to
   go and find is a program you stop opening.
   ============================================================ */

:root{
  --bg:#171A1E;
  --bg2:#1E232A;
  --card:#212630;
  --surface:#212630;
  --surface2:#282E38;
  --line:#2F3640;
  --line2:#3B434E;
  --ink:#ECEFF3;
  --ink2:#A9B2BC;
  --ink3:#858E99;
  --accent:#3ECBA8;
  --accent-soft:rgba(62,203,168,.13);
  --accent-line:rgba(62,203,168,.34);
  --accent-2:#D9A94C;
  --gold-soft:rgba(217,169,76,.13);
  --red:#F0857A;
  --red-soft:rgba(240,133,122,.12);
  /* ---- the 80s layer -------------------------------------------------
     Teal and hot pink is the Miami palette the synthwave covers are built
     on, so the app's existing accent already had the other half of it.
     Rule we hold to: neon touches STRUCTURE and GLOW only — rails, rules,
     halos, celebration moments. It never carries body text, and it never
     becomes a button, because a magenta call-to-action on a dark ground
     glares long before it reads. Shadows become coloured halos; that is
     the whole idea and it costs no legibility. */
  /* These four are the DEFAULT only. spine/theme.json owns the real values
     and applyTheme() overwrites them at boot, so a colour change is a data
     edit in one file rather than a search-and-replace across screens. */
  --neon:#FF5FA2;
  --neon-soft:rgba(255,95,162,.13);
  --neon-line:rgba(255,95,162,.32);
  --neon-glow:0 0 22px rgba(255,95,162,.26);
  --coach:#FFE24A;
  --coach-soft:rgba(255,226,74,.13);
  --coach-line:rgba(255,226,74,.34);
  --shadow:0 1px 2px rgba(0,0,0,.30),0 8px 24px rgba(0,0,0,.28);
  --shadow-lift:0 2px 6px rgba(0,0,0,.32),0 18px 44px rgba(62,203,168,.16);
  --r:18px;
  --tabh:66px;
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
button,a,label,.tap{touch-action:manipulation}
html{height:100%;-webkit-text-size-adjust:100%}
body{
  height:100%;
  background:#0B0D0F;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",Roboto,sans-serif;
  color:var(--ink);
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;
}
.serif{font-family:"New York","Iowan Old Style",ui-serif,Georgia,serif;font-weight:400}
.tnum{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

/* ---------- device frame (desktop only) ---------- */
#device{
  width:min(100vw,402px);
  height:min(874px,calc(100vh - 36px));
  background:var(--bg);position:relative;overflow:hidden;
  border-radius:44px;box-shadow:0 0 0 10px #05070A,0 30px 80px rgba(0,0,0,.6);
  display:flex;flex-direction:column;
}
@media (pointer:coarse),(max-width:560px){
  body{align-items:stretch;background:var(--bg)}
  #device{width:100%;height:100vh;height:100dvh;max-height:none;border-radius:0;box-shadow:none}
}
@media (pointer:fine) and (min-width:900px){
  body::after{content:"Dashboard prototype \2014 tap anything";
    position:fixed;bottom:18px;left:50%;transform:translateX(-50%);
    font-size:11.5px;color:#8A9098;letter-spacing:.02em}
}

/* ---------- scroll region ---------- */
#view{
  flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
  padding:calc(env(safe-area-inset-top) + 18px) 18px calc(var(--tabh) + env(safe-area-inset-bottom) + 26px);
}
#view::-webkit-scrollbar{display:none}
.pane{animation:fade .34s cubic-bezier(.22,1,.36,1) both}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ---------- type ---------- */
.eyebrow{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:600}
.eyebrow.dim{color:var(--ink3)}
h2.h{font-size:23px;line-height:1.2;letter-spacing:-.022em;font-weight:550}
.sect{display:flex;align-items:baseline;justify-content:space-between;margin:26px 2px 11px}
.sect b{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);font-weight:600;
  display:inline-flex;align-items:center;gap:9px}
.sect b:before{content:"";width:13px;height:2px;border-radius:2px;background:var(--neon);
  box-shadow:0 0 7px rgba(255,95,162,.75);flex:none}
.sect a{font-size:12.5px;color:var(--accent);text-decoration:none;font-weight:500;cursor:pointer}
.sub{font-size:14px;line-height:1.5;color:var(--ink2)}
.micro{font-size:12px;color:var(--ink3);line-height:1.5}
/* Justified — lines start and finish on the same edge. On a column this
   narrow that only works with hyphenation on; without it justify tears
   rivers of white space through the middle of a paragraph. */
.just,.alert p,.hero .why{text-align:justify;hyphens:auto;-webkit-hyphens:auto;
  text-wrap:pretty}

/* ---------- header ---------- */
#head{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
#head .who .hi{font-size:22px;letter-spacing:-.02em;font-weight:550;line-height:1.2}
#head .who .dt{font-size:12px;color:var(--ink3);margin-top:3px;letter-spacing:.01em}
/* The lockup, not a loose dumbbell. At 50x25 the old mark was a detail next
   to a serif name set this large — it read as a stray icon rather than the
   thing the app is called. The triangle gives it a shape with presence and
   an aspect ratio that stands up to a heavy first line. */
#head .lockup{width:62px;height:55px;flex:none;overflow:visible}
#head .lockup path{fill:none;stroke-linecap:round;stroke-linejoin:round}
#head .lk-tri{stroke:url(#mkTri);stroke-width:8;
  filter:drop-shadow(0 0 calc(5px * var(--glow-k,1)) var(--neon-line))}
/* On the opening screen the glare is 2.1x the line and blurred 3.5px — on a
   mark 315px wide. Copying those ratios to a 62px mark put a fat white band
   across the middle of the triangle and washed the pink out of it, which is
   why the colour looked wrong even though the gradient is verbatim. A soft
   light on a big sign is a smear on a small one. Pulled back to 1.5x and a
   blur measured against THIS size. */
#head .lk-glare{stroke:url(#mkGlare);stroke-width:12;opacity:.7;
  filter:blur(.7px) drop-shadow(0 0 2px rgba(255,255,255,.4))}
#head .lk-db path{stroke:var(--accent);stroke-linecap:round;
  filter:drop-shadow(0 0 4px var(--accent-soft))}
/* one short bright dash chasing the perimeter — 771 is the path's length */
#head .lk-spark{stroke:#fff;stroke-width:9;stroke-dasharray:24 753;
  filter:drop-shadow(0 0 7px var(--neon));
  animation:lkRun calc(var(--beat,2400ms) * 2) linear infinite}
@keyframes lkRun{from{stroke-dashoffset:0} to{stroke-dashoffset:-777}}

/* ---------- header: punch word, name, heartbeat ---------- */
#head .who{min-width:0}
.punch{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;font-weight:600;
  color:var(--neon);text-shadow:0 0 14px var(--neon-line)}
/* The name was set in a book serif, which is a lovely face and belongs to a
   different app. Everything else here is a tight geometric sans on a dark
   ground; the one word the screen opens with should be that too, just
   bigger and heavier than anything near it. */
.name{font-size:33px;line-height:1;letter-spacing:-.035em;font-weight:650;
  margin:7px 0 0;color:var(--ink)}
#head .dt{font-size:11.5px;color:var(--ink3);margin-top:7px;letter-spacing:.01em}
.hmark{display:flex;align-items:center;gap:6px;flex:none}
.ecg{width:58px;height:20px;overflow:visible;flex:none}
.ecg polyline{fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.ecg-bg{stroke:var(--line2);opacity:.5}
.ecg-l{stroke:var(--accent);filter:drop-shadow(0 0 5px var(--accent));
  stroke-dasharray:18 82;stroke-dashoffset:0;
  animation:trace var(--beat,2400ms) linear infinite}
@keyframes trace{to{stroke-dashoffset:-100}}

/* the shock landing: flat for most of the cycle, then a jump at 82% —
   the instant the trace's leading edge arrives at the mark */
/* The same slow rep as the opening screen, not a scale pulse. The geometry
   here is already onboarding's mark verbatim — same bar, same three plates,
   same widths — so the motion is taken across verbatim too: 9 user units of
   bob in the same 260-unit box, on the same 4.4s clock, with each segment
   carrying its own half-sine so it only rests at the top and the bottom.
   Scaled down by the group around it, which is the whole point: identical
   proportions, smaller. */
#head .lk-db{will-change:transform;animation:rep 4.4s linear infinite}
@keyframes rep{
  0%  {transform:translateY(0);   animation-timing-function:cubic-bezier(.39,.575,.565,1)}
  25% {transform:translateY(-9px);animation-timing-function:cubic-bezier(.47,0,.745,.715)}
  50% {transform:translateY(0);   animation-timing-function:cubic-bezier(.39,.575,.565,1)}
  75% {transform:translateY(9px); animation-timing-function:cubic-bezier(.47,0,.745,.715)}
  100%{transform:translateY(0)}}
/* and the glow breathes on the same clock, as it does there */
#head .lk-glow{transform-origin:150px 96px;animation:lkGlow 4.4s ease-in-out infinite}
@keyframes lkGlow{0%,100%{opacity:.42;transform:scale(.95)}50%{opacity:.9;transform:scale(1.06)}}
@keyframes pump{
  0%,74%   {transform:scale(1);    filter:drop-shadow(0 0 3px var(--accent-dim))}
  80%      {transform:scale(1.09); filter:drop-shadow(0 0 11px var(--accent))}
  86%      {transform:scale(.985); filter:drop-shadow(0 0 6px var(--accent))}
  92%,100% {transform:scale(1);    filter:drop-shadow(0 0 3px var(--accent-dim))}
}

/* ---------- the travelling light ---------- */
.trav{position:relative}
.trav-l{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2;overflow:visible}
.trav-l rect{fill:none;stroke:var(--coach);stroke-width:2;stroke-linecap:round;
  filter:drop-shadow(0 0 6px var(--coach-line));
  stroke-dasharray:22 78;stroke-dashoffset:0;
  animation:travel 2.6s linear infinite}
/* on the session card the pulse is the accent, and it runs at the same
   tempo as the mark on the header — one heartbeat, two places */
.trav-l.accent rect{stroke:var(--accent);stroke-width:2.5;
  filter:drop-shadow(0 0 9px var(--accent)) drop-shadow(0 0 18px var(--accent));
  stroke-dasharray:26 74;animation-duration:4200ms}
.trav-l.coach rect{stroke:var(--coach);filter:drop-shadow(0 0 8px var(--coach))}

/* ---------- coach nico ---------- */
.unread{display:flex;align-items:center;gap:13px;width:100%;font-family:inherit;text-align:left;
  background:var(--coach-soft);border:1px solid var(--coach-line);border-radius:16px;
  padding:15px 16px;cursor:pointer;color:var(--ink);
  transition:transform .16s cubic-bezier(.22,1,.36,1)}
.unread:active{transform:scale(.985)}
.unread .av{width:36px;height:36px;border-radius:50%;flex:none;display:flex;align-items:center;
  justify-content:center;font-weight:650;font-size:14px;background:var(--coach);color:#221B00;
  box-shadow:0 0 18px var(--coach-line)}
.ur-tx{flex:1;min-width:0}
.ur-tx b{display:block;font-size:14.5px;font-weight:600;letter-spacing:-.01em}
.ur-tx small{display:block;font-size:12px;color:var(--ink3);margin-top:3px}
.ur-dot{width:9px;height:9px;border-radius:50%;background:var(--coach);flex:none;
  box-shadow:0 0 10px var(--coach)}

/* ---------- message: ONE box ------------------------------------------
   Header and body share a single border. The mono header and the scanline
   still read as a terminal, but nothing is a card inside a card. */
.msg{position:relative;margin-bottom:10px;border:1.5px solid var(--line);
  border-radius:15px;overflow:hidden;background:rgba(255,255,255,.026)}
.msg.unread{border-color:var(--coach-line);background:var(--coach-soft)}
.msg.done{opacity:.5}
.msg.done .msg-chev{color:var(--accent)}
.msg-hd{display:flex;align-items:center;gap:12px;width:100%;background:none;border:none;
  padding:14px 15px;cursor:pointer;font-family:inherit;color:var(--ink);text-align:left}
.msg.open .msg-hd{border-bottom:1.5px solid var(--coach-line)}
.msg-hd .av{width:32px;height:32px;border-radius:50%;flex:none;display:flex;align-items:center;
  justify-content:center;font-weight:650;font-size:13px;background:var(--coach);color:#221B00}
.msg.unread .msg-hd .av{box-shadow:0 0 16px var(--coach-line)}
.msg:not(.unread) .msg-hd .av{background:var(--surface2);color:var(--ink3)}
.msg-t{flex:1;min-width:0}
.msg-t b{display:block;font-size:14.5px;font-weight:600;letter-spacing:-.01em}
.msg.open .msg-t b{color:var(--coach);font-size:11px;letter-spacing:.16em;
  text-transform:uppercase;font-family:var(--tnum)}
.msg-t small{display:block;font-size:12px;color:var(--ink3);margin-top:2px}
.msg.open .msg-t small{font-size:10.5px;letter-spacing:.1em;font-family:var(--tnum)}
.msg-chev{font-size:17px;color:var(--ink3);flex:none;width:20px;text-align:center}
.msg .ur-dot{width:9px;height:9px;border-radius:50%;background:var(--coach);flex:none;
  box-shadow:0 0 10px var(--coach)}
.msg-body{position:relative;padding:15px}
.msg-body:before{content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 3px)}
.msg-body p{position:relative;font-size:14.5px;line-height:1.5;color:var(--ink2);margin-bottom:9px}
.msg-body p em{font-style:normal;color:var(--ink);font-weight:600}
.msg-ask{color:var(--ink)!important;font-weight:550}
.msg-row{position:relative;display:flex;gap:9px;margin-top:13px}
.pip{color:var(--coach)!important}

/* ---------- the CRT message window -----------------------------------
   Not a rounded chat bubble and not an 8-bit RPG box. The reference the
   80s actually shares with this app is the terminal: a hard 2px rule, a
   labelled header strip, notched corners, and the faintest scanline. It
   sits next to the app's own typography without either one apologising.
   The tail is a two-step staircase, drawn rather than curved, which is
   the one place the pixel-era shows through. */
.msg .crt{clip-path:none;border-top:2px solid var(--coach-line)}
.crt{position:relative;background:linear-gradient(180deg,rgba(255,255,255,.028),transparent 42%),var(--bg2);
  border:2px solid var(--coach-line);padding:0 0 14px;
  clip-path:polygon(9px 0,calc(100% - 9px) 0,100% 9px,100% calc(100% - 9px),
    calc(100% - 9px) 100%,26px 100%,20px calc(100% + 0px),9px 100%,0 calc(100% - 9px),0 9px);
  box-shadow:0 0 26px rgba(0,0,0,.4)}
/* the scanline, deliberately almost invisible */
.crt:after{content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.028) 0 1px,transparent 1px 3px)}
.crt-bar{display:flex;align-items:center;gap:9px;padding:9px 14px;
  background:var(--coach-soft);border-bottom:2px solid var(--coach-line);
  font-family:var(--tnum);font-size:10.5px;letter-spacing:.18em;font-weight:600;color:var(--coach)}
.crt-dot{width:7px;height:7px;border-radius:50%;background:var(--coach);flex:none;
  box-shadow:0 0 9px var(--coach)}
.crt-t{margin-left:auto;color:var(--ink3);letter-spacing:.1em;font-weight:500}
.crt-body{padding:15px 15px 4px}
.crt-body p{font-size:14.5px;line-height:1.5;color:var(--ink2);margin-bottom:9px}
.crt-body p em{font-style:normal;color:var(--ink);font-weight:600}
.crt-ask{color:var(--ink)!important;font-weight:550}
.crt-row{display:flex;gap:9px;padding:6px 15px 0}

/* outline, not fill — a solid neon button is glare, and it made the yellow
   look cheap at full strength */
.ghostline{flex:1;background:transparent;border:1.5px solid var(--coach);color:var(--coach);
  border-radius:11px;padding:12px;font-family:inherit;font-size:14px;font-weight:600;
  cursor:pointer;letter-spacing:-.01em;transition:background .18s,transform .16s}
.ghostline:active{transform:scale(.98);background:var(--coach-soft)}
.ghostline.dim{border-color:var(--line2);color:var(--ink3);font-weight:500}
.ghostline.dim:active{background:rgba(255,255,255,.04)}

/* ---------- motion budget ------------------------------------------
   One place, applied globally. A person who has asked their phone to
   calm down has asked this app too. */
@media (prefers-reduced-motion: reduce){
  *,*:before,*:after{animation-duration:.001ms!important;animation-iteration-count:1!important;
    transition-duration:.001ms!important}
  .ecg-l{stroke-dasharray:none;stroke-dashoffset:0}
  #head .lk-db,#head .lk-glow{animation:none}
  #head .lk-spark{animation:none;opacity:.8}
  .trav-l rect{stroke-dasharray:none;opacity:.55}
}

/* ---------- cards ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.card+.card{margin-top:11px}
.card.tap{cursor:pointer;transition:transform .16s cubic-bezier(.22,1,.36,1),border-color .16s}
.card.tap:active{transform:scale(.982)}
.wash{background:rgba(255,255,255,.030);border:1px solid var(--line);border-radius:15px;box-shadow:none}

/* ---------- clearance / alert strip ---------- */
.alert{display:flex;gap:12px;align-items:flex-start;background:var(--red-soft);
  border:1px solid rgba(240,133,122,.28);border-radius:14px;padding:13px 14px;margin-bottom:12px}
.alert .ic{width:19px;height:19px;stroke:var(--red);fill:none;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round;flex:none;margin-top:1px}
.alert b{font-size:13.5px;font-weight:600;display:block;margin-bottom:3px}
.alert p{font-size:12.5px;line-height:1.5;color:var(--ink2)}
.alert .x{margin-left:auto;background:none;border:none;color:var(--ink3);font-size:16px;cursor:pointer;padding:0 2px;line-height:1}

/* ---------- readiness (the daily hook) ---------- */
#ready{padding:15px 16px}
#ready .q{font-size:14.5px;font-weight:550;letter-spacing:-.01em}
#ready .qs{font-size:12px;color:var(--ink3);margin-top:3px}
.faces{display:flex;gap:8px;margin-top:13px}
.face{flex:1;background:rgba(255,255,255,.035);border:1px solid var(--line);border-radius:13px;
  padding:11px 4px 9px;display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;
  transition:transform .16s cubic-bezier(.22,1,.36,1),border-color .16s,background .18s;font-family:inherit}
.face:active{transform:scale(.95)}
.face.on{border-color:var(--accent);background:var(--accent-soft)}
.face svg{width:22px;height:22px;stroke:var(--ink2);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.face.on svg{stroke:var(--accent)}
.face span{font-size:10.5px;color:var(--ink3);font-weight:500}
.face.on span{color:var(--accent)}
#readyOut{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);font-size:13px;
  line-height:1.5;color:var(--ink2);display:none}
#readyOut.on{display:block;animation:fade .34s both}
#readyOut b{color:var(--ink);font-weight:600}

/* ---------- today hero ---------- */
.hero{position:relative;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);
  box-shadow:0 2px 6px rgba(0,0,0,.32),0 18px 44px rgba(62,203,168,.14),0 0 34px rgba(255,95,162,.13);cursor:pointer;transition:transform .18s cubic-bezier(.22,1,.36,1)}
.hero:active{transform:scale(.985)}
/* The artwork sits in the bottom-right corner at its own aspect ratio rather than
   filling the card. Cropping an illustrated body across a card edge reads as a
   mistake; a whole figure tucked behind the text reads as art. */
.hero .art{position:absolute;right:-14px;bottom:-10px;width:56%;height:82%;
  background-size:contain;background-position:right bottom;background-repeat:no-repeat;opacity:.55}
.hero .veil{position:absolute;inset:0;
  background:linear-gradient(100deg,var(--card) 38%,rgba(33,38,48,.80) 62%,rgba(33,38,48,.20) 100%)}
.hero .in{position:relative;padding:18px 17px 17px}
.hero .tag{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;letter-spacing:.14em;
  text-transform:uppercase;font-weight:600;color:var(--accent)}
.hero .tag i{width:5px;height:5px;border-radius:50%;background:var(--accent);display:block;
  box-shadow:0 0 0 0 rgba(62,203,168,.6);animation:ping 2.4s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(62,203,168,.5)}70%{box-shadow:0 0 0 8px rgba(62,203,168,0)}100%{box-shadow:0 0 0 0 rgba(62,203,168,0)}}
.hero h3{font-size:25px;line-height:1.15;letter-spacing:-.026em;font-weight:550;margin:11px 0 3px;max-width:78%}
.hero .why{font-size:12.5px;color:var(--ink2);line-height:1.45;max-width:80%}
.hero .chips{display:flex;gap:7px;margin:14px 0 16px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.055);
  border:1px solid var(--line2);border-radius:999px;padding:5px 10px;font-size:11.5px;
  color:var(--ink2);font-weight:500}
.chip svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.go{width:100%;background:var(--accent);color:#0C1512;border:none;border-radius:14px;padding:15px;
  font-size:15.5px;font-weight:600;font-family:inherit;cursor:pointer;letter-spacing:-.01em;
  transition:transform .16s}
.go:active{transform:scale(.98)}
.go.ghost{background:transparent;color:var(--ink2);border:1.5px solid var(--line2);font-weight:500}
.go.gold{background:var(--accent-2);color:#1A1305}
.hero.rest .tag{color:var(--ink3)}
.hero.rest .tag i{background:var(--ink3);animation:none}
.hero.done .tag{color:var(--accent-2)}
.hero.done .tag i{background:var(--accent-2);animation:none}
.hero.pending{border-style:dashed;border-color:var(--line2);
  box-shadow:0 2px 6px rgba(0,0,0,.32),0 0 30px rgba(255,95,162,.10)}
.hero.pending .tag{color:var(--neon)}
.hero.pending .tag i{background:var(--neon);animation:none;box-shadow:0 0 9px rgba(255,95,162,.8)}
.mv.pending{opacity:.55;border-style:dashed}
.mv.pending .rx{color:var(--neon);font-size:11px;letter-spacing:.08em;text-transform:uppercase}

/* ---------- streak / week strip ---------- */
.week{display:flex;gap:5px;margin-top:14px}
.wd{flex:1;display:flex;flex-direction:column;align-items:center;gap:7px}
.wd .l{font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);font-weight:600}
.wd .b{width:100%;height:38px;border-radius:9px;background:rgba(255,255,255,.045);
  border:1px solid var(--line);display:flex;align-items:center;justify-content:center;
  font-size:12px;color:var(--ink3);position:relative;transition:all .2s}
.wd.plan .b{border-color:var(--line2);border-style:dashed}
.wd.done .b{background:var(--accent-soft);border-color:var(--accent);border-style:solid;color:var(--accent)}
.wd.miss .b{background:rgba(240,133,122,.08);border-color:rgba(240,133,122,.3);color:var(--red)}
.wd.now .l{color:var(--accent)}
.wd.now .b{box-shadow:0 0 0 2px rgba(62,203,168,.22)}
.wd .b svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}

.statrow{display:flex;align-items:center;gap:14px}
.statrow .big{font-size:38px;font-weight:550;letter-spacing:-.03em;line-height:1}
.statrow .big small{font-size:14px;color:var(--ink3);font-weight:500;letter-spacing:0;margin-left:3px}
.statrow .lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);
  font-weight:600;margin-top:6px}
.statrow .rt{margin-left:auto;text-align:right}
.statrow .rt div{font-size:12.5px;color:var(--ink2);line-height:1.7}
.statrow .rt b{color:var(--ink);font-weight:600}

/* ---------- habits ---------- */
.habits{display:flex;flex-direction:column;gap:8px}
/* Every habit carries a trace of neon whether or not it is ticked — a row
   with a grey circle on it is a to-do list, and nobody comes back to a
   to-do list. The unticked ones glow faintly from the left edge; ticking
   one lights the whole row. */
.hab{position:relative;overflow:hidden;
  display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.030);
  border:1px solid var(--line);border-radius:14px;padding:13px 14px;cursor:pointer;
  font-family:inherit;text-align:left;width:100%;transition:transform .16s,border-color .16s,background .18s}
.hab:active{transform:scale(.982)}
.hab:before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;
  background:var(--neon);opacity:calc(.4 * var(--glow-k,1));box-shadow:0 0 10px var(--neon-line);
  transition:opacity .3s,background .3s,box-shadow .3s}
.hab:after{content:"";position:absolute;left:0;top:0;bottom:0;width:64px;pointer-events:none;
  background:linear-gradient(90deg,var(--neon-soft),transparent);opacity:calc(.55 * var(--glow-k,1));
  transition:opacity .35s}
/* A ticked habit used to light the whole row: accent border, accent wash,
   an outer glow AND a solid accent disc. Four things saying "done" is what
   made three of them at once feel like a Christmas tree. Now the row barely
   tints, and the tick is REVERSED — an outlined ring with the mark drawn
   inside it rather than a filled disc with the mark punched out. Same
   information, a fraction of the light. */
/* Tokens, not literals. These two were written as raw jade rgba while
   everything around them followed the palette, so changing the colour left
   a green outline behind on exactly the buttons that were finished. */
.hab.on{border-color:var(--accent-line);background:var(--accent-soft);box-shadow:none}
.hab.on:before{background:var(--accent);opacity:.85;box-shadow:none}
.hab.on:after{opacity:0}
.hab .tick{width:21px;height:21px;border-radius:50%;border:1.5px solid var(--line2);flex:none;
  position:relative;display:flex;align-items:center;justify-content:center;transition:all .18s}
.hab.on .tick{background:none;border-color:var(--accent)}
.hab .tick .tk{width:11px;height:11px;stroke:var(--accent);fill:none;stroke-width:3;
  stroke-linecap:round;stroke-linejoin:round}
.hab .tick,.hab .tx,.hab .hpts{position:relative;z-index:1}
.hab .tx{flex:1;min-width:0}
.hab .tx b{display:block;font-size:14.5px;font-weight:550;letter-spacing:-.01em;color:var(--ink)}
.hab .tx small{display:block;font-size:12px;color:var(--ink3);margin-top:2px}
.hab .rk{font-size:11px;color:var(--ink3);font-weight:600;letter-spacing:.04em}

/* ---------- quick log rail ---------- */
.rail{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ql{background:rgba(255,255,255,.030);border:1px solid var(--line);border-radius:14px;
  padding:13px 6px 11px;display:flex;flex-direction:column;align-items:center;gap:7px;
  cursor:pointer;font-family:inherit;transition:transform .16s,border-color .16s,background .18s}
.ql:active{transform:scale(.95)}
.ql svg{width:20px;height:20px;stroke:var(--accent);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ql span{font-size:10.5px;color:var(--ink2);font-weight:500;text-align:center;line-height:1.2}

/* ---------- coach note ---------- */
.coach{display:flex;gap:12px;background:var(--gold-soft);border:1px solid rgba(217,169,76,.26);
  border-radius:15px;padding:14px}
.coach .av{width:34px;height:34px;border-radius:50%;background:var(--accent-2);flex:none;
  display:flex;align-items:center;justify-content:center;color:#1A1305;font-weight:650;font-size:13px}
.coach .tx b{font-size:13px;font-weight:600;display:block;margin-bottom:4px}
.coach .tx p{font-size:13px;line-height:1.5;color:var(--ink2)}
.coach .tx .when{font-size:11px;color:var(--ink3);margin-top:7px}

/* ---------- program strip ---------- */
.prog{display:flex;align-items:center;gap:13px}
.prog .ring{flex:none}
.prog .tx{flex:1;min-width:0}
.prog .tx b{font-size:15px;font-weight:550;letter-spacing:-.01em;display:block}
.prog .tx small{font-size:12.5px;color:var(--ink3);display:block;margin-top:3px;line-height:1.4}
.prog .arw{width:17px;height:17px;stroke:var(--ink3);fill:none;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- phase bar ---------- */
.phases{display:flex;gap:4px;margin-top:13px}
.ph{flex:1;text-align:center}
.ph .bar{height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.ph .bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:2px;transition:width .7s cubic-bezier(.22,1,.36,1)}
.ph span{display:block;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink3);margin-top:6px;font-weight:600}
.ph.on span{color:var(--accent)}

/* ---------- tiles ---------- */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:14px;
  box-shadow:var(--shadow);cursor:pointer;transition:transform .16s}
.tile:active{transform:scale(.98)}
.tile .k{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);font-weight:600}
.tile .v{font-size:27px;font-weight:550;letter-spacing:-.028em;margin-top:9px;line-height:1}
.tile .v small{font-size:13px;color:var(--ink3);font-weight:500;letter-spacing:0;margin-left:2px}
.tile .d{font-size:11.5px;color:var(--ink3);margin-top:6px;display:flex;align-items:center;gap:4px}
.tile .d.up{color:var(--accent)}
.tile .d.dn{color:var(--accent-2)}
.tile.wide{grid-column:1 / -1}

/* ---------- chart ---------- */
.chartwrap{margin-top:14px;position:relative}
.chartwrap svg{display:block;width:100%;height:auto;overflow:visible}
.gridln{stroke:var(--line);stroke-width:1}
.axl{fill:var(--ink3);font-size:9.5px;letter-spacing:.04em}
.serie{fill:none;stroke:var(--accent);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.serieArea{fill:url(#gArea)}
.dotEnd{fill:var(--accent);stroke:var(--card);stroke-width:2}
.endLbl{fill:var(--ink);font-size:11px;font-weight:600}
.goalLn{stroke:var(--accent-2);stroke-width:1.5;stroke-dasharray:3 4}
.pendingLn{stroke:var(--line2);stroke-width:2;stroke-dasharray:2 6;stroke-linecap:round}
.goalLbl{fill:var(--accent-2);font-size:9.5px;letter-spacing:.06em}

/* ---------- rank rows ---------- */
.rank{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);cursor:pointer}
.rank:last-child{border-bottom:none}
.rank .th{width:46px;height:46px;border-radius:12px;background:var(--surface2);flex:none;overflow:hidden;
  display:flex;align-items:center;justify-content:center;padding:3px}
.rank .th img{width:100%;height:100%;object-fit:contain}
.rank .tx{flex:1;min-width:0}
.rank .tx b{font-size:14px;font-weight:550;display:block}
.rank .tx small{font-size:11.5px;color:var(--ink3);display:block;margin-top:3px}
.rank .badge{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
  padding:7px 14px;border-radius:999px;flex:none;
  background:none;color:var(--neon);border:1px solid var(--neon-line)}
/* only the one he should do next glows; a column of glowing pills is a fairground */
.rank .badge.lead{border-color:var(--neon);box-shadow:0 0 14px var(--neon-line);
  animation:badgeGlow 3s ease-in-out infinite}
@keyframes badgeGlow{0%,100%{box-shadow:0 0 8px var(--neon-line)}50%{box-shadow:0 0 20px var(--neon-line)}}

.rank .badge.set{background:var(--accent-soft);color:var(--accent)}
.rankbar{height:4px;border-radius:2px;background:var(--line);margin-top:7px;overflow:hidden}
.rankbar i{display:block;height:100%;background:var(--accent);border-radius:2px;transition:width .7s cubic-bezier(.22,1,.36,1)}

/* ---------- search ---------- */
.search{display:flex;align-items:center;gap:9px;background:rgba(255,255,255,.045);
  border:1px solid var(--line);border-radius:13px;padding:11px 13px;margin-bottom:14px}
.search svg{width:16px;height:16px;stroke:var(--ink3);fill:none;stroke-width:1.9;stroke-linecap:round;flex:none}
.search input{flex:1;background:none;border:none;outline:none;color:var(--ink);font-size:14.5px;
  font-family:inherit;-webkit-user-select:text;user-select:text}
.search input::placeholder{color:var(--ink3)}

.filters{display:flex;gap:7px;overflow-x:auto;padding-bottom:3px;margin-bottom:14px;
  scrollbar-width:none;-ms-overflow-style:none}
.filters::-webkit-scrollbar{display:none}
.fl{flex:none;background:rgba(255,255,255,.035);border:1px solid var(--line);border-radius:999px;
  padding:7px 13px;font-size:12.5px;color:var(--ink2);font-family:inherit;cursor:pointer;
  font-weight:500;transition:all .18s}
.fl.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}

/* ---------- exercise grid ---------- */
.exgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ex{background:var(--card);border:1px solid var(--line);border-radius:15px;overflow:hidden;
  cursor:pointer;transition:transform .16s,border-color .16s;position:relative}
.ex:active{transform:scale(.975)}
.ex .im{aspect-ratio:1/.82;background:var(--surface2);position:relative;overflow:hidden}
.ex .im img{width:100%;height:100%;object-fit:contain;display:block}
.ex .im .play{position:absolute;right:8px;bottom:8px;width:26px;height:26px;border-radius:50%;
  background:rgba(11,13,15,.7);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center}
.ex .im .play svg{width:11px;height:11px;fill:var(--accent);stroke:none}
.ex .lb{padding:10px 11px 12px}
.ex .lb b{font-size:12.5px;font-weight:550;line-height:1.3;display:block;letter-spacing:-.01em}
.ex .lb small{font-size:10.5px;color:var(--ink3);display:block;margin-top:4px;
  letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.ex.seen .im:after{content:"";position:absolute;left:8px;top:8px;width:18px;height:18px;border-radius:50%;
  background:var(--accent);box-shadow:0 0 0 3px rgba(33,38,48,.9)}
.ex.seen .im:before{content:"";position:absolute;left:14px;top:12px;width:5px;height:9px;z-index:2;
  border:solid #0C1512;border-width:0 2px 2px 0;transform:rotate(45deg)}
.ex.q{border-color:var(--accent-2)}
.ex.q .lb:after{content:"Queued";display:inline-block;margin-top:7px;font-size:9.5px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--accent-2);font-weight:600}
.ex.na .im{background:repeating-linear-gradient(135deg,var(--surface2),var(--surface2) 8px,
  rgba(255,255,255,.018) 8px,rgba(255,255,255,.018) 16px)}

/* ---------- the placeholder for artwork that does not exist yet ---------- */
.noart{display:flex;align-items:center;justify-content:center;width:100%;height:100%;padding:16%}
.noart svg{width:100%;height:auto;fill:none;stroke:var(--line2);stroke-linecap:round;opacity:.85}
.mv .noart,.rank .noart{padding:16%}
.mv .noart svg,.rank .noart svg{stroke:var(--line2)}
/* ---------- the log book ----------------------------------------------
   His name, set in the serif, on something that reads like a cover. The
   whole tab hangs off the idea that this is a book he owns rather than a
   report the app generates about him. */
.book{background:linear-gradient(160deg,var(--surface2),var(--card) 62%);
  border:1px solid var(--line2);border-radius:var(--r);padding:22px 20px;margin-bottom:16px;
  position:relative;overflow:hidden;box-shadow:var(--shadow)}
.book:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;z-index:2;
  background:linear-gradient(180deg,var(--accent),var(--neon));
  box-shadow:0 0 14px rgba(255,95,162,.34)}
/* the one 80s flourish on the client side: a horizon grid under his name */
.book:after{content:"";position:absolute;left:-14%;right:-14%;bottom:-58px;height:120px;
  pointer-events:none;
  background:repeating-linear-gradient(90deg,transparent 0 46px,var(--neon-line) 46px 47px),
             repeating-linear-gradient(0deg,transparent 0 22px,var(--neon-line) 22px 23px);
  transform:perspective(200px) rotateX(68deg);
  mask-image:linear-gradient(180deg,transparent,#000 66%);
  -webkit-mask-image:linear-gradient(180deg,transparent,#000 66%);
  opacity:.42}
.bk-eye{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink3);font-weight:600}
.bk-name{font-size:31px;line-height:1.1;letter-spacing:-.01em;margin-top:9px;color:var(--ink)}
.bk-sub{font-size:12px;color:var(--ink3);margin-top:9px;letter-spacing:.01em}

.tiles.three{grid-template-columns:repeat(3,1fr)}
.tiles.three .tile{padding:13px 11px}
.tiles.three .v{font-size:22px;margin-top:7px}
.tiles.three .v small{font-size:11px}
.tiles.three .d{font-size:11px}
.rail4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}

/* ---------- the feed ---------- */
.feed{position:relative}
.fe{display:flex;gap:14px;padding-bottom:4px}
.fe-rail{position:relative;width:11px;flex:none;display:flex;justify-content:center}
.fe-rail:before{content:"";position:absolute;top:0;bottom:0;width:1px;background:var(--line)}
.fe:first-child .fe-rail:before{top:9px}
.fe.last .fe-rail:before{bottom:auto;height:9px}
.fe-dot{position:relative;width:9px;height:9px;border-radius:50%;margin-top:5px;
  background:var(--line2);box-shadow:0 0 0 4px var(--bg)}
.fe-dot.done{background:var(--accent)}
.fe-dot.weigh{background:var(--ink2)}
.fe-dot.free{background:var(--accent);opacity:.6}
.fe-kind.free{color:var(--accent);opacity:.85}
.fe-dot.note{background:var(--line2)}
.fe-dot.pr{background:var(--neon);box-shadow:0 0 0 4px var(--bg),0 0 12px rgba(255,95,162,.7)}
.fe-dot.photo{background:var(--ink3)}
.fe-dot.mile{background:var(--neon);box-shadow:0 0 0 4px var(--bg),0 0 12px rgba(255,95,162,.7)}
.fe-dot.reply{background:var(--coach);box-shadow:0 0 0 4px var(--bg),0 0 12px var(--coach-line)}
.fe-kind.reply{color:var(--coach)}
.fl i{font-style:normal;opacity:.6;font-size:11px;margin-left:3px}
.fe-dot.start{background:transparent;border:1.5px dashed var(--line2);box-shadow:none;
  width:11px;height:11px;margin-top:4px}
.fe-body{flex:1;min-width:0;padding-bottom:20px}
.fe-top{display:flex;align-items:center;gap:9px;margin-bottom:5px}
.fe-kind{font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;font-weight:600;color:var(--ink3)}
.fe-kind.done{color:var(--accent)}
.fe-kind.pr,.fe-kind.mile{color:var(--neon)}
.fe-when{font-size:11px;color:var(--ink3);margin-left:auto}
.fe-body b{font-size:15px;font-weight:550;letter-spacing:-.012em;display:block}
.fe-body p{font-size:13px;color:var(--ink2);line-height:1.5;margin-top:4px;white-space:pre-wrap}
.fe.last .fe-body b{color:var(--ink3);font-weight:500;font-size:13.5px}
.fe.last .fe-body p{color:var(--ink3);font-size:12px}

.quietline{display:flex;align-items:center;gap:10px;width:100%;margin-top:20px;
  background:none;border:1px solid var(--line);border-radius:14px;padding:14px 15px;
  font-family:inherit;font-size:12.5px;color:var(--ink3);cursor:pointer;text-align:left}
.quietline span{flex:1}
.quietline .arw{width:15px;height:15px;stroke:var(--ink3);fill:none;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- tonight's movement ---------- */
.tonight{background:linear-gradient(155deg,var(--surface2),var(--card) 60%);
  border:1px solid var(--line2);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);
  position:relative;overflow:hidden}
.tonight:before{content:"";position:absolute;left:0;right:0;top:0;height:2px;
  background:linear-gradient(90deg,var(--accent),var(--neon));box-shadow:var(--neon-glow)}
.tn-art{height:150px;display:flex;align-items:center;justify-content:center;margin-bottom:4px}
.tn-art img{max-height:100%;max-width:100%;object-fit:contain}
.tn-art .noart{height:100%;padding:9%}
.tn-pat{font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--neon);font-weight:600}
.tn-tx b{display:block;font-size:20px;font-weight:550;letter-spacing:-.02em;margin-top:7px}
.tn-tx p{font-size:13.5px;line-height:1.5;color:var(--ink2);margin-top:7px}
.tn-row{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.tn-skip{padding:12px;font-size:14px}

/* ---------- deck run ---------- */
.deckbar{display:flex;gap:4px;margin-top:2px}
.dbi{flex:1;height:3px;border-radius:2px;background:var(--line)}
.dbi.on{background:var(--accent);box-shadow:0 0 8px rgba(62,203,168,.45)}
.deckstat{display:flex;gap:10px;margin-top:20px}
.deckstat > div{flex:1;background:rgba(255,255,255,.035);border:1px solid var(--line);
  border-radius:13px;padding:15px;text-align:center}
.deckstat b{display:block;font-size:27px;font-weight:550;letter-spacing:-.028em}
.deckstat span{display:block;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink3);font-weight:600;margin-top:5px}

/* ---------- colour picker --------------------------------------------
   A native <select> cannot colour its own options, and the colour IS the
   thing being chosen — so the menu is ours. */
.crow{border-bottom:1px solid var(--line)}
.crow:last-of-type{border-bottom:none}
.crow-hd{display:flex;align-items:center;gap:13px;width:100%;background:none;border:none;
  padding:13px 0;cursor:pointer;font-family:inherit;color:var(--ink);text-align:left}
.crow-hd:disabled{opacity:.45;cursor:default}
.cdot{width:30px;height:30px;border-radius:9px;flex:none;background:var(--c);
  box-shadow:0 0 0 1px rgba(255,255,255,.10),0 0 16px var(--c)}
.cdot.sm{width:20px;height:20px;border-radius:6px;
  box-shadow:0 0 0 1px rgba(255,255,255,.10),0 0 10px var(--c)}
.ctx{flex:1;min-width:0}
.ctx b{display:block;font-size:14px;font-weight:600;letter-spacing:-.01em}
.ctx small{display:block;font-size:11.5px;color:var(--ink3);margin-top:2px}
.cnow{font-size:13px;color:var(--ink2);flex:none}
.cmenu{display:flex;flex-direction:column;gap:6px;padding:2px 0 14px}
.citem{display:flex;align-items:center;gap:11px;width:100%;background:rgba(255,255,255,.03);
  border:1px solid var(--line);border-radius:11px;padding:10px 12px;cursor:pointer;
  font-family:inherit;color:var(--ink);text-align:left}
.citem b{font-size:13.5px;font-weight:600;flex:none}
.citem small{font-size:11.5px;color:var(--ink3);flex:1;text-align:right}
.citem.on{border-color:var(--c);background:rgba(255,255,255,.06)}

/* ---------- kit picker ---------- */
.kitpick{display:flex;flex-direction:column;gap:9px;margin-top:18px}
.kp{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.03);
  border:1px solid var(--line);border-radius:14px;padding:15px 16px;cursor:pointer;
  font-family:inherit;color:var(--ink);text-align:left;width:100%}
.kp b{flex:1;font-size:15px;font-weight:550}
.kp span{font-size:12px;color:var(--ink3)}
.kp.on{border-color:var(--accent);background:var(--accent-soft);cursor:default}
.kp.on span{color:var(--accent)}

/* ---------- the week, with the mark on it ---------- */
/* THE WEEK, IN THE LOGO'S OWN TERMS
   The triangle is not an icon here, it is the selection — it replaces the
   highlighted square entirely and fills the cell at the size the square used
   to occupy. The dumbbell is the icon, and it marks a training day.

   Which means a training day that happens to be today draws both, at the
   proportions they hold in the logo, because both come out of the same
   markSvg() the header uses. The lockup appears in the calendar three or
   four times a week without ever being pasted in.

   Colours follow the logo too, and only the logo: bell teal, triangle
   neon. */
.wd .b{overflow:visible;position:relative}
.wd .b svg.wdb,.wd .b svg.wmark{height:auto;overflow:visible;fill:none}
/* Every bell is the SAME SIZE as the one inside the stamp, which means
   solving for it rather than picking a number: in the lockup the drawn bell
   is 45.5% of the mark's width, the mark is 108% of a cell, so the bell is
   49.1% of a cell. A lone bell fills 62.5% of its own 260-wide box, so that
   box has to be 79% of the cell.

   It was briefly 47% because I checked it wrong — comparing the lone SVG's
   ELEMENT box against the stamp's INK box, which are not the same thing and
   made a bell two-thirds the size look correct. Both are measured as ink
   now. */
.wd .b svg.wdb{width:79%}

/* TODAY IS A STAMP.
   The dark square stays where it is and the mark is pressed on top, hanging
   over the bottom. It is REGISTERED, not centred: the viewBox above starts
   at the triangle's top line, so top:0 lands that line exactly on the top
   line of the square and everything else falls where it falls. */
/* top:-1px, not 0. An absolutely-placed child is positioned against the
   PADDING box, so top:0 sits it one border-width below the square's top
   line — which is exactly the hairline of misregistration that was
   showing. The border is invisible on this cell but still occupies its
   pixel, so the mark steps back over it. */
.wd .b svg.wmark{position:absolute;left:50%;top:-1px;width:108%;
  transform:translateX(-50%);z-index:2}
/* no outline on today — the stamp is the marker, a box round it as well is
   two markers for one day */
.wd.now .b{border-color:transparent}
.mk-db path{stroke:var(--accent);stroke-linecap:round;fill:none;
  transition:stroke .25s,filter .25s}
.mk-tri{stroke:url(#mkTri);stroke-width:9;stroke-linejoin:round;stroke-linecap:round;fill:none}
/* and at 44px the glare has no room at all — the line alone carries the
   gradient, which is what makes the pink read as pink */
.mk-glare{display:none}

.wd.plan .b{border-style:solid;border-color:var(--line)}
.wd.plan .b .mk-db path{filter:drop-shadow(0 0 calc(4px * var(--glow-k,1)) var(--accent-soft))}
.wd.done .b svg.wdb .mk-db path{stroke:var(--accent)}

.wd.now .b .mk-tri{filter:drop-shadow(0 0 7px var(--neon-line))}
.wd.now .b .mk-db path{filter:drop-shadow(0 0 5px var(--accent-soft))}
.wd.now .l{color:var(--neon);text-shadow:0 0 10px var(--neon-line)}

/* ---------- the way in --------------------------------------------------
   One screen, once. It borrows the opening screen's language — the mark
   centred, the words under it, one button — so finishing the survey and
   opening the app feel like the same product rather than two.
   ------------------------------------------------------------------- */
#intro{position:absolute;inset:0;z-index:60;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;
  padding:0 30px calc(var(--tabh) + 10px);background:var(--bg);
  animation:fade .45s both}
#intro[hidden]{display:none}
#intro.out{animation:introOut .42s cubic-bezier(.4,0,1,1) both}
@keyframes introOut{to{opacity:0;transform:scale(1.04)}}
.in-mark{width:132px;height:118px;margin-bottom:26px}
.in-mark svg{width:100%;height:100%;overflow:visible}
.in-mark .mk-tri{stroke-width:6;filter:drop-shadow(0 0 10px var(--neon-line))}
.in-mark .mk-db path{stroke:var(--accent);filter:drop-shadow(0 0 7px var(--accent-soft))}
.in-mark .mk-glare{display:none}
.in-eye{font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;font-weight:650;
  color:var(--neon);text-shadow:0 0 14px var(--neon-line)}
.in-name{font-size:38px;font-weight:650;letter-spacing:-.035em;margin:10px 0 0;color:var(--ink)}
.in-copy{font-size:14px;line-height:1.55;color:var(--ink2);margin:14px 0 0;max-width:300px}
#intro .go{margin-top:30px;width:100%;max-width:300px}
.in-foot{position:absolute;bottom:26px;font-size:11px;color:var(--ink3);opacity:.55;
  letter-spacing:.06em}

/* ---------- YOUR PROFILE ------------------------------------------------
   The one number on this tab that only ever goes up. It gets the reactor
   because a ring reads as a thing being filled rather than a thing being
   measured, and because the orbit keeps it alive on a screen where nothing
   else is moving.
   ------------------------------------------------------------------- */
.prof{position:relative;border:1px solid var(--line2);border-radius:var(--r);overflow:hidden;
  background:radial-gradient(120% 140% at 100% 0%, var(--neon-soft), transparent 58%),
    linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.015));
  box-shadow:0 0 26px rgba(0,0,0,.32);transition:border-color .4s,box-shadow .4s}
.prof.full{border-color:var(--accent);box-shadow:0 0 30px var(--accent-soft)}
.prof-hd{display:flex;align-items:center;gap:15px;width:100%;background:none;border:none;
  padding:15px 17px;cursor:pointer;font-family:inherit;color:var(--ink);text-align:left}
.prof-hd:active{transform:scale(.99)}
.prof-rx{flex:none}
.prof-tx{flex:1;min-width:0}
.prof-tx b{display:block;font-size:16px;font-weight:600;letter-spacing:-.018em}
.prof-tx small{display:block;font-size:10.5px;color:var(--neon);margin-top:5px;font-weight:700;
  letter-spacing:.09em;text-transform:uppercase}
.prof-tier{display:inline-block;margin-top:9px;font-size:11.5px;color:var(--ink3);
  border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.prof.full .prof-tier{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.prof.open .fold-chev{transform:rotate(90deg)}
.prof.open .fold-chev svg{stroke:var(--accent)}
.prof-body{padding:0 14px 14px;animation:foldIn .3s cubic-bezier(.22,1,.36,1) both}

/* rxg, not rx: .rx is already the small right-hand label in the session
   and week sheets, and this rule was forcing those to 88x88. */
.rxg{position:relative;display:block;width:88px;height:88px}
.rx-orbit{position:absolute;inset:6px;border-radius:50%;
  background:conic-gradient(from 0deg, transparent 0 62%, var(--accent) 78%, transparent 92%);
  -webkit-mask:radial-gradient(circle, transparent 0 60%, #000 63%);
          mask:radial-gradient(circle, transparent 0 60%, #000 63%);
  opacity:calc((.22 + var(--pf) * .5) * var(--glow-k,1));filter:blur(3px);
  animation:orbit calc(7s - var(--pf) * 3.4s) linear infinite}
@keyframes orbit{to{transform:rotate(360deg)}}
.rx-svg{position:absolute;inset:0;width:88px;height:88px;overflow:visible}
.rx-svg circle,.rx-svg path{fill:none;stroke-linecap:round}
.rx-t{stroke:var(--line2);stroke-width:2;opacity:.3}
.rx-h{stroke:var(--accent);stroke-width:9;opacity:calc(.42 * var(--glow-k,1));filter:blur(5px)}
.rx-c{stroke:var(--accent);stroke-width:3;filter:drop-shadow(0 0 6px var(--accent))}
.rx-n{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  gap:1px;pointer-events:none}
.rx-n b{font-size:28px;font-weight:600;letter-spacing:-.04em;
  background:linear-gradient(180deg,var(--ink),var(--accent));
  -webkit-background-clip:text;background-clip:text;color:transparent}
.rx-n i{font-style:normal;font-size:11px;font-weight:600;color:var(--accent);align-self:center;
  margin-top:6px}

/* the update affordance, inside the drop-down where it belongs */
.go.upd{margin-top:13px}

/* the seam inside Equipment: owned above, unowned below, one section */
.eqsplit{margin:18px 0 2px;font-size:10px;font-weight:700;letter-spacing:.13em;
  text-transform:uppercase;color:var(--ink3);border-top:1px solid var(--line);padding-top:15px}

/* a recommended load, said on the item it applies to */
.lv-load{display:flex;align-items:center;gap:7px;margin-top:8px;font-size:11.5px;
  color:var(--accent);background:var(--accent-soft);border:1px solid var(--accent);
  border-radius:9px;padding:6px 9px}
.lv-load .lvi{width:13px;height:13px;stroke:var(--accent);fill:none;stroke-width:1.8;flex:none}
.lv-alt{display:block;width:100%;margin-top:9px;background:none;border:1px dashed var(--line2);
  border-radius:9px;padding:8px 10px;font-family:inherit;font-size:11.5px;color:var(--ink3);
  cursor:pointer;text-align:left}
.lv-alt:active{background:rgba(255,255,255,.03)}

/* ---------- "show more" on the book ---------- */
.fe-dot.more{background:transparent;border:1.5px dashed var(--line2);box-shadow:none}
.morerow .fe-body{padding-bottom:6px}
.logmore{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.04);
  border:1px solid var(--line2);border-radius:999px;padding:8px 14px;cursor:pointer;
  font-family:inherit;font-size:12.5px;font-weight:600;color:var(--ink2);
  transition:border-color .2s,color .2s}
.logmore:active{transform:scale(.98)}
.logmore .lmc{width:12px;height:12px;stroke:var(--ink3);fill:none;stroke-width:2.4;
  stroke-linecap:round;stroke-linejoin:round;transform:rotate(90deg);transition:transform .28s}
.logmore.on{color:var(--accent);border-color:var(--accent)}
.logmore.on .lmc{transform:rotate(-90deg);stroke:var(--accent)}

/* a locked section, with the reason on the door */
.lockmsg{text-align:center;padding:6px 4px 2px}
.lockmsg .lk-i{width:20px;height:20px;stroke:var(--neon);fill:none;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round}
.lockmsg b{display:block;font-size:15px;font-weight:600;margin:8px 0 6px}
.lockmsg p{font-size:12.5px;line-height:1.5;color:var(--ink3);margin-bottom:14px}

/* where you are — three taps, no typing */
.ctrypick{display:flex;flex-direction:column;gap:8px}
.ctry{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:15px 16px;border-radius:14px;border:1px solid var(--line);
  background:rgba(255,255,255,.03);font-family:inherit;color:var(--ink);cursor:pointer}
.ctry b{font-size:15px;font-weight:600}
.ctry span{font-size:13px;color:var(--ink3)}
.ctry.on{border-color:var(--accent);background:var(--accent-soft)}
.ctry.on span{color:var(--accent)}

.unitbtn{font:inherit;font-size:12.5px;font-weight:600;padding:5px 12px;margin-left:6px;
  border-radius:999px;border:1px solid var(--line);background:none;color:var(--ink3);cursor:pointer}
.unitbtn.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.go.danger{border-color:rgba(240,133,122,.45);color:var(--red)}

/* ---------- a real photo ---------- */
.shot{display:block;margin-top:14px;cursor:pointer}
.shot-in{display:flex;flex-direction:column;align-items:center;gap:7px;padding:26px 16px;
  border:1px dashed var(--line2);border-radius:15px;text-align:center}
.shot-in svg{width:26px;height:26px;stroke:var(--ink3);fill:none;stroke-width:1.6;
  stroke-linecap:round;stroke-linejoin:round}
.shot-in b{font-size:14.5px;font-weight:600}
.shot-in small{font-size:11.5px;color:var(--ink3)}
.shotimg{display:block;width:100%;margin-top:12px;border-radius:14px;border:1px solid var(--line)}
.shotrail{display:flex;gap:9px;overflow-x:auto;padding-bottom:4px;
  scrollbar-width:none;-webkit-overflow-scrolling:touch}
.shotrail::-webkit-scrollbar{display:none}
.shotcard{flex:0 0 122px;margin:0}
.shotcard img{width:100%;height:162px;object-fit:cover;border-radius:13px;
  border:1px solid var(--line);display:block}
.shotcard figcaption{font-size:10.5px;color:var(--ink3);margin-top:5px;text-align:center}

/* their own sport, on the day it lands */
.sportcard{border:1px solid var(--neon-line);border-radius:var(--r);padding:15px;
  margin-bottom:12px;background:linear-gradient(180deg,var(--neon-soft),rgba(255,255,255,.012))}
.sportcard.done{border-color:var(--accent-line);background:var(--accent-soft)}
.sportcard .tag{color:var(--neon)}
.sportcard .tag i{background:var(--neon)}
.sportcard.done .tag,.sportcard.done .tag i{color:var(--accent);background:var(--accent)}

/* ---------- change your answers ---------- */
.anstabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.anstab{flex:1 1 auto;padding:9px 6px;border-radius:11px;border:1px solid var(--line);
  background:rgba(255,255,255,.03);font-family:inherit;font-size:12.5px;font-weight:550;
  color:var(--ink2);cursor:pointer;white-space:nowrap}
.anstab.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.daygrid{display:flex;flex-direction:column;gap:7px;margin-top:12px}
.dayopt{display:flex;align-items:baseline;gap:12px;padding:12px 14px;border-radius:12px;
  border:1px solid var(--line);background:rgba(255,255,255,.028);font-family:inherit;
  color:var(--ink);cursor:pointer;text-align:left}
.dayopt b{font-size:14px;font-weight:650;width:38px;flex:none}
.dayopt small{font-size:12px;color:var(--ink3)}
.dayopt.on{border-color:var(--accent);background:var(--accent-soft)}
.dayopt.on small{color:var(--accent)}
.kitgrid{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.kitopt{flex:1 1 30%;min-width:96px;padding:12px 8px;border-radius:12px;
  border:1px solid var(--line);background:rgba(255,255,255,.028);font-family:inherit;
  font-size:13px;font-weight:550;color:var(--ink2);cursor:pointer}
.kitopt.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}

/* the sample, saying so — same shape as the health alert because it is the
   same kind of message: something you need to know before you trust what is
   under it */
.demobar{display:flex;gap:12px;align-items:flex-start;margin-bottom:16px;
  background:var(--neon-soft);border:1px solid var(--neon-line);
  border-radius:14px;padding:13px 15px}
.demobar .ic{width:19px;height:19px;stroke:var(--neon);fill:none;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round;flex:none;margin-top:1px}
.demobar b{font-size:13.5px;font-weight:600;display:block;margin-bottom:3px}
.demobar p{font-size:12.5px;line-height:1.5;color:var(--ink2)}

/* ---------- a rest day that has something in it -------------------------
   Not a hero with a photo and a shrug. A short brief, then three doors with
   the minutes on them, because the reason anyone skips mobility is never
   the drill — it is not knowing how long it will take.
   ------------------------------------------------------------------- */
.restwrap{border:1px solid var(--line2);border-radius:var(--r);padding:15px;
  background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.012))}
.restwrap.done{border-color:var(--accent-line)}
.rest-hd .tag{display:inline-flex;align-items:center;gap:7px;font-size:10.5px;font-weight:700;
  letter-spacing:.14em;text-transform:uppercase;color:var(--ink3)}
.rest-hd .tag i{width:6px;height:6px;border-radius:50%;background:var(--ink3)}
.restwrap.done .rest-hd .tag,.restwrap.done .rest-hd .tag i{color:var(--accent);background:var(--accent)}
.rest-hd h3{font-size:23px;font-weight:650;letter-spacing:-.03em;margin:9px 0 6px}
.rest-hd p{font-size:12.5px;line-height:1.5;color:var(--ink2);margin-bottom:14px}

.rec{display:flex;align-items:center;gap:13px;width:100%;margin-bottom:8px;
  border:1px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;
  background:rgba(255,255,255,.028);font-family:inherit;color:var(--ink);text-align:left;
  transition:border-color .2s,background .2s}
.rec:active{transform:scale(.985)}
.rec-m{flex:none;width:46px;display:flex;flex-direction:column;align-items:center;line-height:1}
.rec-m b{font-size:23px;font-weight:600;letter-spacing:-.035em;color:var(--neon)}
.rec-m i{font-style:normal;font-size:9px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink3);margin-top:3px}
.rec-tx{flex:1;min-width:0}
.rec-tx b{display:block;font-size:14.5px;font-weight:600;letter-spacing:-.012em}
.rec-tx small{display:block;font-size:11.5px;color:var(--ink3);margin-top:3px;line-height:1.4}
.rec-c{width:14px;height:14px;flex:none;stroke:var(--ink3);fill:none;stroke-width:2.2;
  stroke-linecap:round;stroke-linejoin:round}
.restalt{display:flex;gap:8px;margin-top:12px}
.restalt .go{flex:1;margin-top:0;font-size:13px;padding:12px 8px}

/* the drill itself, in the sheet */
.reclist{margin-top:4px}
.recrow{display:flex;align-items:center;gap:12px;padding:10px 0;
  border-bottom:1px solid var(--line)}
.recrow:last-child{border-bottom:none}
.recart{width:52px;height:40px;flex:none;display:flex;align-items:center;justify-content:center}
.recart img{max-width:100%;max-height:100%;object-fit:contain}
.recart .noart{height:100%;padding:8%}
.rectx b{display:block;font-size:14.5px;font-weight:600}
.rectx small{display:block;font-size:12px;color:var(--ink3);margin-top:2px}

/* ---------- build your own -------------------------------------------- */
.blist{margin:4px 0 12px}
.brow,.prow{display:flex;align-items:center;gap:12px;width:100%;padding:10px 0;
  border-bottom:1px solid var(--line);background:none;border-left:none;border-right:none;
  border-top:none;font-family:inherit;color:var(--ink);text-align:left}
.prow{cursor:pointer}
.prow:active{opacity:.6}
.bart{width:52px;height:40px;flex:none;display:flex;align-items:center;justify-content:center}
.bart img{max-width:100%;max-height:100%;object-fit:contain}
.bart .noart{height:100%;padding:8%}
.btx{flex:1;min-width:0}
.btx b{display:block;font-size:14.5px;font-weight:600}
.btx small{display:block;font-size:11.5px;color:var(--ink3);margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bpres{margin-top:5px;width:110px;font:inherit;font-size:13px;color:var(--ink);
  background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:6px 9px}
.bpres:focus{outline:none;border-color:var(--accent)}
.bdel{flex:none;width:28px;height:28px;border-radius:50%;border:1px solid var(--line);
  background:none;color:var(--ink3);font-size:16px;line-height:1;cursor:pointer}
.bempty{padding:18px 0;text-align:center;font-size:13px;color:var(--ink3)}
.psec{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);
  font-weight:700;margin:16px 0 2px}

/* saved workouts, on the rest day */
.mineblk{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.minehd{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);
  font-weight:700;margin-bottom:9px}
.rec.mine .rec-m b{color:var(--accent);font-size:20px}

/* ---------- the vibe controls ---------- */
.vgrp{margin-bottom:16px}
.vlbl{font-size:12.5px;font-weight:600;color:var(--ink);margin-bottom:8px}
.vlbl span{display:block;font-size:11.5px;font-weight:400;color:var(--ink3);margin-top:2px}
.vrow2{display:flex;flex-wrap:wrap;gap:6px}
.vopt{flex:1 1 auto;min-width:74px;padding:10px 8px;border-radius:11px;
  border:1px solid var(--line);background:rgba(255,255,255,.03);
  font-family:inherit;font-size:12.5px;font-weight:550;color:var(--ink2);cursor:pointer}
.vopt.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}

/* ---------- the profile wearing the sun ---------- */
.prof{position:relative;overflow:hidden}
.prof.sty-sunset .prof-rx{position:relative;flex:1;min-width:0;height:88px;
  overflow:visible;display:block;margin-bottom:14px}
.prof.sty-sunset .prof-tx{width:auto;flex:1}
.prof.sty-sunset .sunbox{position:absolute;left:0;right:0;top:0;bottom:0;overflow:hidden}
/* THE NUMBER RIDES THE SUN.
   It was a column beside the disc, which meant it moved when the card
   opened and sat over the ground lines when it did. It is on the disc now,
   tracking the same --suny the circle uses, so it cannot drift from it.

   White, and it comes up WITH the sun: barely there under the horizon,
   full strength and glowing once the whole thing is clear. The number is
   the light rather than a label stuck on it. */
.prof.sty-sunset .sunnum{position:absolute;left:50%;top:calc(var(--suny,1) * 100%);
  transform:translate(-50%,-52%);display:flex;align-items:baseline;gap:1px;z-index:3;
  pointer-events:none;transition:top .9s cubic-bezier(.22,1,.36,1)}
.prof.sty-sunset .sunnum b{font-size:27px;font-weight:600;letter-spacing:-.04em;color:#fff;
  text-shadow:0 1px 10px rgba(0,0,0,.55), 0 0 calc(14px * var(--pf)) #fff}
.prof.sty-sunset .sunnum i{font-style:normal;font-size:11px;font-weight:600;color:#fff;
  opacity:.75;align-self:center;margin-top:6px}
.prof.sty-sunset .sunnum{opacity:calc(.45 + var(--pf) * .55)}
.prof.sty-sunset .prof-tx{flex:none;width:118px}

.prof.sty-sunset:after{content:"";position:absolute;left:0;right:0;bottom:30px;height:1px;
  background:linear-gradient(90deg,transparent,var(--ink) 22%,var(--ink) 78%,transparent);
  opacity:.28;pointer-events:none;z-index:1}
.prof.sty-sunset .prof-hd{padding-bottom:40px;gap:11px}

/* ---------- the reactor, on the day card ---------- */
.dayrx{display:block;width:88px;height:88px;flex:none}
.sty-reactor .dayx-art{order:1;margin-right:13px}
.sty-reactor .dayx-tx{order:2}

/* ---------- one thing --------------------------------------------------
   Deliberately not styled like a habit. A habit row is one of three in a
   list; this is a single card with the pink on it, because the whole point
   is that it is different today from what it was yesterday.
   ------------------------------------------------------------------- */
.onething{position:relative;overflow:hidden;display:flex;align-items:center;gap:13px;width:100%;
  --oglow:calc(18px * var(--glow-k,1));
  border:1px solid var(--neon-line);border-radius:15px;padding:15px;cursor:pointer;
  font-family:inherit;color:var(--ink);text-align:left;
  background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.012));
  box-shadow:0 0 var(--oglow,18px) var(--neon-soft);transition:border-color .25s,box-shadow .25s,background .25s}
.onething:active{transform:scale(.985)}
.onething:after{content:"";position:absolute;left:0;top:0;bottom:0;width:78px;pointer-events:none;
  background:linear-gradient(90deg,var(--neon-soft),transparent);opacity:.7;transition:opacity .35s}
/* THE FINISHED BUTTON, ONE WAY.
   Whatever the control is — a habit, today's one thing, a section on the Me
   tab — "done" looks the same: token-coloured hairline, the faintest tint,
   no outer glow, and a RING with the tick drawn inside it rather than a
   filled disc with the tick punched out. Everything that finishes should
   settle down to the same brightness, or the screen ends up with a league
   table of how done things are. */
.onething.on{border-color:var(--accent-line);background:var(--accent-soft);box-shadow:none}
.onething.on:after{opacity:0}
.ot-tick{position:relative;z-index:1;width:23px;height:23px;border-radius:50%;flex:none;
  border:1.5px solid var(--neon);display:flex;align-items:center;justify-content:center;
  transition:all .2s}
.onething.on .ot-tick{background:none;border-color:var(--accent)}
.ot-tick .tk{width:12px;height:12px;stroke:var(--accent);fill:none;stroke-width:3;
  stroke-linecap:round;stroke-linejoin:round}
.ot-tx{position:relative;z-index:1;flex:1;min-width:0}
.ot-tx b{display:block;font-size:15px;font-weight:600;letter-spacing:-.012em}
.ot-tx small{display:block;font-size:12px;color:var(--ink3);margin-top:3px}
.onething.on .ot-tx small{color:var(--accent)}
.ot-pts{position:relative;z-index:1;flex:none;font-size:11px;font-weight:700;color:var(--neon);
  border:1px solid var(--neon);border-radius:999px;padding:4px 9px}
.onething.on .ot-pts{color:var(--neon);border-color:var(--neon-line);background:none}
.ot-go{margin-top:9px}

/* two ways out of a rest day, side by side */
.restcta{display:flex;gap:8px;margin-top:2px}
.restcta .go{flex:1;margin-top:0}

/* A freestyle day is a done day, marked so it can still be told apart: the
   coach needs to know the difference between "did what I wrote" and "did his
   own thing", because only one of those says the plan is working. */
.wd.free .b{border-style:dashed;border-color:var(--accent)}

/* THE LAST WORD ON TODAY'S CELL.
   .wd.plan, .done, .miss and .free each set a border, and every one of them
   can also be the current day — so a .wd.now rule written before them loses
   on source order, which is exactly why the outline kept coming back on a
   day that was both today AND a training day. This one sits after all of
   them and doubles the class to outrank them outright. It also kills the
   old teal focus ring further up; the stamp is the marker. */
.wd.now.now .b{border-color:transparent;box-shadow:none}
/* With the stamp off, today is the square again — lit from its edge rather
   than shouted at. Doubled class so it still outranks .plan/.done/.miss. */
.wd.now.box.box .b{border-color:var(--neon);background:var(--neon-soft);
  box-shadow:0 0 calc(14px * var(--glow-k,1)) var(--neon-soft)}
.wd.now.box .b .mk-db path{stroke:var(--neon)}

/* ---------- the week, slimmer -------------------------------------------
   The count and the three stats share one line; the strip below it lost a
   few millimetres of square and gap. */
/* The two cards on this tab are one pair and should read as one pair, so
   they share a height. The agenda came down, the sunset went up, and they
   meet in the middle. */
.card.slim{padding:12px 14px 11px;min-height:104px;display:flex;flex-direction:column;
  justify-content:space-between}
.wkrow{display:flex;align-items:center;gap:14px}
/* both halves of "0 / 4" at the same size — one is not a footnote to the
   other, they are two parts of the same fact */
.wk-n{display:flex;align-items:baseline;line-height:1;flex:none}
.wk-n b{font-size:26px;font-weight:600;letter-spacing:-.035em}
.wk-n i{font-style:normal;font-size:26px;font-weight:600;letter-spacing:-.035em;
  color:var(--ink3)}
/* every number on this card is the same size — none of them is a footnote */
.wk-st{margin-left:auto;display:flex;gap:16px}
.wk-st span{display:flex;align-items:baseline;gap:5px;font-size:10.5px;color:var(--ink3);
  letter-spacing:.02em}
.wk-st i{font-style:normal;font-size:26px;font-weight:600;color:var(--ink);letter-spacing:-.035em}
.card.slim .week{margin-top:9px;gap:4px}
.card.slim .wd{gap:4px}
.card.slim .wd .b{height:30px;border-radius:8px}
/* the slim card sets the box height, not the mark's size — the mark is
   sized against the cell in one place, further down */

/* ---------- THE DAY GAUGE ----------------------------------------------
   One control, four skins. --pf is the fill 0..1, --p the same as a
   percentage; both exist because some skins want a width and some want it
   inside calc(). --f on a square is how full THAT square is, 0..1.
   ------------------------------------------------------------------- */
.dayx{position:relative;margin-top:12px;
  border:1px solid var(--line2);border-radius:var(--r);overflow:hidden;
  background:radial-gradient(120% 140% at 100% 0%, var(--neon-soft), transparent 58%),
    linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.015));
  box-shadow:0 0 26px rgba(0,0,0,.32);transition:border-color .4s,box-shadow .4s}
.dayx.full{border-color:var(--accent);box-shadow:0 0 32px var(--accent-soft)}
.dayx-hd{position:relative;z-index:2;display:flex;align-items:center;gap:14px;width:100%;
  min-height:104px;background:none;border:none;padding:14px 17px;cursor:pointer;
  font-family:inherit;color:var(--ink);text-align:left}
.dayx-hd:active{transform:scale(.99)}

/* The number, and the two lines beside it — the refinement is here. A big
   tight number, a short verdict, and a small tracked-out line that reads as
   a stat rather than as a sentence. */
.dayx-n{display:flex;align-items:center;flex:none}
.dayx-tx{flex:1;min-width:0}
.dayx-tx b{display:block;font-size:15.5px;font-weight:600;letter-spacing:-.022em;line-height:1.15}
.dayx-tx small{display:block;font-size:10px;color:var(--neon);margin-top:5px;font-weight:700;
  letter-spacing:.07em;text-transform:uppercase}
.dayx-chev{flex:none;width:18px;height:18px;display:flex;align-items:center;justify-content:center;
  transition:transform .28s cubic-bezier(.22,1,.36,1)}
.dayx-chev svg{width:14px;height:14px;stroke:var(--ink3);fill:none;stroke-width:2.2;
  stroke-linecap:round;stroke-linejoin:round}
.dayx.open .dayx-chev{transform:rotate(90deg)}
.dayx.open .dayx-chev svg{stroke:var(--accent)}
.dayx-body{position:relative;z-index:2;padding:0 17px 16px;
  animation:foldIn .3s cubic-bezier(.22,1,.36,1) both}
.dayx-art{flex:none;display:flex}
/* the chevron is always last, whatever the gauge reorders around it */
.dayx-chev{order:9}

/* ---- CLIMB ----------------------------------------------------------
   The number moved next to the rungs. It was on the far left, a whole card
   away from the thing it describes, so the eye had to travel to connect
   them; side by side they read as one instrument.

   And the card now breathes. A glow sits behind the whole thing, and both
   its strength and its rate come off --pf: at 10% it is a faint slow
   shimmer you half-notice, at 90% it is pulsing hard. That is the part
   that makes the meter want filling — the card gets more alive the closer
   it gets, rather than just longer. */
.sty-climb .dayx-hd{gap:11px}
.sty-climb .dayx-tx{order:1}
/* 5% of the card between the number and the rungs. They were reading as one
   glued object; a gap that size lets them be two parts of one instrument.
   The unit comes down to about a quarter of the numeral and sits on its
   baseline — at 13px against 38 it was competing with the number instead
   of labelling it. */
.sty-climb .dayx-n{order:2;flex:none}
.sty-climb .dayx-art{order:3;width:24px;height:74px;margin:-3px 0 -3px 0}
.sty-climb .dayx-chev{order:4}

.dayx-glow{position:absolute;inset:0;z-index:0;pointer-events:none;opacity:0}
.sty-climb .dayx-glow{
  background:radial-gradient(58% 130% at 88% 50%, var(--accent), transparent 70%);
  opacity:calc(.05 + var(--pf) * .3);
  animation:dayPulse calc(4.2s - var(--pf) * 2.4s) ease-in-out infinite}
@keyframes dayPulse{
  0%,100%{transform:scale(.9);filter:blur(14px)}
  50%    {transform:scale(1.06);filter:blur(8px)}}
.sty-climb.full .dayx-glow{opacity:.42}
.gcol{display:flex;flex-direction:column;justify-content:space-between;width:100%;height:100%}
.rung{display:block;height:3px;border-radius:2px;width:100%;
  background:rgba(255,255,255,.07);transition:background .35s,box-shadow .35s}
.rung.on{background:var(--accent);box-shadow:0 0 6px var(--accent-soft)}
.rung.next{background:var(--neon);box-shadow:0 0 7px var(--neon);
  animation:sqNext 2s ease-in-out infinite}

/* ---- SUNSET -----------------------------------------------------------
   The disc lives in a box on the right and the horizon is a rule across the
   whole card, so the sun sits IN the card rather than in a widget parked on
   it. overflow:hidden on that box is what makes the horizon a horizon: the
   sun is genuinely cut off by it rather than drawn short. */
/* The sun is a COLUMN in the row, immediately right of the number, not a
   wash behind the whole card — behind the words it was a pink smear you had
   to be told about. It stretches to the card's edges through negative
   margins and stops 12px short of the bottom, which is where the horizon
   rule is drawn, so the disc is cut by the line rather than fading out. */
.sty-sunset .dayx-hd{gap:11px}
.sty-sunset .dayx-n{order:1}
/* The column does NOT clip — only the box inside it does, and only at the
   horizon. That separation is the whole fix: the disc has to be cut by the
   line, the light around it must not be cut by anything. */
.sty-sunset .dayx-art{order:2;position:relative;flex:1;min-width:0;
  align-self:stretch;margin:-14px 0 16px;overflow:visible;pointer-events:none}
.sunbox{position:absolute;inset:0;overflow:hidden}
.sunglow{position:absolute;left:50%;top:calc(var(--suny,1) * 100%);
  width:230px;height:230px;transform:translate(-50%,-50%);pointer-events:none;z-index:-1;
  background:radial-gradient(circle closest-side,
    var(--neon) 0%, var(--neon-soft) 38%, transparent 72%);
  opacity:calc((.05 + var(--pf) * .38) * var(--glow-k,1));
  animation:sunBreathe 5s ease-in-out infinite;
  transition:top .9s cubic-bezier(.22,1,.36,1)}
/* THE GROUND. The horizon was a rule floating on a flat card, which reads as
   a line rather than as a distance. A one-point grid from the card's bottom
   edge up to that rule gives it somewhere to be: the verticals converge on
   the vanishing point the sun sits over, the cross-lines bunch as they
   recede. It lives on the CARD, not inside the sun's box — that box is
   clipped at the horizon, which is the whole point of it. */
/* width:100% explicitly. An <svg> is a replaced element: left:0 + right:0
   does NOT stretch it, it falls back to the size its viewBox implies — which
   is why the ground was 120px of a 339px card. Same trap as the fold ring. */
.gnd{position:absolute;left:0;right:0;width:100%;bottom:0;height:30px;z-index:1;
  pointer-events:none}
/* the ground is drawn in the TITLE's colour, not the accent — it is scenery
   behind the words, and scenery that competes with them is a mistake */
.gnd line{stroke:var(--ink);stroke-width:1;opacity:.13;vector-effect:non-scaling-stroke}
.sty-sunset.full .gnd line{opacity:.2}
.sty-sunset .dayx-tx{order:3;flex:none;width:132px}
.sty-sunset .dayx-chev{order:4}
/* The horizon sits UNDER the subtitle, not through it. At 30px the line
   clears "everything claimed" and the ground has somewhere to be, which is
   what makes the words readable and the distance believable. */
.sty-sunset:after{content:"";position:absolute;left:0;right:0;bottom:30px;height:1px;
  background:linear-gradient(90deg,transparent,var(--ink) 22%,var(--ink) 78%,transparent);
  opacity:.28;pointer-events:none;z-index:1}
.sun{width:100%;height:100%;overflow:visible}
.sun-c,.sun-g{transition:cy .9s cubic-bezier(.22,1,.36,1)}
/* the light is driven off the fill: almost nothing under the horizon, the
   whole corner of the card once it is clear */
@keyframes sunBreathe{0%,100%{transform:translate(-50%,-50%) scale(.94)}
                      50%    {transform:translate(-50%,-50%) scale(1.06)}}
.sun-g{mix-blend-mode:screen;opacity:calc(.25 + var(--pf) * .75)}

/* ---- a hundred percent is an event ----
   Nothing here touches the disc's SIZE. It is the same circle at the same
   radius the whole way up; only the light around it and the card's own edge
   change, so there is no step at the top of the climb. */
.sty-sunset.full .sunglow{opacity:.62}
.sty-sunset.full:after{opacity:.5}
/* the numbers carry a little of the sign's own light */
.sty-sunset .sg.on{filter:drop-shadow(0 0 4px var(--accent)) drop-shadow(0 0 11px var(--accent))}
.sty-sunset .bpc{text-shadow:0 0 10px var(--accent)}
.sty-sunset.full .sg.on{filter:drop-shadow(0 0 5px var(--neon)) drop-shadow(0 0 15px var(--neon))}
.sty-sunset.full{border-color:var(--neon);
  box-shadow:0 0 34px var(--neon-soft), 0 0 0 1px var(--neon-line)}


/* ---- GRID -------------------------------------------------------------
   One-point perspective, vanishing at the top edge. The rungs you have
   already passed are lit, and the scan runs away from you on a loop, eased
   IN so it accelerates toward the horizon the way a road does. */
/* the whole card, not a strip of it — a road in a 60px band reads as a
   stack of lines rather than as distance */
.sty-grid .dayx-art{position:absolute;inset:0;pointer-events:none;overflow:hidden;
  -webkit-mask:linear-gradient(0deg,#000 42%,transparent 96%);
          mask:linear-gradient(0deg,#000 42%,transparent 96%)}
.grid{width:100%;height:100%}
.grid line{vector-effect:non-scaling-stroke}
.gv{stroke:var(--line2);stroke-width:1;opacity:.42}
.gl{stroke:var(--line2);stroke-width:1;opacity:.34;transition:stroke .5s,opacity .5s}
.gl.on{stroke:var(--accent);opacity:.95;filter:drop-shadow(0 0 4px var(--accent))}
.gscan{stroke:var(--neon);stroke-width:1.6;opacity:0;
  filter:drop-shadow(0 0 7px var(--neon));
  animation:gScan 3.6s cubic-bezier(.6,0,.85,.4) infinite}
@keyframes gScan{
  0%  {transform:translateY(60px);opacity:0}
  12% {opacity:.9}
  92% {opacity:0}
  100%{transform:translateY(0);opacity:0}}

/* the water itself — over the card, with the blur BEHIND it, so the number
   and the words are genuinely submerged rather than recoloured */
.tank{position:absolute;left:0;right:0;bottom:0;height:var(--h);z-index:3;
  pointer-events:none;overflow:visible;
  background:linear-gradient(180deg,var(--accent-soft),var(--accent-dim));
  -webkit-backdrop-filter:blur(1.1px) saturate(1.5);
          backdrop-filter:blur(1.1px) saturate(1.5);
  transition:height .9s cubic-bezier(.22,1,.36,1)}
.wv{position:absolute;left:-50%;right:-50%;width:200%;bottom:100%;height:9px;
  fill:var(--accent);animation:wave var(--d,10s) linear infinite}
.wv.w1{opacity:.5}
.wv.w2{opacity:.28;animation-direction:reverse;height:7px}
@keyframes wave{from{transform:translateX(0)}to{transform:translateX(-25%)}}
.sty-grid.full .tank{background:linear-gradient(180deg,var(--accent-dim),var(--accent-soft))}
