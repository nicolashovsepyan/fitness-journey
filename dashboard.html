/* ============================================================
   THE DAY GAUGE
   Four ways to make a percentage worth chasing.

     cell    squares in a row, filling one at a time.
     climb   the same idea run up the right-hand edge.
     ember   a bar burning toward 100 with sparks off the tip.
     stack   the three of them fused: squares climbing the right
             edge with a spark off the top one.

   In all four the meter is DISCRETE — ten squares, ten rungs —
   because "one more block" is a thing you can picture doing and
   "eleven percent" is not. The part-filled square carries the
   remainder so nothing is rounded away.
   ------------------------------------------------------------ */
const DAY_STYLES = [['cell','Cell'],['climb','Climb'],['ember','Ember'],['stack','Stack']];
const dayStyle = () => S.dayStyle || 'stack';
const STEPS = 10;

/* how many blocks are full, and how full the next one is */
function blocks(pct){
  const exact = pct/100*STEPS;
  const full = Math.floor(exact + 1e-9);
  return {full, frac: Math.min(1, exact - full)};
}

function dayArt(st, pct){
  const {full, frac} = blocks(pct);
  const sq = (i, extra) =>
    `<span class="sq ${i<full?'on':''} ${i===full&&frac>0?'part':''} ${i===full&&frac<=0?'next':''}"
       style="--d:${(i*0.045).toFixed(2)}s;--f:${(i===full?frac:0).toFixed(3)}">${extra||''}</span>`;
  const spark = `<span class="spk">${[0,1,2].map(i=>`<i style="--d:${(i*0.6).toFixed(2)}s"></i>`).join('')}</span>`;

  if(st === 'cell')
    return `<span class="row">${Array.from({length:STEPS},(_,i)=>
      sq(i, (i===full-1 && frac<=0) || (i===full && frac>0) ? spark : '')).join('')}</span>`;

  if(st === 'climb')
    return `<span class="gcol">${Array.from({length:STEPS},(_,i)=>
      `<span class="rung ${STEPS-1-i<full?'on':''} ${STEPS-1-i===full?'next':''}"></span>`).join('')}</span>`;

  if(st === 'ember')
    return `<span class="embar"><span class="embar-f"></span><span class="embar-tip">${spark}</span></span>`;

  /* stack — squares up the right edge, spark off the top lit one */
  return `<span class="gcol sqcol">${Array.from({length:STEPS},(_,i)=>{
    const idx = STEPS-1-i;
    return sq(idx, idx===full-1 || (idx===full && frac>0) ? spark : '');
  }).join('')}</span>`;
}

/* ---- what the card SAYS ------------------------------------------
   "Today is open" said nothing. The title is now a verdict on the day
   in as few words as it can be made, and the line under it is the
   single biggest thing still on the table, led by the number. On a
   training day that is almost always the session, which is the point:
   the card should keep saying "train" until he has.               */
const PRIZE = {session:'the session', habits:'your habits', ready:'the check-in',
               note:'a note', open:'opening the app'};
function dayLine(sc){
  const left = sc.parts.filter(p=>p.pts>0 && (sc.got[p.id]||0) < 1).sort((x,y)=>y.pts-x.pts);
  const big = left[0];
  /* Training outranks everything, so on a training day the card keeps
     saying one thing until he has done it. Two words, no hedging. */
  const trainLeft = sc.isTraining && (sc.got.session||0) < 1;
  const title =
      sc.pct >= 100 ? 'Perfect day'
    : trainLeft     ? 'Go train'
    : sc.pct >= 85  ? 'One box left'
    : sc.pct >= 60  ? 'Strong day'
    : sc.pct >= 30  ? 'Building'
    : sc.pct >   0  ? 'Barely started'
    :                 'Zero on the board';
  const sub = big ? `+${big.pts}% &middot; ${PRIZE[big.id] || big.label.toLowerCase()}`
                  : 'Everything claimed';
  return {title, sub};
}

function dayHero(sc){
  const st = dayStyle();
  const open = !!(S.folds && S.folds.score);
  const {title, sub} = dayLine(sc);
  const rows = sc.parts.filter(p=>p.pts>0).map(p=>{
    const g = sc.got[p.id]||0;
    return `<span class="dchip ${g>=1?'on':(g>0?'part':'')}">
      ${g>=1?svg(I.check,'dck'):''}${p.label}<i>${g>=1?'+'+p.pts:(g>0?Math.round(p.pts*g)+'/'+p.pts:'+'+p.pts)}</i></span>`;
  }).join('');

  return `<div class="dayx sty-${st} ${sc.pct>=100?'full':''} ${open?'open':''}"
      style="--pf:${(sc.pct/100).toFixed(3)};--p:${sc.pct}%">
    <span class="dayx-glow" aria-hidden="true"></span>
    <button class="dayx-hd" data-act="fold:score">
      <span class="dayx-n"><span class="tnum">${sc.pct}</span><i>%</i></span>
      <span class="dayx-tx"><b>${title}</b><small>${sub}</small></span>
      <span class="dayx-art">${dayArt(st, sc.pct)}</span>
      <span class="dayx-chev">${svg(I.arrow)}</span>
    </button>
    ${open?`<div class="dayx-body">
      <div class="dh-list">${rows}</div>
      <div class="micro just" style="margin-top:12px">${sc.isTraining
        ? 'Training pays more than everything else put together. That is on purpose.'
        : 'Rest day, so the session’s share moves onto your habits. Today can still be a hundred.'}</div>
    </div>`:''}
  </div>`;
}

function paneToday(){
  const s = todayId ? SESSIONS[todayId] : null;
  const scaled = s ? scaleSession(s) : null;
  const mins = scaled ? scaled.blocks.reduce((t,b)=>t+b.mins,0) : 0;
  const blocks = scaled ? scaled.blocks.length : 0;
  const doneCount = Object.keys(S.done).length;
  const HABITS = HABITS_FOR();
  const habDone = HABITS.filter(h=>S.habits[h.id]).length;

  let h = `<div class="pane">${header()}`;

  /* TEMPORARY — the five day-gauge styles, so they can be judged on the
     real number rather than described. Delete once one is chosen. */
  h += `<div class="sect"><b>Day gauge</b><span class="micro">pick one</span></div>
  <div class="stypick">${DAY_STYLES.map(([id,label])=>
    `<button class="${dayStyle()===id?'on':''}" data-daysty="${id}">${label}</button>`).join('')}
  </div><div style="height:14px"></div>`;

  /* --- clearance, because the PAR-Q said so. Not dismissible until acted on. --- */
  if(!S.dismissed.parq){
    h += `<div class="alert">
      ${svg(I.alert,'ic')}
      <div><b>One thing before we load up</b>
      <p>Week one is safe either way, but get the tick from your GP before we add weight. Tap when it is done.</p>
      </div>
      <button class="x" data-act="parq">✕</button>
    </div>`;
  }

  /* --- readiness: the reason to open the app on a day you are not training --- */
  h += `<div class="card" id="ready">
    <div class="q">How's the body today? <span class="pay">+${todayId?8:15}%</span></div>
    <div class="qs">Three seconds. It changes what I give you.</div>
    <div class="faces">
      ${[['low',I.face1,'Rough'],['ok',I.face2,'Fine'],['good',I.face3,'Good']].map(([v,ic,l])=>
        `<button class="face ${S.readiness===v?'on':''}" data-ready="${v}">${svg(ic)}<span>${l}</span></button>`).join('')}
    </div>
    <div id="readyOut" class="${S.readiness?'on':''}">${readyCopy()}</div>
  </div>`;

  /* --- the hero --- */
  h += `<div class="sect"><b>Today</b>${s&&released(todayId)?`<a data-act="swap">Not feeling it?</a>`:''}</div>`;
  if(s && !released(todayId)){
    /* Being told a human is mid-way through your program is a better
       experience than being shown a program nobody checked. */
    h += `<div class="hero pending trav" data-act="pending">
      ${travelSvg('accent')}
      <div class="veil"></div>
      <div class="in">
        <div class="tag"><i></i>In review</div>
        <h3>Coach Nico is still on this one</h3>
        <div class="why">Today's session is written and being checked before it reaches you. It
          unlocks the moment he is happy with it.</div>
        <div class="chips"><span class="chip">${svg(I.clock)}20 min when it lands</span></div>
        <button class="go ghost">Tell me when it's ready</button>
      </div>
    </div>`;
  } else if(s){
    h += `<div class="hero trav ${todayDone() ?'done':''}" data-act="openday" data-day="${todayId}">
      ${todayDone()?'':travelSvg('accent')}
      <div class="art" style="background-image:url('${heroArt(s)}')"></div>
      <div class="veil"></div>
      <div class="in">
        <div class="tag"><i></i>${todayDone() ?'Done — nice work':'Day 1 · Week 1'}</div>
        <h3>${s.name}</h3>
        <div class="why">${s.why}</div>
        <div class="chips">
          <span class="chip pay-c ${todayDone()?'earned':''}">${todayDone()?'&check; 60% earned':'+60%'}</span>
          <span class="chip">${svg(I.clock)}${mins} min</span>
          <span class="chip">${svg(I.layers)}${blocks} blocks</span>
          <span class="chip">${svg(I.spark)}${s.tag}</span>
        </div>
        <button class="go ${todayDone() ?'ghost':''}">${todayDone() ?'Look at it again':'Open the session'}</button>
      </div>
    </div>`;
  } else {
    const nx = nextDay();
    h += `<div class="hero rest" data-act="openday" data-day="${nx.id}">
      <div class="art" style="background-image:url('images/exercises/dead_hang.png')"></div>
      <div class="veil"></div>
      <div class="in">
        <div class="tag"><i></i>Rest day</div>
        <h3>Nothing today</h3>
        <div class="why">Next up is ${SESSIONS[nx.id].name}, ${nx.when}. Ten minutes outside still counts.</div>
        <button class="go ghost">Look at ${nx.when}'s session</button>
      </div>
    </div>`;
  }

  /* --- the week --- */
  /* Three stacked lines of "label value" on the right made this card twice
     as tall as it needed to be. The count leads, the other three sit beside
     it as a single row of small stats, and the strip underneath lost a few
     millimetres too. Same information, about 40% of the height. */
  h += `<div class="sect"><b>Your week</b><a data-act="tab:log">Your log</a></div>
  <div class="card slim">
    <div class="wkrow">
      <div class="wk-n"><b class="tnum">${doneCount}</b><i>/4</i></div>
      <div class="wk-st">
        <span><i class="tnum">${S.streak||1}</i>streak</span>
        <span><i class="tnum">${doneCount*20}</i>min</span>
        <span><i class="tnum">${Math.round(habDone/HABITS.length*100)}</i>% habits</span>
      </div>
    </div>
    <div class="week">
      ${DAYNM.map((d,i)=>{
        /* the mark itself marks a training day — the app's own symbol doing
           a job rather than decorating one */
        const plan = WEEKPLAN[i], dn = !!S.done[d], now = i===DOW;
        const past = i<DOW && i>=PROGRAM_START_DOW;
        const cls = dn?'done':(plan&&past?'miss':(plan&&i>=PROGRAM_START_DOW?'plan':''));
        return `<div class="wd ${cls} ${now?'now':''}">
          <span class="l">${d[0]}</span>
          <span class="b">${
            dn  ? svg(I.check)
          : now ? markSvg('wmark', !!plan)          /* today: the triangle IS the selection */
          /* A lone bell gets its own frame. Inside the triangle's 300x268 box
             it would be drawn at the size it is IN the logo, which is a
             sixth of a cell — right for the lockup, invisible on its own. */
          : plan? `<svg class="wdb" viewBox="0 0 260 130" aria-hidden="true">
                     <g class="mk-db">${DB_PATHS}</g></svg>`
          : ''}</span>
        </div>`;
      }).join('')}
    </div>
  </div>`;

  /* --- THE DAY -------------------------------------------------------
     The single most important control on the screen. It is not a readout,
     it is the thing the day is trying to fill, so it moves on its own and
     it is the only place the arithmetic lives. Tap it for the receipt. */
  h += dayHero(dayScore());

  /* ---- ONE THING ---- */
  const td = todayTodo(), tdDone = !!(S.todos||{})[td.id];
  const tdPts = (todayId?SCORE_TRAIN:SCORE_REST).find(x=>x.id==='todo').pts;
  /* One control. A to-do that needs a number opens the sheet the moment you
     press it and marks itself the moment you save; one that needs nothing
     just ticks. A separate button underneath was asking the person to press
     the same thing twice. */
  h += `<div class="sect"><b>One thing today</b><span class="micro">${
    tdDone?'done':'changes daily'}</span></div>
  <button class="onething ${tdDone?'on':''}" data-todo1="${td.id}"
      ${(!tdDone && td.act)?`data-otact="${td.act}"`:''}>
    <span class="ot-tick"></span>
    <span class="ot-tx"><b>${td.t}</b><small>${tdDone?'Done \u2014 that is +'+tdPts+'%':td.s}</small></span>
    <span class="ot-pts">${tdDone?'&plus;'+tdPts+'%':(td.cta?td.cta:'&plus;'+tdPts+'%')}</span>
  </button>`;

  const hbs = HABITS_FOR(), hbDone = hbs.filter(x=>S.habits[x.id]).length;
  const nextSlot = HABIT_POOL[hbs.length];
  h += `<div class="sect"><b>Habits</b><span class="micro">${hbDone}/${hbs.length}</span></div>
  <div class="habits">
    ${hbs.map(x=>{
      const on=S.habits[x.id];
      const just = on && JUST_HABIT===x.id;
      return `<button class="hab ${on?'on':''}" data-habit="${x.id}">
        <span class="tick">${on?svg(I.check,'tk'):''}</span>
        <span class="tx"><b>${x.t}</b><small>${x.s}</small></span>
        <span class="hpts ${just?'just':''}">&plus;${Math.round((todayId?18:50)/hbs.length)}%${
          just?`<i class="pspark"></i><i class="pspark" style="--d:.12s"></i>`:''}</span>
      </button>`;
    }).join('')}
  </div>
  ${nextSlot?`<div class="micro" style="margin:11px 2px 0">Seven clean days unlocks <b style="color:var(--ink)">${nextSlot.t}</b>.</div>`:''}`;

  /* --- quick log --- */
  h += `<div class="sect"><b>Log something</b><span class="micro pay-t">a note is +${(todayId?7:15)}%</span></div>
  <div class="rail">
    <button class="ql" data-act="log:weight">${svg(I.scale)}<span>Weight</span></button>
    <button class="ql" data-act="log:note">${svg(I.pen)}<span>Note</span></button>
    <button class="ql" data-act="log:photo">${svg(I.cam)}<span>Photo</span></button>
    <button class="ql" data-act="log:session">${svg(I.plus)}<span>Session</span></button>
  </div>`;

  /* --- messages from a human ---
     One button. The badge only exists when something is actually unread;
     a permanent counter is wallpaper. */
  const unread = unreadCount();
  h += fold('msgs', 'Coach Nico', MESSAGES.map(msgBox).join(''),
    {icon: I.mail, tone: unread?'live':'',
     sub: unread?`${unread===1?'A message is':unread+' messages are'} waiting` : 'Read them again, or reply',
     badge: unread || null, openByDefault: unread > 0});

  /* --- the program --- */
  h += `<div class="sect"><b>Your program</b><a data-act="openweek">See the week</a></div>
  <div class="card tap" data-act="openweek">
    <div class="prog">
      <div class="ring">${ring(8,'1')}</div>
      <div class="tx"><b>Kettlebell Foundation</b>
        <small>Week 1 of 12 · Foundation phase · 4 days, 20 minutes, one bell</small></div>
      ${svg(I.arrow,'arw')}
    </div>
    <div class="phases">
      ${[['Foundation',1],['Build',0],['Peak',0]].map(([n,on],i)=>
        `<div class="ph ${on?'on':''}"><div class="bar"><i data-grow="${on?'8%':'0%'}"></i></div><span>${n}</span></div>`).join('')}
    </div>
  </div>`;

  /* --- learn nudge: the "watch it tonight, do it next session" loop --- */
  const q = S.queued.filter(k=>EX[k]);
  h += `<div class="sect"><b>Queued for next session</b><a data-act="tab:learn">Library</a></div>`;
  if(q.length){
    h += `<div class="exgrid">${q.slice(0,2).map(k=>exCard(k)).join('')}</div>`;
  } else {
    h += `<div class="empty">${svg(I.book)}<b>Nothing queued</b>
      <p>Find a movement in the library, watch the clip, and it shows up here for next time.</p></div>`;
  }

  return h+`</div>`;
}

/* FOLD
   A section header that is also the control for its own contents. Used
   for everything a person consults occasionally rather than reads every
   time — which on a dashboard is most things. Open state is remembered,
   so his shape of the app persists. */
/* FIVE WAYS TO SHOW A BUTTON FILLING UP
   Switchable at the top of the Me tab. `S.ringStyle` picks one.

   Two rules learned the hard way and applied to all of them:
     - A completed run is CONTINUOUS. The gap belongs between done and
       not-done, never between two finished pieces.
     - The arc starts at the TOP-LEFT CORNER, not mid-edge. A line that
       begins in the middle of a straight run looks like a mistake; one
       that begins at a corner looks like it was drawn on purpose.

     arc     one run growing clockwise from the top-left corner.
     comet   the same run with a bright head at the leading edge, so the
             light looks like it travelled there and stopped.
     bars    a thick glowing bar per task with an even hairline gap — a
             segmented gauge. Countable, and heavy on light.
     ring    a circular meter around the icon. No long lines anywhere.
     charge  the icon tile fills bottom-up, like something charging.
   ------------------------------------------------------------------- */
/* Comet won. The others are gone rather than left switchable: a chooser
   nobody will ever open is just another thing to keep working. */
const ringStyle = () => 'comet';
const ON_ICON = st => st === 'ring' || st === 'charge';

/* The rect every outline style traces.
   No pathLength, and no dash lengths in the markup. Chrome would not repaint
   a dash reliably when the length came from pathLength on a percentage-sized
   rect — a half-full card painted about 85% full and stayed there until
   something else forced a repaint. So the markup only carries WHICH SLICE of
   the outline a piece wants, as two fractions of the way round, and
   layoutRings() converts those to absolute pixels once the card has a real
   size. One measurement, exact numbers, nothing for the engine to guess. */
const RRECT = 'x="0" y="0" width="100%" height="100%" rx="14"';
const RX = 14;

/* Turn "from fraction a to fraction b of the way round" into real px.
   Runs after every render and on resize. Because the perimeter is measured,
   the corner is exact: a run that starts at 0 starts at the top-left corner
   itself, not after the curve, because ORIGIN winds the start back by one
   corner arc — the reason a filling outline should never begin mid-edge. */
function layoutRings(root){
  (root||document).querySelectorAll('.oring').forEach(svg=>{
    const w = svg.clientWidth, h = svg.clientHeight;
    if(!w || !h) return;
    const rx = Math.min(RX, w/2, h/2);
    const P = 2*(w - 2*rx) + 2*(h - 2*rx) + 2*Math.PI*rx;   /* true perimeter */
    const ORIGIN = (Math.PI*rx)/2;                          /* one corner arc */
    svg.querySelectorAll('[data-a]').forEach(el=>{
      const a = parseFloat(el.dataset.a), b = parseFloat(el.dataset.b);
      const len = Math.max(0, (b - a) * P);
      el.style.strokeDasharray  = len + 'px ' + Math.max(0.01, P - len) + 'px';
      el.style.strokeDashoffset = (ORIGIN - a*P) + 'px';
    });
  });
}
addEventListener('resize', ()=>layoutRings());

function ringSvg(total, done){
  if(!total || total < 1) return '';
  const st = ringStyle();
  if(ON_ICON(st)) return '';
  const pct = done/total;

  if(st === 'bars'){
    /* even hairline gaps between every slot, done or not — a gauge */
    const seg = 1/total, gap = 0.016;
    const one = (i,cls) =>
      `<rect class="${cls} ${i<done?'on':''}" ${RRECT}
         data-a="${(i*seg + gap/2).toFixed(5)}" data-b="${((i+1)*seg - gap/2).toFixed(5)}"
         style="--d:${(i*0.08).toFixed(2)}s"/>`;
    const idx = Array.from({length: total}, (_,i)=>i);
    return `<svg class="oring bars" aria-hidden="true">
      ${idx.map(i=>one(i,'rgh')).join('')}${idx.map(i=>one(i,'rg')).join('')}
    </svg>`;
  }

  /* arc + comet — one continuous run out of the top-left corner */
  const notch = Array.from({length: total-1}, (_,i)=>
    `<rect class="notch" ${RRECT}
       data-a="${((i+1)/total - 0.004).toFixed(5)}" data-b="${((i+1)/total + 0.004).toFixed(5)}"/>`).join('');
  const run = cls =>
    `<rect class="${cls} ${done?'on':''}" ${RRECT} data-a="0" data-b="${pct.toFixed(5)}"/>`;
  /* the head: a short bright dash parked exactly where the run ends */
  const head = done && done < total
    ? `<rect class="head" ${RRECT}
         data-a="${Math.max(0, pct-0.009).toFixed(5)}" data-b="${pct.toFixed(5)}"/>` : '';
  return `<svg class="oring ${st}" aria-hidden="true">
    <rect class="track" ${RRECT}/>
    ${notch}${run('rgh')}${run('rg')}${st==='comet'?head:''}
  </svg>`;
}

/* ring + charge live inside the icon tile instead of round the card */
function iconFx(total, done){
  const st = ringStyle();
  if(!total || !ON_ICON(st)) return '';
  const pct = done/total;
  if(st === 'charge')
    return `<span class="chg" style="--h:${(pct*100).toFixed(1)}%"></span>`;

  /* An explicit arc path, not a dashed circle. A circle's own path runs the
     wrong way round on screen and no amount of rotating fixes the direction;
     stating the sweep flag says "clockwise from twelve" and means it. */
  const CX = 22, R = 19;
  const pt = deg => {
    const a = (deg - 90) * Math.PI/180;
    return [(CX + R*Math.cos(a)).toFixed(3), (CX + R*Math.sin(a)).toFixed(3)];
  };
  const track = `<circle class="ir-t" cx="${CX}" cy="${CX}" r="${R}"/>`;
  if(pct <= 0) return `<svg class="icoring" viewBox="0 0 44 44" aria-hidden="true">${track}</svg>`;
  const arc = pct >= 0.999
    ? `M ${CX} ${CX-R} A ${R} ${R} 0 1 1 ${CX-0.01} ${CX-R} `
    : `M ${pt(0).join(' ')} A ${R} ${R} 0 ${pct>0.5?1:0} 1 ${pt(pct*360).join(' ')}`;
  return `<svg class="icoring" viewBox="0 0 44 44" aria-hidden="true">${track}
    <path class="ir-h" d="${arc}"/><path class="ir-c" d="${arc}"/></svg>`;
}

function fold(id, title, body, opts){
  const o = opts||{};
  const open = S.folds ? !!S.folds[id] : !!o.openByDefault;
  /* `steps` and `did` describe the ring: how many pieces, how many lit. */
  const steps = o.steps || 0, did = Math.min(o.did||0, steps);
  const fill = steps ? did/steps : (o.fill==null ? null : Math.max(0, Math.min(1, o.fill)));
  const done = fill!=null && fill>=1;
  const st = steps ? ringStyle() : null;
  return `<div class="fold ${open?'open':''} ${o.tone||''} ${done?'done':''} ${st?'sty-'+st:''}"
    ${fill!=null?`style="--fill:${fill.toFixed(2)};--pct:${(fill*100).toFixed(1)}%"`:''}>
    ${steps?ringSvg(steps, did):''}
    <button class="fold-hd" data-act="fold:${id}">
      <span class="fold-ic">${steps?iconFx(steps, did):''}${svg(o.icon||I.box)}</span>
      <span class="fold-tx"><b>${title}</b>${o.sub?`<small>${o.sub}</small>`:''}</span>
      ${o.badge?`<span class="fold-badge">${o.badge}</span>`:''}
      ${done?`<span class="fold-ck">${svg(I.check)}</span>`
            :(o.note?`<span class="fold-note">${o.note}</span>`:'')}
      <span class="fold-chev">${svg(I.arrow)}</span>
    </button>
    ${open?`<div class="fold-body">${body}</div>`:''}
  </div>`;
}

function unreadCount(){ return MESSAGES.filter(m=>!S.readMsg[m.id] && !S.hidMsg[m.id]).length; }

/* Closed: one line and a dot. Open: the terminal window. The travelling
   light only ever runs on an UNREAD one — the moment it is read it stops,
   which is what makes it mean something. */
function msgBox(m){
  const done = !!S.hidMsg[m.id];
  const open = !!S.openMsg[m.id] && !done;
  const unread = !S.readMsg[m.id] && !done;
  return `<div class="msg ${open?'open':''} ${unread?'unread':''} ${done?'done':''}">
    ${unread && !open ? travelSvg('coach') : ''}
    <button class="msg-hd" data-act="togglemsg:${m.id}">
      <span class="av">N</span>
      <span class="msg-t"><b>${m.from}</b><small>${open?m.at:m.subject}</small></span>
      ${unread?'<span class="ur-dot"></span>'
        :`<span class="msg-chev">${done?'&check;':(open?'&minus;':'+')}</span>`}
    </button>
    ${open?`<div class="msg-body">
      ${m.lines.map(l=>`<p>${l}</p>`).join('')}
      ${m.ask?`<p class="msg-ask">${m.ask}</p>`:''}
      <div class="msg-row">
        ${m.cta?`<button class="ghostline" data-act="log:checkin">${m.cta}</button>`:''}
        <button class="ghostline dim" data-act="hidemsg:${m.id}">Mark done</button>
      </div>
    </div>`:''}
  </div>`;
}

function readyCopy(){
  if(!S.readiness) return '';
  return ({
    low:'<b>Noted.</b> I have pulled the third set off everything and dropped the finisher. Twenty minutes of easy is still a session — and it still counts on the strip.',
    ok:'<b>Fine works.</b> The session stands as written. If set three feels off, stop it there and log it.',
    good:'<b>Good.</b> I have added one set to the push and one to the row. Nothing else changes — week one earns its numbers, it does not chase them.'
  })[S.readiness];
}
function nextDay(){
  for(let i=1;i<=7;i++){ const d=(DOW+i)%7; if(WEEKPLAN[d]) return {id:WEEKPLAN[d],when:i===1?'tomorrow':DAYNM[d]}; }
  return {id:'d1',when:'soon'};
}
function ring(pct,label){
  const r=21,c=2*Math.PI*r, off=c*(1-pct/100);
  return `<svg width="52" height="52" viewBox="0 0 52 52">
    <circle cx="26" cy="26" r="${r}" fill="none" stroke="var(--line)" stroke-width="4"/>
    <circle cx="26" cy="26" r="${r}" fill="none" stroke="var(--accent)" stroke-width="4"
      stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}"
      transform="rotate(-90 26 26)"/>
    <text x="26" y="30" text-anchor="middle" fill="var(--ink)" font-size="15" font-weight="600">${label}</text>
  </svg>`;
}
/* ---------- artwork, and its absence ----------------------------------
   A movement without a picture still gets a card. The placeholder is the
   app's own mark, ghosted, with the pattern name — deliberately blank
   rather than an approximation, because the whole reason we are here is
   that an approximate figure reads as a broken app. */
/* The session's face: the first movement in it that actually has artwork.
   Falls back to the mark rather than to a broken image. */
function heroKey(s){
  for(const b of s.blocks) for(const [k] of b.items) if(EX[k] && EX[k].img) return k;
  return s.blocks[0].items[0][0];
}
function heroArt(s){ const k=heroKey(s); return (EX[k]&&EX[k].img)||''; }
function art(k,cls){
  const e=EX[k];
  return e.img
    ? `<img class="${cls||''}" src="${e.img}" alt="" loading="lazy">`
    : `<span class="noart ${cls||''}" aria-label="Artwork not made yet">
        <svg viewBox="0 0 260 130" aria-hidden="true">
          <path d="M86 65 H174" stroke-width="7" opacity=".5"/>
          <path d="M86 38 V92" stroke-width="12.65"/><path d="M174 38 V92" stroke-width="12.65"/>
          <path d="M66.8 40.7 V89.3" stroke-width="9.9"/><path d="M193.2 40.7 V89.3" stroke-width="9.9"/>
        </svg></span>`;
}
const KITNAME = {bar:'a pull-up bar',band:'bands',db:'dumbbells',kb:'a kettlebell',bench:'a bench',mat:'a mat'};
function exCard(k){
  const e=EX[k], lk=isLocked(k);
  const missing=(e.kit||[]).filter(x=>!OWNED.has(x));
  return `<div class="ex ${S.seen.includes(k)?'seen':''} ${S.queued.includes(k)?'q':''} ${e.img?'':'na'} ${lk?'lk':''}" data-ex="${k}">
    <div class="im">${art(k)}${
      lk ? `<span class="lock">Needs ${missing.map(x=>KITNAME[x]||x).join(' + ')}</span>`
      : e.img ? `<div class="play">${svg(I.play)}</div>`
      : `<span class="soon">Card coming</span>`}</div>
    <div class="lb"><b>${e.n}</b><small>${e.pat}</small></div>
  </div>`;
}

/* ============================================================
   TAB · LOG — the log book

   This is the tab he owns. Onboarding promised him "your log, your data,
   your journey" and told him his name goes on the front of it, so the tab
   has to be a record, not a report: everything that happened, newest first,
   in his own handwriting where he wrote any.

   The numbers sit on top as a summary of the book below them. They are
   derived from the entries — not a separate thing he also has to maintain.
   ============================================================ */

/* Every kind of thing that can happen to him, merged into one stream.
   Sessions, weigh-ins, notes, photos, tests, milestones — one shape, so the
   feed never has to special-case anything to render it. */
/* MILESTONES ARE PROGRESS, NOT ACTIVITY.
   A milestone is a thing that moved him closer to what he came for: the
   first session, a benchmark set, a target chosen, a week completed. A
   weigh-in is a reading, a note is a note, and a message from Coach Nico
   is a conversation — none of those are milestones, and calling them that
   would make the word worth nothing by week two.

   The onboarding entry stays a milestone: it is the moment the program
   became possible.

   Everything carries `at` in prototype-clock milliseconds so the feed can
   be ordered by when it actually happened. Older saves used `t` (a day
   offset), so those are read and converted rather than dropped. */
const AT = e => e.at != null ? e.at
               : (e.t != null ? T0 + e.t*864e5 - 8*36e5 : T0);

function logEntries(){
  const out=[];
  (S.notes||[]).forEach(n=>out.push({at:AT(n), kind:LOGMETA[n.k]?n.k:'note',
    title:n.h, body:n.b}));
  (S.weights||[]).forEach((wp,i)=>out.push({at:(S.weightAt||[])[i] ?? AT({t:wp[0]}),
    kind:'weigh', title:`${disp(wp[1])} ${U}`,
    body:i===0?'Starting weight, from your onboarding.':''}));
  (S.freestyle||[]).forEach(f=>out.push({at:AT(f), kind:'free', title:f.h,
    body:[f.mins,f.rpe].filter(Boolean).join(' \u00b7 ') + (f.b?` \u2014 ${f.b}`:'')}));
  Object.entries(S.doneAt||{}).forEach(([dn,when])=>{
    const idx=DAYNM.indexOf(dn), sid=WEEKPLAN[idx];
    if(!sid) return;
    const ses=SESSIONS[sid];
    out.push({at:when, kind:'session', title:ses.name,
      body:`${ses.blocks.reduce((t,x)=>t+x.mins,0)} minutes \u00b7 ${ses.tag}`});
  });
  Object.entries(S.testAt||{}).forEach(([id,when])=>{
    const t=TESTS.find(x=>x.id===id); if(!t) return;
    out.push({at:when, kind:'pr', title:`${t.name}: ${S.tests[id]} ${t.unit}`,
      body:'Benchmark set. Everything from here is measured against it.'});
  });
  if(S.profile.photo && S.photoAt) out.push({at:S.photoAt, kind:'photo',
    title:'Starting photo', body:'Front and side. Stored on your device.'});
  if(S.targetKg!=null && S.targetAt) out.push({at:S.targetAt, kind:'milestone',
    title:`Target set: ${disp(S.targetKg)} ${U}`, body:'The chart has somewhere to go now.'});
  return out.sort((x,y)=>y.at-x.at);
}

const LOGMETA={
  session:  ['done',  'Session'],
  free:     ['free',  'Freestyle'],
  weigh:    ['weigh', 'Weigh-in'],
  note:     ['note',  'Note'],
  pr:       ['pr',    'Benchmark'],
  photo:    ['photo', 'Photo'],
  milestone:['mile',  'Milestone'],
  coach:    ['reply', 'Coach Nico']
};
/* the filters, and which kinds each one keeps */
const LOGFILTERS = [
  ['all',   'Everything', null],
  ['train', 'Training',   ['session','free','pr']],
  ['mile',  'Milestones', ['milestone']],
  ['coach', 'Coach',      ['coach']]
];

function paneLog(){
  const w = S.weights;
  const cur = w[w.length-1][1], first = w[0][1];
  const single = w.length<2;
  const delta = Math.round((disp(cur)-disp(first))*10)/10;
  const toGoal = S.targetKg!=null ? Math.round((disp(cur)-disp(S.targetKg))*10)/10 : null;
  const done = Object.keys(S.done).length + (S.freestyle||[]).length;
  const entries = logEntries();

  let h = `<div class="pane">${header()}`;

  /* ---- the book, named ---- */
  h += `<div class="book">
    <div class="bk-eye">The log of</div>
    <div class="bk-name serif">${esc(A.name)}</div>
    <div class="bk-sub">Opened 10 August 2026 · ${entries.length} entr${entries.length===1?'y':'ies'}</div>
  </div>`;

  /* ---- the weigh-in, named and counted down ---- */
  const wi = weighIn();
  /* Doing it is a Today job, so this is the calendar entry, not the button:
     which day, how far off, and on the day itself where to find it. */
  const wiDone = !!(S.todos||{}).weigh;
  h += `<div class="weigh ${wi.today?'now':''} ${wiDone?'done':''}"
      ${wi.today&&!wiDone?'data-act="tab:today"':''}>
    <span class="wi-ic">${svg(wiDone?I.check:I.scale)}</span>
    <span class="wi-tx">
      <b>${wiDone ? 'Logged for this week'
                  : wi.today ? 'Weigh in today'
                             : `Weigh-in ${wi.day}`}</b>
      <small>${wiDone ? `Next one ${wi.day}, seven days`
                      : wi.today ? "It is today's one thing"
                                 : `${wi.days} day${wi.days===1?'':'s'} away`}</small>
    </span>
    ${wi.today&&!wiDone?`<span class="wi-go">Go</span>`
      :`<span class="wi-cd tnum">${wiDone?'\u2713':wi.days}</span>`}
  </div>`;

  /* ---- what the book adds up to ---- */
  h += `<div class="tiles three">
    <div class="tile" data-act="logsheet:weight">
      <div class="k">Weight</div>
      <div class="v tnum">${disp(cur)}<small>${U}</small></div>
      <div class="d">${single?'Start':(delta<0?'▼ ':'▲ ')+Math.abs(delta)+' '+U}</div>
    </div>
    <div class="tile" data-act="tab:today">
      <div class="k">Sessions</div>
      <div class="v tnum">${done}</div>
      <div class="d">of 48</div>
    </div>
    <div class="tile" data-act="opentodo:goalweight">
      <div class="k">Target</div>
      <div class="v tnum">${S.targetKg!=null?disp(S.targetKg):'—'}</div>
      <div class="d">${S.targetKg!=null?Math.abs(toGoal)+' to go':'Set it'}</div>
    </div>
  </div>`;

  /* ---- THE LOG ITSELF — the reason this tab exists ---- */
  h += `<div class="sect"><b>Everything, newest first</b><a data-act="logsheet:note">Write</a></div>`;
  h += `<div class="rail4">
    <button class="ql" data-act="logsheet:session">${svg(I.plus)}<span>Session</span></button>
    <button class="ql" data-act="logsheet:weight">${svg(I.scale)}<span>Weight</span></button>
    <button class="ql" data-act="logsheet:note">${svg(I.pen)}<span>Note</span></button>
    <button class="ql" data-act="logsheet:photo">${svg(I.cam)}<span>Photo</span></button>
  </div>`;

  const lf = LOGFILTERS.find(f=>f[0]===(S.logFilter||'all')) || LOGFILTERS[0];
  const shown = lf[2] ? entries.filter(e=>lf[2].includes(e.kind)) : entries;
  h += `<div class="filters">${LOGFILTERS.map(([id,label,kinds])=>{
      const n = kinds ? entries.filter(e=>kinds.includes(e.kind)).length : entries.length;
      return `<button class="fl ${lf[0]===id?'on':''}" data-logf="${id}">${label}${n?` <i>${n}</i>`:''}</button>`;
    }).join('')}</div>`;
  /* The three newest, and the rest on request. The book is the point of this
     tab, but a wall of it on arrival buries the three things that actually
     happened today — and the ones you have already read are the ones you
     are least likely to want. */
  const LOG_HEAD = 3;
  const more = Math.max(0, shown.length - LOG_HEAD);
  const allOpen = !!(S.folds||{}).logall;
  const list = allOpen ? shown : shown.slice(0, LOG_HEAD);
  h += `<div class="feed">
    ${list.map(e=>{
      const [cls,label]=LOGMETA[e.kind]||['note','Note'];
      return `<div class="fe">
        <div class="fe-rail"><span class="fe-dot ${cls}"></span></div>
        <div class="fe-body">
          <div class="fe-top"><span class="fe-kind ${cls}">${label}</span><span class="fe-when">${stamp(e.at)}</span></div>
          <b>${esc(e.title)}</b>
          ${e.body?`<p>${esc(e.body)}</p>`:''}
        </div>
      </div>`;
    }).join('')}
    ${shown.length?'':`<div class="empty" style="margin-top:4px">${svg(I.book)}<b>Nothing here yet</b><p>It will fill up.</p></div>`}
    ${more?`<div class="fe morerow">
      <div class="fe-rail"><span class="fe-dot more"></span></div>
      <div class="fe-body"><button class="logmore ${allOpen?'on':''}" data-act="fold:logall">
        ${allOpen ? 'Show less' : `Show ${more} more`}${svg(I.arrow,'lmc')}</button></div>
    </div>`:''}
    ${(allOpen||!more)?`<div class="fe last">
      <div class="fe-rail"><span class="fe-dot start"></span></div>
      <div class="fe-body"><b>Day one</b><p>Everything above this line is yours. Nothing gets deleted, ever.</p></div>
    </div>`:''}
  </div>`;

  /* ---- the numbers the book produces ---- */
  h += `<div class="sect"><b>Weight</b><a data-act="logsheet:weight">Weigh in</a></div>
  <div class="card">
    <div class="micro">${single
      ? `One reading so far — ${disp(cur)} ${U}, this morning. Weigh in again next Monday, same time, same clothes, and the line starts.`
      : `${delta<0?'Down':'Up'} ${Math.abs(delta)} ${U} since you started.`}${
      S.targetKg!=null
        ? ` Target is ${disp(S.targetKg)} ${U} — ${Math.abs(toGoal)} ${U} away, which at a safe rate is about ${Math.max(1,Math.round(Math.abs(S.targetKg-cur)/0.45))} weeks.`
        : ` <b style="color:var(--accent-2)">No target set yet</b> — the dotted line has nowhere to go until you pick one.`}</div>
    <div class="chartwrap">${weightChart()}</div>
    ${S.targetKg==null?`<button class="go ghost" style="margin-top:14px" data-act="opentodo:goalweight">Set a target weight</button>`:''}
  </div>`;

  /* Every card is its own test. They all opened the push-up sheet before,
     because every row carried the same data-todo="test". Now each carries
     its own id and the sheet is built from it.

     Laid out as a rail you swipe rather than a list you read: picking a
     test should feel like picking a game, not filling in a form. */
  h += `<div class="sect"><b>Benchmarks</b><span class="micro">${Object.keys(S.tests||{}).length}/${TESTS.length} tested</span></div>
  <div class="rail-h bcar" id="bcar">
    ${TESTS.map((t,i)=>{
      const got=(S.tests||{})[t.id];
      const flipped = !!(S.flip||{})[t.id];
      return `<div class="bflip ${flipped?'over':''} ${got?'got':''} ${!got&&i===0?'lead':''}">
        <div class="bf-in">
          <button class="bf-face bf-front" data-flip="${t.id}">
            <span class="bc-art">${art(t.id)}</span>
            <b>${t.name}</b>
            <small>${t.how}</small>
            <span class="bc-go">${got?got+' '+t.unit:'Test'}</span>
          </button>
          <button class="bf-face bf-back" data-flip="${t.id}">
            <span class="bf-eye">${t.unit === 'sec' ? 'Hold' : 'Reps'}</span>
            <b>${t.name}</b>
            <p>${t.note}</p>
            ${got?`<span class="bf-score"><i class="tnum">${got}</i>${t.unit}</span>`:''}
            <span class="bc-go alt" data-go="${t.id}">${got?'Test again':'Do it now'}</span>
          </button>
        </div>
      </div>`;
    }).join('')}
  </div>
  <div class="bcdots" id="bcdots">${TESTS.map((_,k)=>
    `<i class="${k===0?'on':''}"></i>`).join('')}</div>
  <div class="micro" style="text-align:center;margin:2px 2px 0">Scroll through them. Tap one to turn it over.</div>`;

  h += `<div class="sect"><b>Photos</b><a data-act="logsheet:photo">Add</a></div>
  <div class="empty">${svg(I.cam)}<b>No photos yet</b>
    <p>One from the front, one from the side, once a fortnight. Nobody sees them. In twelve weeks they will say more than the scale does.</p></div>`;

  h += `<div class="sect"><b>Where you started</b></div>
  <div class="card">
    <div class="arow"><span class="k">Shape today</span><span class="v">Carrying some weight around the middle <em>— your own answer</em></span></div>
    <div class="arow"><span class="k">Ninety days</span><span class="v">Lean out, then get stronger</span></div>
    <div class="arow"><span class="k">Ten years</span><span class="v">Keep up with the kids · move without pain · play sport again</span></div>
    <div class="arow"><span class="k">Real driver</span><span class="v">Lose weight · the doctor said so · the kids</span></div>
  </div>`;

  return h+`</div>`;
}

/* One series, so no legend — the section title names it. Only the newest point
   is labelled; a number on every point is noise.

   Two states, because on day one there genuinely is only one reading:
   · one point  — the dot, the date, and an honest "no line yet".
   · two or more — the line, plus the target if he has set one.
   The target is HIS. Nothing is drawn until he types a number. */
function weightChart(){
  const W=320,H=132,PL=8,PR=58,PT=14,PB=22;
  const d=S.weights.map(p=>[p[0],disp(p[1])]);
  const goal=S.targetKg!=null ? disp(S.targetKg) : null;
  const single=d.length<2;
  const xs=d.map(p=>p[0]), ys=d.map(p=>p[1]);
  /* with one reading, invent an x-window a week wide so the dot sits left and
     the empty week ahead of it is visible rather than implied */
  const x0=Math.min(...xs), x1=single ? x0+7 : Math.max(...xs);
  const band=ys.concat(goal!=null?[goal]:[]);
  const pad=single&&goal==null ? 2.5 : 1.2;
  const lo=Math.min(...band)-pad, hi=Math.max(...band)+pad;
  const X=v=>PL+(v-x0)/((x1-x0)||1)*(W-PL-PR);
  const Y=v=>PT+(hi-v)/((hi-lo)||1)*(H-PT-PB);
  const pts=d.map(p=>[X(p[0]),Y(p[1])]);
  const last=pts[pts.length-1], lastV=d[d.length-1][1];
  const gy=goal!=null?Y(goal):null;
  return `<svg viewBox="0 0 ${W} ${H}" role="img"
      aria-label="Body weight. ${single?`One reading so far, ${lastV} ${U}.`
        :`${d.length} readings, from ${d[0][1]} to ${lastV} ${U}.`}${goal!=null?` Target ${goal} ${U}.`:''}">
    <line class="gridln" x1="${PL}" y1="${(H-PB).toFixed(1)}" x2="${(W-PR).toFixed(1)}" y2="${(H-PB).toFixed(1)}"/>
    ${gy!=null?`<line class="goalLn" x1="${PL}" y1="${gy.toFixed(1)}" x2="${(W-PR).toFixed(1)}" y2="${gy.toFixed(1)}"/>
      <text class="goalLbl" x="${(W-PR+6).toFixed(1)}" y="${(gy+3.5).toFixed(1)}">target</text>`:''}
    ${single
      ? `<line class="pendingLn" x1="${(last[0]+7).toFixed(1)}" y1="${last[1].toFixed(1)}"
           x2="${(W-PR).toFixed(1)}" y2="${last[1].toFixed(1)}"/>`
      : `<path class="serie" d="${pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ')}"/>`}
    <circle class="dotEnd" cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="4.5"/>
    <text class="endLbl" x="${(last[0]+9).toFixed(1)}" y="${(last[1]-9).toFixed(1)}"
      text-anchor="${single?'start':'start'}">${lastV}</text>
    ${single
      ? `<text class="axl" x="${last[0].toFixed(1)}" y="${H-6}" text-anchor="middle">today</text>
         <text class="axl" x="${(W-PR).toFixed(1)}" y="${H-6}" text-anchor="middle">next Mon</text>`
      : d.map(p=>`<text class="axl" x="${X(p[0]).toFixed(1)}" y="${H-6}" text-anchor="middle">${p[0]===0?'start':'wk '+p[0]/7}</text>`).join('')}
  </svg>`;
}

/* ============================================================
   TAB · LEARN — discovery, not a catalogue

   The browsable grid is the least important thing on this tab. The
   job is to get one new movement into him per visit, so the tab
   opens on a single card he has not seen, and the only two choices
   are learn it or show me another.

   Underneath that sits the starter deck: the movements his own
   program uses, dealt five at a time. Five is a stopping point, not
   a cap — the run offers to end there and lets him carry on if he
   is enjoying it. A deck that never ends gets abandoned mid-way and
   feels like homework; one that says "that's five, well done" gets
   finished and reopened tomorrow.
   ============================================================ */
let LQ='', LF='all', DECK=null, DECKI=0;

/* Deterministic pick-of-the-visit: rotates through everything he has
   not watched, in a fixed order, so it never repeats until it has to
   and never shuffles under him mid-session. */
function tonight(){
  const pool=Object.keys(EX).filter(k=>!isLocked(k) && EX[k].img && !S.seen.includes(k));
  const all =Object.keys(EX).filter(k=>!isLocked(k) && EX[k].img);
  const src = pool.length?pool:all;
  return src[(S.visits||0) % src.length];
}

function paneLearn(){
  const list=Object.keys(EX).filter(k=>{
    const e=EX[k];
    if(LF!=='all'&&e.pat!==LF) return false;
    if(LQ&&!e.n.toLowerCase().includes(LQ.toLowerCase())) return false;
    return true;
  });
  const pats=['all',...new Set(Object.values(EX).filter(e=>!(e.kit||[]).some(x=>!OWNED.has(x))).map(e=>e.pat))];
  const mine=Object.keys(EX).filter(k=>!isLocked(k));
  const locked=list.filter(isLocked);
  const withArt=mine.filter(k=>EX[k].img);
  const seen=S.seen.length;
  const pick=tonight();

  let h=`<div class="pane">${header()}`;

  /* ---------- one movement, tonight ---------- */
  if(pick){
    const e=EX[pick], already=S.seen.includes(pick);
    h+=`<div class="sect" style="margin-top:2px"><b>Tonight's movement</b><span class="micro">${seen} learned</span></div>
    <div class="tonight" data-ex="${pick}">
      <div class="tn-art">${art(pick)}</div>
      <div class="tn-tx">
        <div class="tn-pat">${e.pat}</div>
        <b>${e.n}</b>
        <p>${e.why}</p>
      </div>
      <div class="tn-row">
        <button class="go" data-act="watch:${pick}">${already?'Watch it again':'Learn this one'}</button>
        <button class="go ghost tn-skip" data-act="reroll">Show me another</button>
      </div>
    </div>`;
  }

  /* ---------- the starter deck ---------- */
  h+=`<div class="sect"><b>Your starter deck</b><span class="micro">${seen}/${withArt.length}</span></div>
  <div class="card tap" data-act="deck">
    <div class="prog">
      <div class="ring">${ring(Math.round(seen/withArt.length*100),seen)}</div>
      <div class="tx"><b>${seen?'Pick up where you left off':'Learn the movements in your program'}</b>
        <small>Five cards a run, then you choose whether to keep going. Ten minutes tonight and you will
        walk into Monday knowing what every movement is for.</small></div>
      ${svg(I.arrow,'arw')}
    </div>
  </div>`;

  /* ---------- browse, for when he wants to go looking ---------- */
  h+=`<div class="sect"><b>Everything else</b><span class="micro">${list.filter(k=>!isLocked(k)).length}</span></div>`;
  h+=`<div class="search">${svg(I.search)}<input id="q" placeholder="Search a movement" value="${esc(LQ)}"></div>`;
  h+=`<div class="filters">${pats.map(p=>
    `<button class="fl ${LF===p?'on':''}" data-fl="${p}">${p==='all'?'Everything':p}</button>`).join('')}</div>`;

  const open=list.filter(k=>!isLocked(k));
  h+= open.length ? `<div class="exgrid">${open.map(exCard).join('')}</div>`
    : `<div class="empty">${svg(I.search)}<b>Nothing matches</b><p>Try a different word, or clear the filter.</p></div>`;

  if(withArt.length<mine.length){
    h+=`<div class="micro" style="margin-top:14px;padding:0 2px">${mine.length-withArt.length} movements in your
      program are still having their card drawn. They are in your sessions either way.</div>`;
  }
  if(locked.length){
    h+=`<button class="quietline" data-act="tab:me">
      <span>${locked.length} more movements need kit you do not have</span>
      ${svg(I.arrow,'arw')}
    </button>`;
  }

  return h+`</div>`;
}

/* ---------- the deck run ---------- */
function sheetDeck(){
  if(!DECK){
    /* unseen first, then the rest — so a returning run always opens on
       something new rather than re-dealing what he already knows */
    const pool=Object.keys(EX).filter(k=>!isLocked(k)&&EX[k].img);
    DECK=[...pool.filter(k=>!S.seen.includes(k)),...pool.filter(k=>S.seen.includes(k))];
    DECKI=0;
  }
  if(DECKI>=DECK.length){ DECK=null; return sheetDeckDone(true); }

  const k=DECK[DECKI], e=EX[k];
  const n=DECKI+1, restPoint = n%5===0 && DECKI<DECK.length-1;

  openSheet(`
    <div class="deckbar">
      ${DECK.slice(0,Math.min(DECK.length,10)).map((_,i)=>
        `<span class="dbi ${i<n?'on':''}"></span>`).join('')}
    </div>
    <div class="eyebrow dim" style="margin-top:14px">Card ${n} of ${DECK.length} &middot; ${e.pat}</div>
    <h4 style="margin-top:8px">${e.n}</h4>
    <div class="shsub">${e.why}</div>
    <div class="vid" data-act="watch:${k}">
      ${art(k)}
      <div class="pb">${svg(I.play)}</div>
      <div class="cap">40 seconds</div>
    </div>
    <div class="cues">
      ${e.cues.slice(0,3).map((c,i)=>`<div class="cue"><span class="n">${i+1}</span><p>${c}</p></div>`).join('')}
    </div>
    ${e.bad&&e.bad.length?`<div class="cues">
      <div class="eyebrow" style="margin-bottom:10px;color:var(--red)">The mistake everyone makes</div>
      <div class="cue bad"><span class="n">!</span><p>${e.bad[0]}</p></div>
    </div>`:''}
    <div class="sheetcta">
      <button class="go" data-act="deckgot:${k}">${restPoint?'Got it — that is five':'Got it'}</button>
    </div>
    <button class="go ghost" style="margin-top:9px" data-act="decknext">Skip this one</button>
  `);
}

/* The stopping point. It congratulates, then offers — it never nags. */
function sheetDeckDone(finished){
  const seen=S.seen.length;
  openSheet(`
    <div class="eyebrow">${finished?'Deck complete':'Five done'}</div>
    <h4 style="margin-top:8px">${finished?'That is every movement in your program':'Nice — five in the bank'}</h4>
    <div class="shsub">${finished
      ? `You now know what every movement in your twelve weeks is for. That puts you ahead of most people who have been training for a year.`
      : `You have watched ${seen} now. Stop here and it still counts — or keep going while you are in the mood.`}</div>
    <div class="deckstat">
      <div><b class="tnum">${seen}</b><span>learned</span></div>
      <div><b class="tnum">${S.queued.length}</b><span>queued</span></div>
    </div>
    <div class="sheetcta">
      ${finished
        ? `<button class="go" data-act="close">Done</button>`
        : `<button class="go" data-act="deckmore">Keep going</button>
           <button class="go ghost" style="margin-top:9px" data-act="close">That's enough for tonight</button>`}
    </div>
  `);
}

/* ============================================================
   TAB · ME
   Two jobs: let him finish telling us who he is (every answer
   makes the program better, and saying so out loud is what makes
   people answer), and let him see everything he already said.
   ============================================================ */
/* The percentages are real: the base plus every outstanding weight is exactly
   100. A completeness meter that cannot reach 100 is the fastest way to teach
   someone that your numbers are decoration. */
const PROFILE_BASE=62;
/* Short label, one-line reason, and the reward. The percentage is back
   because it is the reward — a number that visibly moves is the whole
   reason anyone finishes a profile. Each one is worth what it is worth
   to the programming, and the five together take it to 100. */
const PTODO=[
  ['photo',      'Photo',        'Front and side',        '2 min',  5],
  ['goalweight', 'Target weight','Gives the chart a line','20 sec', 6],

/* Five tiers. Named so the next one is worth reaching. */
const TIERS=[[100,'Complete'],[92,'Dialled in'],[80,'Sharp'],[70,'Warming up'],[0,'Rough sketch']];
const tierOf = pct => TIERS.find(t=>pct>=t[0])[1];
/* The reactor ring, kept because it belongs on a profile: a number that
   only ever goes up, with light orbiting behind it. Draws an explicit arc
   path — a circle's own path runs the wrong way on screen. */
function reactor(pct){
  const C = 44, R = 34;
  const pt = deg => { const a=(deg-90)*Math.PI/180;
    return `${(C+R*Math.cos(a)).toFixed(2)} ${(C+R*Math.sin(a)).toFixed(2)}`; };
  const arc = pct <= 0 ? '' : (pct >= 99.9
    ? `M ${C} ${C-R} A ${R} ${R} 0 1 1 ${C-0.01} ${C-R}`
    : `M ${pt(0)} A ${R} ${R} 0 ${pct>50?1:0} 1 ${pt(pct*3.6)}`);
  return `<span class="rxg"><span class="rx-orbit"></span>
    <svg class="rx-svg" viewBox="0 0 88 88" aria-hidden="true">
      <circle class="rx-t" cx="44" cy="44" r="34"/>
      ${arc?`<path class="rx-h" d="${arc}"/><path class="rx-c" d="${arc}"/>`:''}
    </svg><span class="rx-n"><b class="tnum">${pct}</b><i>%</i></span></span>`;
}

/* The readiness answer has to actually move the numbers. A card that says
   "I dropped a set" over a session that still shows three is the moment a
   person stops believing anything else on the screen. */
function scaleSession(s){
  const r = S.readiness;
  if(!r || r==='ok') return {blocks:s.blocks, note:''};
  const setDelta = r==='low' ? -1 : 1;
  const blocks = s.blocks
    .filter(b => !(r==='low' && b.role==='Finish'))
    .map(b => ({...b, items: b.items.map(([k,rx,note],i)=>{
      const m = /^(\d+) × (.+)$/.exec(rx);
      /* on a good day only the first two working movements get the extra set */
      const eligible = r==='low' ? true : (b.role==='Work' && i<2);
      if(!m || !eligible) return [k,rx,note];
      const sets = Math.max(1, parseInt(m[1],10) + setDelta);
      return [k, sets+' × '+m[2], note];
    })}));
  return {blocks, note: r==='low'
    ? 'A set off everything and no finisher, because you said rough. It still counts as a full session.'
    : 'An extra set on the push and the row, because you said good. Nothing else changes.'};
}
function sheetDay(id){
  const s=SESSIONS[id];
  const {blocks, note} = scaleSession(s);
  const mins=blocks.reduce((t,b)=>t+b.mins,0);
  openSheet(`
    <div class="eyebrow">${s.tag} · ${mins} minutes</div>
    <h4 style="margin-top:8px">${s.name}</h4>
    <div class="shsub">${s.why}</div>
    ${note?`<div class="micro" style="margin-top:12px;color:var(--accent)">${note}</div>`:''}
    ${blocks.map(b=>`<div class="blk">
      <div class="blkh"><b>${b.role}</b><small>${b.mins} min</small></div>
      ${b.items.map(([k,rx,note])=>`<div class="mv" data-ex="${k}">
        <div class="th">${art(k)}</div>
        <div class="tx"><b>${EX[k].n}</b><small>${note||EX[k].pat}</small></div>
        <div class="rx">${rx}</div>
      </div>`).join('')}
    </div>`).join('')}
    <div class="sheetcta">
      <button class="go" data-act="start:${id}">Start the session</button>
    </div>
    <button class="go ghost" style="margin-top:9px" data-act="close">Not now</button>
  `);
}

    session:{h:'What did you do?',s:'Anything. Ours, a gym session, a sport, a long walk. It all counts the same.',
      body:`<div class="fld"><label>What was it</label>
              <input id="lgh" type="text" placeholder="Padel with Sam"></div>
            <div class="fld"><label>How long</label><div class="segs" data-seg-group="mins">
              ${['20 min','40 min','1 hr','More'].map((x,i)=>`<button class="seg ${i===1?'on':''}" data-seg="${x}">${x}</button>`).join('')}
            </div></div>
            <div class="fld"><label>How hard</label><div class="segs" data-seg-group="rpe">
              ${['Easy','Solid','All out'].map((x,i)=>`<button class="seg ${i===1?'on':''}" data-seg="${x}">${x}</button>`).join('')}
            </div></div>
            <div class="fld"><label>Notes <span style="text-transform:none;letter-spacing:0;color:var(--ink3)">&mdash; optional</span></label>
              <textarea id="lgv" placeholder="What you did, how it felt."></textarea></div>`},
    checkin:{h:'Reply to Coach Nico',s:'Goes to him, and into your log so you can read it back later. He answers on Mondays.',
      body:`<div class="fld"><label>How was last week, honestly</label><textarea id="lgv" placeholder="Be honest — it is the only version that helps."></textarea></div>
            <div class="fld"><label>Anything hurting</label><div class="segs">
              ${['Nothing','A bit','A lot'].map((x,i)=>`<button class="seg ${i===0?'on':''}" data-seg="${x}">${x}</button>`).join('')}
            </div></div>`}
  }[kind];
  openSheet(`<h4>${F.h}</h4><div class="shsub">${F.s}</div>${F.body}
    <div class="sheetcta"><button class="go" data-act="save:${kind}">Save</button></div>
    <button class="go ghost" style="margin-top:9px" data-act="close">Cancel</button>`);
}

function sheetTodo(k){
  const t=PTODO.find(x=>x[0]===k) || ['test','Push-up test','Get your first rank','90 sec',12];
  const extra={
    goalweight:`<div class="fld"><label>Target weight (${U})</label>
        <input id="lgv" type="text" inputmode="decimal" placeholder="${disp(S.weights[S.weights.length-1][1]-6)}"></div>
      <div class="micro" style="margin-top:12px">You are ${disp(S.weights[S.weights.length-1][1])} ${U} today. A pound a week is the rate that keeps muscle on; anything faster comes off you as well as off the scale. Pick the number you actually want — I will pace it, not police it.</div>`,
    measure:`<div class="fld"><label>Waist, at the navel (cm)</label><input id="lgv" type="text" inputmode="decimal" placeholder="98"></div>`,
    injury:`<div class="fld"><label>The knee — what and when</label><textarea id="lgv" placeholder="Aches going down stairs, fine walking."></textarea></div>`,
    test:`<div class="fld"><label>Push-ups to failure</label><input id="lgv" type="text" inputmode="numeric" placeholder="12"></div>
          <div class="micro" style="margin-top:10px">Hands on the bench is fine — tell me and I will rank it against the bench standard, not the floor one.</div>`,
    photo:`<div class="empty" style="margin-top:16px">${svg(I.cam)}<b>Take or choose a photo</b><p>Stays on your device.</p></div>`
  }[k]||'';
  openSheet(`<h4>${t[1]}</h4><div class="shsub">${t[2]}</div>${extra}
    <div class="sheetcta"><button class="go" data-act="todo:${k}">Save · +${t[3]}% complete</button></div>
    <button class="go ghost" style="margin-top:9px" data-act="close">Later</button>`);
}

/* ============================================================
   8 · WIRING
   ============================================================ */
function wire(){
  view.querySelectorAll('[data-ready]').forEach(b=>b.onclick=()=>{
    S.readiness = S.readiness===b.dataset.ready?null:b.dataset.ready; save(); go('today');
    if(S.readiness) toast('Session adjusted');
  });
  view.querySelectorAll('[data-habit]').forEach(b=>b.onclick=()=>{
    const k=b.dataset.habit; S.habits[k]=!S.habits[k]; save(); go('today');
    if(S.habits[k]&&HABITS.every(x=>S.habits[x.id])) toast('All three. That is the day won.');
  });
  view.querySelectorAll('[data-ex]').forEach(b=>b.onclick=()=>sheetExercise(b.dataset.ex));
  view.querySelectorAll('[data-todo]').forEach(b=>b.onclick=()=>sheetTodo(b.dataset.todo));
  view.querySelectorAll('[data-test]').forEach(b=>b.onclick=()=>sheetTest(b.dataset.test));
  view.querySelectorAll('[data-gear]').forEach(b=>b.onclick=()=>sheetGear(b.dataset.gear));
  view.querySelectorAll('[data-slotsel]').forEach(b=>b.onclick=()=>{
    const [slot,palette]=b.dataset.slotsel.split(':');
    S.slots=Object.assign({}, slotChoice(), {[slot]:palette});
    S.openSlot=null; applyTheme(); save(); go('me');
  });
  view.querySelectorAll('[data-fl]').forEach(b=>b.onclick=()=>{ LF=b.dataset.fl; go('learn'); });
  /* The card turns; the button on its back is the only thing that opens
     the test. Stopping propagation is what keeps the two apart. */
  /* The benchmark rail behaves like the body-shape carousel in onboarding:
     whichever card is nearest the middle of the viewport is the live one.
     Its neighbours drop back in scale and opacity so the row reads as one
     thing being chosen rather than four things sitting in a list. */
  const bcar = view.querySelector('#bcar');
  if(bcar){
    const dots = [].slice.call(view.querySelectorAll('#bcdots i'));
    const slides = [].slice.call(bcar.querySelectorAll('.bflip'));
    const track = () => {
      const mid = bcar.getBoundingClientRect().left + bcar.clientWidth/2;
      let best = 0, bestD = Infinity;
      slides.forEach((el,i)=>{
        const r = el.getBoundingClientRect();
        const d = Math.abs(r.left + r.width/2 - mid);
        if(d < bestD){ bestD = d; best = i; }
      });
      slides.forEach((el,i)=>el.classList.toggle('live', i===best));
      dots.forEach((d,i)=>d.classList.toggle('on', i===best));
    };
    bcar.addEventListener('scroll', ()=>{
      if(bcar._raf) return;
      bcar._raf = requestAnimationFrame(()=>{ bcar._raf=0; track(); });
    }, {passive:true});
    track();
  }

  view.querySelectorAll('[data-habit]').forEach(b=>b.addEventListener('click', ()=>{
    /* Remembered only long enough to render once. It is a visual beat, not
       state — persisting it would replay the spark on every reload. */
    if(!S.habits[b.dataset.habit]) JUST_HABIT = b.dataset.habit;
  }, true));

  view.querySelectorAll('[data-todo1]').forEach(b=>b.onclick=()=>{
    /* Needs a number? Open the sheet and remember what it was for; the save
       handler ticks it. Otherwise it is its own confirmation. */
    if(b.dataset.otact){
      PENDING_TODO = b.dataset.todo1;
      return act(b.dataset.otact, b);
    }
    S.todos=S.todos||{};
    const id=b.dataset.todo1, was=!!S.todos[id];
    S.todos[id]=!was; save(); go('today',true);
    if(!was) toast('Nice — that is the kind of thing that adds up');
  });
  view.querySelectorAll('[data-flip]').forEach(b=>b.onclick=e=>{
    /* data-go, not data-test: the generic [data-test] handler further down
       would also fire and open the sheet twice. */
    const cta = e.target.closest('[data-go]');
    if(cta) return sheetTest(cta.dataset.go);
    S.flip=S.flip||{}; S.flip[b.dataset.flip]=!S.flip[b.dataset.flip];
    save(); go('log',true);
  });
  view.querySelectorAll('[data-daysty]').forEach(b=>b.onclick=()=>{
    S.dayStyle=b.dataset.daysty; save(); go('today',true);
  });
  view.querySelectorAll('[data-logf]').forEach(b=>b.onclick=()=>{
    S.logFilter=b.dataset.logf; save(); go('log',true);
  });
  const q=view.querySelector('#q');
  if(q) q.oninput=()=>{ LQ=q.value; const c=q.selectionStart; go('learn');
    const n=view.querySelector('#q'); if(n){ n.focus(); n.setSelectionRange(c,c);} };
  view.querySelectorAll('[data-act]').forEach(b=>b.onclick=e=>{ e.stopPropagation(); act(b.dataset.act,b); });
}
function wireSheet(){
  sBody.querySelectorAll('[data-act]').forEach(b=>b.onclick=e=>{ e.stopPropagation(); act(b.dataset.act,b); });
  sBody.querySelectorAll('[data-ex]').forEach(b=>b.onclick=()=>sheetExercise(b.dataset.ex));
  sBody.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>sheetDay(b.dataset.day));
  sBody.querySelectorAll('[data-seg]').forEach(b=>b.onclick=()=>{
    b.parentNode.querySelectorAll('.seg').forEach(x=>x.classList.remove('on')); b.classList.add('on'); });
}

function act(a,el){
  const [cmd,arg]=a.split(':');
  if(cmd==='tab') return go(arg);
  if(cmd==='close') return closeSheet();
  if(cmd==='parq'){ S.dismissed.parq=1; save(); go('today'); return toast('Noted — I will ask again before week 5'); }
  if(cmd==='openday') return released(el.dataset.day)?sheetDay(el.dataset.day):toast('Still in review');
  if(cmd==='pending') return toast("You'll get a nudge the moment it unlocks");
  if(cmd==='openweek') return sheetWeek();
  if(cmd==='swap') return toast('Swap coming — three alternatives for today');
  if(cmd==='editprofile') return toast('Opens the onboarding answers, editable');
  if(cmd==='gearalt'){
    /* A person improvising with two chairs is telling us something useful.
       It goes to the coach as a question, not into a void. */
    notifyCoach('alt', {title:`${A.name} may have a stand-in for the ${
      (GEAR.find(g=>g.id===arg)||{name:'item'}).name.toLowerCase()}`,
      now:'Ask what he actually has — chairs, a step, a sturdy table — and whether it is safe to load.',
      next:'If it holds up, write the substitution into the program instead of waiting on the purchase.'});
    save();
    return toast('Tell Coach Nico what you have — he will work it in');
  }
  if(cmd==='editkit') return sheetKit();
  if(cmd==='kitadd'){
    const a=KIT_ADVICE[arg]; if(!a) return;
    OWNED.add(arg==='kb2'?'kb':arg);
    notifyCoach('kit', {title:`${A.name} added: ${a.n}`, now:a.now, next:a.next});
    save(); closeSheet(); go('me');
    return toast('Coach Nico has been told');
  }
  if(cmd==='log'||cmd==='logsheet') return sheetLog(arg);
  if(cmd==='fold'){ S.folds=S.folds||{}; S.folds[arg]=!S.folds[arg]; save(); return go(S.tab,true); }
  if(cmd==='opentodo') return sheetTodo(arg);
  if(cmd==='savetest'){
    const v=sBody.querySelector('#lgv'), n=parseInt(v&&v.value,10);
    if(!n||n<1) return toast('Type a number first');
    S.tests=S.tests||{}; S.tests[arg]=n;
    S.testAt=S.testAt||{}; S.testAt[arg]=nowMs();
    if(arg==='pushup') S.profile.test=true;
    save(); closeSheet(); go('log');
    const t=TESTS.find(x=>x.id===arg);
    return toast(`${t.name}: ${n} ${t.unit} \u2014 logged`);
  }
  if(cmd==='slotopen'){ S.openSlot = S.openSlot===arg ? null : arg; save(); return go('me'); }
  if(cmd==='shuffle'){
    S.themeRandom=!S.themeRandom;
    if(!S.themeRandom) S.slots=slotChoice();   /* keep what it landed on */
    applyTheme(); save(); go('me',true);
    return toast(S.themeRandom?'New colours every Monday':'Yours to pick again');
  }
  if(cmd==='togglemsg'){
    if(S.hidMsg[arg]) S.hidMsg[arg]=0;          /* re-opening un-archives it */
    S.openMsg[arg]=!S.openMsg[arg];
    if(S.openMsg[arg]) S.readMsg[arg]=1;
    save(); go('today',true); return;
  }
  if(cmd==='hidemsg'){
    S.hidMsg[arg]=1; S.openMsg[arg]=false; save(); go('today',true);
    return toast('Done \u2014 still here if you want it');
  }
  if(cmd==='deck'){ DECK=null; return sheetDeck(); }
  if(cmd==='reroll'){ S.visits=(S.visits||0)+1; save(); return go('learn'); }
  if(cmd==='decknext'){ DECKI++; return (DECKI%5===0 && DECKI<DECK.length) ? sheetDeckDone(false) : sheetDeck(); }
  if(cmd==='deckgot'){
    if(!S.seen.includes(arg)){ S.seen.push(arg); save(); }
    DECKI++;
    return (DECKI%5===0 && DECKI<DECK.length) ? sheetDeckDone(false) : sheetDeck();
  }
  if(cmd==='deckmore') return sheetDeck();
  if(cmd==='gear') return sheetGear(arg);
  if(cmd==='buy'){
    const g=GEAR.find(x=>x.id===arg); if(!g) return;
    /* A search page, deliberately — see the note on GEAR. Opens in a new tab
       so a half-finished session is never lost behind a shopping trip. */
    window.open(MARKET.search+encodeURIComponent(g.search),'_blank','noopener');
    return toast('Opened in a new tab');
  }
  if(cmd==='watch'){
    if(!S.seen.includes(arg)){ S.seen.push(arg); S.visits=(S.visits||0)+1; save(); go(S.tab); }
    return toast('In the real app this plays the clip'); }
  if(cmd==='queue'){
    const i=S.queued.indexOf(arg);
    if(i>=0){ S.queued.splice(i,1); toast('Taken off next session'); }
    else { S.queued.push(arg); toast(EX[arg].n+' is in Wednesday\'s session'); }
    save(); closeSheet(); go(S.tab); return;
  }
  if(cmd==='start'){
    S.done[DAYNM[DOW]]=1;
    S.doneAt=S.doneAt||{}; S.doneAt[DAYNM[DOW]]=nowMs();
    save(); closeSheet(); go('today');
    return toast('Work Mode opens here — session marked done for the demo');
  }
  if(cmd==='save'){
    const v=sBody.querySelector('#lgv'), hh=sBody.querySelector('#lgh');
    if(arg==='weight'&&v&&v.value){
      const kg = toKg(v.value);
      if(kg!=null){ S.weightAt=(S.weightAt||[]); }
      /* one reading per week: a second entry lands seven days on, which is
         also the only cadence at which a bathroom scale tells the truth */
      if(kg!=null){ S.weights.push([S.weights[S.weights.length-1][0]+7,kg]);
                    S.weightAt.push(nowMs()); }
    }
    if(arg==='session'){
      const seg=g=>{const el=sBody.querySelector(`[data-seg-group="${g}"] .seg.on`);return el?el.textContent.trim():'';};
      S.freestyle = S.freestyle || [];
      S.freestyle.unshift({at:nowMs(), h:(hh&&hh.value)||'Session',
        mins:seg('mins'), rpe:seg('rpe'), b:(v&&v.value)||''});
    } else if(arg==='note'||arg==='checkin'){
      S.notes.unshift({at:nowMs(), k:arg==='checkin'?'coach':'note',
        h:(hh&&hh.value)||(arg==='checkin'?'You replied to Coach Nico':'Note'),
        b:(v&&v.value)||'—'});
    }
    if(arg==='photo'){ S.profile.photo=true; S.photoAt=nowMs(); }
    /* If this sheet was opened by today's one thing, saving IS ticking it. */
    if(PENDING_TODO){ S.todos=S.todos||{}; S.todos[PENDING_TODO]=1; PENDING_TODO=null; }
    save(); closeSheet(); go(S.tab);
    return toast(arg==='checkin'?'Sent to Coach Nico \u2014 and saved in your log':'Saved');
  }
  if(cmd==='todo'){
    const v=sBody.querySelector('#lgv');
    if(arg==='goalweight'){
      const kg=toKg(v&&v.value);
      if(kg==null){ return toast('Type a number first'); }
      /* Guard rails, not gatekeeping: he is told when a target is unsafe and
         it is still saved, because it is his body. */
      const cur=S.weights[S.weights.length-1][1];
      S.targetKg=kg; S.targetAt=nowMs(); S.profile.goalweight=true; save(); closeSheet(); go('log');
      const wks=Math.round((cur-kg)/0.45);
      if(kg>=cur) return toast('Saved — that is at or above where you are now');
      if(wks>26)  return toast('Saved — that is a long road, we will pace it');
      return toast(`Saved — about ${Math.max(1,wks)} weeks at a safe rate`);
    }
    S.profile[arg]=true; save(); closeSheet(); go('me');
    const gained=(PTODO.find(x=>x[0]===arg)||[])[4];
    const now=PROFILE_BASE+PTODO.reduce((t,x)=>t+(S.profile[x[0]]?x[4]:0),0);
    return toast(gained?`+${gained}% \u00b7 ${tierOf(now)}`:'Saved');
  }
}

/* ---------- toast ---------- */
let tT;
function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('on');
  clearTimeout(tT); tT=setTimeout(()=>t.classList.remove('on'),2400); }

/* ---------- helpers ---------- */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function ago(d){ return d===0?'now':d===-1?'today':d===-2?'yesterday':Math.abs(d)+'d'; }

/* ---------- boot ---------- */
document.querySelectorAll('.tb').forEach(b=>b.onclick=()=>go(b.dataset.tab));
datePlaceholders();
applyTheme();   /* paint immediately from the fallback */
go(S.tab||'today');
loadTheme().then(()=>go(S.tab||'today'));   /* then again from the spine, if reachable */
</script>
