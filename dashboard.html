  kb_deadlift:{n:'Kettlebell Deadlift',pat:'Hinge',img:null,kit:['kb'],why:'The first movement of the whole program. Everything a kettlebell does later is this, faster.',cues:['Bell on the floor between your feet, feet about hip width.','Push the hips back until your hands reach it. Back stays flat, shins near vertical.','Stand up by driving the floor away and squeezing the glutes at the top.'],bad:['Squatting down to it. Hips back, not hips down — the knees only bend as much as the hips demand.']},
  kb_rdl:{n:'Kettlebell Romanian Deadlift',pat:'Hinge',img:null,kit:['kb'],why:'The hamstring half of the hinge, and the reason your lower back stops taking the load.',cues:['Start standing, bell in both hands in front of your thighs.','Push the hips back and slide the bell down your legs. Soft knees, they do not bend further.','Go until you feel the hamstrings, then stand tall.'],bad:['Rounding the back to get lower. The hamstrings decide the depth, not your ambition.']},
  single_leg_rdl:{n:'Single-Leg RDL',pat:'Hinge',img:'images/exercises/single_leg_rdl.png',kit:[],why:'Hamstrings, balance, and a hip that finally works one side at a time.',cues:['Soft knee on the standing leg. It stays soft, it does not bend more.','Hinge until you feel the hamstring, back leg rising behind you.','Hips stay square to the floor. Do not let the back hip roll open.'],bad:['Rounding the back to reach lower. Stop where the hamstring stops you.']},
  kb_swing:{n:'Kettlebell Swing',pat:'Hinge',img:'images/exercises/kb_swing.png',kit:['kb'],phase:2,why:'The movement the whole thing has been building to. It arrives in week five, not week one.',cues:['Hike the bell back between your legs like a rugby pass.','Snap the hips forward hard. The bell floats to chest height on its own.','Arms are rope. They do not lift anything.'],bad:['Squatting and lifting it with the shoulders. That is not a swing and it is how backs get hurt.']},
  box_squat:{n:'Bench Squat',pat:'Legs',img:null,kit:['bench'],why:'A squat with a floor under it. The bench tells your knee exactly how far it is going.',cues:['Stand in front of the bench, feet a bit wider than hips.','Sit back until you touch it lightly, then stand.','Touch. Do not drop onto it.'],bad:['Going deeper than the bench because it felt fine. Depth is earned in weeks, not in one set.']},
  goblet_squat:{n:'Goblet Squat',pat:'Legs',img:null,kit:['kb'],why:'The counterweight at your chest is what makes a squat knee-friendly for a beginner.',cues:['Hold the bell at chest height, elbows tucked in.','Sit down between the hips, chest tall, to the bench.','Drive up through the whole foot.'],bad:['Letting the elbows drift out and the chest fold. The bell stays glued to your sternum.']},
  bulgarian_split:{n:'Bulgarian Split Squat',pat:'Legs',img:'images/exercises/bulgarian_split.png',kit:['bench'],phase:3,why:'One leg at a time — the fastest way to find and fix a weak side. It waits until the knee says yes.',cues:['Back foot on the bench, front foot a long stride out.','Drop straight down, front thigh towards parallel.','All the weight through the front heel.'],bad:['Starting this before the knee is ready. It is parked until week nine at the earliest.']},
  wall_sit:{n:'Wall Sit',pat:'Legs',img:'images/exercises/wall_sit.png',kit:[],why:'Quad strength with nothing moving — which is why the knee tolerates it when reps do not.',cues:['Back flat on the wall, slide down until the thighs are where the knee is comfortable.','Hands off the thighs.','Breathe. Come out before the form goes.'],bad:['Going to ninety degrees because that is the picture. Go to where it does not hurt.']},
  pushup:{n:'Push-ups',pat:'Push',img:'images/exercises/pushup.png',kit:['bench'],why:'The whole upper body in one movement. Everything scales from here.',cues:['Hands on the bench to start — the higher the hands, the easier it is.','One line from ear to heel. Squeeze the glutes.','Elbows back at about 45°, not flared out to the sides.'],bad:['Hips sagging first. If they do, raise the hands. Do not cut the reps.']},
  kb_floor_press:{n:'Kettlebell Floor Press',pat:'Push',img:null,kit:['kb','mat'],why:'Pressing with a hard stop at the bottom, so the sore shoulder never goes anywhere it does not want to.',cues:['On your back on the mat, knees bent, bell in one hand at your chest.','Press straight up. The bell finishes over the shoulder, not the face.','Lower until the upper arm touches the mat, then go again.'],bad:['Bouncing the elbow off the floor. Touch, pause, press.']},
  kb_press:{n:'Kettlebell Overhead Press',pat:'Press',img:null,kit:['kb'],phase:3,why:'Overhead, once the shoulder and the arm have earned it.',cues:['Bell in the rack position, resting on the forearm, wrist straight.','Press up and slightly back until the arm is by your ear.','Ribs down. The lower back does not help.'],bad:['Pressing through arm pain. This one waits for the GP tick and a quiet shoulder.']},
  single_arm_row:{n:'Single-Arm Row',pat:'Pull',img:null,kit:['kb','bench'],why:'Square hips, drive elbow back, full stretch.',cues:['Square hips, drive elbow back, full stretch.'],bad:[]},
  kb_high_pull:{n:'Kettlebell High Pull',pat:'Pull',img:null,kit:['kb'],phase:3,why:'A swing that finishes in a pull. Upper back work without anything to hang from.',cues:['Swing as normal, then guide the elbow high and back as the bell floats.','The hips still do all the work.'],bad:['Pulling early with the arm. The bell must be weightless before the elbow moves.']},
  suitcase_carry:{n:'Suitcase Carry',pat:'Carry',img:null,kit:['kb'],why:'Grip, core and posture at once, and it looks like nothing. Perfect for a small flat.',cues:['One bell in one hand, hanging by your side. Stand tall.','Walk. Do not lean away from it — resist the tilt.','Swap hands and walk back.'],bad:['Leaning to the other side to balance. Staying vertical IS the exercise.']},
  goblet_march:{n:'Goblet March',pat:'Core',img:null,kit:['kb'],why:'A plank you do standing up. Kind to the ankle, brutal on the middle.',cues:['Bell at the chest, stand tall.','Lift one knee to hip height, hold a beat, put it down.','Ribs down, no leaning back.'],bad:['Rushing. One slow knee is worth five fast ones.']},
  farmers_carry:{n:'Farmer\'s Carry (no straps)',pat:'Conditioning',img:'images/exercises/farmers_carry.png',kit:['kb'],phase:2,why:'A dumbbell in each hand, no straps — grip is the point. Walk tall, shoulders back, 30-40 m. Set them down when the round is done, not when your grip fails. If they slip early, go lighter. Start 40-50 lb per hand.',cues:['A dumbbell in each hand, no straps — grip is the point. Walk tall, shoulders back, 30-40 m. Set them down when the round is done, not when your grip fails. If they slip early, go lighter. Start 40-50 lb per hand.'],bad:[]},
  forearm_plank:{n:'Forearm Plank',pat:'Core',img:'images/exercises/forearm_plank.png',kit:['mat'],why:'The brace that protects your back in every other movement here.',cues:['Elbows under shoulders, forearms flat.','Squeeze the glutes, tuck the ribs down, pull the belly in.','Twenty honest seconds beats sixty sagging ones.'],bad:['Hips high in a tent. Flat line from shoulder to heel or it does not count.']},
  side_plank:{n:'Side Plank',pat:'Core',img:null,kit:['mat'],why:'The side of the middle that the plank misses — and the bit that holds you upright in a carry.',cues:['On one forearm, elbow under the shoulder, knees bent to start.','Lift the hips until you are one straight line.','Build to straight legs over weeks, not in one session.'],bad:['Hips drifting backwards. Stack shoulder, hip and knee.']},
  hollow_hold:{n:'Hollow Hold',pat:'Core',img:'images/exercises/hollow_hold.png',kit:['mat'],why:'The shape every hard movement later is built on.',cues:['Lower back pressed flat into the mat. That is the whole exercise.','Bend the knees and keep the arms by your side to start.','Only straighten out once the back stays flat.'],bad:['A gap under the lower back. Bend the knees more and keep the gap closed.']},
  turkish_getup:{n:'Turkish Get-Up',pat:'Skill',img:'images/exercises/turkish_getup.png',kit:['kb','mat'],phase:3,why:'The best thing a kettlebell can teach a 45-year-old body. Five minutes of it is a whole session.',cues:['Learn it in halves, with no bell at all, for the first two weeks.','Every position is a stop. Nothing flows until every stop is solid.'],bad:['Doing the whole thing on day one. It is six movements pretending to be one.']},
  mountain_climber:{n:'Mountain Climbers',pat:'Conditioning',img:'images/exercises/mountain_climber.png',kit:['mat'],why:'Your heart rate, without a single jump on that ankle.',cues:['Plank position, hands under shoulders.','Drive one knee to the chest, swap. Hips stay level.','Pace it. This is a thirty-second effort, not a sprint.'],bad:['Hips bouncing up and down. Slow it until they stop.']},
  march_in_place:{n:'Fast March',pat:'Conditioning',img:null,kit:[],why:'Conditioning that a sore ankle and a downstairs neighbour can both live with.',cues:['Knees high, arms driving, stay light.','Thirty seconds hard, thirty easy.'],bad:['Turning it into jogging. Both feet never leave the floor at once.']},
  dead_hang:{n:'Dead Hang',pat:'Pull',img:'images/exercises/dead_hang.png',kit:['bar'],why:'Grip, shoulders and a spine that gets to decompress, for the price of hanging on.',cues:['Full grip, arms straight, shoulders relaxed but not collapsed.','Breathe. Let the spine lengthen.','Build the time before you build anything else.'],bad:['Dropping off the bar. Step down under control.']},
  scap_pullup:{n:'Scapular Pull-ups',pat:'Pull',img:null,kit:['bar'],why:'The first inch of a pull-up, and the piece almost everyone skips.',cues:['Hang straight, then pull the shoulder blades down without bending the arms.','Tiny movement. Big difference.'],bad:[]},
  wide_inverted_row:{n:'Wide Inverted Row',pat:'Pull',img:'images/exercises/wide_inverted_row.png',kit:['bar'],why:'The step between rowing a bell and pulling your own bodyweight.',cues:['Body straight from ear to heel, chest to the bar.','Squeeze the shoulder blades before the arms bend.','The higher the bar, the easier — start high.'],bad:['Hips leading. The whole plank moves as one.']},
  hanging_knee_raise:{n:'Hanging Knee Raise',pat:'Core',img:'images/exercises/hanging_knee_raise.png',kit:['bar'],why:'Core work that also builds the grip and the hang at the same time.',cues:['Hang still, then lift the knees to hip height.','No swinging. Stop the body before the next rep.'],bad:[]},
  pullup:{n:'Pull-Up',pat:'Pull',img:'images/exercises/pullup.png',kit:['bar'],why:'The one everybody wants. It is a long road and it starts with hanging.',cues:['Dead hang, shoulders pulled down first.','Chin over the bar, chest towards it.','Lower slowly — the way down builds the way up.'],bad:['Kipping to get up. Not yet.']},
  banded_pullapart:{n:'Banded Pull-Aparts',pat:'Pull',img:'images/exercises/banded_pullapart.png',kit:['band'],why:'Two minutes of this is why your shoulder stops aching at a desk.',cues:['Arms straight, band at chest height.','Pull apart until the hands are wide, squeeze the shoulder blades.','Return slowly — the way back is the half that counts.'],bad:['Shrugging. Shoulders down and away from the ears.']},
  banded_glute_bridge:{n:'Banded Glute Bridge',pat:'Glutes',img:'images/exercises/banded_glute_bridge.png',kit:['band'],why:'The glute bridge with the bit that actually makes the outer glute work.',cues:['Band above the knees. Press out into it the whole time.','Squeeze hard at the top for one second.'],bad:[]},
  band_assisted_pullup:{n:'Band-Assisted Pull-Up',pat:'Pull',img:null,kit:['bar','band'],why:'The bridge between hanging and a real pull-up. Needs both the bar and a band.',cues:['Loop the band over the bar and put one foot in it.','Thinner band each time you get comfortable.'],bad:[]},
  bent_over_row:{n:'Bent-Over Row',pat:'Pull',img:'images/exercises/bent_over_row.png',kit:['db'],why:'Both sides at once, once one bell stops being enough load.',cues:['Hinge, flat back, bells hanging straight down.','Lead with the elbows, pull to the hips.'],bad:[]},
  arm_circles:{n:'Arm Circles',pat:'Mobility',img:null,kit:[],why:'One arm at a time. Ten big slow circles forward, ten backward. Wakes the shoulder up before you load it.',cues:['One arm at a time. Ten big slow circles forward, ten backward. Wakes the shoulder up before you load it.'],bad:[]},
  down_dog_up_dog:{n:'Down Dog to Up Dog',pat:'Mobility',img:'images/exercises/down_dog_up_dog.png',kit:[],why:'Hips high in an upside-down V, then sweep the chest through and forward until the arms are straight. Hold five seconds at each end.',cues:['Hips high in an upside-down V, then sweep the chest through and forward until the arms are straight. Hold five seconds at each end.'],bad:[]},
  straight_bar_push_up:{n:'Straight Bar Push-Up',pat:'Push',img:'images/exercises/straight_bar_push_up.png',kit:['bb','parallettes'],why:'Hands on parallettes or a fixed barbell. Greater depth than floor — chest drops well below hand level. Full scapular protraction at top. Narrow grip, elbows at 45°. Excellent shoulder health and chest stimulus.',cues:['Hands on parallettes or a fixed barbell. Greater depth than floor — chest drops well below hand level. Full scapular protraction at top. Narrow grip, elbows at 45°. Excellent shoulder health and chest stimulus.'],bad:[]},
  lat_pulldown:{n:'Lat Pulldown',pat:'Pull',img:null,kit:['machine'],why:'Sit tall, pull the bar to your upper chest and lead with your elbows, not your hands. Let it back up slowly.',cues:['Sit tall, pull the bar to your upper chest and lead with your elbows, not your hands. Let it back up slowly.'],bad:[]},
  assisted_dip:{n:'Assisted Dip (machine)',pat:'Push',img:null,kit:['machine'],why:'Kneel or stand on the pad — the machine takes weight off you. Lean forward a little, lower until your upper arms are level with the floor, press back up. Log the ASSIST weight: lower is stronger.',cues:['Kneel or stand on the pad — the machine takes weight off you. Lean forward a little, lower until your upper arms are level with the floor, press back up. Log the ASSIST weight: lower is stronger.'],bad:[]},
  seated_cable_row:{n:'Seated Cable Row',pat:'Pull',img:null,kit:['cable'],why:'Chest up, pull the handle to your belly and squeeze your shoulder blades together. Do not lean back to move the weight.',cues:['Chest up, pull the handle to your belly and squeeze your shoulder blades together. Do not lean back to move the weight.'],bad:[]},
  lateral_raise:{n:'Lateral Raise',pat:'Push',img:null,kit:['db'],why:'Light dumbbells. Raise them out to the sides up to shoulder height, elbows soft. Lower slowly. This one is never heavy.',cues:['Light dumbbells. Raise them out to the sides up to shoulder height, elbows soft. Lower slowly. This one is never heavy.'],bad:[]},
  triceps_pushdown:{n:'Triceps Pushdown',pat:'Push',img:null,kit:['cable'],why:'Elbows glued to your sides. Push the bar or rope down until your arms are straight, then let it come back up slowly.',cues:['Elbows glued to your sides. Push the bar or rope down until your arms are straight, then let it come back up slowly.'],bad:[]},
  reverse_fly:{n:'Reverse Fly (chest-supported)',pat:'Pull',img:null,kit:['db','bench'],why:'Chest flat on an incline bench, a light dumbbell in each hand hanging down. Arms almost straight, raise them out to the sides like opening your arms wide. Squeeze the back of your shoulders at the top, lower slowly. Light weight — this is never a heavy movement.',cues:['Chest flat on an incline bench, a light dumbbell in each hand hanging down. Arms almost straight, raise them out to the sides like opening your arms wide. Squeeze the back of your shoulders at the top, lower slowly. Light weight — this is never a heavy movement.'],bad:[]},
  barbell_curl:{n:'Barbell Curl',pat:'Pull',img:null,kit:['bb'],why:'Elbows pinned to your sides. Curl up, lower all the way down under control. If your back is swinging, the bar is too heavy.',cues:['Elbows pinned to your sides. Curl up, lower all the way down under control. If your back is swinging, the bar is too heavy.'],bad:[]},
  chest_press_machine:{n:'Chest Press Machine',pat:'Push',img:null,kit:['machine'],why:'Set the seat so the handles sit level with the middle of your chest. Press out, control the way back. Do not lock out hard.',cues:['Set the seat so the handles sit level with the middle of your chest. Press out, control the way back. Do not lock out hard.'],bad:[]},
  chest_supported_row:{n:'Chest-Supported Row',pat:'Pull',img:null,kit:['machine'],why:'Chest stays flat on the pad the whole set. Row to your ribs, pause a beat, lower slowly. The pad does the cheating for you.',cues:['Chest stays flat on the pad the whole set. Row to your ribs, pause a beat, lower slowly. The pad does the cheating for you.'],bad:[]},
  shoulder_press_machine:{n:'Shoulder Press Machine',pat:'Push',img:null,kit:['machine'],why:'Press straight overhead, ribs down so you do not arch your back. Lower until your hands are about ear height.',cues:['Press straight overhead, ribs down so you do not arch your back. Lower until your hands are about ear height.'],bad:[]},
  db_pullover:{n:'DB Pullover (on bench)',pat:'Pull',img:null,kit:['db','bench'],why:'Lie back on the bench holding one dumbbell over your chest, elbows slightly bent and fixed. Lower the dumbbell back to about head level only — feel the stretch across your lats and ribs, not deep in the shoulder. Pull it back over your chest. Start light, 20-25 lb.',cues:['Lie back on the bench holding one dumbbell over your chest, elbows slightly bent and fixed. Lower the dumbbell back to about head level only — feel the stretch across your lats and ribs, not deep in the shoulder. Pull it back over your chest. Start light, 20-25 lb.'],bad:[]},
  back_extension_45:{n:'45-Degree Back Extension',pat:'Hinge',img:'images/exercises/back_extension_45.png',kit:['machine'],why:'Pad just below your hip bones. Bend at the hips and come back up until your body is one straight line — do not arch past that.',cues:['Pad just below your hip bones. Bend at the hips and come back up until your body is one straight line — do not arch past that.'],bad:[]},
  dip_support_hold:{n:'Dip Support Hold',pat:'Push',img:'images/exercises/dip_support_hold.png',kit:['dipbars'],why:'Top of the dip position — arms locked, shoulders depressed and packed, body upright. Hold full bodyweight without bending arms. The entry test for dip work. Build 30-60s before attempting reps.',cues:['Top of the dip position — arms locked, shoulders depressed and packed, body upright. Hold full bodyweight without bending arms. The entry test for dip work. Build 30-60s before attempting reps.'],bad:[]},
  banded_sidewalk:{n:'Banded Lateral Walks',pat:'Glutes',img:'images/exercises/banded_sidewalk.png',kit:['band'],why:'Band at knees, stay low, continuous side-steps.',cues:['Band at knees, stay low, continuous side-steps.'],bad:[]},
  superman:{n:'Superman',pat:'Core',img:null,kit:[],why:'Prone on floor. Simultaneously raise arms, chest, and legs off the ground. Hold 2 sec. Lower with control. Great lower back and posterior chain activation.',cues:['Prone on floor. Simultaneously raise arms, chest, and legs off the ground. Hold 2 sec. Lower with control. Great lower back and posterior chain activation.'],bad:[]},
  db_rdl:{n:'Dumbbell Romanian Deadlift',pat:'Hinge',img:null,kit:['db'],why:'Push your hips back and slide the dumbbells down the front of your legs. Knees stay almost straight. Stop when you feel the stretch behind your thighs, then stand tall.',cues:['Push your hips back and slide the dumbbells down the front of your legs. Knees stay almost straight. Stop when you feel the stretch behind your thighs, then stand tall.'],bad:[]},
  db_shoulder_press:{n:'DB Shoulder Press',pat:'Push',img:null,kit:['db','bench'],why:'Sit tall, a dumbbell in each hand at shoulder height. Press straight overhead, ribs down so you do not arch your back. Lower back to ear height under control.',cues:['Sit tall, a dumbbell in each hand at shoulder height. Press straight overhead, ribs down so you do not arch your back. Lower back to ear height under control.'],bad:[]},
  pushup_on_dumbbells:{n:'Push-Ups on Dumbbells',pat:'Push',img:null,kit:['db'],why:'Hands gripping two dumbbells set on the floor so your wrists stay straight. Body in one line, chest down between them, press back up.',cues:['Hands gripping two dumbbells set on the floor so your wrists stay straight. Body in one line, chest down between them, press back up.'],bad:[]},
  bird_dog:{n:'Bird Dog',pat:'Core',img:'images/exercises/bird_dog.png',kit:[],why:'On all fours. Extend the right arm forward and the left leg straight back at the same time. Hold 2 sec without letting the hips rotate, then switch sides. Anti-rotation control.',cues:['On all fours. Extend the right arm forward and the left leg straight back at the same time. Hold 2 sec without letting the hips rotate, then switch sides. Anti-rotation control.'],bad:[]},
  lying_leg_raise:{n:'Lying Leg Raise',pat:'Core',img:null,kit:[],why:'Lie flat, legs straight. Raise the legs to vertical keeping them straight, then lower slowly without letting the heels touch. Hands under the glutes to protect the low back.',cues:['Lie flat, legs straight. Raise the legs to vertical keeping them straight, then lower slowly without letting the heels touch. Hands under the glutes to protect the low back.'],bad:[]},
  thoracic_rotation:{n:'Thoracic Rotations',pat:'Mobility',img:null,kit:[],why:'Quadruped, reach hand to ceiling.',cues:['Quadruped, reach hand to ceiling.'],bad:[]},
  wrist_prep:{n:'Wrist Prep Rocks',pat:'Mobility',img:null,kit:[],why:'Rock over wrists, all directions.',cues:['Rock over wrists, all directions.'],bad:[]},
  shoulder_tap:{n:'Plank Shoulder Taps',pat:'Core',img:null,kit:[],why:'High plank. Tap opposite shoulder — fight the rotation. Wider foot stance for more stability.',cues:['High plank. Tap opposite shoulder — fight the rotation. Wider foot stance for more stability.'],bad:[]},
  bench_press:{n:'Bench Press',pat:'Push',img:'images/exercises/bench_press.png',kit:['bb','bench','rack'],why:'Shoulder blades pinned to the bench, feet down. Bar to the sternum, elbows about 45 degrees, press to lockout.',cues:['Shoulder blades pinned to the bench, feet down. Bar to the sternum, elbows about 45 degrees, press to lockout.'],bad:[]},
  dip:{n:'Dip',pat:'Push',img:'images/exercises/dip.png',kit:['parallettes'],why:'Slight lean for chest, upright for triceps. Full depth. No shoulder shrug.',cues:['Slight lean for chest, upright for triceps. Full depth. No shoulder shrug.'],bad:[]},
  prone_ytw:{n:'Prone Y-T-W Raise',pat:'Pull',img:null,kit:['bench','db'],why:'Face down on an incline bench, arms hanging, thumbs up. Raise the arms into a Y overhead, lower. Then straight out to a T, lower. Then bent into a W, lower. That is one rep. No weight or very light — this is for the small muscles that hold your shoulders back.',cues:['Face down on an incline bench, arms hanging, thumbs up. Raise the arms into a Y overhead, lower. Then straight out to a T, lower. Then bent into a W, lower. That is one rep. No weight or very light — this is for the small muscles that hold your shoulders back.'],bad:[]},
  leg_swings:{n:'Leg Swings',pat:'Mobility',img:null,kit:[],why:'Front-back then lateral, controlled.',cues:['Front-back then lateral, controlled.'],bad:[]},
  ankle_mobility:{n:'Ankle Mobility',pat:'Mobility',img:null,kit:[],why:'Knee over toe, heel down.',cues:['Knee over toe, heel down.'],bad:[]},
  touchdown_squat:{n:'Touchdown Squat',pat:'Legs',img:null,kit:[],why:'Knees-over-toes, controlled reach.',cues:['Knees-over-toes, controlled reach.'],bad:[]},
  tibialis_raise:{n:'Tibialis Raise',pat:'Shin',img:null,kit:[],why:'Toes up against wall, full ROM.',cues:['Toes up against wall, full ROM.'],bad:[]},
  kot_calf:{n:'KOT Calf Raise',pat:'Calf',img:null,kit:[],why:'Knees-over-toes calf, deep stretch.',cues:['Knees-over-toes calf, deep stretch.'],bad:[]},
  back_squat:{n:'Back Squat',pat:'Legs',img:'images/exercises/back_squat.png',kit:['bb','rack'],why:'Bar on the back, brace, sit between the hips. Hip crease below the knee, knees tracking over the toes.',cues:['Bar on the back, brace, sit between the hips. Hip crease below the knee, knees tracking over the toes.'],bad:[]},
  overhead_press:{n:'Overhead Press',pat:'Press',img:'images/exercises/overhead_press.png',kit:['bb'],why:'Standing and strict. Ribs down, squeeze the glutes, press until the arms are by the ears. No leg drive.',cues:['Standing and strict. Ribs down, squeeze the glutes, press until the arms are by the ears. No leg drive.'],bad:[]},
  ring_pushup:{n:'Weighted Deep Ring Push-Up',pat:'Push',img:null,kit:['rings','vest'],why:'Deep ROM, turn rings out at top. (Phase-2 push anchor)',cues:['Deep ROM, turn rings out at top. (Phase-2 push anchor)'],bad:[]},
  hanging_leg_raise:{n:'Hanging Leg Raise',pat:'Core',img:null,kit:['bar'],why:'No swing. Posterior pelvic tilt at top. Control the descent. Legs straight.',cues:['No swing. Posterior pelvic tilt at top. Control the descent. Legs straight.'],bad:[]},
  copenhagen_plank:{n:'Copenhagen Plank',pat:'Core',img:null,kit:['bench'],why:'Top leg on bench, bottom leg floating. Straight body. Insane adductor + core.',cues:['Top leg on bench, bottom leg floating. Straight body. Insane adductor + core.'],bad:[]},
  worlds_greatest_stretch:{n:'World\'s Greatest Stretch',pat:'Mobility',img:null,kit:[],why:'Step one foot forward into a gentle lunge, both hands on the floor inside the front foot. Reach the inside arm up to the ceiling and turn your chest to follow it. Bring it back down, step back, switch sides. Opens hips, chest and back in one move.',cues:['Step one foot forward into a gentle lunge, both hands on the floor inside the front foot. Reach the inside arm up to the ceiling and turn your chest to follow it. Bring it back down, step back, switch sides. Opens hips, chest and back in one move.'],bad:[]},
  single_leg_bridge:{n:'Single-Leg Bridge',pat:'Glutes',img:null,kit:[],why:'Hips level, full extension.',cues:['Hips level, full extension.'],bad:[]},
  deadlift:{n:'Deadlift',pat:'Hinge',img:'images/exercises/deadlift.png',kit:['bb'],why:'Brace, push floor away, neutral spine.',cues:['Brace, push floor away, neutral spine.'],bad:[]},
  burpee:{n:'Burpee',pat:'Full',img:null,kit:[],why:'Squat-jump back-push-up-jump forward-jump + clap overhead. Rhythm is everything.',cues:['Squat-jump back-push-up-jump forward-jump + clap overhead. Rhythm is everything.'],bad:[]},
  slant_pulse:{n:'Slant Squat Pulses',pat:'Legs',img:null,kit:['slantboard'],why:'Heels elevated, small quad pulses.',cues:['Heels elevated, small quad pulses.'],bad:[]},
  slant_board_squat:{n:'Slant-Board Squat',pat:'Legs',img:null,kit:['slantboard','vest'],why:'Tempo 311, full depth, heels raised.',cues:['Tempo 311, full depth, heels raised.'],bad:[]},

/* ---- LAYING A PROGRAM ONTO A WEEK ---------------------------------
   Sessions are placed onto training days in order. Two cases the first
   version got wrong, both of which lose a person's actual program:

   · MORE DAYS THAN SESSIONS — a three-session program on five training
     days. Cycling is right: the sessions repeat.
   · MORE SESSIONS THAN DAYS — a five-session program on three training
     days. Cycling is NOT right, because it would show sessions 1,2,3
     forever and 4 and 5 never. The program has to ROTATE: where this
     week stopped is where next week starts, so every session comes
     round. Rotation is a function of the week number, not of state, so
     it survives a reload and cannot drift.

   The offset counts whole weeks since the program arrived. A program
   with no arrival date starts this week, offset zero. */
function programOffset(ids, days){
  if(ids.length <= days.length) return 0;
  const at = (LOADED && LOADED.at) ? Date.parse(LOADED.at) : NaN;
  if(!at) return 0;
  /* self-contained on purpose: this runs while the app is still being set
     up, above NOW, DOW and weekStart(). Reaching forward to them would
     throw into a catch and take the whole program with it. */
  const mon = new Date(); mon.setHours(0,0,0,0);
  mon.setDate(mon.getDate() - ((mon.getDay() + 6) % 7));
  const wk = Math.floor((mon.getTime() - at) / 604800000);
  return ((wk * days.length) % ids.length + ids.length) % ids.length;
}
function layWeek(){
  const week = [null,null,null,null,null,null,null];
  const ids  = Object.keys(SESSIONS);
  if(!ids.length) return week;
  const days = (A.trainDays && A.trainDays.length ? A.trainDays : [0,1,3,5])
    .slice().sort((x,y)=>x-y).filter(d => d>=0 && d<7);
  const off = programOffset(ids, days);
  days.forEach((d,i)=>{ week[d] = ids[(off + i) % ids.length]; });
  return week;
}

  {id:'reach',   t:'Reach overhead, gently',    s:'Both arms, ten times. Stop where the arm says stop'},
  {id:'note',    t:"How's the week going?",       s:'One sentence to Coach Nico', act:'logsheet:note', cta:'Write it'}
];

/* Deterministic, so it does not reshuffle every time the page redraws, and
   so two people on the same day are not doing the same thing forever. */
function todayTodo(){
  const wi = weighIn();
  if(wi.today) return TODOS[0];
  const seed = Math.floor(NOW.getTime() / 86400000);
  return TODOS[1 + (seed % (TODOS.length - 1))];
}

/* What a thing pays, read from the table rather than typed into the copy.
   Every "+7%" on the screen goes through here, so the label and the score
   can never drift apart again — which is exactly how a note came to advertise
   +15% while the table paid 5. */
const payFor = id => ((todayId ? SCORE_TRAIN : SCORE_REST)
  .find(x => x.id === id) || {pts:0}).pts;

/* THE HUNDRED MUST ADD UP.
   Both tables are summed at boot. If an edit ever makes a day worth 97 or
   104 the console says so by name instead of the number quietly being wrong
   for weeks. A percentage that cannot reach a hundred is a broken promise. */
(function checkHundred(){
  [['training',SCORE_TRAIN],['rest',SCORE_REST]].forEach(([name,tbl])=>{
    const sum = tbl.reduce((t,x)=>t+x.pts,0);
    if(sum !== 100) console.error(`SCORING: a ${name} day totals ${sum}, not 100`, tbl);
  });
})();

function dayLabel(ms){
  const t = dayKey(), y = (()=>{const d=new Date(nowMs()); d.setDate(d.getDate()-1); return dayKey(d);})();
  const k = dayKey(new Date(ms));
  if(k===t) return 'Today';
  if(k===y) return 'Yesterday';
  return new Date(ms).toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
}
const dayKey = d => { const x = d||new Date(nowMs()); x.setHours(0,0,0,0);
  return new Date(x.getTime() - x.getTimezoneOffset()*6e4).toISOString().slice(0,10); };
const startOfToday = () => { const d = new Date(nowMs()); d.setHours(0,0,0,0); return d.getTime(); };
const todayItems = arr => (arr||[]).filter(x => (x.at||0) >= startOfToday());

function dayScore(){
  const isTraining = !!todayId;
  const parts = (isTraining ? SCORE_TRAIN : SCORE_REST).map(x=>({...x}));
  /* On a day their own sport lands, it takes the session's place in the
     scoring — the hundred still has to add up to a hundred, so the points
     move rather than being invented. */
  if(!isTraining && sportToday() && mySports().length){
    const habits = parts.find(p=>p.id==='habits');
    const todo   = parts.find(p=>p.id==='todo');
    habits.pts = 25; todo.pts = 10;
    parts.unshift({id:'sport', label:sportName(), pts:35});
  }
  const HABITS = HABITS_FOR();
  const habDone = HABITS.filter(h=>S.habits[h.id]).length;
  /* Notes carried a `t` day-index that nothing writes any more — every note
     is saved with a real `at` timestamp now. The test was therefore never
     true, and writing one paid nothing. Anything logged since midnight
     counts. */
  const notesToday = todayItems(S.notes).filter(n => n.k==='note' || n.k==='coach' || n.k==='reply');
  const freeToday  = todayItems(S.freestyle);
  const got = {
    open:    1,
    ready:   S.readiness ? 1 : 0,
    habits:  HABITS.length ? habDone / HABITS.length : 0,
    /* Notes only. Logging a sport or a recovery drill was quietly ticking
       "Wrote a note" as well, which paid twice for one action and put a
       label on the receipt that had not happened. */
    note:    notesToday.length ? 1 : 0,
    session: todayDone() ? 1 : 0,
    todo:    (S.todos||{})[todayTodo().id] ? 1 : 0,
    sport:   sportDone() ? 1 : 0
  };
  const earned = parts.reduce((t,p)=>t + p.pts*(got[p.id]||0), 0);

  /* Anything beyond what the day asked for is a bonus ON TOP of the
     hundred. A second session, extra notes — the day can be worth more than
     a hundred percent, because he did more than a hundred percent. */
  const extraSessions = Math.max(0, freeToday.length - (todayDone() ? 0 : 1));
  const extraNotes    = Math.max(0, notesToday.length - 1);
  const bonus = extraSessions*15 + extraNotes*3;

  const pct = Math.round(earned) + bonus;
  return {pct, fill: Math.min(100, Math.round(earned)), bonus, parts, got, isTraining};
}

   that has not been released is not hidden and it is not broken —
   it says a person is still working on it, which is true and is
   the entire premise of "built by AI and a human".

const KEY = k('dash');

let S = load();
/* The seed cannot know the clock — T0 is defined after it — so `at:0` is a
   placeholder meaning "when he onboarded", filled in here. Left as a literal
   zero it rendered as 31 Dec 1969. */
function datePlaceholders(){
  const start = T0 - 13*36e5;                 /* this morning, 08:40 */
  (S.notes||[]).forEach(n=>{ if(!n.at) n.at = start; });
  S.weightAt = (S.weightAt||[]).map(v => v || start);
  while(S.weightAt.length < (S.weights||[]).length) S.weightAt.push(start);
}
function load(){ try{ const r=localStorage.getItem(KEY); return r?Object.assign({},seed,JSON.parse(r)):structuredClone(seed);}catch(e){return structuredClone(seed);} }
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} }

/* THE DAY, KEPT.
   A percentage that only exists until midnight is a scoreboard, not a
   record. Every save stamps today's number against today's date, so the
   week has a shape, the month has a shape, and the check-in has something
   true to open with. Cheap: one integer per day. */
function recordDay(){
  try{
    const sc = dayScore();
    S.days = S.days || {};
    const k = dayKey();
    if(S.days[k] !== sc.pct){ S.days[k] = sc.pct; save(); }
  }catch(e){}
}
/* the last n days, oldest first, with nulls for days never opened */
function dayHistory(n){
  const out = [];
  for(let i=n-1;i>=0;i--){
    const d = new Date(nowMs()); d.setDate(d.getDate()-i);
    const k = dayKey(d);
    out.push({k, dow:d.getDay(), pct:(S.days||{})[k] ?? null});
  }
  return out;
}

/* ============================================================
   3b · THEME — read from the spine, applied once, to the root

   The whole switchable-neon feature is this function plus a data file.
   No component knows a colour: they all read var(--neon*), so changing
   the palette can never require touching a screen. That is the entire
   point of doing it before the visual pass rather than after.

   Falls back to the tokens already in the stylesheet if the spine is
   not reachable (opened from a file:// path, or published standalone),
   so the app is never colourless.
   ============================================================ */
const THEME_FALLBACK = {
  palettes:[
    {id:'jade',    name:'Jade',    hint:'The dumbbell green. Where this started.', hex:'#3ECBA8'},
    {id:'miami',   name:'Miami',   hint:'Hot pink. The synthwave one.',            hex:'#FF5FA2'},
    {id:'voltage', name:'Voltage', hint:'Neon yellow. Loudest at night.',          hex:'#FFE24A'},
    {id:'electric',name:'Electric',hint:'Cyan. Coldest of the six.',               hex:'#4FD8FF'},
    {id:'violet',  name:'Violet',  hint:'Purple. Calmest at night.',               hex:'#B57BFF'},
    {id:'acid',    name:'Acid',    hint:'Lime. Turn it up.',                       hex:'#B6FF3D'}
  ],
  slots:[
    {id:'accent',name:'Buttons & rings',hint:'What you tap and what fills up',   default:'jade'},
    {id:'neon',  name:'Glow & edges',   hint:'Rails, rules, the heartbeat',      default:'miami'},
    {id:'coach', name:'Coach Nico',     hint:'Only ever a message from a human', default:'voltage'}
  ]
};
let THEME = THEME_FALLBACK;

function rgba(hex,a){
  const h=hex.replace('#','');
  const n=parseInt(h.length===3?h.split('').map(c=>c+c).join(''):h,16);
  return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;
}
const pal = id => THEME.palettes.find(x=>x.id===id) || THEME.palettes[0];

/* One week, one shuffle. Seeded by the week number so it is stable all week
   instead of re-rolling on every render — a colour scheme that changes while
   you are looking at it is a bug, not a feature. */
function weeklyPick(){
  const wk = Math.floor((NOW - new Date(2026,0,1)) / 6048e5);
  const pool = THEME.palettes.map(p=>p.id);
  const out=[]; let n=wk;
  for(let i=0;i<3;i++){ n=(n*9301+49297)%233280; const j=n%pool.length; out.push(pool.splice(j,1)[0]); }
  return {accent:out[0], neon:out[1], coach:out[2]};
}

function slotChoice(){
  if(S.themeRandom) return weeklyPick();
  const d = Object.fromEntries(THEME.slots.map(s=>[s.id,s.default]));
  return Object.assign(d, S.slots||{});
}

/* ONE DIAL FOR THE WHOLE APP'S BRIGHTNESS.
   Everything that glows is written against --glow-k, so "soft" is not a
   different stylesheet, it is the same one turned down. Kept to a
   multiplier rather than three hand-tuned themes because three themes drift
   apart the moment anyone adds a component. */
const GLOW_K = {soft:.45, normal:1, bold:1.5};
function applyGlow(){
  document.documentElement.style.setProperty('--glow-k', GLOW_K[S.glow] ?? 1);
}

function applyTheme(){
  const c = slotChoice(), r = document.documentElement.style;
  const a = pal(c.accent).hex, n = pal(c.neon).hex, k = pal(c.coach).hex;
  r.setProperty('--accent', a);
  r.setProperty('--accent-soft', rgba(a,.13));
  r.setProperty('--accent-dim',  rgba(a,.30));
  r.setProperty('--accent-line', rgba(a,.34));
  r.setProperty('--neon', n);
  r.setProperty('--neon-soft', rgba(n,.13));
  r.setProperty('--neon-line', rgba(n,.32));
  r.setProperty('--neon-glow', `0 0 22px ${rgba(n,.26)}`);
  r.setProperty('--coach', k);
  r.setProperty('--coach-soft', rgba(k,.13));
  r.setProperty('--coach-line', rgba(k,.34));
  return c;
}
async function loadTheme(){
  try{
    const res=await fetch('spine/theme.json',{cache:'no-cache'});
    if(res.ok){ const t=await res.json(); if(t.palettes&&t.slots) THEME=t; }
  }catch(e){ /* standalone build - the fallback above is already correct */ }
  applyTheme();
}

/* THE REAL DAY.
   This was pinned to Monday 10 Aug so the demo always opened on session one.
   The cost was that the week strip said Monday while the person holding the
   phone was standing in a Friday, which makes the one thing on this screen
   that has to be trusted — the agenda — the one thing that is visibly wrong.
   So it is the actual date now, and the program is read off it. */
const NOW = new Date();
const DOW = NOW.getDay();
const DAYNM = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
/* THE WEEK STARTS ON MONDAY.
   Date.getDay() returns Sunday as 0 and that stays the internal index —
   every date calculation in the file depends on it. What changes is the
   ORDER things are drawn in. The survey shows a Monday-first week, so a
   strip that opened on Sunday put the training days one column left of
   where the person had just placed them; the data was right and the row
   was lying about it.

   Anything that draws seven days iterates this. Nothing calculates with it. */
const WEEK_ORDER = [1,2,3,4,5,6,0];
function greet(){ const h=NOW.getHours(); return h<5?'Still up':h<12?'Morning':h<17?'Afternoon':h<21?'Evening':'Late one'; }
function dstr(){ return NOW.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'}); }
/* THE CLOCK
   Every entry carried d:0, so the feed had nothing to sort by and new
   items landed wherever the array happened to put them — a session logged
   last showed up above the coach reply that came before it.

   The clock is real now, but the indirection stays: everything that writes
   a timestamp goes through nowMs(), so pinning the clock again for a demo
   is a one-line change rather than a hunt. */
const T0 = NOW.getTime(), BOOT = Date.now();   /* now the same instant, kept for ordering */
const nowMs = () => T0 + (Date.now() - BOOT);
const hhmm = ms => new Date(ms).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
function stamp(ms){
  const d = new Date(ms), t = new Date(nowMs());
  const sameDay = d.toDateString() === t.toDateString();
  if (sameDay) return hhmm(ms);
  const days = Math.round((t - d) / 864e5);
  if (days === 1) return 'Yesterday';
  if (days < 7)   return DAYNM[d.getDay()] + ' ' + hhmm(ms);
  return d.toLocaleDateString('en-GB',{day:'numeric',month:'short'});
}

/* Sunday, because that is where his four training days start. Days before it
   in the strip are not "missed" — the program had not begun. */
const PROGRAM_START_DOW = Math.min(...WEEKPLAN.map((x,i)=>x?i:9));

/* ---- REST DAYS HAVE A JOB ---------------------------------------------
   "Nothing today" is neither true nor useful. A rest day is when the joints
   get their work and the nervous system gets its break, and someone who
   opens the app on one should be handed something that takes five minutes
   and is obviously not training.

   Three lengths, because the reason people skip these is never the drill,
   it is the clock. Everything uses a mat and a wall at most, so it holds
   for anyone whatever their kit, and nothing loads a joint.              */
/* ---- THE SPORT THEY ALREADY DO ----------------------------------------
   The survey asks what else is in the week — running, five-a-side, yoga —
   and which days it lands on, and then the app forgot about it entirely.
   Someone who plays football on Thursday was shown a rest day and offered
   mobility, which tells them the app is not paying attention.

   It counts. Same as training, because it IS training.                  */
const SPORTS = {run:'Running or cycling', team:'Your team sport', yoga:'Yoga or pilates',
  hiit:'HIIT or a class', swim:'Swimming', racket:'Racket sport',
  martial:'Martial arts or boxing', climb:'Climbing', other:'Your other sport'};
const mySports = () => (A.otherAct||[]).filter(x=>x && x!=='none');
/* Already Sunday-based: normaliseDays converts actDays alongside trainDays
   at boot. This used to convert again, gated on the same flag that the

const sportDays = () => A.actDays || [];
const sportToday = () => sportDays().includes(DOW);

   items:[['cat_cow','8 slow'],['hip_90_90','6 each way'],['deep_squat_rock','8 rocks']]},
  {id:'r10', mins:10, name:'Hips and spine',

/* ---- FREESTYLE ---------------------------------------------------------
   The program owns four days. It does not own the other three, and a person
   who did a hundred push-ups on a Tuesday has trained — the agenda saying
   otherwise is the app calling him a liar. So anything logged freehand
   counts on the strip, in the week total, and in the minutes.

   It is kept distinct from a program day rather than merged: the coach needs
   to know the difference between "did what I wrote" and "did his own thing",

const todayDone = () => !!S.done[DAYNM[DOW]];

/* The punch word is picked from what is actually true right now — a
   session waiting, one already done, a rest day, a streak, the hour.
   A line that never changes stops being read by the third day. */
function punch(){
  const done = Object.keys(S.done).length;
  const h = NOW.getHours();
  if (todayId && todayDone())          return "That's done";
  if (todayId && !released(todayId)) return 'Almost ready';
  if (todayId && h >= 21)            return 'One more thing';
  if (todayId)                       return 'Today you train';
  if (done >= 3)                     return 'Three in the bank';
  if (!todayId)                      return 'Rest is training';
  return 'Day one';
}

/* THE HEARTBEAT
   The line runs into the dumbbell, and the dumbbell IS the heart — it takes
   the pulse and jumps. Two CSS animations of identical duration and no delay,
   so they stay locked together without a single line of JavaScript to drift.

   pathLength="100" normalises the trace, so the leading edge of the dash
   reaches the right-hand end at a known fraction of the cycle (82%) whatever
   the drawn size is. That is the number the pump keyframe fires on. Change
   the dash and you must change that number too — they are one mechanism.

   Both are stroke-dashoffset and transform only: composited, no repaint. */
function ecg(){
  const done = Object.keys(S.done).length;
  /* Resting pace, not panic. 3.8s at zero sessions down to ~2.6s on a
     full week — a heartbeat you notice once and then stop noticing. */
  const ms = 3800 - done * 300;
  const pts = '0,17 20,17 26,17 30,5 36,29 42,12 47,17 66,17 72,17 76,11 80,17 100,17';
  return `<svg class="ecg" viewBox="0 0 100 34" aria-hidden="true" style="--beat:${ms}ms">
    <polyline class="ecg-bg" points="${pts}" pathLength="100"/>
    <polyline class="ecg-l"  points="${pts}" pathLength="100"/>
  </svg>`;
}

/* ---- THE MARK, once ---------------------------------------------------
   The header lockup and the calendar's "today" cell are the same drawing at
   two sizes, so the numbers live here and both read them. That is what makes
   the proportions match: not care, but a shared constant.
   ------------------------------------------------------------------- */
/* Both ends of the break sit at y=16. They were stepped for a version and
   it read as a mistake rather than a choice. */
const TRI_D = 'M100 16 H286 L150 252 L14 16 H60';
/* onboarding's mark verbatim — same bar, same three plates, same widths */
const DB_PATHS =
  '<path d="M86 65 H174" stroke-width="7" opacity=".55"/>' +
  '<path d="M86 38 V92" stroke-width="12.65"/><path d="M174 38 V92" stroke-width="12.65"/>' +
  '<path d="M66.8 40.7 V89.3" stroke-width="9.9"/><path d="M193.2 40.7 V89.3" stroke-width="9.9"/>' +
  '<path d="M52.4 47.5 V82.5" stroke-width="7.13"/><path d="M207.6 47.5 V82.5" stroke-width="7.13"/>';
/* where the dumbbell sits inside the triangle, in the triangle's own units */
const DB_PLACE = 'translate(41.5,41) scale(0.84)';

/* The whole mark at any size. `db` decides whether the bell is inside it —
   which is exactly the calendar's rule: the triangle marks today, the
   dumbbell marks a training day, and a training day that is today is the
   logo. */
const markSvg = (cls, db, vb) =>
  `<svg class="${cls}" viewBox="${vb||'0 0 300 268'}" aria-hidden="true">
    <path class="mk-tri" d="${TRI_D}"/>
    <path class="mk-glare" d="${TRI_D}"/>
    ${db?`<g transform="${DB_PLACE}"><g class="mk-db">${DB_PATHS}</g></g>`:''}
  </svg>`;

function header(){
  return `<div id="head">
    <div class="who">
      <div class="punch">${punch()}</div>
      <h1 class="name">${esc(A.name)}</h1>
      <div class="dt">${dstr()} &middot; week 1</div>
    </div>
    <div class="hmark" style="--beat:${3800 - Object.keys(S.done).length*300}ms">
      <svg class="lockup" viewBox="0 0 300 268" aria-hidden="true">
        <!-- The open triangle from the opening screen. The 40-unit break in the
             top-left is the dark segment of a real neon tube, and the two ends
             sit at different heights on purpose. Stroke is far heavier than
             onboarding's 2.4 because this is rendered at a fifth of the size. -->
        <path class="lk-tri" d="${TRI_D}"/>
        <path class="lk-glare" d="${TRI_D}"/>
        <path class="lk-spark" d="${TRI_D}"/>
        <!-- the dumbbell, inside the triangle rather than beside it -->
        <!-- Two groups, not one. The beat animates the transform property,
             and a CSS transform beats an SVG transform ATTRIBUTE outright:
             with one group the placement would be wiped the moment the pulse
             ran and the dumbbell would jump to the corner. The outer group
             owns the placement, the inner one owns the beat. -->
        <circle class="lk-glow" cx="150" cy="96" r="88" fill="url(#mkGlow)"/>
        <!-- Sized against the triangle's INTERIOR, not its bounding box. At
             this height the two edges are ~178 units apart, so a 131-unit
             dumbbell sits inside with air on both sides. Centre of the drawn
             mark is (130,65) in its own 260x130 box, hence the offsets. -->
        <g transform="${DB_PLACE}"><g class="lk-db">${DB_PATHS}</g></g>
      </svg>
    </div>
  </div>`;
}

/* ============================================================
   TAB · TODAY
   The one job of this screen: answer "what am I doing today?"
   before you have to think. Everything else is below the fold
   on purpose.
   ============================================================ */
/* ============================================================
   THE DAY GAUGE
   Four ways to make a percentage worth chasing.

     cell    squares in a row, filling one at a time.
     climb   the same idea run up the right-hand edge.
     ember   a bar burning toward 100 with sparks off the tip.
     stack   the three of them fused: squares climbing the right
             edge with a spark off the top one.

   In all four the meter is DISCRETE — ten squares, ten rungs —
   because "one more block" is a thing you can picture doing and
   "eleven percent" is not. The part-filled square carries the
   remainder so nothing is rounded away.
   ------------------------------------------------------------ */
/* Five gauges that are not all the same idea in different clothes. Cell,
   Climb, Ember and Stack were four ways of counting blocks; these change
   what the card IS.

     sunset  the synthwave sun, rising out of the slats as the day fills.
     grid    a perspective road that lights up toward the horizon.
     reels   the number on slot-machine reels that roll when it changes.
     board   an arcade scoreboard — seven-segment, ghost segments and all.
     climb   the incumbent, kept so there is something to judge against.

   The rule I held to: no palm trees, no chrome lettering, no gradient
   sunburst. Eighties by MECHANISM — a rising sun, a receding road, a
   mechanical reel, an LED panel — rather than by costume. Costume is what
   makes this stuff cheesy; the machinery is what makes it good. */
const DAY_STYLES = [['reactor','Reactor'],['sunset','Sunset'],['climb','Climb'],
                    ['grid','Grid'],['reels','Reels'],['board','Board']];
/* Reactor for the day, sunset for the profile. A day is a thing that fills
   and empties again tomorrow — a ring says that. A profile only ever goes
   up, and a sun coming over a horizon says THAT. They were the wrong way
   round. Both are switchable under Customize your vibe. */
const PROF_STYLES = [['sunset','Sunset'],['reactor','Reactor']];
const profStyle = () => S.profStyle || 'sunset';
/* Sunset won. The other four stay in the file — they are a switch away if
   this ever needs revisiting — but nothing offers them any more. */
const dayStyle = () => S.dayStyle || 'reactor';
const STEPS = 10;
/* the two where the number IS the gauge, so the default one is suppressed */
const NUM_IN_ART = st => st === 'reels' || st === 'reactor';

function blocks(pct){
  const exact = pct/100*STEPS;
  const full = Math.floor(exact + 1e-9);
  return {full, frac: Math.min(1, exact - full)};
}

/* ---- seven-segment geometry, in a 16x28 cell ---- */
const SEG_ON = ['abcdef','bc','abdeg','abcdg','bcfg','acdfg','acdefg','abc','abcdefg','abcdfg'];
/* A real seven-segment bar is about six times longer than it is thick. At
   two-to-one they stop reading as strokes of a numeral and start reading as
   a pile of hexagons, which is what the first pass did. */
const hbar = y => `2.5,${y} 4.3,${y-1.7} 11.7,${y-1.7} 13.5,${y} 11.7,${y+1.7} 4.3,${y+1.7}`;
const vbar = (x,y1,y2) => `${x},${y1} ${x+1.7},${y1+1.8} ${x+1.7},${y2-1.8} ${x},${y2} ${x-1.7},${y2-1.8} ${x-1.7},${y1+1.8}`;
const SEG_PTS = {a:hbar(2.5), g:hbar(14), d:hbar(25.5),
                 f:vbar(2.5,4.2,12.3), b:vbar(13.5,4.2,12.3),
                 e:vbar(2.5,15.7,23.8), c:vbar(13.5,15.7,23.8)};
/* The seven-segment numerals are not the Board gauge's private property any
   more — they are how this card writes a number, full stop. Every gauge but
   Reels (which IS a number) draws them; only the size changes. */
const segNum = pct =>
  `<span class="board">${String(pct).split('').map(d=>digit(+d)).join('')}<span class="bpc">%</span></span>`;

const digit = d => {
  const on = SEG_ON[d] || '';
  return `<svg class="sev" viewBox="0 0 16 28" aria-hidden="true">${
    Object.keys(SEG_PTS).map(k =>
      `<polygon class="sg ${on.includes(k)?'on':''}" points="${SEG_PTS[k]}"/>`).join('')}</svg>`;
};

function dayArt(st, pct){
  const {full, frac} = blocks(pct);

  /* ---- SUNSET ---------------------------------------------------------
     The sun sits BELOW the horizon at zero and climbs out of it. Slats get
     thicker toward the bottom, so the lower half of the disc is mostly gap
     and the top is nearly solid — which is what sells it as light rather
     than as a striped circle. */
  if(st === 'sunset') return sunSvg(pct);

  /* ---- REACTOR: the ring, moved over from the profile ---- */
  if(st === 'reactor') return `<span class="dayrx">${reactor(pct)}</span>`;

  /* ---- GRID -----------------------------------------------------------
     A road, drawn in one-point perspective. The rungs nearest you light
     first and the lit edge travels toward the horizon, so filling the day
     is distance covered. A scan runs the same way on a loop. */
  if(st === 'grid'){
    const N = 7;
    const ys = Array.from({length:N}, (_,i) => 60 * Math.pow(1 - i/N, 2.2));
    const lit = Math.round(pct/100 * N);
    const rows = ys.map((y,i) =>
      `<line class="gl ${i < lit ? 'on' : ''}" x1="0" y1="${y.toFixed(2)}" x2="120" y2="${y.toFixed(2)}"/>`).reverse().join('');
    const cols = Array.from({length:9}, (_,j) =>
      `<line class="gv" x1="60" y1="0" x2="${-120 + j*45}" y2="60"/>`).join('');
    /* The grid is the tank, and the day fills it. Two waves at different
       speeds and phases so the surface never repeats visibly, and the water
       sits OVER the card with a blur behind it — so the number and the words
       genuinely go under as the level rises, rather than being redrawn in a
       different colour. */
    const wv = (cls,d) => `<svg class="wv ${cls}" viewBox="0 0 240 14" preserveAspectRatio="none"
        aria-hidden="true" style="--d:${d}"><path d="M0 7 Q30 0 60 7 T120 7 T180 7 T240 7 V14 H0 Z"/></svg>`;
    return `<svg class="grid" viewBox="0 0 120 60" preserveAspectRatio="none" aria-hidden="true">
      ${cols}${rows}<line class="gscan" x1="0" y1="0" x2="120" y2="0"/>
    </svg>
    <span class="tank" style="--h:${pct}%">${wv('w1','9s')}${wv('w2','13s')}</span>`;
  }

  /* ---- REELS ----------------------------------------------------------
     One window per digit, a bright line across the middle, and cylinder
     shading top and bottom. They roll on every render where the number
     changed, which is the only time a reel should ever move. */
  if(st === 'reels'){
    const ds = String(pct).split('');
    return `<span class="reels ${DAY_ROLLED ? 'roll' : ''}">
      ${ds.map((d,i) => `<span class="rl" style="--d:${(i*0.07).toFixed(2)}s"><i>${d}</i></span>`).join('')}
      <span class="rl pc"><i>%</i></span>
    </span>`;
  }

  if(st === 'board') return '';

  /* ---- CLIMB ---------------------------------------------------------- */
  return `<span class="gcol">${Array.from({length:STEPS},(_,i)=>
    `<span class="rung ${STEPS-1-i<full?'on':''} ${STEPS-1-i===full?'next':''}"></span>`).join('')}</span>`;
}

/* ---- what the card SAYS ------------------------------------------
   "Today is open" said nothing. The title is now a verdict on the day
   in as few words as it can be made, and the line under it is the
   single biggest thing still on the table, led by the number. On a
   training day that is almost always the session, which is the point:
   the card should keep saying "train" until he has.               */
/* where each line of the receipt lives on the screen */
const GOTO = {session:'sec-session', sport:'sec-session', habits:'sec-habits', todo:'sec-todo',
              ready:'sec-ready', note:'sec-note'};
const PRIZE = {session:'the session', sport:'your sport', habits:'your habits', ready:'the check-in',
               note:'a note', open:'opening the app'};
function dayLine(sc){
  const left = sc.parts.filter(p=>p.pts>0 && (sc.got[p.id]||0) < 1).sort((x,y)=>y.pts-x.pts);
  const big = left[0];
  /* Training outranks everything, so on a training day the card keeps
     saying one thing until he has done it. Two words, no hedging. */
  const trainLeft = sc.isTraining && (sc.got.session||0) < 1;
  const title =
      sc.pct >= 100 ? 'Perfect day'
    : trainLeft     ? 'Go train'
    : sc.pct >= 85  ? 'One box left'
    : sc.pct >= 60  ? 'Strong day'
    : sc.pct >= 30  ? 'Building'
    : sc.pct >   0  ? 'Barely started'
    :                 'Zero on the board';
  const sub = big ? `+${big.pts}% &middot; ${PRIZE[big.id] || big.label.toLowerCase()}`
                  : 'Everything claimed';
  return {title, sub};
}

function dayHero(sc){
  const st = dayStyle();
  DAY_ROLLED = DAY_LAST !== null && DAY_LAST !== sc.pct;
  DAY_LAST = sc.pct;
  const open = !!(S.folds && S.folds.score);
  const {title, sub} = dayLine(sc);
  /* One line per thing: what it is on the left, what it pays on the right,
     a tick when it is banked. The pills wrapped into an uneven bag and you
     had to hunt for the number; a column you can read straight down. */
  const rows = sc.parts.filter(p=>p.pts>0).map(p=>{
    const g = sc.got[p.id]||0;
    const val = g>=1 ? '+'+p.pts+'%' : (g>0 ? Math.round(p.pts*g)+'/'+p.pts+'%' : '+'+p.pts+'%');
    /* Every row that names something you can go and do is a link to it.
       Reading "One thing +10%" and then having to hunt down the screen for
       the card is the app knowing where it is and not telling you. */
    const to = GOTO[p.id];
    return `<${to?'button':'div'} class="dr ${g>=1?'on':(g>0?'part':'')} ${to?'go2':''}"
        ${to?`data-goto="${to}"`:''}>
      <span class="dr-k">${g>=1?svg(I.check,'dck'):'<i class="dr-o"></i>'}${p.label}</span>
      <span class="dr-v">${val}${to?svg(I.arrow,'dr-c'):''}</span></${to?'button':'div'}>`;
  }).join('');

  return `<div class="dayx sty-${st} ${sc.pct>=100?'full':''} ${open?'open':''}"
      style="--pf:${(sc.fill/100).toFixed(3)};--p:${sc.fill}%">
    <span class="dayx-glow" aria-hidden="true"></span>
    ${st==='sunset' ? `<svg class="gnd" viewBox="0 0 120 22" preserveAspectRatio="none" aria-hidden="true">
      ${Array.from({length:13},(_,j)=>
        `<line x1="60" y1="0" x2="${(-150 + j*30)}" y2="22"/>`).join('')}
      ${[0.34,0.60,0.82,1].map(t=>
        `<line x1="0" y1="${(22*t*t).toFixed(2)}" x2="120" y2="${(22*t*t).toFixed(2)}"/>`).join('')}
    </svg>` : ''}
    <button class="dayx-hd" data-act="fold:score">
      ${NUM_IN_ART(st) ? '' : `<span class="dayx-n">${segNum(sc.pct)}</span>`}
      <span class="dayx-tx"><b>${title}</b><small>${sub}</small></span>
      <span class="dayx-art">${dayArt(st, sc.fill)}</span>
      <span class="dayx-chev">${svg(I.arrow)}</span>
    </button>
    ${open?`<div class="dayx-body">
      <div class="dh-rows">${rows}</div>
      ${sc.bonus?`<div class="dr bonus"><span class="dr-k">Extra work</span>
        <span class="dr-v">+${sc.bonus}%</span></div>`:''}
      <div class="micro just" style="margin-top:12px">${sc.isTraining
        ? 'Training pays more than everything else put together. That is on purpose.'
        : 'Rest day, so the session’s share moves onto your habits. Today can still be a hundred.'}</div>
    </div>`:''}
  </div>`;
}

function paneToday(){
  const s = todayId ? SESSIONS[todayId] : null;
  const scaled = s ? scaleSession(s) : null;
  const mins = scaled ? scaled.blocks.reduce((t,b)=>t+b.mins,0) : 0;
  const blocks = scaled ? scaled.blocks.length : 0;
  const doneCount = Object.keys(S.done).length + freeThisWeek();
  const HABITS = HABITS_FOR();
  const habDone = HABITS.filter(h=>S.habits[h.id]).length;

  let h = `<div class="pane">${header()}`;

  /* THE SAMPLE SAYS SO, EVERY TIME.
     The demo profile trains Sun/Mon/Wed/Fri and weighs 82kg. Once the intro
     was dismissed nothing on screen admitted that, so a person whose survey
     had not reached this device saw a week they never chose and concluded
     the app was wrong. It was — about who it was talking to. */
  if(IS_DEMO){
    h += `<div class="demobar">
      ${svg(I.alert,'ic')}
      <div><b>This is the sample, not you</b>
      <p class="just">Your answers have not reached this device, so the week, the weight and the
        kit below all belong to a made-up person. Open the <b>Open my dashboard</b> link at the
        end of the survey and it becomes yours.</p></div>
    </div>`;
  }

  /* --- clearance, because the PAR-Q said so. Not dismissible until acted on. --- */
  if(!S.dismissed.parq && (A.parq||[]).some(x=>x && x!=='none')){
    h += `<div class="alert">
      ${svg(I.alert,'ic')}
      <div><b>One thing before we load up</b>
      <p>Week one is safe either way, but get the tick from your GP before we add weight. Tap when it is done.</p>
      </div>
      <button class="x" data-act="parq">✕</button>
    </div>`;
  }

  /* --- the week --- */
  /* Three stacked lines of "label value" on the right made this card twice
     as tall as it needed to be. The count leads, the other three sit beside
     it as a single row of small stats, and the strip underneath lost a few
     millimetres too. Same information, about 40% of the height. */
  const planned = WEEKPLAN.filter(Boolean).length || 4;
  /* Minutes TRAINED, said so. A bare "0 min" next to a streak reads as
     minutes-on-the-app, which is the opposite of what this app is for. */
  const trainedMins = Object.keys(S.done).length * (parseInt(A.length,10)||20) + freeMins();

  h += `<div class="sect"><b>Your week</b><a data-act="tab:log">Your log</a></div>
  <div class="card slim">
    <div class="wkrow">
      <div class="wk-n"><b class="tnum">${doneCount}</b><i class="tnum">/${planned}</i></div>
      <div class="wk-st">
        <span><i class="tnum">${S.streak||1}</i>day streak</span>
        <span><i class="tnum">${trainedMins}</i>min trained</span>
      </div>
    </div>
    <div class="week">
      ${WEEK_ORDER.map(i=>{
        const d = DAYNM[i];
        /* the mark itself marks a training day — the app's own symbol doing
           a job rather than decorating one */
        const plan = WEEKPLAN[i], free = freeOn(i);
        const dn = !!S.done[d] || free, now = i===DOW;
        /* how far through a Monday-first week each day sits, so "past" is
           still past once Sunday is the last column rather than the first */
        const pos = (i + 6) % 7, posNow = (DOW + 6) % 7;
        const past = pos < posNow;
        /* You cannot miss a session that was never handed to you. A day only
           counts as missed if it was released and the day has passed —
           otherwise it stays a plain planned day, which is what it is. */
        const missed = plan && past && released(plan);
        const cls = (dn?'done':(missed?'miss':(plan?'plan':'')))
                  + (free && !S.done[d] ? ' free' : '')
                  + (now && (S.markStyle||'square')!=='stamp' ? ' box' : '');
        return `<div class="wd ${cls} ${now?'now':''}">
          <span class="l">${d[0]}</span>
          <span class="b">${
            dn  ? svg(I.check)
          /* viewBox starts at y=16, which is the triangle's top line — so the
             top of the SVG box IS that line and it can be laid flush on the
             top of the day square. Anything above it still paints, because
             the svg is overflow:visible. */
          : now ? ((S.markStyle||'square')==='stamp'
                    ? markSvg('wmark', !!plan, '0 16 300 252')
                    : (plan ? `<svg class="wdb" viewBox="0 0 260 130" aria-hidden="true">
                        <g class="mk-db">${DB_PATHS}</g></svg>` : ''))
          /* A lone bell gets its own frame. Inside the triangle's 300x268 box
             it would be drawn at the size it is IN the logo, which is a
             sixth of a cell — right for the lockup, invisible on its own. */
          : plan? `<svg class="wdb" viewBox="0 0 260 130" aria-hidden="true">
                     <g class="mk-db">${DB_PATHS}</g></svg>`
          : ''}</span>
        </div>`;
      }).join('')}
    </div>
  </div>`;

  /* --- THE DAY -------------------------------------------------------
     The single most important control on the screen. It is not a readout,
     it is the thing the day is trying to fill, so it moves on its own and
     it is the only place the arithmetic lives. Tap it for the receipt. */
  h += dayHero(dayScore());

  /* --- the hero --- */
  h += `<div class="sect" id="sec-session"><b>Today</b>${s&&released(todayId)?`<a data-act="swap">Not feeling it?</a>`:''}</div>`;
  if(s && !released(todayId)){
    /* Being told a human is mid-way through your program is a better
       experience than being shown a program nobody checked. */
    h += `<div class="hero pending trav" data-act="pending">
      ${travelSvg('accent')}
      <div class="veil"></div>
      <div class="in">
        <div class="tag"><i></i>In review</div>
        <h3>Coach Nico is still on this one</h3>
        <div class="why">Today's session is written and being checked before it reaches you. It
          unlocks the moment he is happy with it.</div>
        <div class="chips"><span class="chip">${svg(I.clock)}20 min when it lands</span></div>
        <button class="go ghost">Tell me when it's ready</button>
      </div>
    </div>`;
  } else if(s){
    h += `<div class="hero trav ${todayDone() ?'done':''}" data-act="openday" data-day="${todayId}">
      ${todayDone()?'':travelSvg('accent')}
      <div class="art" style="background-image:url('${heroArt(s)}')"></div>
      <div class="veil"></div>
      <div class="in">
        <div class="tag"><i></i>${todayDone() ?'Done - nice work':'Day 1 · Week 1'}</div>
        <h3>${s.name}</h3>
        <div class="why">${s.why}</div>
        <div class="chips">
          <span class="chip pay-c ${todayDone()?'earned':''}">${todayDone()?`&check; ${payFor('session')}% earned`:`+${payFor('session')}%`}</span>
          <span class="chip">${svg(I.clock)}${mins} min</span>
          <span class="chip">${svg(I.layers)}${blocks} blocks</span>
          <span class="chip">${svg(I.spark)}${s.tag}</span>
        </div>
        <button class="go ${todayDone() ?'ghost':''}">${todayDone() ?'Look at it again':'Open the session'}</button>
      </div>
    </div>`;
  } else {
    const nx = nextDay(), rDone = recoveryDone();
    if(sportToday() && mySports().length){
      const sDone = sportDone();
      h += `<div class="sportcard ${sDone?'done':''}">
        <div class="rest-hd">
          <div class="tag"><i></i>Your own sport</div>
          <h3>${sDone ? sportName() + ' \u2014 logged' : sportName() + ' today'}</h3>
          <p class="just">You told me this is already in your week, so it is not a rest day and
            the app is not going to pretend it is. Log it and it counts like a session.</p>
        </div>
        ${sDone ? '' : `<button class="go" data-act="dosport">Did it \u2014 log it</button>`}
      </div>`;
    }
    h += `<div class="restwrap ${rDone?'done':''}">
      <div class="rest-hd">
        <div class="tag"><i></i>Rest day</div>
        <h3>${rDone ? 'Recovery done' : 'Give it five minutes'}</h3>
        <p class="just">Next session is ${SESSIONS[nx.id].name}, ${nx.when}. Today is for the
          joints \u2014 pick a length and it counts on your week.</p>
      </div>
      ${RECOVERY.map(r=>`<button class="rec" data-recov="${r.id}">
        <span class="rec-m"><b class="tnum">${r.mins}</b><i>min</i></span>
        <span class="rec-tx"><b>${r.name}</b><small>${r.why}</small></span>
        ${svg(I.arrow,'rec-c')}
      </button>`).join('')}
      ${myWorkouts().length ? `<div class="mineblk">
        <div class="minehd">Your own</div>
        ${myWorkouts().slice(0,3).map(w=>`<button class="rec mine" data-mine="${w.id}">
          <span class="rec-m"><b class="tnum">${w.items.length}</b><i>mv</i></span>
          <span class="rec-tx"><b>${esc(w.name)}</b><small>${
            w.items.map(it=>(EX[it.ex]||{n:it.ex}).n).slice(0,3).join(', ')}${
            w.items.length>3?'\u2026':''}</small></span>
          ${svg(I.arrow,'rec-c')}
        </button>`).join('')}
      </div>` : ''}
      <div class="restalt">
        <button class="go ghost" data-act="openday" data-day="${nx.id}">${nx.when}'s session</button>
        <button class="go ghost" data-act="buildadd2">Build a workout</button>
      </div>
    </div>`;
  }

  /* --- readiness ------------------------------------------------------
     Unanswered it is a card, high up, because on a rest day it is the whole
     reason to open the app. Answered it stops being a question — it folds
     into a row the size of a habit, keeps the face he picked as its icon,
     and drops down next to the other things you log. A question you have
     already answered should not hold the best real estate on the screen. */
  /* Asked daily, answered daily. It was stored as a bare value, so an answer
     given on Tuesday still sat there on Friday claiming to describe how the
     body felt that morning. Stamped with the day now; anything older simply
     is not an answer any more. */
  if(S.readinessAt && S.readinessAt !== dayKey()){ S.readiness = null; S.readinessAt = null; }
  const readyOn = !!S.readiness;
  if(!readyOn){
    h += `<div class="card" id="sec-ready">
      <div class="q">How do you feel? <span class="pay">+${payFor('ready')}%</span></div>
      <div class="qs">Three seconds. It changes what I give you.</div>
      <div class="faces">
        ${[['low',I.face1,'Rough'],['ok',I.face2,'Fine'],['good',I.face3,'Good']].map(([v,ic,l])=>
          `<button class="face" data-ready="${v}">${svg(ic)}<span>${l}</span></button>`).join('')}
      </div>
    </div>`;
  }

  /* ---- ONE THING ---- */
  const td = todayTodo(), tdDone = !!(S.todos||{})[td.id];
  const tdPts = (todayId?SCORE_TRAIN:SCORE_REST).find(x=>x.id==='todo').pts;
  /* One control. A to-do that needs a number opens the sheet the moment you
     press it and marks itself the moment you save; one that needs nothing
     just ticks. A separate button underneath was asking the person to press
     the same thing twice. */
  h += `<div class="sect" id="sec-todo"><b>One thing today</b><span class="micro">${
    tdDone?'done':'changes daily'}</span></div>
  <button class="onething ${tdDone?'on':''}" data-todo1="${td.id}"
      ${(!tdDone && td.act)?`data-otact="${td.act}"`:''}>
    <span class="ot-tick">${tdDone?svg(I.check,'tk'):''}</span>
    <span class="ot-tx"><b>${td.t}</b><small>${tdDone?'Done \u2014 that is +'+tdPts+'%':td.s}</small></span>
    <span class="ot-pts">${tdDone?'&plus;'+tdPts+'%':(td.cta?td.cta:'&plus;'+tdPts+'%')}</span>
  </button>`;

  const hbs = HABITS_FOR(), hbDone = hbs.filter(x=>S.habits[x.id]).length;
  const nextSlot = HABIT_POOL[hbs.length];
  h += `<div class="sect" id="sec-habits"><b>Habits</b><span class="micro">${hbDone}/${hbs.length}</span></div>
  <div class="habits">
    ${hbs.map(x=>{
      const on=S.habits[x.id];
      const just = on && JUST_HABIT===x.id;
      return `<button class="hab ${on?'on':''}" data-habit="${x.id}">
        <span class="tick">${on?svg(I.check,'tk'):''}</span>
        <span class="tx"><b>${x.t}</b><small>${x.s}</small></span>
        <span class="hpts ${just?'just':''}">&plus;${Math.round(payFor('habits')/hbs.length)}%${
          just?`<i class="pspark"></i><i class="pspark" style="--d:.12s"></i>`:''}</span>
      </button>`;
    }).join('')}
  </div>
  ${nextSlot?`<div class="micro" style="margin:11px 2px 0">Seven clean days unlocks <b style="color:var(--ink)">${nextSlot.t}</b>.</div>`:''}`;

  /* ---- YOUR OWN, EVERY DAY ----
     These were only on the rest-day card, which is the one day a person is
     least likely to be looking for a workout they built. They live here
     too, on every day, next to the other things you can log. */
  if(myWorkouts().length){
    h += `<div class="sect"><b>Your workouts</b><a data-act="buildadd2">Build another</a></div>
    <div class="minelist">
      ${myWorkouts().map(w=>`<button class="rec mine" data-mine="${w.id}">
        <span class="rec-m"><b class="tnum">${w.items.length}</b><i>mv</i></span>
        <span class="rec-tx"><b>${esc(w.name)}</b><small>${
          w.items.map(it=>(EX[it.ex]||{n:it.ex}).n).slice(0,3).join(', ')}${
          w.items.length>3?'\u2026':''}</small></span>
        ${svg(I.arrow,'rec-c')}
      </button>`).join('')}
    </div>`;
  }

  /* --- quick log --- */
  h += `<div class="sect" id="sec-note"><b>Log something</b><span class="micro pay-t">a note is +${payFor('note')}%</span></div>
  <div class="rail">
    <button class="ql" data-act="log:weight">${svg(I.scale)}<span>Weight</span></button>
    <button class="ql" data-act="log:note">${svg(I.pen)}<span>Note</span></button>
    <button class="ql" data-act="log:photo">${svg(I.cam)}<span>Photo</span></button>
    <button class="ql" data-act="buildadd2">${svg(I.plus)}<span>Build one</span></button>
  </div>`;


  /* the answered version, down here where it belongs */
  if(readyOn){
    const RM = {low:[I.face1,'Rough'], ok:[I.face2,'Fine'], good:[I.face3,'Good']};
    const [ic,label] = RM[S.readiness] || RM.ok;
    h += `<span id="sec-ready"></span>` + fold('ready', 'How do you feel?', `<div class="card plain">
      <div class="micro just">${readyCopy()}</div>
      <div class="faces" style="margin-top:13px">
        ${[['low',I.face1,'Rough'],['ok',I.face2,'Fine'],['good',I.face3,'Good']].map(([v,fi,l])=>
          `<button class="face ${S.readiness===v?'on':''}" data-ready="${v}">${svg(fi)}<span>${l}</span></button>`).join('')}
      </div>
    </div>`, {icon: ic, steps:1, did:1,
      /* a span, not a <b>: .fold-tx b is display:block, which broke this
         one line into three */
      sub:`${label} \u00b7 <span class="pts">+${payFor('ready')}%</span> banked`});
  }

  /* --- messages from a human ---
     One button. The badge only exists when something is actually unread;
     a permanent counter is wallpaper. */
  const unread = unreadCount();
  h += fold('msgs', 'Coach Nico', MESSAGES.map(msgBox).join(''),
    {icon: I.mail, tone: unread?'live':'',
     sub: unread?`${unread===1?'A message is':unread+' messages are'} waiting` : 'Read them again, or reply',
     badge: unread || null, openByDefault: unread > 0});

  /* --- the program --- */
  h += `<div class="sect"><b>Your program</b><a data-act="openweek">See the week</a></div>
  <div class="card tap" data-act="openweek">
    <div class="prog">
      <div class="ring">${ring(8,'1')}</div>
      <div class="tx"><b>${esc(programMeta().name)}</b>
        <small>${esc(programMeta().sub)}</small></div>
      ${svg(I.arrow,'arw')}
    </div>
    <div class="phases">
      ${[['Foundation',1],['Build',0],['Peak',0]].map(([n,on],i)=>
        `<div class="ph ${on?'on':''}"><div class="bar"><i data-grow="${on?'8%':'0%'}"></i></div><span>${n}</span></div>`).join('')}
    </div>
  </div>`;

  /* --- learn nudge: the "watch it tonight, do it next session" loop --- */
  const q = S.queued.filter(k=>EX[k]);
  h += `<div class="sect"><b>Queued for next session</b><a data-act="tab:learn">Library</a></div>`;
  if(q.length){
    h += `<div class="exgrid">${q.slice(0,2).map(k=>exCard(k)).join('')}</div>`;
  } else {
    h += `<div class="empty">${svg(I.book)}<b>Nothing queued</b>
      <p>Find a movement in the library, watch the clip, and it shows up here for next time.</p></div>`;
  }

  return h+`</div>`;
}

/* FOLD
   A section header that is also the control for its own contents. Used
   for everything a person consults occasionally rather than reads every
   time — which on a dashboard is most things. Open state is remembered,
   so his shape of the app persists. */
/* FIVE WAYS TO SHOW A BUTTON FILLING UP
   Switchable at the top of the Me tab. `S.ringStyle` picks one.

   Two rules learned the hard way and applied to all of them:
     - A completed run is CONTINUOUS. The gap belongs between done and
       not-done, never between two finished pieces.
     - The arc starts at the TOP-LEFT CORNER, not mid-edge. A line that
       begins in the middle of a straight run looks like a mistake; one
       that begins at a corner looks like it was drawn on purpose.

     arc     one run growing clockwise from the top-left corner.
     comet   the same run with a bright head at the leading edge, so the
             light looks like it travelled there and stopped.
     bars    a thick glowing bar per task with an even hairline gap — a
             segmented gauge. Countable, and heavy on light.
     ring    a circular meter around the icon. No long lines anywhere.
     charge  the icon tile fills bottom-up, like something charging.
   ------------------------------------------------------------------- */
/* Comet won. The others are gone rather than left switchable: a chooser
   nobody will ever open is just another thing to keep working. */
const ringStyle = () => 'comet';
const ON_ICON = st => st === 'ring' || st === 'charge';

/* The rect every outline style traces.
   No pathLength, and no dash lengths in the markup. Chrome would not repaint
   a dash reliably when the length came from pathLength on a percentage-sized
   rect — a half-full card painted about 85% full and stayed there until
   something else forced a repaint. So the markup only carries WHICH SLICE of
   the outline a piece wants, as two fractions of the way round, and
   layoutRings() converts those to absolute pixels once the card has a real
   size. One measurement, exact numbers, nothing for the engine to guess. */
const RRECT = 'x="0" y="0" width="100%" height="100%" rx="14"';
const RX = 14;

/* Turn "from fraction a to fraction b of the way round" into real px.
   Runs after every render and on resize. Because the perimeter is measured,
   the corner is exact: a run that starts at 0 starts at the top-left corner
   itself, not after the curve, because ORIGIN winds the start back by one
   corner arc — the reason a filling outline should never begin mid-edge. */
function layoutRings(root){
  (root||document).querySelectorAll('.oring').forEach(svg=>{
    const w = svg.clientWidth, h = svg.clientHeight;
    if(!w || !h) return;
    const rx = Math.min(RX, w/2, h/2);
    const P = 2*(w - 2*rx) + 2*(h - 2*rx) + 2*Math.PI*rx;   /* true perimeter */
    const ORIGIN = (Math.PI*rx)/2;                          /* one corner arc */
    svg.querySelectorAll('[data-a]').forEach(el=>{
      const a = parseFloat(el.dataset.a), b = parseFloat(el.dataset.b);
      const len = Math.max(0, (b - a) * P);
      el.style.strokeDasharray  = len + 'px ' + Math.max(0.01, P - len) + 'px';
      el.style.strokeDashoffset = (ORIGIN - a*P) + 'px';
    });
  });
}
addEventListener('resize', ()=>layoutRings());

function ringSvg(total, done){
  if(!total || total < 1) return '';
  const st = ringStyle();
  if(ON_ICON(st)) return '';
