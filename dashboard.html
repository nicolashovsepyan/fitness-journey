/* ---- REELS ------------------------------------------------------------
   Each digit in its own window, cylinder-shaded top and bottom, with the
   hairline across the middle where a real reel is split. */
.sty-reels .dayx-art{order:-1;margin-right:14px}
.reels{display:flex;gap:4px;align-items:stretch}
.rl{position:relative;width:34px;height:52px;border-radius:6px;overflow:hidden;
  background:linear-gradient(180deg,#11151a,#1b2129 46%,#1b2129 54%,#0d1116);
  box-shadow:inset 0 0 0 1px var(--line2), inset 0 8px 12px -8px #000,
             inset 0 -8px 12px -8px #000}
.rl i{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-style:normal;font-size:31px;font-weight:600;letter-spacing:-.04em;
  color:var(--ink);font-variant-numeric:tabular-nums;
  text-shadow:0 0 12px var(--accent-soft)}
.rl:after{content:"";position:absolute;left:0;right:0;top:50%;height:1px;
  background:rgba(255,255,255,.10)}
.rl.pc{width:20px;background:none;box-shadow:none}
.rl.pc i{font-size:13px;color:var(--accent);align-items:flex-end;padding-bottom:11px}
.rl.pc:after{display:none}
.reels.roll .rl i{animation:reelRoll .5s cubic-bezier(.2,.9,.3,1) both;animation-delay:var(--d,0s)}
@keyframes reelRoll{
  0%  {transform:translateY(-115%);filter:blur(2.5px)}
  70% {filter:blur(0)}
  100%{transform:translateY(0);filter:blur(0)}}

/* ---- BOARD ------------------------------------------------------------
   The unlit segments stay visible. That is the whole trick of a real LED
   panel: you can see the shape of the eight that the number is not. */
.board{display:flex;align-items:flex-end;gap:3px}
.sev{width:29px;height:51px;overflow:visible}
/* Board is the full-size setting; the others take it down so the gauge
   beside them still has room to be the picture. */
.sty-sunset .sev{width:19px;height:34px}
.sty-sunset .bpc{font-size:11px;padding-bottom:4px}
.sty-grid .sev,.sty-climb .sev{width:25px;height:44px}
.sty-grid .bpc,.sty-climb .bpc{font-size:12px;padding-bottom:4px}
.sty-climb .dayx-n{margin-right:5%}
.sg{fill:var(--ink);opacity:.06;transition:opacity .35s,fill .35s}
.sg.on{fill:var(--accent);opacity:1;filter:drop-shadow(0 0 5px var(--accent))}
.bpc{font-size:13px;font-weight:700;color:var(--accent);letter-spacing:.04em;
  padding-bottom:5px;text-shadow:0 0 8px var(--accent-soft)}
.sty-board.full .sg.on{fill:var(--neon);filter:drop-shadow(0 0 7px var(--neon))}

/* ---- the receipt, shared ---- */
.dh-rows{display:flex;flex-direction:column}
.dr{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:9px 0;border-bottom:1px solid var(--line);font-size:13px;color:var(--ink3)}
.dr:last-child{border-bottom:none}
.dr-k{display:flex;align-items:center;gap:9px;min-width:0}
.dr-o{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--line2);flex:none}
.dr .dck{width:13px;height:13px;stroke:var(--accent);fill:none;stroke-width:3;
  stroke-linecap:round;stroke-linejoin:round;flex:none}
.dr-v{display:inline-flex;align-items:center;font-weight:700;font-size:12px;
  color:var(--ink3);font-variant-numeric:tabular-nums}
.dr.on{color:var(--ink)}
.dr.on .dr-v{color:var(--neon)}
.dr.part .dr-v{color:var(--ink2)}
/* a row that goes somewhere */
.dr.go2{width:100%;background:none;border:none;font:inherit;text-align:left;cursor:pointer;
  border-bottom:1px solid var(--line);color:var(--ink3)}
.dr.go2:active{opacity:.6}
.dr .dr-c{width:11px;height:11px;stroke:var(--ink3);fill:none;stroke-width:2.4;
  stroke-linecap:round;stroke-linejoin:round;margin-left:7px;vertical-align:-1px}
.dr.bonus{border-bottom:none;color:var(--neon)}
.dr.bonus .dr-v{color:var(--neon)}
/* what a thing pays, said on the thing itself rather than in a legend */
.pay{font-size:11px;font-weight:700;color:var(--accent);background:var(--accent-soft);
  border:1px solid var(--accent);border-radius:999px;padding:2px 8px;margin-left:6px;
  vertical-align:2px;letter-spacing:0}
.pay-t{color:var(--accent)!important}
.chip.pay-c{color:var(--accent);border-color:var(--accent);background:var(--accent-soft);
  font-weight:700;box-shadow:0 0 12px var(--accent-soft)}
.chip.pay-c.earned{box-shadow:0 0 16px var(--accent-soft)}
/* The percentage is the reward, so it is the one thing that gets to move.
   On the tick it swells once and throws two sparks — the same idea as the
   ember on the day gauge, at the size of a chip: the number visibly leaves
   here and goes into the total. */
.hpts{position:relative;font-size:11px;font-weight:700;color:var(--ink3);flex:none;
  border:1px solid var(--line);border-radius:999px;padding:4px 9px}
/* THE RULE: an unearned percentage is grey, an earned one is the SECOND
   colour — not the first. The first colour already means "this section is
   complete"; using it for points too made completion and reward look like
   the same event. Points are neon, everywhere, and the ember stays. */
.hab.on .hpts{color:var(--neon);border-color:var(--neon-line);background:none}
/* the same rule inline, for the places a percentage is banked inside a line
   of text rather than in a chip */
.pts,.fold.done .fold-tx small .pts{color:var(--neon);font-weight:700}
.hpts.just{animation:ptsPop .75s cubic-bezier(.22,1,.36,1)}
@keyframes ptsPop{
  0%  {transform:scale(1);   box-shadow:0 0 0 0 var(--neon-soft)}
  28% {transform:scale(1.2); box-shadow:0 0 16px 2px var(--neon-soft)}
  100%{transform:scale(1);   box-shadow:0 0 0 0 rgba(0,0,0,0)}}
.pspark{position:absolute;left:50%;top:2px;width:3px;height:3px;border-radius:50%;
  background:var(--neon);box-shadow:0 0 7px var(--neon);pointer-events:none;
  animation:pSpark .8s ease-out both;animation-delay:var(--d,0s)}
@keyframes pSpark{
  0%  {opacity:0;transform:translate(-50%,0) scale(.5)}
  25% {opacity:1}
  100%{opacity:0;transform:translate(-190%,-17px) scale(.2)}}

/* ---------- fold ------------------------------------------------------
   A flat row with a plus on it reads as a spreadsheet. These are the way
   into a whole section, so every one carries neon from the start — a ring
   round the icon and a soft halo, always on, so the row reads as a thing
   that lights up rather than a table row.

   `--fill` (0..1) is how complete the section is. Rather than mixing
   colours — which needs color-mix and silently did nothing — a second
   fully-lit ring sits on top of the dim one and its OPACITY is the fill.
   Plain opacity works everywhere and animates on the compositor.

   At --fill:1 the tile flips solid: filled accent, dark glyph, a ring of
   light around it. That is the "this one is finished" state.
   ------------------------------------------------------------------- */
.fold{position:relative;border:1px solid var(--line);border-radius:16px;overflow:hidden;
  margin-top:11px;background:linear-gradient(180deg,rgba(255,255,255,.036),rgba(255,255,255,.014));
  transition:border-color .22s,box-shadow .22s}
.fold:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;z-index:3;
  background:var(--line2);transition:background .25s,box-shadow .25s}
.fold.open{border-color:var(--line2)}
.fold.open:before{background:linear-gradient(180deg,var(--accent),var(--neon));
  box-shadow:0 0 12px var(--neon-line)}
.fold.live{border-color:var(--coach-line)}
.fold.live:before{background:var(--coach);box-shadow:0 0 12px var(--coach-line)}
.fold.done{border-color:var(--accent)}
.fold.done:before{background:var(--accent);box-shadow:none}

.fold-hd{position:relative;display:flex;align-items:center;gap:12px;width:100%;background:none;
  border:none;padding:15px 16px 15px 17px;cursor:pointer;font-family:inherit;color:var(--ink);
  text-align:left;transition:transform .16s cubic-bezier(.22,1,.36,1),background .2s}

/* ---------- the meter, five ways ---------------------------------------
   Shared: the halo layer (.rgh) is wide and blurred and does the actual
   glowing; the core (.rg) is hairline and only gives the light an edge.
   Nodes had the best light of the first three, so that intensity is now
   the baseline everywhere.
   ------------------------------------------------------------------- */
/* oring, not ring. `.ring` is ALSO the program card's week dial, and an
   unscoped `.ring{position:absolute}` here tore that dial out of flow and
   dropped it on the name in the header. A shared word in a global stylesheet
   is a collision waiting for the next component to arrive. */
.oring{position:absolute;top:1.5px;left:1.5px;width:calc(100% - 3px);height:calc(100% - 3px);
  pointer-events:none;z-index:2;overflow:visible}
.fold.open .oring{opacity:.55}
/* NOTE: stroke-dasharray is deliberately NOT transitioned. Chrome mis-lands
   the final length when it interpolates a dash list on a pathLength-normalised
   shape — a half-full card painted about 85% full and stayed there. The dash
   is set at render time instead; the light still arrives, it just arrives
   already in place, and the glow fades in around it. */
.oring rect{fill:none;stroke-linecap:round;
  transition:stroke .55s,opacity .55s,filter .55s;transition-delay:var(--d,0s)}

/* ---- ARC: one run growing clockwise out of the top-left corner ---- */
.oring.arc .track,.oring.comet .track{stroke:var(--line2);stroke-width:1;opacity:.2}
.oring.arc .notch,.oring.comet .notch{stroke:var(--line2);stroke-width:2.5;opacity:.45}
.oring.arc .rgh,.oring.comet .rgh{stroke:transparent;stroke-width:8;opacity:0}
.oring.arc .rgh.on,.oring.comet .rgh.on{stroke:var(--neon);opacity:calc(.5 * var(--glow-k,1));
  filter:blur(6px) drop-shadow(0 0 12px var(--neon))}
.oring.arc .rg,.oring.comet .rg{stroke:transparent;stroke-width:2}
/* THE RULE, EVERYWHERE: green is FINISHED. A section three-fifths done was
   drawing three-fifths of a green ring, which made green mean "some of this"
   on the Me tab and "all of this" on a habit. Partial progress is neon —
   the same colour points are paid in — and the ring only turns green when
   the whole thing is done. */
.oring.arc .rg.on,.oring.comet .rg.on{stroke:var(--neon);opacity:1;
  filter:drop-shadow(0 0 5px var(--neon)) drop-shadow(0 0 11px var(--neon))}

/* ---- COMET: same run, with a bright head where the light stopped ---- */
.oring.comet .head{stroke:#fff;stroke-width:3.4;opacity:.95;
  filter:drop-shadow(0 0 6px var(--neon)) drop-shadow(0 0 16px var(--neon));
  animation:cometPulse 2.4s ease-in-out infinite}
@keyframes cometPulse{0%,100%{opacity:.95}50%{opacity:.55}}

/* ---- BARS: a thick lit bar per task, even hairline gap throughout ---- */
.oring.bars .rgh{stroke:transparent;stroke-width:9;opacity:0}
.oring.bars .rgh.on{stroke:var(--accent);opacity:.5;filter:blur(6px) drop-shadow(0 0 12px var(--accent))}
.oring.bars .rg{stroke:var(--line2);stroke-width:2.6;opacity:.28}
.oring.bars .rg.on{stroke:var(--accent);stroke-width:3.2;opacity:1;
  filter:drop-shadow(0 0 5px var(--accent)) drop-shadow(0 0 11px var(--accent))}

/* ---- RING + CHARGE: no outline at all, the icon tile is the meter ---- */
.icoring{position:absolute;inset:-4px;width:calc(100% + 8px);height:calc(100% + 8px);
  overflow:visible;pointer-events:none;z-index:2}
.icoring circle,.icoring path{fill:none;transition:opacity .55s,filter .55s}
.icoring .ir-t{stroke:var(--line2);stroke-width:2;opacity:.3}
.icoring .ir-h{stroke:var(--accent);stroke-width:6;stroke-linecap:round;opacity:.45;
  filter:blur(4px) drop-shadow(0 0 10px var(--accent))}
.icoring .ir-c{stroke:var(--accent);stroke-width:2.4;stroke-linecap:round;
  filter:drop-shadow(0 0 5px var(--accent))}
.fold.sty-ring .fold-ic{overflow:visible}
/* the tile-based meters own the tile, so the generic --fill ring stands down */
.fold.sty-ring .fold-ic:before,.fold.sty-charge .fold-ic:before{opacity:0}

.chg{position:absolute;left:0;right:0;bottom:0;height:var(--h,0%);z-index:0;
  border-radius:0 0 11px 11px;background:linear-gradient(180deg,var(--accent-soft),var(--accent));
  opacity:.75;box-shadow:0 0 18px var(--accent);
  transition:height .8s cubic-bezier(.22,1,.36,1)}
.chg:before{content:"";position:absolute;left:0;right:0;top:-1px;height:2px;
  background:#fff;opacity:.8;filter:blur(1.5px) drop-shadow(0 0 6px var(--accent))}
.fold.sty-charge .fold-ic{overflow:hidden}
.fold.sty-charge.done .chg{display:none}

/* ---- complete, in every style: the seams stop mattering ---- */
.fold.done .oring .rg,.fold.done .oring .rg.on{stroke:var(--accent);opacity:.62;
  filter:drop-shadow(0 0 2px var(--accent)) drop-shadow(0 0 5px var(--accent))}
.fold.done .oring .rgh,.fold.done .oring .rgh.on{stroke:var(--accent);opacity:calc(.16 * var(--glow-k,1));
  filter:blur(6px) drop-shadow(0 0 8px var(--accent))}
.fold.done .oring .notch,.fold.done .oring .track,.fold.done .oring .head{opacity:0}
.fold.live .oring .rg.on{stroke:var(--coach);filter:drop-shadow(0 0 4px var(--coach))}
.fold.live .oring .rgh.on{stroke:var(--coach);filter:blur(5px) drop-shadow(0 0 10px var(--coach))}

/* the count becomes a tick */
.fold-note.tick{border-color:var(--accent);background:var(--accent-soft);padding:4px 8px;
  display:inline-flex;align-items:center}
.fold-note .ntick{width:13px;height:13px;stroke:var(--accent);fill:none;stroke-width:3;
  stroke-linecap:round;stroke-linejoin:round}

/* ---- the temporary chooser ---- */
.stypick{display:flex;gap:6px;margin-bottom:4px}
.stypick button{flex:1;background:rgba(255,255,255,.035);border:1px solid var(--line);
  border-radius:11px;padding:9px 2px;font-family:inherit;font-size:11.5px;color:var(--ink2);
  cursor:pointer;font-weight:550;white-space:nowrap}
.stypick button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}


/* the icon tile — neon on every one, always */
.fold-ic{position:relative;width:36px;height:36px;border-radius:12px;flex:none;
  display:flex;align-items:center;justify-content:center;
  background:var(--surface2);border:1px solid var(--neon-line);
  box-shadow:0 0 12px var(--neon-soft), inset 0 0 12px rgba(255,255,255,.035);
  transition:background .3s,box-shadow .3s,border-color .3s}
.fold-ic:before{content:"";position:absolute;inset:-1px;border-radius:inherit;pointer-events:none;
  border:1.5px solid var(--neon);
  box-shadow:0 0 14px var(--neon-line), inset 0 0 12px var(--neon-soft);
  opacity:var(--fill,0);transition:opacity .5s cubic-bezier(.22,1,.36,1)}
/* :not(.icoring) — the glyph rule used to size EVERY svg in the tile, which
   squashed the progress ring into the 17px glyph slot and parked it on the
   left. The ring is a sibling of the glyph, not another glyph. */
.fold-ic svg:not(.icoring){position:relative;z-index:1;width:17px;height:17px;stroke:var(--ink2);fill:none;
  stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:stroke .3s}
.fold.open .fold-ic{background:var(--accent-soft);border-color:var(--accent);
  box-shadow:0 0 18px var(--accent-soft)}
.fold.open .fold-ic svg:not(.icoring){stroke:var(--accent)}
.fold.live .fold-ic{background:var(--coach-soft);border-color:var(--coach);
  box-shadow:0 0 20px var(--coach-line)}
.fold.live .fold-ic svg:not(.icoring){stroke:var(--coach)}
.fold.live .fold-ic:before{opacity:0}
/* Finished, but quieter. The solid tile with a tick punched through it was
   shouting next to the sections that still need doing — backwards, because a
   finished section is the one you no longer have to look at. The icon stays
   put, the tile only tints, and the tick moves to the right where the count
   used to be. Everything that glows here is pulled back about 15%. */
/* The icon is left exactly as it is on every other row. Recolouring it was
   a third signal saying the same thing the tick and the ring already say,
   and three signals for one fact is what made a finished row shout. */
.fold.done{border-color:var(--accent-line)}
.fold.done .fold-ic{border-color:var(--accent);box-shadow:none}
.fold.done .fold-ic:before{opacity:0}
.fold-ck{flex:none;width:22px;height:22px;border-radius:50%;display:flex;
  align-items:center;justify-content:center;background:var(--accent-soft);
  border:1px solid var(--accent)}
.fold-ck svg{width:11px;height:11px;stroke:var(--accent);fill:none;stroke-width:3;
  stroke-linecap:round;stroke-linejoin:round}

.fold-tx{flex:1;min-width:0}
.fold-tx b{display:block;font-size:15px;font-weight:600;letter-spacing:-.012em}
.fold-tx small{display:block;font-size:12px;color:var(--ink3);margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fold.live .fold-tx small{color:var(--coach)}
.fold.done .fold-tx small{color:var(--accent)}

.fold-badge{min-width:21px;height:21px;border-radius:999px;background:var(--coach);color:#221B00;
  font-size:11.5px;font-weight:700;display:flex;align-items:center;justify-content:center;
  padding:0 6px;box-shadow:0 0 14px var(--coach-line);flex:none}
.fold-note{font-size:11.5px;color:var(--ink3);flex:none;border:1px solid var(--line);
  border-radius:999px;padding:4px 9px;transition:color .3s,border-color .3s,background .3s}
.fold-chev{flex:none;display:flex;align-items:center;justify-content:center;
  width:22px;height:22px;transition:transform .28s cubic-bezier(.22,1,.36,1)}
.fold-chev svg{width:15px;height:15px;stroke:var(--ink3);fill:none;stroke-width:2.2;
  stroke-linecap:round;stroke-linejoin:round}
.fold.open .fold-chev{transform:rotate(90deg)}
.fold.open .fold-chev svg{stroke:var(--accent)}

.fold-body{padding:2px 14px 14px;animation:foldIn .3s cubic-bezier(.22,1,.36,1) both}
@keyframes foldIn{from{opacity:0;transform:translateY(-7px)}to{opacity:1;transform:none}}
.fold-body .card.plain{background:none;border:none;box-shadow:none;padding:0;margin:0}
.fold-body .msg:last-child{margin-bottom:0}
.fold-body .lvl:first-of-type{padding-top:0}
.fold-body .dh-list{margin-top:0}


/* ---------- the day, scored ---------- */
.daylist{display:flex;flex-wrap:wrap;gap:7px;margin-top:13px}
.dchip{font-size:11.5px;color:var(--ink3);background:rgba(255,255,255,.035);
  border:1px solid var(--line);border-radius:999px;padding:6px 11px;
  display:inline-flex;align-items:center;gap:7px}
.dchip i{font-style:normal;font-size:10.5px;opacity:.75;font-variant-numeric:tabular-nums}
.dchip.part{color:var(--ink2);border-color:var(--line2)}
.dchip.on{color:var(--neon);border-color:var(--neon-line);background:none}

/* ---------- THE THREAD ---------------------------------------------------
   Who said a thing is carried by WHERE it sits, not by a label you have to
   read: Coach Nico on the left behind his initial, Ozzy on the right, and
   whatever the app recorded on its own down the middle in small type. That
   is the one thing a rail-and-dot feed could not do, because every entry in
   it had the same shape.
   ------------------------------------------------------------------- */
.thread{display:flex;flex-direction:column;gap:9px;padding-top:4px}

/* the day, once, where the day changes */
.tdiv{display:flex;align-items:center;gap:10px;margin:9px 0 4px;
  font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--ink3);font-weight:650}
.tdiv:before,.tdiv:after{content:"";flex:1;height:1px;background:var(--line)}

.tmsg{display:flex;gap:8px;max-width:100%}
.tmsg.me{justify-content:flex-end}
.tav{width:26px;height:26px;border-radius:50%;flex:none;align-self:flex-end;
  display:flex;align-items:center;justify-content:center;
  background:var(--coach);color:#221B00;font-size:12px;font-weight:800}
/* text-align:left explicitly — the pane centres a few things and a bubble
   that inherits it looks like a poster. width:fit-content so a short entry
   is a short bubble instead of an 80%-wide box with two words in it. */
/* tbub, not tb: .tb is the TAB BAR button, which is a centred flex column,
   so every bubble inherited that and centred each line inside itself. */
.tbub{max-width:80%;width:fit-content;text-align:left;
  border-radius:15px;padding:11px 13px;border:1px solid var(--line);
  background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.014))}
.tmsg.them .tbub{border-bottom-left-radius:5px;border-color:var(--coach-line);
  background:var(--coach-soft)}
.tmsg.me .tbub{border-bottom-right-radius:5px;border-color:var(--accent-line);
  background:var(--accent-soft)}
.tbub-k{font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;font-weight:700;
  color:var(--ink3);margin-bottom:4px}
.tmsg.them .tbub-k{color:var(--coach)}
.tmsg.me .tbub-k{color:var(--accent)}
.tbub b{display:block;font-size:14.5px;font-weight:600;letter-spacing:-.01em;color:var(--ink)}
/* not justified: justification needs a measure, and a chat bubble has none —
   it just tears three-word lines into stripes */
.tbub p{font-size:12.5px;line-height:1.45;color:var(--ink2);margin-top:4px;text-align:left}
.tbub-t{display:block;font-style:normal;font-size:10px;color:var(--ink3);margin-top:6px;
  text-align:right;font-variant-numeric:tabular-nums}

/* the app talking about itself — centred, quiet, no bubble */
.tsys{display:flex;align-items:center;justify-content:center;gap:7px;flex-wrap:wrap;
  padding:5px 12px;font-size:11.5px;color:var(--ink3);text-align:center}
.tsys b{font-weight:600;color:var(--ink2)}
.tsys span{color:var(--ink3)}
.tsys i{font-style:normal;font-size:10px;opacity:.7;font-variant-numeric:tabular-nums}
.ts-i{width:11px;height:11px;stroke:var(--accent);fill:none;stroke-width:3;
  stroke-linecap:round;stroke-linejoin:round;flex:none}
.tsys.k-mile .ts-i,.tsys.k-pr .ts-i{stroke:var(--neon)}
.tstart{text-align:center;font-size:11px;color:var(--ink3);opacity:.6;margin:14px 0 2px}
.tdiv .logmore{flex:none}

/* ---------- seven days, as they scored ---------------------------------
   Bars, not a chart. Seven numbers is not a trend, it is a week — and a week
   you can read at a glance is worth more here than a line you have to
   interpret. A day never opened is a dash, not a zero: they are different
   things and pretending otherwise makes the record a lie.
   ------------------------------------------------------------------- */
.card.hist{display:flex;gap:6px;align-items:flex-end;padding:14px 14px 11px}
.hd7{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px}
.hd-b{width:100%;height:42px;border-radius:5px;background:rgba(255,255,255,.045);
  display:flex;align-items:flex-end;overflow:hidden;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.04)}
.hd-b i{display:block;width:100%;height:var(--h,0%);border-radius:4px;
  background:linear-gradient(180deg,var(--neon),var(--accent));
  transition:height .7s cubic-bezier(.22,1,.36,1)}
.hd7.full .hd-b i{box-shadow:0 0 10px var(--accent)}
.hd-v{font-size:11px;font-weight:600;color:var(--ink2);font-variant-numeric:tabular-nums}
.hd-l{font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);font-weight:600}
.hd7.none .hd-v,.hd7.none .hd-l{color:var(--ink3);opacity:.5}

/* where you land, briefly lit so you know you arrived */
.flash{animation:flash 1.4s ease-out}
@keyframes flash{0%,18%{background:var(--neon-soft);border-radius:8px}100%{background:transparent}}

/* ---------- the weigh-in ------------------------------------------------
   A weekly appointment, not a button. It says which day, how far away, and
   on the day itself it stops counting and starts asking.
   ------------------------------------------------------------------- */
.weigh{display:flex;align-items:center;gap:12px;margin-bottom:12px;
  border:1px solid var(--line);border-radius:15px;padding:13px 15px;
  background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.012));
  transition:border-color .3s,box-shadow .3s}
.weigh.now{border-color:var(--neon);box-shadow:0 0 20px var(--neon-soft);cursor:pointer}
.weigh.done{border-color:var(--accent)}
.wi-ic{width:32px;height:32px;border-radius:11px;flex:none;display:flex;
  align-items:center;justify-content:center;background:var(--surface2);
  border:1px solid var(--line2)}
.wi-ic svg{width:16px;height:16px;stroke:var(--ink3);fill:none;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round}
.weigh.now .wi-ic{border-color:var(--neon);background:var(--neon-soft)}
.weigh.now .wi-ic svg{stroke:var(--neon)}
.weigh.done .wi-ic{border-color:var(--accent);background:var(--accent-soft)}
.weigh.done .wi-ic svg{stroke:var(--accent);stroke-width:3}
.wi-tx{flex:1;min-width:0}
.wi-tx b{display:block;font-size:14.5px;font-weight:600;letter-spacing:-.012em}
.wi-tx small{display:block;font-size:12px;color:var(--ink3);margin-top:2px}
.weigh.now .wi-tx small{color:var(--neon)}
/* A number on its own does not say "counting down". A number with a unit
   under it, over a row of dots that empties as the day approaches, does —
   and the dots are the same seven days the strip above already uses, so it
   reads as the same week rather than as a second calendar. */
.wi-cd{flex:none;display:flex;flex-direction:column;align-items:center;line-height:1}
.wi-cd b{font-size:22px;font-weight:600;color:var(--ink2);letter-spacing:-.03em}
.wi-cd i{font-style:normal;font-size:9px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink3);margin-top:3px}
.weigh.done .wi-cd b{color:var(--accent)}
.weigh.now .wi-cd b{color:var(--neon)}
.wi-dots{position:absolute;left:15px;right:15px;bottom:7px;display:flex;gap:4px}
.wi-dots i{flex:1;height:2px;border-radius:1px;background:var(--neon);opacity:.55}
.wi-dots i.off{background:var(--line2);opacity:.5}
.weigh{position:relative;padding-bottom:18px}
.weigh.done .wi-dots i{background:var(--accent);opacity:.4}
.wi-go{flex:none;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--neon);border:1px solid var(--neon);border-radius:999px;padding:6px 12px;
  box-shadow:0 0 14px var(--neon-soft)}

/* ---------- benchmarks as a rail you swipe ---------- */
.rail-h{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 8px;
  scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;
  scrollbar-width:none;-ms-overflow-style:none}
.rail-h::-webkit-scrollbar{display:none}
/* ---- the benchmark carousel -------------------------------------------
   Same behaviour as the body-shape picker in onboarding: the rail snaps to
   centre, the card in the middle is at full size and full opacity, and its
   neighbours sit back at .8 and .35 so there is one card being looked at
   rather than four competing. Padding of half the rail minus half a card is
   what lets the first and last one reach the middle.
   ------------------------------------------------------------------- */
.bcar{padding:4px 0 10px;margin:0 -18px;scroll-padding:0;
  padding-left:calc(50% - 76px);padding-right:calc(50% - 76px)}
.bcar .bflip{opacity:.35;transform:scale(.8);transform-origin:center;
  scroll-snap-align:center;transition:opacity .22s,transform .22s}
.bcar .bflip.live{opacity:1;transform:scale(1)}
.bcdots{display:flex;gap:6px;justify-content:center;margin:2px 0 9px}
.bcdots i{width:6px;height:6px;border-radius:50%;background:var(--line);
  transition:background .16s,transform .16s}
.bcdots i.on{background:var(--accent);transform:scale(1.3)}

/* ---- the flip ----------------------------------------------------
   A benchmark has two sides: the thing you do, and what counts as doing
   it properly. Stacking both on one face made a card nobody read. So the
   card turns on its vertical axis — front is the invitation, back is the
   standard and your number.

   The 3D lives on .bf-in; the wrapper keeps the perspective so the turn
   has depth instead of looking like a width animation. Both faces are
   absolutely placed and back-face-hidden, and the card is given a fixed
   height because two absolutely-placed faces have none of their own. */
.bflip{flex:0 0 152px;height:228px;scroll-snap-align:start;perspective:1000px}
.bf-in{position:relative;width:100%;height:100%;transform-style:preserve-3d;
  transition:transform .62s cubic-bezier(.3,1.1,.4,1)}
.bflip.over .bf-in{transform:rotateY(180deg)}
.bf-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  background:var(--card);border:1px solid var(--line);border-radius:17px;padding:13px;
  cursor:pointer;font-family:inherit;color:var(--ink);text-align:left;
  display:flex;flex-direction:column;gap:4px;transition:border-color .18s}
.bf-back{transform:rotateY(180deg)}
/* the front's own type — .bcard's rules do not reach inside a face */
.bf-face b{font-size:14px;font-weight:600;letter-spacing:-.01em}
.bf-front small{font-size:11.5px;color:var(--ink3);flex:1}
.bf-face .bc-go{margin-top:auto}
.bf-eye{font-size:10px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;
  color:var(--ink3)}
.bf-back b{font-size:14px;font-weight:600;letter-spacing:-.01em;margin-top:2px}
.bf-back p{font-size:11.5px;line-height:1.45;color:var(--ink2);flex:1;margin-top:6px;
  text-align:justify;hyphens:auto}
.bf-score{display:flex;align-items:baseline;gap:3px;font-size:11px;color:var(--ink3);
  margin-bottom:2px}
.bf-score i{font-style:normal;font-size:26px;font-weight:600;color:var(--accent);
  letter-spacing:-.03em}
.bflip.lead .bf-face{border-color:var(--neon-line)}
.bflip.lead .bc-go{box-shadow:0 0 14px var(--neon-line);animation:badgeGlow 3s ease-in-out infinite}
.bflip.got .bf-face{border-color:var(--accent)}
.bflip.got .bc-go{color:var(--accent);border-color:var(--accent);box-shadow:none;animation:none}
.bc-go.alt{color:var(--accent);border-color:var(--accent)}
/* a turning card must not be clipped by the rail */
.rail-h{overflow-y:visible}

.bcard{flex:0 0 152px;scroll-snap-align:start;background:var(--card);
  border:1px solid var(--line);border-radius:17px;padding:13px;cursor:pointer;
  font-family:inherit;color:var(--ink);text-align:left;display:flex;flex-direction:column;gap:4px;
  transition:transform .16s cubic-bezier(.22,1,.36,1),border-color .18s}
.bcard:active{transform:scale(.97)}
.bc-art{height:74px;display:flex;align-items:center;justify-content:center;margin-bottom:4px}
.bc-art img{max-height:100%;max-width:100%;object-fit:contain}
.bc-art .noart{height:100%;padding:12%}
.bcard b{font-size:14px;font-weight:600;letter-spacing:-.01em}
.bcard small{font-size:11.5px;color:var(--ink3);flex:1}
.bc-go{margin-top:9px;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
  color:var(--neon);border:1px solid var(--neon-line);border-radius:999px;padding:6px 0;text-align:center}
.bcard.lead{border-color:var(--neon-line)}
.bcard.lead .bc-go{box-shadow:0 0 14px var(--neon-line);animation:badgeGlow 3s ease-in-out infinite}
.bcard.got{border-color:var(--accent)}
.bcard.got .bc-go{color:var(--accent);border-color:var(--accent);box-shadow:none;animation:none}

/* ---------- level up ---------- */
.lvl{padding:15px 0;border-bottom:1px solid var(--line);cursor:pointer}
.lvl:first-of-type{padding-top:2px}
.lvl:last-of-type{border-bottom:none;padding-bottom:2px}
.lvl:active{opacity:.72}
.lv-top{display:flex;align-items:baseline;gap:10px}
.lv-top b{font-size:16px;font-weight:600;letter-spacing:-.015em;flex:1}
.lv-when{font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;
  color:var(--ink3);border:1px solid var(--line2);border-radius:999px;padding:3px 8px;flex:none}
.lv-when.now{color:var(--accent);border-color:var(--accent)}
.lv-un{font-size:13px;color:var(--ink2);margin-top:7px}
.lv-un b{color:var(--accent);font-weight:600}
.lv-list{list-style:none;margin:9px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.lv-list li{font-size:12px;color:var(--ink2);background:rgba(255,255,255,.045);
  border:1px solid var(--line);border-radius:8px;padding:5px 9px}
.lv-list li.more{color:var(--ink3);background:none;border-style:dashed}
.lv-foot{display:flex;align-items:center;gap:9px;margin-top:11px}
.lv-foot .arw{width:15px;height:15px;stroke:var(--ink3);fill:none;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round;margin-left:auto;flex:none}

/* ---------- kit chips ---------- */
.kitrow{display:flex;flex-wrap:wrap;gap:7px}
.kt{font-size:12.5px;font-weight:500;padding:7px 12px;border-radius:999px;
  border:1px dashed var(--line2);color:var(--ink3)}
.kt.has{border-style:solid;border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}

/* ---------- working around ---------- */
.wrow{display:flex;gap:14px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.wrow:last-child{border-bottom:none}
.wrow b{width:64px;flex:none;font-weight:600;color:var(--ink)}
.wrow span{color:var(--ink2);flex:1}
.wrow.flag b{color:var(--red)}

/* ---------- gear rows ---------- */
.gear{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);cursor:pointer}
.gear:last-child{border-bottom:none}
.gear:active{opacity:.7}
.gear .tx{flex:1;min-width:0}
.gear .tx b{font-size:14.5px;font-weight:550;letter-spacing:-.01em;display:block}
.gear .tx small{font-size:12px;color:var(--ink3);display:block;margin-top:3px;line-height:1.4}
.gmeta{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
.gp{font-size:11.5px;font-weight:600;color:var(--ink2);background:rgba(255,255,255,.05);
  border:1px solid var(--line);border-radius:999px;padding:3px 9px}
.gu{font-size:11.5px;font-weight:600;color:var(--accent);background:var(--accent-soft);
  border:1px solid rgba(62,203,168,.28);border-radius:999px;padding:3px 9px}
.gu.zero{color:var(--ink3);background:rgba(255,255,255,.04);border-color:var(--line)}
.gear .arw{width:17px;height:17px;stroke:var(--ink3);fill:none;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- locked movement cards ---------- */
.ex.lk{opacity:.62}
.ex.lk .im{filter:grayscale(1)}
.lock{position:absolute;left:8px;bottom:8px;display:inline-flex;align-items:center;gap:5px;
  font-size:9px;letter-spacing:.09em;text-transform:uppercase;font-weight:600;color:var(--accent-2);
  background:rgba(11,13,15,.62);border:1px solid rgba(217,169,76,.34);border-radius:999px;padding:3px 8px}
.buyrow{display:flex;flex-direction:column;gap:9px;margin-top:20px}
.disclose{font-size:11px;color:var(--ink3);line-height:1.5;margin-top:14px;text-align:center}
.soon{position:absolute;left:8px;bottom:8px;font-size:9px;letter-spacing:.1em;text-transform:uppercase;
  font-weight:600;color:var(--ink3);background:rgba(11,13,15,.55);border:1px solid var(--line);
  border-radius:999px;padding:3px 8px}
.naTag{display:inline-flex;align-items:center;gap:5px;font-size:9.5px;letter-spacing:.1em;
  text-transform:uppercase;font-weight:600;color:var(--ink3);background:rgba(255,255,255,.045);
  border:1px solid var(--line);border-radius:999px;padding:4px 9px}

/* ---------- profile completeness ---------- */
.compl{display:flex;align-items:center;gap:16px}
.compl .tx{flex:1}
.compl .tx b{font-size:16px;font-weight:550;letter-spacing:-.015em;display:block}
.compl .tx p{font-size:12.5px;color:var(--ink2);margin-top:5px;line-height:1.45}
.todo{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);
  cursor:pointer;background:none;border-left:none;border-right:none;border-top:none;width:100%;
  font-family:inherit;color:var(--ink);text-align:left}
.todo:last-child{border-bottom:none}
.todo .n{width:24px;height:24px;border-radius:50%;border:1.5px dashed var(--line2);flex:none;
  display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--ink3);font-weight:600}
.todo.done .n{border:none;background:var(--accent);color:#0C1512}
.todo .tx{flex:1;min-width:0}
.todo .tx b{font-size:14px;font-weight:550;display:block;letter-spacing:-.01em}
.todo .tx small{font-size:11.5px;color:var(--ink3);display:block;margin-top:3px;line-height:1.4}
.todo.done .tx b{color:var(--ink3);text-decoration:line-through;text-decoration-color:var(--line2)}
/* the reward, stated plainly */
.todo .xp{font-size:11.5px;font-weight:700;letter-spacing:.03em;flex:none;
  color:var(--accent);background:var(--accent-soft);border:1px solid var(--accent-dim);
  border-radius:999px;padding:5px 10px}
.todo .xp.got{color:var(--ink3);background:none;border-color:var(--line);font-weight:500}
.xpbar{height:9px;border-radius:999px;background:var(--surface2);overflow:hidden;
  border:1px solid var(--line)}
.xpbar i{display:block;height:100%;width:0;border-radius:999px;
  background:linear-gradient(90deg,var(--accent),var(--neon));
  box-shadow:0 0 14px var(--neon-line);
  transition:width .8s cubic-bezier(.22,1,.36,1)}
.xprow{display:flex;align-items:baseline;gap:10px;margin-top:11px}
.xprow b{font-size:17px;font-weight:600;letter-spacing:-.015em;flex:1}
.xprow span{font-size:15px;font-weight:600;color:var(--accent)}

/* ---------- answer rows ---------- */
.arow{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.arow:last-child{border-bottom:none}
.arow .k{font-size:12.5px;color:var(--ink3);width:112px;flex:none;padding-top:1px}
.arow .v{font-size:13.5px;color:var(--ink);flex:1;line-height:1.45}
.arow .v em{font-style:normal;color:var(--ink3)}

/* ---------- journal ---------- */
.jn{display:flex;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.jn:last-child{border-bottom:none}
.jn .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none;margin-top:6px}
.jn .dot.g{background:var(--accent-2)}
.jn .dot.n{background:var(--line2)}
.jn .tx{flex:1;min-width:0}
.jn .tx b{font-size:13.5px;font-weight:550;display:block;letter-spacing:-.01em}
.jn .tx p{font-size:12.5px;color:var(--ink2);margin-top:3px;line-height:1.45;white-space:pre-wrap}
.jn .tm{font-size:11px;color:var(--ink3);flex:none;padding-top:2px}

/* ---------- empty ---------- */
.empty{text-align:center;padding:26px 18px;border:1px dashed var(--line2);border-radius:15px}
.empty svg{width:26px;height:26px;stroke:var(--ink3);fill:none;stroke-width:1.5;
  stroke-linecap:round;stroke-linejoin:round;margin-bottom:11px}
.empty b{font-size:14px;font-weight:550;display:block;margin-bottom:5px}
.empty p{font-size:12.5px;color:var(--ink3);line-height:1.5}

/* ---------- tab bar ---------- */
#tabs{position:absolute;left:0;right:0;bottom:0;height:calc(var(--tabh) + env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom);
  background:rgba(23,26,30,.86);backdrop-filter:blur(18px) saturate(150%);
  -webkit-backdrop-filter:blur(18px) saturate(150%);
  border-top:1px solid var(--line);display:flex;z-index:30}
.tb{flex:1;background:none;border:none;font-family:inherit;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding-top:4px}
.tb svg{width:22px;height:22px;stroke:var(--ink3);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;transition:stroke .2s}
.tb span{font-size:10px;color:var(--ink3);font-weight:500;letter-spacing:.02em;transition:color .2s}
.tb.on svg{stroke:var(--accent)}
.tb.on span{color:var(--accent)}
.tb .nub{position:absolute;top:6px;width:14px;height:2px;border-radius:2px;background:transparent;transition:background .2s}
.tb.on .nub{background:var(--accent);box-shadow:0 0 12px 1px rgba(255,95,162,.6)}

/* ---------- sheet ---------- */
#scrim{position:absolute;inset:0;background:rgba(6,8,10,.62);backdrop-filter:blur(3px);
  opacity:0;pointer-events:none;transition:opacity .3s;z-index:40}
#scrim.on{opacity:1;pointer-events:auto}
#sheet{position:absolute;left:0;right:0;bottom:0;z-index:50;background:var(--bg2);
  border-top:1px solid var(--line2);border-radius:24px 24px 0 0;
  max-height:88%;display:flex;flex-direction:column;
  transform:translateY(102%);transition:transform .38s cubic-bezier(.22,1,.36,1);
  box-shadow:0 -18px 50px rgba(0,0,0,.5)}
#sheet.on{transform:none}
#sheet .grip{width:38px;height:4px;border-radius:2px;background:var(--line2);margin:11px auto 4px;flex:none}
#sheetBody{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  padding:12px 18px calc(24px + env(safe-area-inset-bottom))}
#sheetBody::-webkit-scrollbar{display:none}
#sheetBody h4{font-size:20px;font-weight:550;letter-spacing:-.02em;line-height:1.2}
#sheetBody .shsub{font-size:13px;color:var(--ink2);margin-top:6px;line-height:1.5}

/* video slot */
.vid{aspect-ratio:16/10;border-radius:15px;background:var(--surface2);border:1px solid var(--line);
  margin:16px 0 0;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;
  cursor:pointer}
.vid img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:.42}
.vid .pb{position:relative;width:54px;height:54px;border-radius:50%;background:var(--accent);
  display:flex;align-items:center;justify-content:center;box-shadow:0 8px 26px rgba(62,203,168,.32)}
.vid .pb svg{width:19px;height:19px;fill:#0C1512;stroke:none;margin-left:3px}
.vid .cap{position:absolute;left:12px;bottom:11px;font-size:11px;color:var(--ink2);
  background:rgba(11,13,15,.66);padding:4px 9px;border-radius:999px;backdrop-filter:blur(6px)}

.cues{margin-top:16px}
.cue{display:flex;gap:11px;padding:11px 0;border-bottom:1px solid var(--line)}
.cue:last-child{border-bottom:none}
.cue .n{width:19px;height:19px;border-radius:50%;background:var(--accent-soft);color:var(--accent);
  font-size:10.5px;font-weight:650;display:flex;align-items:center;justify-content:center;flex:none;margin-top:1px}
.cue p{font-size:13.5px;line-height:1.5;color:var(--ink2)}
.cue.bad .n{background:var(--red-soft);color:var(--red)}

/* forms in sheet */
.fld{margin-top:16px}
.fld label{display:block;font-size:11px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--ink3);font-weight:600;margin-bottom:8px}
.fld input,.fld textarea,.fld select{width:100%;background:rgba(255,255,255,.045);
  border:1px solid var(--line);border-radius:13px;padding:14px;color:var(--ink);
  font-size:15.5px;font-family:inherit;outline:none;-webkit-user-select:text;user-select:text;
  transition:border-color .18s}
.fld textarea{min-height:110px;resize:none;line-height:1.5;font-size:14.5px}
.fld input:focus,.fld textarea:focus{border-color:var(--accent)}
.segs{display:flex;gap:7px}
.seg{flex:1;background:rgba(255,255,255,.035);border:1px solid var(--line);border-radius:12px;
  padding:12px 4px;font-size:13px;color:var(--ink2);font-family:inherit;cursor:pointer;font-weight:500}
.seg.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.sheetcta{margin-top:20px}

/* day / block list */
.blk{margin-top:16px}
.blkh{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:9px}
.blkh b{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:600}
.blkh small{font-size:11.5px;color:var(--ink3)}
/* A ported program names its blocks and says why. The role stays the eyebrow;
   the name is the line a person actually reads. */
.blkt{font-size:14.5px;font-weight:600;letter-spacing:-.01em;color:var(--ink);margin:-3px 0 3px}
.blkn{font-size:11.5px;line-height:1.45;color:var(--ink3);margin:0 0 9px}
.mv{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.030);
  border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:7px;
  cursor:pointer;transition:transform .16s}
.mv:active{transform:scale(.985)}
.mv .th{width:44px;height:44px;border-radius:10px;background:var(--surface2);flex:none;overflow:hidden}
.mv .th img{width:100%;height:100%;object-fit:contain}
.mv .tx{flex:1;min-width:0}
.mv .tx b{font-size:14px;font-weight:550;display:block;letter-spacing:-.01em}
.mv .tx small{font-size:12px;color:var(--ink3);display:block;margin-top:3px}
.mv .rx{font-size:13px;color:var(--accent);font-weight:600;flex:none;letter-spacing:-.01em}

/* toast */
#toast{position:absolute;left:50%;bottom:calc(var(--tabh) + env(safe-area-inset-bottom) + 18px);
  transform:translateX(-50%) translateY(14px);z-index:60;
  background:var(--surface2);border:1px solid var(--line2);border-radius:999px;
  padding:11px 18px;font-size:13px;color:var(--ink);box-shadow:var(--shadow);
  opacity:0;pointer-events:none;transition:opacity .28s,transform .28s;white-space:nowrap;max-width:88%}
#toast.on{opacity:1;transform:translateX(-50%)}
</style>
</head>
<body>

<!-- THE LOGO'S PAINT, defined once for the whole document.
     The shape of the ramp is onboarding's - vertical, bright through the
     middle - but the colour is the NEON slot, which is the one the user
     picks under "Glow & edges". The white stay white; only the pink moves.

     The glare is a second pass: light coming off the dumbbell and landing on
     the tube, fading to nothing a little above and below the bar line, which
     crosses the sides at y=100. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <linearGradient id="mkTri" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="268">
    <stop offset="0%"   stop-color="var(--neon)"/>
    <stop offset="26%"  stop-color="var(--neon)" stop-opacity=".8"/>
    <stop offset="37%"  stop-color="#FFFFFF"     stop-opacity=".9"/>
    <stop offset="50%"  stop-color="var(--neon)" stop-opacity=".8"/>
    <stop offset="100%" stop-color="var(--neon)"/>
  </linearGradient>
  <linearGradient id="mkGlare" gradientUnits="userSpaceOnUse" x1="0" y1="70" x2="0" y2="132">
    <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0"/>
    <stop offset="34%"  stop-color="#FFFFFF" stop-opacity=".55"/>
    <stop offset="50%"  stop-color="#FFFFFF" stop-opacity="1"/>
    <stop offset="66%"  stop-color="#FFFFFF" stop-opacity=".55"/>
    <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="mkGlow">
    <stop offset="0%"   stop-color="var(--accent)" stop-opacity=".38"/>
    <stop offset="100%" stop-color="var(--accent)" stop-opacity="0"/>
  </radialGradient>
</defs></svg>
<div id="device">
  <!-- THE WAY IN.
       Opening straight onto a dashboard the first time is like being handed
       a cockpit. This is the one screen between finishing the survey and
       the app: the mark, the person's name, and what happens next. It is
       shown once, and only once, per person. -->
  <div id="intro" hidden>
    <div class="in-mark"></div>
    <div class="in-eye"></div>
    <h1 class="in-name"></h1>
    <p class="in-copy"></p>
    <button class="go in-go">Open my dashboard</button>
    <div class="in-foot">Fitness Journey</div>
  </div>
  <div id="view"></div>

  <nav id="tabs">
    <button class="tb on" data-tab="today"><span class="nub"></span>
      <svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.5V20h13V9.5"/><path d="M9.5 20v-6h5v6"/></svg>
      <span>Today</span></button>
    <button class="tb" data-tab="log"><span class="nub"></span>
      <svg viewBox="0 0 24 24"><path d="M5 3.5h11a3 3 0 0 1 3 3v14H8a3 3 0 0 1-3-3z"/><path d="M5 17.5h11"/><path d="M9 8h6"/><path d="M9 11.5h4"/></svg>
      <span>Log</span></button>
    <button class="tb" data-tab="learn"><span class="nub"></span>
      <svg viewBox="0 0 24 24"><path d="M4 5.5A2 2 0 0 1 6 4h5v16H6a2 2 0 0 0-2 1.5z"/><path d="M20 5.5A2 2 0 0 0 18 4h-5v16h5a2 2 0 0 1 2 1.5z"/></svg>
      <span>Learn</span></button>
    <button class="tb" data-tab="me"><span class="nub"></span>
      <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.6"/><path d="M4.5 20a7.5 7.5 0 0 1 15 0"/></svg>
      <span>Me</span></button>
  </nav>

  <div id="scrim"></div>
  <div id="sheet"><div class="grip"></div><div id="sheetBody"></div></div>
  <div id="toast"></div>
</div>

<script>
/* ============================================================
   1 · THE PERSON
   Read from whatever the survey last wrote on this device.
   In the real app this comes out of the store; here it is inline
   so the prototype is one file you can open anywhere.
   ============================================================ */
/* ============================================================
   1 · WHO THIS IS
   The dashboard used to open with one person's answers typed into
   it. It now READS them, from whatever the survey last wrote, and
   the person is whoever finished the survey on this device.

   THE HANDOFF, in one place so it can be checked:
     onboarding.html  writes  fj.v1.profile.<uid>   the answers
                      writes  fj.v1.current         which uid is live
     dashboard.html   reads   both, and nothing else

   Older builds of the survey wrote `fj_current` with no id at all.
   That is still read, and given an id on arrival, so a survey filled
   in before today still lands somewhere sensible instead of showing
   a stranger's dashboard.
   ============================================================ */
const PROFILE_V = 6;
const BUILD_STAMP = '23 Aug 2026, 17:24';

/* A stable id per person. Email is the only thing the survey collects
   that is unique to a human, so it seeds the id; anyone who skipped it
   gets a random one, which is fine — it only has to be unique on this
   device, and the server will re-key everyone when there is a server. */
function uidFor(a){
  const e = (a && a.email || '').trim().toLowerCase();
  if(!e) return 'u' + Math.random().toString(36).slice(2,10);
  let h = 0;
  for(let i=0;i<e.length;i++){ h = (h*31 + e.charCodeAt(i)) | 0; }
  return 'u' + (h >>> 0).toString(36);
}

/* THE PROFILE CAN ARRIVE IN THE URL.
   localStorage is per-origin, so a survey filled on one page and an app
   opened on another never see each other's storage — which is exactly what
   happened, and no amount of getting the keys right would have fixed it.

   So the answers can also travel IN THE LINK, base64url in the hash, the
   same encoding onboarding already uses for its coach link. That works
   across origins, across devices, and is how a person sends their profile
   to their own phone. On arrival it is written to storage and the hash is
   stripped, so a refresh does not re-import and the URL stops carrying
   somebody's health answers around. */
/* THREE LINK SHAPES, ONE READER.
   This project grew two lineages at once and they invented different links:

     #<payload>   this build — the profile, base64url
     #fj=<...>    the other onboarding — the same profile, prefixed
     #prg=<...>   the other console — a program, sometimes with answers

   Rather than pick a winner and break whoever is holding the other kind of
   link, all three are read. The prefix is stripped, the payload is decoded,
   and whatever it turns out to contain — answers, a program, or both — is
   used. A person should never be told their link is the wrong sort. */
function fromHash(){
  let h = (location.hash || '').replace(/^#/, '');
  if(!h) return null;
  const m = h.match(/^(fj|prg|p)=(.*)$/);
  if(m) h = m[2];
  if(h.length < 24) return null;
  try{
    const b = h.replace(/-/g,'+').replace(/_/g,'/');
    const p = JSON.parse(decodeURIComponent(escape(atob(b))));
    if(!p) return null;
    /* the other lineage nests answers under `answers`, and names the id
       `userId`; normalise both so the rest of this file sees one shape */
    if(!p.a && p.answers) p.a = p.answers;
    if(!p.uid && p.userId) p.uid = p.userId;
    /* a program-only link still has to know who it is for */
    if(!p.a && p.program){
      const cur = localStorage.getItem('fj.v1.current');
      const rec = cur && JSON.parse(localStorage.getItem('fj.v1.profile.'+cur)||'null');
      if(rec && rec.a && (!p.uid || p.uid === cur)) p.a = rec.a, p.uid = cur;
    }
    return p.a ? p : null;
  }catch(e){ return null; }
}

/* ONE SET OF RECORDS, NOT TWO.

   This file grew its own identity store — fj.v1.profile.<uid> and
   fj.v1.current — at the same time as js/ grew the documented one in
   core/schema.js: fj.users, fj.intakes, fj.programs. Two systems, same
   information, no conversation between them. The survey wrote to one and
   the dashboard read the other, so a person who had just onboarded still
   opened on the demo.

   The schema records win, for two reasons: they are the shape docs/BACKEND.md
   commits to for Supabase, so aligning now means the backend swap is a change
   of adapter rather than a rewrite; and they are what the app's runner
   already reads, which is where a workout has to come from.

   The old keys are still read, below, so anything already on a device keeps
   working. Nothing writes them any more. */
function fromRecords(){
  try{
    const uid = localStorage.getItem('fj.user');
    if(!uid) return null;
    const itk = JSON.parse(localStorage.getItem('fj.intakes')||'[]')
      .filter(i => i.userId === uid)
      .sort((x,y)=>String(y.submittedAt).localeCompare(String(x.submittedAt)))[0];
    if(!itk || !itk.answers) return null;
    return {uid, a:itk.answers, at:itk.submittedAt};
  }catch(e){ return null; }
}

function loadProfile(){
  const viaRecords = fromRecords();
  if(viaRecords) return viaRecords;
  try{
    const viaLink = fromHash();
    if(viaLink){
      const uid = viaLink.uid || uidFor(viaLink.a);
      localStorage.setItem('fj.v1.profile.' + uid,
        JSON.stringify({v:PROFILE_V, at:viaLink.at, uid, a:viaLink.a}));
      localStorage.setItem('fj.v1.current', uid);

      /* THE PROGRAM TRAVELS WITH THE PERSON.
         A program written in the console lived in that browser's storage and
         nowhere else, so it could not reach the phone it was written for and
         it died with a reinstall. If the link carries one, it is written into
         this device's coach record — which is exactly where the dashboard
         already looks. Sending someone their program is now sending them a
         link, and re-opening that link restores it. */
      if(viaLink.program && viaLink.program.days){
        try{
          const key = 'fj.v1.' + uid + '.coach';
          const cur = JSON.parse(localStorage.getItem(key) || '{}');
          cur.program = viaLink.program;
          if(viaLink.released) cur.released = viaLink.released;
          localStorage.setItem(key, JSON.stringify(cur));
        }catch(e){}
      }

      /* the record is on the device now, so the URL stops carrying somebody's
         health answers and their program around */
      try{ history.replaceState(null, '', location.pathname + location.search); }catch(e){}
      return {uid, a:viaLink.a, at:viaLink.at};
    }
  }catch(e){}
  try{
    /* the current build */
    const cur = localStorage.getItem('fj.v1.current');
    if(cur){
      const raw = localStorage.getItem('fj.v1.profile.' + cur);
      if(raw){ const p = JSON.parse(raw); if(p && p.a) return {uid:cur, a:p.a, at:p.at}; }
    }
    /* a survey filled in before the handoff existed */
    const legacy = localStorage.getItem('fj_current');
    if(legacy){
      const p = JSON.parse(legacy);
      if(p && p.a){
        const uid = uidFor(p.a);
        localStorage.setItem('fj.v1.profile.' + uid, JSON.stringify({v:PROFILE_V, at:p.at, a:p.a}));
        localStorage.setItem('fj.v1.current', uid);
        return {uid, a:p.a, at:p.at};
      }
    }
  }catch(e){}
  return null;
}

   The survey's day picker counts Monday as 0, because that is how a training
   week reads to a person. Every date function in this file counts Sunday as
   0, because that is what Date.getDay() returns. Nothing converted between
   them, so a person choosing Mon/Wed/Fri was given Sun/Tue/Thu — the answer
   was right and the agenda was wrong.

   Converted once, on the way in, and never thought about again. `dayBase`
   says which convention the answer was written in; profiles saved before
   that field existed were all Monday-based, so they convert too. */
/* THE ANSWERS ARE EDITABLE, SO THEY HAVE TO BE WRITABLE.
   Everything downstream reads A. Until now A was assembled at boot and
   never written back, so "change this" could only ever change the screen
   until the next reload. This puts it back where it came from. */
function saveProfile(){
  try{
    const uid = (typeof USER !== 'undefined' && USER !== 'demo') ? USER : null;
    if(!uid) return;                      /* the sample is not somebody's record */
    localStorage.setItem('fj.v1.profile.' + uid,
      JSON.stringify({v:PROFILE_V, at:new Date().toISOString(), uid, a:A}));
  }catch(e){}
}

/* The week is derived from the days, so moving a day has to rebuild it —
   otherwise the strip and "what is today" disagree until a reload. */
function rebuildWeek(){
  /* one placement rule, used here and at boot — see layWeek() */
  const week = layWeek();
  for(let i=0;i<7;i++) WEEKPLAN[i] = week[i];
  todayId = WEEKPLAN[DOW];
}

function normaliseDays(a){
  if(!a) return a;
  if(a.dayBase === 'sun') return a;                    /* already ours */
  /* BOTH DAY LISTS, OR THE STAMP LIES.
     This converted trainDays and then stamped dayBase:'sun' - but actDays
     is written in the same Monday-based week and was left alone. The stamp
     then told sportDays() the conversion had already happened, so it
     returned the raw list and the sport landed a day early: a Sunday
     football match showed up on Saturday. One flag covering two lists means
     they have to be converted together. */
  const toSun = xs => xs.map(d => (d + 1) % 7).sort((x,y)=>x-y);
  if(Array.isArray(a.trainDays)) a.trainDays = toSun(a.trainDays);
  if(Array.isArray(a.actDays))   a.actDays   = toSun(a.actDays);
  a.dayBase = 'sun';
  return a;
}

/* A LINK OPENED WHILE THE APP IS ALREADY OPEN.
   Tapping a handoff link when the app is on screen changes the fragment
   and nothing else — same document, no reload, so loadProfile() never runs
   again and the new program is silently ignored. It looks exactly like the
   link not working, which is the report that started this.

   A payload arriving after boot means "become this person now", so reload
   once and let the normal path do the work. */
addEventListener('hashchange', function(){
  const h = (location.hash || '').replace(/^#/, '');
  if(h.length > 40) location.reload();
});

const LOADED = loadProfile();
if(LOADED) normaliseDays(LOADED.a);
const IS_DEMO = !LOADED;
const A = Object.assign({}, DEMO, LOADED ? LOADED.a : {});
/* Onboarding does not ask where a person lives, so this is not in the
   answers. Until it is, every buy link points at one market. */
/* Deliberately NOT defaulted. An unanswered country keeps Equipment locked,
   which is the honest state — prices and shop links are wrong without it.
   MARKET falls back to CA only so the currency symbol has something to be

/* THE SURVEY AND THIS PAGE DISAGREED ABOUT WHAT `kit` IS, and it took the
   whole dashboard down the first time a real profile arrived: the survey
   writes {have:[…], other:[…]} — it asks what you own AND what you own that
   it did not list — and everything here expects a flat array, because the
   demo profile was written by hand as one.

   Normalised here, at the boundary, rather than in the twenty places that
   read it. `other` is folded in because a person who typed "sandbag" owns a
   sandbag, and dropping it would silently narrow what we think they have. */
if(A.kit && !Array.isArray(A.kit)){
  A.kit = [].concat(A.kit.have || [], A.kit.other || []).filter(Boolean);
}
/* Same shape problem, same fix: the survey answers "where" as a list. */
if(A.where && !Array.isArray(A.where)) A.where = [A.where].filter(Boolean);

/* Declared HERE, above the program, and not further down where it used to
   live: SESSIONS merges whatever the console saved, and a `const` read
   before its declaration throws into a catch that quietly returns null —
   so the edits were being dropped in silence. Identity resolves first.

   ONE APP, MANY USERS
   Every record is scoped by user id, never by a name baked into a key.
   `fj.v1.<user>.<record>` is the shape. The id is the one the survey
   wrote, so two people filling the survey on one phone get two separate
   dashboards rather than overwriting each other. */
const USER = LOADED ? LOADED.uid : 'demo';
const k = rec => `fj.v1.${USER}.${rec}`;

const COACH_KEY = k('coach');
/* THE PROGRAM COMES FROM THE CONSOLE.
   The sessions below are the shipped first draft. The moment the coach
   console saves a program for this person it replaces them wholesale —
   same shape, edited by a human. One source of truth, and it is the one
   with a person's judgement in it. */
/* THE RELEASED PROGRAM, FROM THE RECORD THE COACH ACTUALLY RELEASED.

   COACH_KEY is this browser's console state. It is the right source when the
   coach and the client are the same tab, and useless the moment the app is
   installed — an installed iOS app has its own storage container, so it
   cannot see what the console wrote. The Program record is what the release
   link carries across that gap (js/release.js), so it is checked first and
   the console's local copy is the fallback for same-device work. */
function releasedProgram(){
  try{
    const uid = localStorage.getItem('fj.user'); if(!uid) return null;
    const prg = JSON.parse(localStorage.getItem('fj.programs')||'[]')
      .find(p => p.assignedTo === uid);
    const raw = prg && prg.profile && prg.profile.raw;
    return (raw && raw.days && Object.keys(raw.days).length) ? raw : null;
  }catch(e){ return null; }
}

/* WHAT THE PERSON IS ACTUALLY ON, for the places that name it.

   Two spots printed "Kettlebell Foundation · Week 1 of 12 · 4 days, 20
   minutes, one bell" as literal text: the program card on Today, and the
   heading of the week sheet. That is one real program - the training
   partner's - and it was shown to everybody, on every program. Nicolas
   opened The Fundamentals, 4 days of 40 minutes, and was told he was doing
   20-minute kettlebell sessions.

   The name and the duration ride along in the released record now. Where
   they are missing - an older link, or a program released before they were
   carried - this says so plainly rather than inventing a title. The sample
   keeps the kettlebell copy, because on the sample it is true. */
function programMeta(){
  const raw  = releasedProgram() || {};
  const days = (Array.isArray(A.trainDays) && A.trainDays.length) || +A.days || 0;
  const mins = parseInt(A.length, 10) || 0;
  if(IS_DEMO) return {
    name: 'Kettlebell Foundation',
    sub:  'Week 1 of 12 \u00b7 Foundation phase \u00b7 4 days, 20 minutes, one bell',
    eyebrow: 'Foundation \u00b7 weeks 1\u20134',
    blurb: 'Twelve weeks in three phases, built around one bell. Weeks one to four teach the hinge - which is why there is no swing in them. The swing is a hinge done fast, and you cannot do a hinge fast before you can do one at all.',
  };
  const bits = [];
  if(days) bits.push(days + (days === 1 ? ' day' : ' days'));
  if(mins) bits.push(mins + ' minutes');
  return {
    name: raw.name || 'Your program',
    sub:  ['Week 1', 'Foundation phase'].concat(bits).join(' \u00b7 '),
    eyebrow: 'Foundation \u00b7 weeks 1\u20134',
    /* No invented prose for a real program. The week below says what the
       week is; a paragraph about somebody else's bell does not. */
    blurb: bits.length ? 'Your week, as it stands: ' + bits.join(', ') + '.' : '',
  };
}

function coachProgram(){
  try{
    const p = releasedProgram()
      || JSON.parse(localStorage.getItem(COACH_KEY)||'{}').program;
    if(!p || !p.days || !Object.keys(p.days).length) return null;
    const out = {};
    for(const [id,d] of Object.entries(p.days)){
      out[id] = {name:d.name, tag:d.tag, why:d.why,
        blocks:(d.blocks||[]).map(b=>({role:b.role, mins:+b.mins||0,
          /* a real program names its blocks — "Knee Armor Circuit", not "Prime".
             Carry the name and the coach's note or the session reads generic. */
          name:b.name||'', note:b.note||'',
          items:(b.items||[]).map(it=>[it.ex, it.pres, it.note].filter(x=>x!==''&&x!=null))}))};
    }
    return out;
  }catch(e){ return null; }
}
function released(id){
  try{
    /* A program that arrived by link was released by the act of sending it —
       the coach does not get to press the switches again on someone else's
       phone. Its own release map rides along inside the record. */
    const prg = JSON.parse(localStorage.getItem('fj.programs')||'[]')
      .find(p => p.assignedTo === localStorage.getItem('fj.user'));
    const carried = prg && prg.profile && prg.profile.released;
    if(carried) return !!carried[id];
    if(prg) return true;
    const r=JSON.parse(localStorage.getItem(COACH_KEY)||'{}').released||{shape:true};
    return !!r[id];
  }catch(e){ return id==='shape'; }
}


const U = A.unit;
const disp = kg => Math.round((U==='lb' ? kg*2.20462 : kg)*10)/10;
/* A WEIGHT, IN THEIR UNIT, WITH THE UNIT ON IT.
   The equipment advice was written as prose with both units baked in and
   kilos first — so someone who told us they think in pounds was reading
   "20 kg / 44 lb" and doing the conversion in their head, in an app that
   already knows the answer. Weights are numbers now and this renders them.
   Rounded to something you can actually buy: kettlebells and plates come in
   steps, not decimals. */
const STEP_KG = [4,6,8,10,12,16,20,24,28,32,36,40];
/* Real sizes people can buy, not arithmetic. Kettlebells come in 26/35/44/53,
   dumbbells and plates in 10/15/20/25/45 — so both are in the list and the
   nearest one wins. Telling someone to get a 44 lb bell finds a shop;
   telling them 44.1 finds nothing. */
const STEP_LB = [10,15,18,20,25,26,30,35,40,44,45,50,53,55,60,62,70,80,90];
function wt(kg, opts){
  const o = opts || {};
  if(U === 'lb'){
    const raw = kg * 2.20462;
    const n = o.exact ? Math.round(raw) : STEP_LB.reduce((b,x)=>
      Math.abs(x-raw) < Math.abs(b-raw) ? x : b, STEP_LB[0]);
    return n + ' lb';
  }
  const n = o.exact ? Math.round(kg) : STEP_KG.reduce((b,x)=>
    Math.abs(x-kg) < Math.abs(b-kg) ? x : b, STEP_KG[0]);
  return n + ' kg';
}
const toKg = v => { const n=parseFloat(v); if(isNaN(n)||n<=0) return null;
  return Math.round((U==='lb' ? n/2.20462 : n)*10)/10; };
