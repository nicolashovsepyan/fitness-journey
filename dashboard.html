  const pct = done/total;

  if(st === 'bars'){
    /* even hairline gaps between every slot, done or not — a gauge */
    const seg = 1/total, gap = 0.016;
    const one = (i,cls) =>
      `<rect class="${cls} ${i<done?'on':''}" ${RRECT}
         data-a="${(i*seg + gap/2).toFixed(5)}" data-b="${((i+1)*seg - gap/2).toFixed(5)}"
         style="--d:${(i*0.08).toFixed(2)}s"/>`;
    const idx = Array.from({length: total}, (_,i)=>i);
    return `<svg class="oring bars" aria-hidden="true">
      ${idx.map(i=>one(i,'rgh')).join('')}${idx.map(i=>one(i,'rg')).join('')}
    </svg>`;
  }

  /* arc + comet — one continuous run out of the top-left corner */
  const notch = Array.from({length: total-1}, (_,i)=>
    `<rect class="notch" ${RRECT}
       data-a="${((i+1)/total - 0.004).toFixed(5)}" data-b="${((i+1)/total + 0.004).toFixed(5)}"/>`).join('');
  const run = cls =>
    `<rect class="${cls} ${done?'on':''}" ${RRECT} data-a="0" data-b="${pct.toFixed(5)}"/>`;
  /* the head: a short bright dash parked exactly where the run ends */
  const head = done && done < total
    ? `<rect class="head" ${RRECT}
         data-a="${Math.max(0, pct-0.009).toFixed(5)}" data-b="${pct.toFixed(5)}"/>` : '';
  return `<svg class="oring ${st}" aria-hidden="true">
    <rect class="track" ${RRECT}/>
    ${notch}${run('rgh')}${run('rg')}${st==='comet'?head:''}
  </svg>`;
}

/* ring + charge live inside the icon tile instead of round the card */
function iconFx(total, done){
  const st = ringStyle();
  if(!total || !ON_ICON(st)) return '';
  const pct = done/total;
  if(st === 'charge')
    return `<span class="chg" style="--h:${(pct*100).toFixed(1)}%"></span>`;

  /* An explicit arc path, not a dashed circle. A circle's own path runs the
     wrong way round on screen and no amount of rotating fixes the direction;
     stating the sweep flag says "clockwise from twelve" and means it. */
  const CX = 22, R = 19;
  const pt = deg => {
    const a = (deg - 90) * Math.PI/180;
    return [(CX + R*Math.cos(a)).toFixed(3), (CX + R*Math.sin(a)).toFixed(3)];
  };
  const track = `<circle class="ir-t" cx="${CX}" cy="${CX}" r="${R}"/>`;
  if(pct <= 0) return `<svg class="icoring" viewBox="0 0 44 44" aria-hidden="true">${track}</svg>`;
  const arc = pct >= 0.999
    ? `M ${CX} ${CX-R} A ${R} ${R} 0 1 1 ${CX-0.01} ${CX-R} `
    : `M ${pt(0).join(' ')} A ${R} ${R} 0 ${pct>0.5?1:0} 1 ${pt(pct*360).join(' ')}`;
  return `<svg class="icoring" viewBox="0 0 44 44" aria-hidden="true">${track}
    <path class="ir-h" d="${arc}"/><path class="ir-c" d="${arc}"/></svg>`;
}

function fold(id, title, body, opts){
  const o = opts||{};
  const open = S.folds ? !!S.folds[id] : !!o.openByDefault;
  /* `steps` and `did` describe the ring: how many pieces, how many lit. */
  const steps = o.steps || 0, did = Math.min(o.did||0, steps);
  const fill = steps ? did/steps : (o.fill==null ? null : Math.max(0, Math.min(1, o.fill)));
  const done = fill!=null && fill>=1;
  const st = steps ? ringStyle() : null;
  return `<div class="fold ${open?'open':''} ${o.tone||''} ${done?'done':''} ${st?'sty-'+st:''}"
    ${fill!=null?`style="--fill:${fill.toFixed(2)};--pct:${(fill*100).toFixed(1)}%"`:''}>
    ${steps?ringSvg(steps, did):''}
    <button class="fold-hd" data-act="fold:${id}">
      <span class="fold-ic">${steps?iconFx(steps, did):''}${svg(o.icon||I.box)}</span>
      <span class="fold-tx"><b>${title}</b>${o.sub?`<small>${o.sub}</small>`:''}</span>
      ${o.badge?`<span class="fold-badge">${o.badge}</span>`:''}
      ${done?`<span class="fold-ck">${svg(I.check)}</span>`
            :(o.note?`<span class="fold-note">${o.note}</span>`:'')}
      <span class="fold-chev">${svg(I.arrow)}</span>
    </button>
    ${open?`<div class="fold-body">${body}</div>`:''}
  </div>`;
}

function unreadCount(){ return MESSAGES.filter(m=>!S.readMsg[m.id] && !S.hidMsg[m.id]).length; }

/* Closed: one line and a dot. Open: the terminal window. The travelling
   light only ever runs on an UNREAD one — the moment it is read it stops,
   which is what makes it mean something. */
function msgBox(m){
  const done = !!S.hidMsg[m.id];
  const open = !!S.openMsg[m.id] && !done;
  const unread = !S.readMsg[m.id] && !done;
  return `<div class="msg ${open?'open':''} ${unread?'unread':''} ${done?'done':''}">
    ${unread && !open ? travelSvg('coach') : ''}
    <button class="msg-hd" data-act="togglemsg:${m.id}">
      <span class="av">N</span>
      <span class="msg-t"><b>${m.from}</b><small>${open?m.at:m.subject}</small></span>
      ${unread?'<span class="ur-dot"></span>'
        :`<span class="msg-chev">${done?'&check;':(open?'&minus;':'+')}</span>`}
    </button>
    ${open?`<div class="msg-body">
      ${m.lines.map(l=>`<p>${l}</p>`).join('')}
      ${m.ask?`<p class="msg-ask">${m.ask}</p>`:''}
      <div class="msg-row">
        ${m.cta?`<button class="ghostline" data-act="log:checkin">${m.cta}</button>`:''}
        <button class="ghostline dim" data-act="hidemsg:${m.id}">Mark done</button>
      </div>
    </div>`:''}
  </div>`;
}

function readyCopy(){
  if(!S.readiness) return '';
  return ({
    low:'<b>Noted.</b> I have pulled the third set off everything and dropped the finisher. Twenty minutes of easy is still a session - and it still counts on the strip.',
    ok:'<b>Fine works.</b> The session stands as written. If set three feels off, stop it there and log it.',
    good:'<b>Good.</b> I have added one set to the push and one to the row. Nothing else changes - week one earns its numbers, it does not chase them.'
  })[S.readiness];
}
function nextDay(){
  for(let i=1;i<=7;i++){ const d=(DOW+i)%7; if(WEEKPLAN[d]) return {id:WEEKPLAN[d],when:i===1?'tomorrow':DAYNM[d]}; }
  return {id:'d1',when:'soon'};
}
function ring(pct,label){
  const r=21,c=2*Math.PI*r, off=c*(1-pct/100);
  return `<svg width="52" height="52" viewBox="0 0 52 52">
    <circle cx="26" cy="26" r="${r}" fill="none" stroke="var(--line)" stroke-width="4"/>
    <circle cx="26" cy="26" r="${r}" fill="none" stroke="var(--accent)" stroke-width="4"
      stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}"
      transform="rotate(-90 26 26)"/>
    <text x="26" y="30" text-anchor="middle" fill="var(--ink)" font-size="15" font-weight="600">${label}</text>
  </svg>`;
}
/* ---------- artwork, and its absence ----------------------------------
   A movement without a picture still gets a card. The placeholder is the
   app's own mark, ghosted, with the pattern name — deliberately blank
   rather than an approximation, because the whole reason we are here is
   that an approximate figure reads as a broken app. */
/* The session's face: the first movement in it that actually has artwork.
   Falls back to the mark rather than to a broken image. */
function heroKey(s){
  for(const b of s.blocks) for(const [k] of b.items) if(EX[k] && EX[k].img) return k;
  return s.blocks[0].items[0][0];
}
function heroArt(s){ const k=heroKey(s); return (EX[k]&&EX[k].img)||''; }
function art(k,cls){
  const e=EX[k];
  return e.img
    ? `<img class="${cls||''}" src="${e.img}" alt="" loading="lazy">`
    : `<span class="noart ${cls||''}" aria-label="Artwork not made yet">
        <svg viewBox="0 0 260 130" aria-hidden="true">
          <path d="M86 65 H174" stroke-width="7" opacity=".5"/>
          <path d="M86 38 V92" stroke-width="12.65"/><path d="M174 38 V92" stroke-width="12.65"/>
          <path d="M66.8 40.7 V89.3" stroke-width="9.9"/><path d="M193.2 40.7 V89.3" stroke-width="9.9"/>
        </svg></span>`;
}
const KITNAME = {bar:'a pull-up bar',band:'bands',db:'dumbbells',kb:'a kettlebell',bench:'a bench',mat:'a mat'};
function exCard(k){
  const e=EX[k], lk=isLocked(k);
  const missing=(e.kit||[]).filter(x=>!OWNED.has(x));
  return `<div class="ex ${S.seen.includes(k)?'seen':''} ${S.queued.includes(k)?'q':''} ${e.img?'':'na'} ${lk?'lk':''}" data-ex="${k}">
    <div class="im">${art(k)}${
      lk ? `<span class="lock">Needs ${missing.map(x=>KITNAME[x]||x).join(' + ')}</span>`
      : e.img ? `<div class="play">${svg(I.play)}</div>`
      : `<span class="soon">Card coming</span>`}</div>
    <div class="lb"><b>${e.n}</b><small>${e.pat}</small></div>
  </div>`;
}

/* ============================================================
   TAB · LOG — the log book

   This is the tab he owns. Onboarding promised him "your log, your data,
   your journey" and told him his name goes on the front of it, so the tab
   has to be a record, not a report: everything that happened, newest first,
   in his own handwriting where he wrote any.

   The numbers sit on top as a summary of the book below them. They are
   derived from the entries — not a separate thing he also has to maintain.
   ============================================================ */

/* Every kind of thing that can happen to him, merged into one stream.
   Sessions, weigh-ins, notes, photos, tests, milestones — one shape, so the
   feed never has to special-case anything to render it. */
/* MILESTONES ARE PROGRESS, NOT ACTIVITY.
   A milestone is a thing that moved him closer to what he came for: the
   first session, a benchmark set, a target chosen, a week completed. A
   weigh-in is a reading, a note is a note, and a message from Coach Nico
   is a conversation — none of those are milestones, and calling them that
   would make the word worth nothing by week two.

   The onboarding entry stays a milestone: it is the moment the program
   became possible.

   Everything carries `at` in prototype-clock milliseconds so the feed can
   be ordered by when it actually happened. Older saves used `t` (a day
   offset), so those are read and converted rather than dropped. */
const AT = e => e.at != null ? e.at
               : (e.t != null ? T0 + e.t*864e5 - 8*36e5 : T0);

function logEntries(){
  const out=[];
  (S.notes||[]).forEach(n=>out.push({at:AT(n), kind:LOGMETA[n.k]?n.k:'note',
    title:n.h, body:n.b}));
  (S.weights||[]).forEach((wp,i)=>out.push({at:(S.weightAt||[])[i] ?? AT({t:wp[0]}),
    kind:'weigh', title:`${disp(wp[1])} ${U}`,
    body:i===0?'Starting weight, from your onboarding.':''}));
  (S.freestyle||[]).forEach(f=>out.push({at:AT(f), kind:'free', title:f.h,
    body:[f.mins,f.rpe].filter(Boolean).join(' \u00b7 ') + (f.b?` \u2014 ${f.b}`:'')}));
  Object.entries(S.doneAt||{}).forEach(([dn,when])=>{
    const idx=DAYNM.indexOf(dn), sid=WEEKPLAN[idx];
    if(!sid) return;
    const ses=SESSIONS[sid];
    out.push({at:when, kind:'session', title:ses.name,
      body:`${ses.blocks.reduce((t,x)=>t+x.mins,0)} minutes \u00b7 ${ses.tag}`});
  });
  Object.entries(S.testAt||{}).forEach(([id,when])=>{
    const t=TESTS.find(x=>x.id===id); if(!t) return;
    out.push({at:when, kind:'pr', title:`${t.name}: ${S.tests[id]} ${t.unit}`,
      body:'Benchmark set. Everything from here is measured against it.'});
  });
  if(S.profile.photo && S.photoAt) out.push({at:S.photoAt, kind:'photo',
    title:'Starting photo', body:'Front and side. Stored on your device.'});
  if(S.targetKg!=null && S.targetAt) out.push({at:S.targetAt, kind:'milestone',
    title:`Target set: ${disp(S.targetKg)} ${U}`, body:'The chart has somewhere to go now.'});
  return out.sort((x,y)=>y.at-x.at);
}

const LOGMETA={
  session:  ['done',  'Session'],
  free:     ['free',  'Freestyle'],
  weigh:    ['weigh', 'Weigh-in'],
  note:     ['note',  'Note'],
  pr:       ['pr',    'Benchmark'],
  photo:    ['photo', 'Photo'],
  milestone:['mile',  'Milestone'],
  coach:    ['reply', 'Coach Nico']
};
/* the filters, and which kinds each one keeps */
const LOGFILTERS = [
  ['all',   'Everything', null],
  ['train', 'Training',   ['session','free','pr']],
  ['mile',  'Milestones', ['milestone']],
  ['coach', 'Coach',      ['coach']]
];

function paneLog(){
  const w = S.weights;
  const cur = w[w.length-1][1], first = w[0][1];
  const single = w.length<2;
  const delta = Math.round((disp(cur)-disp(first))*10)/10;
  const toGoal = S.targetKg!=null ? Math.round((disp(cur)-disp(S.targetKg))*10)/10 : null;
  const done = Object.keys(S.done).length + (S.freestyle||[]).length;
  const entries = logEntries();

  let h = `<div class="pane">${header()}`;

  /* ---- the weigh-in, named and counted down ---- */
  const wi = weighIn();
  /* Doing it is a Today job, so this is the calendar entry, not the button:
     which day, how far off, and on the day itself where to find it. */
  const wiDone = !!(S.todos||{}).weigh;
  h += `<div class="weigh ${wi.today?'now':''} ${wiDone?'done':''}"
      ${wi.today&&!wiDone?'data-act="tab:today"':''}>
    <span class="wi-ic">${svg(wiDone?I.check:I.scale)}</span>
    <span class="wi-tx">
      <b>${wiDone ? 'Logged for this week'
                  : wi.today ? "Today's weight?"
                             : `Weigh-in ${wi.day}`}</b>
      <small>${wiDone ? `Next one ${wi.day}, seven days`
                      : wi.today ? "It is today's one thing"
                                 : `${wi.days} day${wi.days===1?'':'s'} away`}</small>
    </span>
    ${wi.today&&!wiDone?`<span class="wi-go">Go</span>`
      :`<span class="wi-cd"><b class="tnum">${wiDone?'7':wi.days}</b><i>${
          wiDone?'days':(wi.days===1?'day':'days')}</i></span>`}
    <span class="wi-dots" aria-hidden="true">${WEEK_ORDER.map((_,n)=>
      `<i class="${n <= ((WEIGH_DOW - DOW + 7) % 7) ? '' : 'off'}"></i>`).join('')}</span>
  </div>`;

  /* ---- what the book adds up to ---- */
  h += `<div class="tiles three">
    <div class="tile" data-act="logsheet:weight">
      <div class="k">Weight</div>
      <div class="v tnum">${disp(cur)}<small>${U}</small></div>
      <div class="d">${single?'Start':(delta<0?'▼ ':'▲ ')+Math.abs(delta)+' '+U}</div>
    </div>
    <div class="tile" data-act="tab:today">
      <div class="k">Sessions</div>
      <div class="v tnum">${done}</div>
      <div class="d">of 48</div>
    </div>
    <div class="tile" data-act="opentodo:goalweight">
      <div class="k">Target</div>
      <div class="v tnum">${S.targetKg!=null?disp(S.targetKg):' - '}</div>
      <div class="d">${S.targetKg!=null?Math.abs(toGoal)+' to go':'Set it'}</div>
    </div>
  </div>`;

  /* ---- THE LOG ITSELF — the reason this tab exists ---- */
  h += `<div class="sect"><b>Everything, newest first</b><a data-act="logsheet:note">Write</a></div>`;
  h += `<div class="rail4">
    <button class="ql" data-act="logsheet:session">${svg(I.plus)}<span>Freestyle</span></button>
    <button class="ql" data-act="logsheet:weight">${svg(I.scale)}<span>Weight</span></button>
    <button class="ql" data-act="logsheet:note">${svg(I.pen)}<span>Note</span></button>
    <button class="ql" data-act="logsheet:photo">${svg(I.cam)}<span>Photo</span></button>
  </div>`;

  const lf = LOGFILTERS.find(f=>f[0]===(S.logFilter||'all')) || LOGFILTERS[0];
  const shown = lf[2] ? entries.filter(e=>lf[2].includes(e.kind)) : entries;
  h += `<div class="filters">${LOGFILTERS.map(([id,label,kinds])=>{
      const n = kinds ? entries.filter(e=>kinds.includes(e.kind)).length : entries.length;
      return `<button class="fl ${lf[0]===id?'on':''}" data-logf="${id}">${label}${n?` <i>${n}</i>`:''}</button>`;
    }).join('')}</div>`;
  /* The three newest, and the rest on request. The book is the point of this
     tab, but a wall of it on arrival buries the three things that actually
     happened today — and the ones you have already read are the ones you
     are least likely to want. */
  const LOG_HEAD = 3;
  const more = Math.max(0, shown.length - LOG_HEAD);
  const allOpen = !!(S.folds||{}).logall;
  const list = allOpen ? shown : shown.slice(0, LOG_HEAD);
  /* A THREAD, NOT A TABLE.
     The rail-and-dot layout gave every entry the same shape, so a message
     from Coach Nico and a weight Ozzy typed in looked identical and you had
     to read the label to find out who was talking. A conversation solves
     that with position alone: the coach on the left with his initial, Ozzy
     on the right, and anything the app itself recorded down the middle in
     small type where it belongs. */
  const SIDE = {coach:'them', note:'me', weigh:'me', free:'me', photo:'me',
                session:'sys', pr:'sys', milestone:'sys'};
  let lastDay = null;
  h += `<div class="thread">
    ${list.map(e=>{
      const [cls,label]=LOGMETA[e.kind]||['note','Note'];
      const side = SIDE[e.kind] || 'sys';
      const dk = dayKey(new Date(e.at));
      const div = dk!==lastDay ? `<div class="tdiv"><span>${dayLabel(e.at)}</span></div>` : '';
      lastDay = dk;
      /* k- prefix: the kind names are words like "weigh", "note", "free" and
         "done", and several of those are already classes elsewhere — the
         weigh-in CARD's styles were landing on the weigh-in BUBBLE and
         wrapping it in a second box. Namespace them. */
      if(side==='sys') return `${div}<div class="tsys k-${cls}">
        ${svg(I.check,'ts-i')}<b>${esc(e.title)}</b>${e.body?`<span>${esc(e.body)}</span>`:''}
        <i>${hhmm(e.at)}</i></div>`;
      return `${div}<div class="tmsg ${side} k-${cls}">
        ${side==='them'?`<span class="tav">N</span>`:''}
        <div class="tbub">
          <div class="tbub-k">${label}</div>
          <b>${esc(e.title)}</b>
          ${e.body?`<p>${esc(e.body)}</p>`:''}
          <i class="tbub-t">${hhmm(e.at)}</i>
        </div>
      </div>`;
    }).join('')}
    ${shown.length?'':`<div class="empty" style="margin-top:4px">${svg(I.book)}<b>Nothing here yet</b><p>It will fill up.</p></div>`}
    ${more?`<div class="tdiv"><button class="logmore ${allOpen?'on':''}" data-act="fold:logall">
        ${allOpen ? 'Show less' : `Show ${more} more`}${svg(I.arrow,'lmc')}</button></div>`:''}
    ${(allOpen||!more)?`<div class="tstart">Day one \u00b7 nothing here is ever deleted</div>`:''}
  </div>`;

  /* ---- the numbers the book produces ---- */
  h += `<div class="sect"><b>Weight</b><a data-act="logsheet:weight">Weigh in</a></div>
  <div class="card">
    <div class="micro">${single
      ? `One reading so far - ${disp(cur)} ${U}, this morning. Weigh in again next Monday, same time, same clothes, and the line starts.`
      : `${delta<0?'Down':'Up'} ${Math.abs(delta)} ${U} since you started.`}${
      S.targetKg!=null
        ? ` Target is ${disp(S.targetKg)} ${U} - ${Math.abs(toGoal)} ${U} away, which at a safe rate is about ${Math.max(1,Math.round(Math.abs(S.targetKg-cur)/0.45))} weeks.`
        : ` <b style="color:var(--accent-2)">No target set yet</b> - the dotted line has nowhere to go until you pick one.`}</div>
    <div class="chartwrap">${weightChart()}</div>
    ${S.targetKg==null?`<button class="go ghost" style="margin-top:14px" data-act="opentodo:goalweight">Set a target weight</button>`:''}
  </div>`;

  /* Every card is its own test. They all opened the push-up sheet before,
     because every row carried the same data-todo="test". Now each carries
     its own id and the sheet is built from it.

     Laid out as a rail you swipe rather than a list you read: picking a
     test should feel like picking a game, not filling in a form. */
  h += `<div class="sect"><b>Benchmarks</b><span class="micro">${Object.keys(S.tests||{}).length}/${TESTS.length} tested</span></div>
  <div class="rail-h bcar" id="bcar">
    ${TESTS.map((t,i)=>{
      const got=(S.tests||{})[t.id];
      const flipped = !!(S.flip||{})[t.id];
      /* Once a benchmark is set it stops being a challenge and becomes a
         number to beat. The card says the next target rather than sitting
         there inviting a test that has already happened. */
      const target = got ? Math.max(got+1, Math.ceil(got*1.15)) : null;
      return `<div class="bflip ${flipped?'over':''} ${got?'got':''} ${!got&&i===0?'lead':''}">
        <div class="bf-in">
          <button class="bf-face bf-front" data-flip="${t.id}">
            <span class="bc-art">${art(t.id)}</span>
            <b>${t.name}</b>
            <small>${got ? `Beat ${got} ${t.unit}` : t.how}</small>
            <span class="bc-go">${got ? `Next: ${target}` : 'Test'}</span>
          </button>
          <button class="bf-face bf-back" data-flip="${t.id}">
            <span class="bf-eye">${got ? 'Your best' : (t.unit === 'sec' ? 'Hold' : 'Reps')}</span>
            <b>${t.name}</b>
            <p>${got ? `You did ${got}. ${target} beats it - that is the whole challenge.` : t.note}</p>
            ${got?`<span class="bf-score"><i class="tnum">${got}</i>${t.unit}</span>`:''}
            <span class="bc-go alt" data-go="${t.id}">${got?`Go for ${target}`:'Do it now'}</span>
          </button>
        </div>
      </div>`;
    }).join('')}
  </div>
  <div class="bcdots" id="bcdots">${TESTS.map((_,k)=>
    `<i class="${k===0?'on':''}"></i>`).join('')}</div>
  <div class="micro" style="text-align:center;margin:2px 2px 0">Scroll through them. Tap one to turn it over.</div>`;

  const pics = S.photos || [];
  h += `<div class="sect"><b>Photos</b><a data-act="logsheet:photo">Add</a></div>
  ${pics.length
    ? `<div class="shotrail">${pics.map(p=>`<figure class="shotcard">
        <img src="${p.src}" alt=""><figcaption>${dayLabel(p.at)}</figcaption></figure>`).join('')}</div>
       <div class="micro" style="margin:9px 2px 0">${pics.length} photo${pics.length===1?'':'s'},
         on this device only.</div>`
    : `<div class="empty">${svg(I.cam)}<b>No photos yet</b>
        <p>One from the front, one from the side, once a fortnight. Nobody sees them. In twelve weeks they will say more than the scale does.</p></div>`}`;

  return h+`</div>`;
}

/* One series, so no legend — the section title names it. Only the newest point
   is labelled; a number on every point is noise.

   Two states, because on day one there genuinely is only one reading:
   · one point  — the dot, the date, and an honest "no line yet".
   · two or more — the line, plus the target if he has set one.
   The target is HIS. Nothing is drawn until he types a number. */
function weightChart(){
  const W=320,H=132,PL=8,PR=58,PT=14,PB=22;
  const d=S.weights.map(p=>[p[0],disp(p[1])]);
  const goal=S.targetKg!=null ? disp(S.targetKg) : null;
  const single=d.length<2;
  const xs=d.map(p=>p[0]), ys=d.map(p=>p[1]);
  /* with one reading, invent an x-window a week wide so the dot sits left and
     the empty week ahead of it is visible rather than implied */
  const x0=Math.min(...xs), x1=single ? x0+7 : Math.max(...xs);
  const band=ys.concat(goal!=null?[goal]:[]);
  const pad=single&&goal==null ? 2.5 : 1.2;
  const lo=Math.min(...band)-pad, hi=Math.max(...band)+pad;
  const X=v=>PL+(v-x0)/((x1-x0)||1)*(W-PL-PR);
  const Y=v=>PT+(hi-v)/((hi-lo)||1)*(H-PT-PB);
  const pts=d.map(p=>[X(p[0]),Y(p[1])]);
  const last=pts[pts.length-1], lastV=d[d.length-1][1];
  const gy=goal!=null?Y(goal):null;
  return `<svg viewBox="0 0 ${W} ${H}" role="img"
      aria-label="Body weight. ${single?`One reading so far, ${lastV} ${U}.`
        :`${d.length} readings, from ${d[0][1]} to ${lastV} ${U}.`}${goal!=null?` Target ${goal} ${U}.`:''}">
    <line class="gridln" x1="${PL}" y1="${(H-PB).toFixed(1)}" x2="${(W-PR).toFixed(1)}" y2="${(H-PB).toFixed(1)}"/>
    ${gy!=null?`<line class="goalLn" x1="${PL}" y1="${gy.toFixed(1)}" x2="${(W-PR).toFixed(1)}" y2="${gy.toFixed(1)}"/>
      <text class="goalLbl" x="${(W-PR+6).toFixed(1)}" y="${(gy+3.5).toFixed(1)}">target</text>`:''}
    ${single
      ? `<line class="pendingLn" x1="${(last[0]+7).toFixed(1)}" y1="${last[1].toFixed(1)}"
           x2="${(W-PR).toFixed(1)}" y2="${last[1].toFixed(1)}"/>`
      : `<path class="serie" d="${pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ')}"/>`}
    <circle class="dotEnd" cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="4.5"/>
    <text class="endLbl" x="${(last[0]+9).toFixed(1)}" y="${(last[1]-9).toFixed(1)}"
      text-anchor="${single?'start':'start'}">${lastV}</text>
    ${single
      ? `<text class="axl" x="${last[0].toFixed(1)}" y="${H-6}" text-anchor="middle">today</text>
         <text class="axl" x="${(W-PR).toFixed(1)}" y="${H-6}" text-anchor="middle">next Mon</text>`
      : d.map(p=>`<text class="axl" x="${X(p[0]).toFixed(1)}" y="${H-6}" text-anchor="middle">${p[0]===0?'start':'wk '+p[0]/7}</text>`).join('')}
  </svg>`;
}

/* ============================================================
   TAB · LEARN — discovery, not a catalogue

   The browsable grid is the least important thing on this tab. The
   job is to get one new movement into him per visit, so the tab
   opens on a single card he has not seen, and the only two choices
   are learn it or show me another.

   Underneath that sits the starter deck: the movements his own
   program uses, dealt five at a time. Five is a stopping point, not
   a cap — the run offers to end there and lets him carry on if he
   is enjoying it. A deck that never ends gets abandoned mid-way and
   feels like homework; one that says "that's five, well done" gets
   finished and reopened tomorrow.
   ============================================================ */
let LQ='', LF='all', DECK=null, DECKI=0;

/* Deterministic pick-of-the-visit: rotates through everything he has
   not watched, in a fixed order, so it never repeats until it has to
   and never shuffles under him mid-session. */
function tonight(){
  const pool=Object.keys(EX).filter(k=>!isLocked(k) && EX[k].img && !S.seen.includes(k));
  const all =Object.keys(EX).filter(k=>!isLocked(k) && EX[k].img);
  const src = pool.length?pool:all;
  return src[(S.visits||0) % src.length];
}

function paneLearn(){
  const list=Object.keys(EX).filter(k=>{
    const e=EX[k];
    if(LF!=='all'&&e.pat!==LF) return false;
    if(LQ&&!e.n.toLowerCase().includes(LQ.toLowerCase())) return false;
    return true;
  });
  const pats=['all',...new Set(Object.values(EX).filter(e=>!(e.kit||[]).some(x=>!OWNED.has(x))).map(e=>e.pat))];
  const mine=Object.keys(EX).filter(k=>!isLocked(k));
  const locked=list.filter(isLocked);
  const withArt=mine.filter(k=>EX[k].img);
  const seen=S.seen.length;
  const pick=tonight();

  let h=`<div class="pane">${header()}`;

  /* ---------- one movement, tonight ---------- */
  if(pick){
    const e=EX[pick], already=S.seen.includes(pick);
    h+=`<div class="sect" style="margin-top:2px"><b>Tonight's movement</b><span class="micro">${seen} learned</span></div>
    <div class="tonight" data-ex="${pick}">
      <div class="tn-art">${art(pick)}</div>
      <div class="tn-tx">
        <div class="tn-pat">${e.pat}</div>
        <b>${e.n}</b>
        <p>${e.why}</p>
      </div>
      <div class="tn-row">
        <button class="go" data-act="watch:${pick}">${already?'Watch it again':'Learn this one'}</button>
        <button class="go ghost tn-skip" data-act="reroll">Show me another</button>
      </div>
    </div>`;
  }

  /* ---------- the starter deck ---------- */
  h+=`<div class="sect"><b>Your starter deck</b><span class="micro">${seen}/${withArt.length}</span></div>
  <div class="card tap" data-act="deck">
    <div class="prog">
      <div class="ring">${ring(Math.round(seen/withArt.length*100),seen)}</div>
      <div class="tx"><b>${seen?'Pick up where you left off':'Learn the movements in your program'}</b>
        <small>Five cards a run, then you choose whether to keep going. Ten minutes tonight and you will
        walk into Monday knowing what every movement is for.</small></div>
      ${svg(I.arrow,'arw')}
    </div>
  </div>`;

  /* ---------- browse, for when he wants to go looking ---------- */
  h+=`<div class="sect"><b>Everything else</b><span class="micro">${list.filter(k=>!isLocked(k)).length}</span></div>`;
  h+=`<div class="search">${svg(I.search)}<input id="q" placeholder="Search a movement" value="${esc(LQ)}"></div>`;
  h+=`<div class="filters">${pats.map(p=>
    `<button class="fl ${LF===p?'on':''}" data-fl="${p}">${p==='all'?'Everything':p}</button>`).join('')}</div>`;

  const open=list.filter(k=>!isLocked(k));
  h+= open.length ? `<div class="exgrid">${open.map(exCard).join('')}</div>`
    : `<div class="empty">${svg(I.search)}<b>Nothing matches</b><p>Try a different word, or clear the filter.</p></div>`;

  if(withArt.length<mine.length){
    h+=`<div class="micro" style="margin-top:14px;padding:0 2px">${mine.length-withArt.length} movements in your
      program are still having their card drawn. They are in your sessions either way.</div>`;
  }
  if(locked.length){
    h+=`<button class="quietline" data-act="tab:me">
      <span>${locked.length} more movements need kit you do not have</span>
      ${svg(I.arrow,'arw')}
    </button>`;
  }

  return h+`</div>`;
}

/* ---------- the deck run ---------- */
function sheetDeck(){
  if(!DECK){
    /* unseen first, then the rest — so a returning run always opens on
       something new rather than re-dealing what he already knows */
    const pool=Object.keys(EX).filter(k=>!isLocked(k)&&EX[k].img);
    DECK=[...pool.filter(k=>!S.seen.includes(k)),...pool.filter(k=>S.seen.includes(k))];
    DECKI=0;
  }
  if(DECKI>=DECK.length){ DECK=null; return sheetDeckDone(true); }

  const k=DECK[DECKI], e=EX[k];
  const n=DECKI+1, restPoint = n%5===0 && DECKI<DECK.length-1;

  openSheet(`
    <div class="deckbar">
      ${DECK.slice(0,Math.min(DECK.length,10)).map((_,i)=>
        `<span class="dbi ${i<n?'on':''}"></span>`).join('')}
    </div>
    <div class="eyebrow dim" style="margin-top:14px">Card ${n} of ${DECK.length} &middot; ${e.pat}</div>
    <h4 style="margin-top:8px">${e.n}</h4>
    <div class="shsub">${e.why}</div>
    <div class="vid" data-act="watch:${k}">
      ${art(k)}
      <div class="pb">${svg(I.play)}</div>
      <div class="cap">40 seconds</div>
    </div>
    <div class="cues">
      ${e.cues.slice(0,3).map((c,i)=>`<div class="cue"><span class="n">${i+1}</span><p>${c}</p></div>`).join('')}
    </div>
    ${e.bad&&e.bad.length?`<div class="cues">
      <div class="eyebrow" style="margin-bottom:10px;color:var(--red)">The mistake everyone makes</div>
      <div class="cue bad"><span class="n">!</span><p>${e.bad[0]}</p></div>
    </div>`:''}
    <div class="sheetcta">
      <button class="go" data-act="deckgot:${k}">${restPoint?'Got it - that is five':'Got it'}</button>
    </div>
    <button class="go ghost" style="margin-top:9px" data-act="decknext">Skip this one</button>
  `);
}

/* The stopping point. It congratulates, then offers — it never nags. */
function sheetDeckDone(finished){
  const seen=S.seen.length;
  openSheet(`
    <div class="eyebrow">${finished?'Deck complete':'Five done'}</div>
    <h4 style="margin-top:8px">${finished?'That is every movement in your program':'Nice - five in the bank'}</h4>
    <div class="shsub">${finished
      ? `You now know what every movement in your twelve weeks is for. That puts you ahead of most people who have been training for a year.`
      : `You have watched ${seen} now. Stop here and it still counts - or keep going while you are in the mood.`}</div>
    <div class="deckstat">
      <div><b class="tnum">${seen}</b><span>learned</span></div>
      <div><b class="tnum">${S.queued.length}</b><span>queued</span></div>
    </div>
    <div class="sheetcta">
      ${finished
        ? `<button class="go" data-act="close">Done</button>`
        : `<button class="go" data-act="deckmore">Keep going</button>
           <button class="go ghost" style="margin-top:9px" data-act="close">That's enough for tonight</button>`}
    </div>
  `);
}

/* ============================================================
   TAB · ME
   Two jobs: let him finish telling us who he is (every answer
   makes the program better, and saying so out loud is what makes
   people answer), and let him see everything he already said.
   ============================================================ */
/* The percentages are real: the base plus every outstanding weight is exactly
   100. A completeness meter that cannot reach 100 is the fastest way to teach
   someone that your numbers are decoration. */
const PROFILE_BASE=62;
/* Short label, one-line reason, and the reward. The percentage is back
   because it is the reward — a number that visibly moves is the whole
   reason anyone finishes a profile. Each one is worth what it is worth
   to the programming, and the five together take it to 100. */
/* Country is first because it GATES something. Prices, currency and which
   shop a buy link opens are all meaningless without it, so Equipment stays
   shut until it is answered — a locked door with a reason on it, rather
   than a section quietly showing the wrong money. */
const PTODO=[
  ['country',    'Where you are','Sets prices and shops', '5 sec',  4],
  ['photo',      'Photo',        'Front and side',        '2 min',  5],
  ['goalweight', 'Target weight','Gives the chart a line','20 sec', 6],
  ['measure',    'Waist',        'Truer than the scale',  '1 min',  7],
  ['test',       'Push-up test', 'Your first rank',       '90 sec',12],
  ['injury',     'The knee',     'What hurts, and when',  '1 min',  4]
];
/* answered in onboarding one day; until then it is a profile task */
const HAS_COUNTRY = () => !!(S.profile && S.profile.country);
/* Five tiers. Named so the next one is worth reaching. */
const TIERS=[[100,'Complete'],[92,'Dialled in'],[80,'Sharp'],[70,'Warming up'],[0,'Rough sketch']];
const tierOf = pct => TIERS.find(t=>pct>=t[0])[1];
/* THE SUN, as a component.
   It was written inline in the day gauge; both surfaces want it now, so it
   moved out. The disc is solved against its box — r=30 in an 80-tall frame
   leaves 20 units of slack and it ends at cy=40, ten at each end — so at a
   hundred it clears the horizon with daylight under it and still stops
   short of the top. The halo is a SIBLING of the clipped box, never a
   child: inside, its blur hit the box edge and came out square. */
function sunSvg(pct){
  const cy = (110 - pct/100 * 70).toFixed(1);
  const slats = Array.from({length:10}, (_,i) =>
    `<rect x="0" y="${(34 + i*4.2).toFixed(1)}" width="92" height="${(0.6 + i*0.46).toFixed(1)}"/>`).join('');
  return `<span class="sunbox"><svg class="sun" viewBox="0 0 92 80"
      preserveAspectRatio="xMidYMax meet" aria-hidden="true">
    <defs>
      <linearGradient id="sunG" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%"   stop-color="#FFFFFF"/>
        <stop offset="14%"  stop-color="#FFFFFF" stop-opacity=".82"/>
        <stop offset="34%"  stop-color="var(--neon)"/>
        <stop offset="72%"  stop-color="var(--neon)"/>
        <stop offset="100%" stop-color="var(--accent)"/>
      </linearGradient>
      <linearGradient id="sunGl" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0"/>
        <stop offset="22%"  stop-color="#FFFFFF" stop-opacity=".75"/>
        <stop offset="40%"  stop-color="#FFFFFF" stop-opacity="0"/>
        <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
      </linearGradient>
      <mask id="slatM">
        <rect x="0" y="0" width="92" height="140" fill="#fff"/>
        <g fill="#000">${slats}</g>
      </mask>
    </defs>
    <circle class="sun-c" cx="46" cy="${cy}" r="30" fill="url(#sunG)" mask="url(#slatM)"/>
    <circle class="sun-g" cx="46" cy="${cy}" r="30" fill="url(#sunGl)" mask="url(#slatM)"/>
  </svg></span>
  <span class="sunglow" style="--suny:${(cy/80).toFixed(4)}"></span>`;
}

/* The ground under it. One-point perspective from the card's bottom edge up
   to the horizon rule, drawn in the TITLE's colour because it is scenery
   behind words and scenery that competes with words is a mistake. */
const groundSvg = () => `<svg class="gnd" viewBox="0 0 120 30" preserveAspectRatio="none"
    aria-hidden="true">
  ${Array.from({length:13},(_,j)=>`<line x1="60" y1="0" x2="${(-150 + j*30)}" y2="30"/>`).join('')}
  ${[0.34,0.60,0.82,1].map(t=>`<line x1="0" y1="${(30*t*t).toFixed(2)}" x2="120" y2="${(30*t*t).toFixed(2)}"/>`).join('')}
</svg>`;

/* The reactor ring, kept because it belongs on a profile: a number that
   only ever goes up, with light orbiting behind it. Draws an explicit arc
   path — a circle's own path runs the wrong way on screen. */
function reactor(pct){
  const C = 44, R = 34;
  const pt = deg => { const a=(deg-90)*Math.PI/180;
    return `${(C+R*Math.cos(a)).toFixed(2)} ${(C+R*Math.sin(a)).toFixed(2)}`; };
  const arc = pct <= 0 ? '' : (pct >= 99.9
    ? `M ${C} ${C-R} A ${R} ${R} 0 1 1 ${C-0.01} ${C-R}`
    : `M ${pt(0)} A ${R} ${R} 0 ${pct>50?1:0} 1 ${pt(pct*3.6)}`);
  return `<span class="rxg"><span class="rx-orbit"></span>
    <svg class="rx-svg" viewBox="0 0 88 88" aria-hidden="true">
      <circle class="rx-t" cx="44" cy="44" r="34"/>
      ${arc?`<path class="rx-h" d="${arc}"/><path class="rx-c" d="${arc}"/>`:''}
    </svg><span class="rx-n"><b class="tnum">${pct}</b><i>%</i></span></span>`;
}

/* One button, one job: the answers in here are not carved in stone. */
const updateBtn = (label, tab) =>
  `<button class="go ghost upd" data-act="editprofile:${tab||'week'}">${label}</button>`;

function paneMe(){
  const done=PTODO.filter(t=>S.profile[t[0]]).length;
  const pct=PROFILE_BASE+PTODO.reduce((t,x)=>t+(S.profile[x[0]]?x[4]:0),0);
  const nextUp = PTODO.find(x=>!S.profile[x[0]]);
  let h=`<div class="pane">${header()}`;

  /* ---- YOUR PROFILE -------------------------------------------------
     The bar and the fold used to say the same number twice, in two
     different shapes, under two different names. They are one thing now:
     the profile IS the percentage, the reactor ring carries it, and the
     five things that move it live inside. One number, one place. */
  const ps = profStyle();
  h+=`<div class="prof sty-${ps} ${pct>=100?'full':''} ${S.folds&&S.folds.todos?'open':''}"
       style="--pf:${(pct/100).toFixed(3)};--p:${pct}%">
    ${ps==='sunset' ? groundSvg() : ''}
    <button class="prof-hd" data-act="fold:todos">
      <span class="prof-rx">${ps==='sunset'
        ? sunSvg(pct) + `<span class="sunnum" style="--suny:${((110 - pct/100*70)/80).toFixed(4)}"
            ><b class="tnum">${pct}</b><i>%</i></span>`
        : reactor(pct)}</span>
      <span class="prof-tx">
        <b>Your profile</b>
        <small>${nextUp ? `${PTODO.length-done} left · next is +${nextUp[4]}%` : 'Complete'}</small>
        <span class="prof-tier">${tierOf(pct)}</span>
      </span>
      <span class="fold-chev">${svg(I.arrow)}</span>
    </button>
    ${(S.folds&&S.folds.todos)?`<div class="prof-body">
      ${PTODO.map(([k,t,why,secs,xp])=>`<button class="todo ${S.profile[k]?'done':''}" data-todo="${k}">
        <span class="n">${S.profile[k]?'&check;':''}</span>
        <span class="tx"><b>${t}</b><small>${why} &middot; ${secs}</small></span>
        <span class="xp ${S.profile[k]?'got':''}">&plus;${xp}%</span>
      </button>`).join('')}
    </div>`:''}
  </div>`;

  /* ---- everything else, ordered by how much is left to do -----------
     Least finished first. A section you have already dealt with should
     not keep sitting at the top of the screen asking to be looked at. */
  const cards = [];

  /* Every line of this comes out of the survey. Nothing here is typed. */
  const DAYFULL = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const WHEN = {morning:'Mornings', lunch:'Around lunch', evening:'Evenings',
                flex:'Whenever the day allows'};
  const INT  = {easy:'Ease me in', steady:'Steady', push:'Push me'};
  const trainDays = (A.trainDays||[]).slice().sort((a,b)=>a-b);
  const INFO = [['Name',A.name],['Age',A.age],
      ['Country',MARKET.name+' <em> - sets your units, your currency, and where buy links point</em>'],
      ['Height', A.heightCm ? A.heightCm+' cm' : ''],
      ['Weight', A.weightKg ? `${disp(A.weightKg)} ${U}` : ''],
      ['Training at','Home · '+KIT_LABEL],
      ['Days', trainDays.length
        ? `${trainDays.length} a week - ${trainDays.map(d=>DAYNM[d]).join(', ')}`
        : 'Not set'],
      ['Session length', A.length ? A.length+' minutes' : ''],
      ['Experience', `${A.levels&&A.levels.gym||'New'} to the gym · ${
        (A.levels&&A.levels.body||'New').toLowerCase()} to bodyweight`],
      ['When', WHEN[A.when] || 'Whenever the day allows'],
      ['Intensity', INT[A.intensity] || 'Steady'],
      ['Check-in', DAYFULL[WEIGH_DOW] + (A.checkin ? ' morning'
        : ' morning <em> - the day before your first session</em>')]];
  const infoDone = INFO.filter(([,v])=>v!=null && String(v).trim()!=='').length;
  cards.push(['info', `${esc(A.name)}'s info`, `<div class="card plain">
    ${INFO.map(([k,v])=>`<div class="arow"><span class="k">${k}</span><span class="v">${v}</span></div>`).join('')}
    ${updateBtn('Something here has changed','goals')}
  </div>`, {icon: I.user, steps: INFO.length, did: infoDone,
            sub: infoDone===INFO.length ? 'All answered at the start' : 'What you told me at the start'}]);

  /* ---- EQUIPMENT ----------------------------------------------------
     What he owns and what he should buy next were two sections saying one
     thing. They are the same six slots: three filled, three not, and the
     three that are not ARE the upgrade path. One section, one meter, and
     the shop is simply the empty half of the list. */
  const KIT = [['Kettlebell','kb'],['Bench','bench'],['Mat','mat'],
               ['Bar','bar'],['Bands','band'],['Dumbbells','db']];
  const kitHas = KIT.filter(([,k])=>OWNED.has(k)).length;
  const open3 = gearOpen();
  const locked = !HAS_COUNTRY();
  cards.push(['kit', 'Equipment', locked ? `<div class="card plain">
    <div class="lockmsg">
      ${svg(I.alert,'lk-i')}
      <b>One answer away</b>
      <p class="just">Everything below quotes a price and opens a shop. Until I know where
        you are, both would be wrong - so it stays shut rather than guessing.</p>
      <button class="go" data-act="opentodo:country">Tell me where you are</button>
    </div>
  </div>` : `<div class="card plain">
    <div class="kitrow">
      ${KIT.map(([n,k])=>`<span class="kt ${OWNED.has(k)?'has':''}">${n}</span>`).join('')}
    </div>
    <div class="micro just" style="margin-top:12px">${OWNED.has('bar')
      ? 'You have something to hang from, which opens up every pull there is.'
      : 'No bar means no pull-ups, no hanging. Your only pull is a one-arm row.'}</div>
    <button class="go ghost" style="margin-top:13px" data-act="editkit">I got something new</button>

    ${open3.length?`<div class="eqsplit">What to get next</div>
    ${open3.map(g=>{
      const n=unlockCount(g), names=unlockNames(g);
      return `<div class="lvl" data-gear="${g.id}">
        <div class="lv-top">
          <b>${g.name}</b>
          <span class="lv-when ${g.when==='now'?'now':''}">${g.when==='now'?'start here':'wait - '+g.when}</span>
        </div>
        <div class="lv-un">${n?`Unlocks <b>${n}</b> exercise${n===1?'':'s'}`:'No new exercises - but it is how you keep progressing'}</div>
        ${(g.load || g.loadKg)?`<div class="lv-load">${svg(I.scale,'lvi')}${
          g.loadKg ? `<b>${wt(g.loadKg)}</b> ${g.loadWhy||''}` : g.load}</div>`:''}
        ${names.length?`<ul class="lv-list">${names.map(x=>`<li>${x}</li>`).join('')}${n>3?`<li class="more">+${n-3} more</li>`:''}</ul>`:''}
        ${g.alt?`<button class="lv-alt" data-act="gearalt:${g.id}">I have something that could stand in - let me tell you</button>`:''}
        <div class="lv-foot"><span class="gp">${MARKET.currency}${g.price}</span>${svg(I.arrow,'arw')}</div>
      </div>`;
    }).join('')}
    <div class="micro just" style="margin-top:12px">Three at a time, cheapest first.
      Tick one off and the next one appears.</div>`:''}
  </div>`, {icon: I.box, steps: KIT.length, did: kitHas, note: `${kitHas} of ${KIT.length}`,
            sub: locked ? 'Locked \u2014 tell me where you are first'
               : open3.length ? `Next: ${open3[0].name.toLowerCase()} \u00b7 ${MARKET.currency}${open3[0].price}`
                              : 'You have the lot'}]);

  /* WORKING AROUND, FROM HIS ACTUAL ANSWERS.
     This was Ozzy's knee, arm and ankle typed in by hand, so a person with a
     bad shoulder opened the app and was told about somebody else's joints.
     The survey asks exactly this question — it just was not being read.

     Each zone carries the constraint it implies, because "knees" on its own
     is a label and "no loaded bend until it settles" is a rule the program
     can be checked against. */
  const ZONE = {
    neck: ['Neck',        'Nothing overhead until it is quiet'],
    shldr:['Shoulders',   'No pressing overhead, and rows stay below the shoulder'],
    arm:  ['Elbows or wrists','Fists or handles instead of flat palms'],
    mid:  ['Upper back',  'Chest supported wherever a row allows it'],
    low:  ['Lower back',  'Hinges stay light and braced, no loaded rounding'],
    hip:  ['Hips',        'Depth is what you own today, not what the picture shows'],
    knee: ['Knees',       'No loaded bend until it settles'],
    ankle:['Ankles or feet','No jumping, no landing'],
    other:['Something else','You told me in your own words - I have it noted']
  };
  const gpOk = !!S.dismissed.parq;
  const pains = (A.pain||[]).filter(k=>ZONE[k]);
  const needsGP = (A.parq||[]).some(x=>x && x!=='none');

  const AROUND = pains.map(k=>[ZONE[k][0], ZONE[k][1], true]);
  if(A.painNote && String(A.painNote).trim())
    AROUND.push(['In your words', String(A.painNote).trim(), true]);
  if(needsGP)
    AROUND.push(['GP', gpOk ? 'Cleared - we can start adding load'
                            : 'Clearance needed before load goes up', gpOk]);
  if(!AROUND.length)
    AROUND.push(['Nothing flagged', 'You told me nothing hurts. Say the word if that changes.', true]);

  const aroundDone = AROUND.filter(r=>r[2]).length;
  cards.push(['around', 'Working around', `<div class="card plain">
    ${AROUND.map(([k,v,ok])=>`<div class="wrow ${ok?'':'flag'}"><b>${k}</b><span>${v}</span></div>`).join('')}
    <div class="micro just" style="margin-top:12px">${
      (needsGP && !gpOk)
        ? 'The rest are built into the program. The tick from your GP is the one left.'
        : (pains.length
            ? 'Every one of these is designed around, not skipped.'
            : 'Nothing to work around today. That makes this simpler.')}</div>
    ${updateBtn('Something has changed - or something new hurts','pain')}
  </div>`, {icon: I.shield, steps: AROUND.length, did: aroundDone,
            note: `${aroundDone} of ${AROUND.length}`,
            sub: (needsGP && !gpOk) ? 'One still open - the GP tick'
               : (pains.length ? pains.map(k=>ZONE[k][0].toLowerCase()).join(', ')
                               : 'Nothing flagged')}]);

  /* least finished first — a section already dealt with drops to the end */
  cards.sort((x,y)=>{
    const f = c => (c[3].steps ? Math.min(c[3].did||0, c[3].steps)/c[3].steps : 1);
    return f(x) - f(y);
  });
  cards.forEach(c => { h += fold(c[0], c[1], c[2], c[3]); });

  /* ---- housekeeping, pinned to the bottom whatever happens ---- */
  const pick = slotChoice();
  /* The vibe section used to be three colours. It is now everything about
     how the app FEELS: the two gauges, how today is marked, and how hard
     the whole thing glows. All of it is preference, none of it changes what
     the app knows, so it all belongs behind one door. */
  const pick3 = (label, hint, styles, cur, act) => `<div class="vgrp">
    <div class="vlbl">${label}<span>${hint}</span></div>
    <div class="vrow2">${styles.map(([id,nm])=>
      `<button class="vopt ${cur===id?'on':''}" data-act="${act}:${id}">${nm}</button>`).join('')}</div>
  </div>`;

  h+=fold('vibe', 'Customize your vibe', `<div class="card plain">
    ${pick3('Today\u2019s gauge','What the day fills up', DAY_STYLES, dayStyle(), 'daysty')}
    ${pick3('Profile gauge','What the profile fills up', PROF_STYLES, profStyle(), 'profsty')}
    ${pick3('Today on the agenda','How the current day is marked',
       [['stamp','Stamp'],['square','Square']], S.markStyle||'square', 'marksty')}
    ${pick3('Glow','How hard everything shines',
       [['soft','Soft'],['normal','Normal'],['bold','Bold']], S.glow||'normal', 'glowsty')}
    <div class="eqsplit">Colours</div>
    ${THEME.slots.map(sl=>{
      const cur = pal(pick[sl.id]);
      const open = S.openSlot===sl.id;
      return `<div class="crow ${open?'open':''}">
        <button class="crow-hd" data-act="slotopen:${sl.id}" ${S.themeRandom?'disabled':''}>
          <span class="cdot" style="--c:${cur.hex}"></span>
          <span class="ctx"><b>${sl.name}</b><small>${sl.hint}</small></span>
          <span class="cnow">${cur.name}</span>
          <span class="msg-chev">${open?'&minus;':'+'}</span>
        </button>
        ${open?`<div class="cmenu">
          ${THEME.palettes.map(pl=>`<button class="citem ${pl.id===cur.id?'on':''}"
            data-slotsel="${sl.id}:${pl.id}">
            <span class="cdot sm" style="--c:${pl.hex}"></span><b>${pl.name}</b>
            <small>${pl.hint}</small></button>`).join('')}
        </div>`:''}
      </div>`;
    }).join('')}
    <button class="go ${S.themeRandom?'':'ghost'}" style="margin-top:14px" data-act="shuffle">
      ${S.themeRandom?'Shuffling weekly &mdash; turn off':'Surprise me every week'}</button>
  </div>`, {icon: I.drop, sub: 'Three colours, six to pick from',
             note: S.themeRandom?'shuffling':pal(pick.neon).name});

  /* Settings promised three things and did none of them. Units and the two
     data rights are real now; reminders needs a service worker and says so
     rather than sitting there looking clickable. */
  h+=fold('settings', 'Settings', `<div class="card plain">
    <div class="arow"><span class="k">Units</span><span class="v">
      <button class="unitbtn ${U==='kg'?'on':''}" data-act="setunit:kg">kg</button>
      <button class="unitbtn ${U==='lb'?'on':''}" data-act="setunit:lb">lb</button></span></div>
    <div class="arow"><span class="k">Reminders</span><span class="v">Not yet
      <em> - needs notifications, which need the app installed</em></span></div>
    <div class="eqsplit">Your data</div>
    <div class="micro just">Everything this app knows about you is on this device. Nothing has
      been sent anywhere. You can take it with you, or destroy it - both, right now, without
      asking anyone.</div>
    <button class="go ghost" style="margin-top:12px" data-act="exportdata">Download everything</button>
    <button class="go ghost danger" style="margin-top:8px" data-act="wipe">Delete everything</button>
  </div>`, {icon: I.gear, sub: 'Units, reminders, your data'});
  /* A VISIBLE BUILD STAMP.
     "Is the app actually updating?" is unanswerable without one, and it came
     up the moment there was a phone in the loop and a browser cache between
     us. If this line has not changed, neither has anything else. */
  h+=`<div class="micro" style="text-align:center;margin-top:22px;opacity:.6">
    Fitness Journey &middot; build ${BUILD_STAMP}</div>`;

  return h+`</div>`;
}

/* ============================================================
   7 · SHEETS
   ============================================================ */
const scrim=document.getElementById('scrim'), sheet=document.getElementById('sheet'), sBody=document.getElementById('sheetBody');
function openSheet(html){ sBody.innerHTML=html; sheet.classList.add('on'); scrim.classList.add('on'); sBody.scrollTop=0; wireSheet(); }
/* Which to-do, if any, opened the sheet that is currently up. Cleared on
   close as well as on save, so backing out never ticks anything. */
let PENDING_TODO = null;
/* Which habit was ticked a moment ago, so its percentage can visibly catch
   light on the way into the total. Cleared as soon as it has been drawn. */
let JUST_HABIT = null;
/* The last percentage the day gauge drew. A reel that spins on every render
   is a fidget; one that spins only when the number changed is a machine. */
let DAY_LAST = null, DAY_ROLLED = false;
function closeSheet(){ sheet.classList.remove('on'); scrim.classList.remove('on'); PENDING_TODO=null; }
scrim.onclick=closeSheet;

/* Cheapest bit of kit that would unlock this movement. */
function gearFor(k){
  const missing=(EX[k].kit||[]).filter(x=>!OWNED.has(x));
  const g=GEAR.filter(x=>missing.includes(x.kit)).sort((a,b)=>a.rank-b.rank)[0];
  return g?g.id:'bar';
}
function sheetExercise(k){
  const e=EX[k], q=S.queued.includes(k), seen=S.seen.includes(k), lk=isLocked(k);
  const missing=(e.kit||[]).filter(x=>!OWNED.has(x));
  openSheet(`
    <div class="eyebrow dim">${e.pat}</div>
    <h4 style="margin-top:8px">${e.n}</h4>
    <div class="shsub">${e.why}</div>
    ${lk?`<div class="alert" style="margin-top:16px;background:var(--gold-soft);border-color:rgba(217,169,76,.28)">
      ${svg(I.alert,'ic')}
      <div><b style="color:var(--accent-2)">You cannot do this one yet</b>
      <p>It needs ${missing.map(x=>KITNAME[x]||x).join(' and ')}, which you do not have. It is not in your program and nothing in your twelve weeks depends on it.</p></div>
    </div>`:''}
    <div class="vid ${e.img?'':'na'}" ${e.img?`data-act="watch:${k}"`:''}>
      ${art(k)}
      ${e.img?`<div class="pb">${svg(I.play)}</div>
        <div class="cap">40 seconds · ${seen?'watched':'not watched yet'}</div>`
        :`<div class="cap">Card and clip being made</div>`}
    </div>
    ${e.kit&&e.kit.length?`<div style="margin-top:12px"><span class="naTag">Needs: ${e.kit.map(x=>({kb:'kettlebell',bench:'bench',mat:'mat'})[x]||x).join(' · ')}</span></div>`:''}
    <div class="cues">
      <div class="eyebrow" style="margin-bottom:10px">How to do it</div>
      ${e.cues.map((c,i)=>`<div class="cue"><span class="n">${i+1}</span><p>${c}</p></div>`).join('')}
    </div>
    ${e.bad&&e.bad.length?`<div class="cues">
      <div class="eyebrow" style="margin-bottom:10px;color:var(--red)">The mistake everyone makes</div>
      ${e.bad.map(c=>`<div class="cue bad"><span class="n">!</span><p>${c}</p></div>`).join('')}
    </div>`:''}
    <div class="sheetcta">
      ${lk
        ? `<button class="go gold" data-act="gear:${gearFor(k)}">
             What you would need · ${MARKET.currency}${(GEAR.find(g=>g.id===gearFor(k))||{price:' - '}).price}</button>`
        : `<button class="go ${q?'ghost':'gold'}" data-act="queue:${k}">
             ${q?'Remove from next session':'Put it in my next session'}</button>`}
    </div>
    <button class="go ghost" style="margin-top:9px" data-act="close">Close</button>
  `);
}

/* The readiness answer has to actually move the numbers. A card that says
   "I dropped a set" over a session that still shows three is the moment a
   person stops believing anything else on the screen. */
function scaleSession(s){
  const r = S.readiness;
  if(!r || r==='ok') return {blocks:s.blocks, note:''};
  const setDelta = r==='low' ? -1 : 1;
  const blocks = s.blocks
    .filter(b => !(r==='low' && b.role==='Finish'))
    .map(b => ({...b, items: b.items.map(([k,rx,note],i)=>{
      const m = /^(\d+) × (.+)$/.exec(rx);
      /* on a good day only the first two working movements get the extra set */
      const eligible = r==='low' ? true : (b.role==='Work' && i<2);
      if(!m || !eligible) return [k,rx,note];
      const sets = Math.max(1, parseInt(m[1],10) + setDelta);
      return [k, sets+' × '+m[2], note];
    })}));
  return {blocks, note: r==='low'
    ? 'A set off everything and no finisher, because you said rough. It still counts as a full session.'
    : 'An extra set on the push and the row, because you said good. Nothing else changes.'};
}
function sheetDay(id){
  const s=SESSIONS[id];
  const {blocks, note} = scaleSession(s);
  const mins=blocks.reduce((t,b)=>t+b.mins,0);
  openSheet(`
    <div class="eyebrow">${s.tag} · ${mins} minutes</div>
    <h4 style="margin-top:8px">${s.name}</h4>
    <div class="shsub">${s.why}</div>
    ${note?`<div class="micro" style="margin-top:12px;color:var(--accent)">${note}</div>`:''}
    ${blocks.map(b=>`<div class="blk">
      <div class="blkh"><b>${b.role}</b><small>${b.mins} min</small></div>
      ${b.name?`<div class="blkt">${b.name}</div>`:''}
      ${b.note?`<div class="blkn">${b.note}</div>`:''}
      ${b.items.map(([k,rx,note])=>`<div class="mv" data-ex="${k}">
        <div class="th">${art(k)}</div>
        <div class="tx"><b>${EX[k]?EX[k].n:k}</b><small>${note||(EX[k]?EX[k].pat:'')}</small></div>
        <div class="rx">${rx}</div>
      </div>`).join('')}
    </div>`).join('')}
    <div class="sheetcta">
      <button class="go" data-act="start:${id}">Start the session</button>
    </div>
    <button class="go ghost" style="margin-top:9px" data-act="close">Not now</button>
  `);
}

/* A recovery drill laid out like a session, because it is one — a short one
   that loads nothing. Logging it writes a freestyle entry, so the day counts
   on the strip and in the week total rather than reading as a blank. */
/* ============================================================
   BUILD YOUR OWN
   Freestyle used to mean "type what you did afterwards". That is a
   diary, not a workout. This is the other half: pick movements,
   say how many, name it, keep it — and it is there next time
   without being rebuilt.

   The picker only offers what he owns. Being shown a barbell
   movement you cannot do is the app not listening.
   ============================================================ */
const myWorkouts = () => S.mine || (S.mine = []);
const newWid = () => 'w' + Date.now().toString(36);

function sheetBuild(id){
  const w = id ? myWorkouts().find(x=>x.id===id) : null;
  const draft = w ? JSON.parse(JSON.stringify(w))
                  : {id:newWid(), name:'', items:[], at:nowMs()};
  BUILD = draft;
  drawBuild();
}
let BUILD = null;

function drawBuild(){
  const d = BUILD; if(!d) return;
  const mins = Math.max(5, d.items.length * 4);
  openSheet(`<div class="sh-hd">
      <div class="eyebrow">Your own workout</div>
      <h3>${d.items.length ? esc(d.name || 'Untitled') : 'Build a workout'}</h3>
      <p class="micro just">Pick the movements, say how many. It is saved to your list and you can
        run it whenever you like \u2014 it counts on your week the same as anything else.</p>
    </div>
    <div class="fld"><label>Call it something</label>
      <input id="bname" type="text" placeholder="Saturday shoulders" value="${esc(d.name||'')}"></div>

    <div class="blist">
      ${d.items.length ? d.items.map((it,i)=>{
        const e = EX[it.ex] || {n:it.ex};
        return `<div class="brow">
          <span class="bart">${art(it.ex)}</span>
          <span class="btx"><b>${esc(e.n)}</b>
            <input class="bpres" data-i="${i}" placeholder="3 \u00d7 8" value="${esc(it.pres||'')}"></span>
          <button class="bdel" data-bdel="${i}">&times;</button>
        </div>`;
      }).join('') : `<div class="bempty">Nothing in it yet. Add your first movement.</div>`}
    </div>

    <button class="go ghost" data-act="buildadd">+ Add a movement</button>

    <div class="sheetcta">
      ${d.items.length?`<div class="micro" style="margin-bottom:10px">About ${mins} minutes.</div>`:''}
      <button class="go" data-act="buildsave">Save it</button>
      ${myWorkouts().some(x=>x.id===d.id)?`<button class="go ghost" data-act="builddel">Delete</button>`:''}
    </div>`);

  sBody.querySelectorAll('.bpres').forEach(el=>el.onchange=()=>{
    BUILD.items[+el.dataset.i].pres = el.value; });
  sBody.querySelectorAll('[data-bdel]').forEach(b=>b.onclick=()=>{
    const n = sBody.querySelector('#bname'); if(n) BUILD.name = n.value;
    BUILD.items.splice(+b.dataset.bdel,1); drawBuild(); });
}

/* the picker — only what he owns, grouped by pattern */

  const n = sBody.querySelector('#bname'); if(n) BUILD.name = n.value;
  const ok = Object.entries(EX).filter(([,e]) =>
    !(e.kit||[]).length || (e.kit||[]).every(k=>OWNED.has(k)));
  const byPat = {};
  ok.forEach(([id,e])=>{ (byPat[e.pat||'Other'] ||= []).push([id,e]); });
  openSheet(`<div class="sh-hd"><div class="eyebrow">Add a movement</div>
      <h3>What do you want in it?</h3>
      <p class="micro just">Only what your kit can actually do \u2014 ${esc(KIT_LABEL)}.</p></div>
    ${Object.keys(byPat).sort().map(pt=>`
      <div class="psec">${esc(pt)}</div>
      ${byPat[pt].sort((a,b)=>a[1].n.localeCompare(b[1].n)).map(([id,e])=>
        `<button class="prow" data-pick="${id}">

          <span class="btx"><b>${esc(e.n)}</b><small>${esc(e.why||'')}</small></span>
        </button>`).join('')}`).join('')}`);
  sBody.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{
    BUILD.items.push({ex:b.dataset.pick, pres:''}); drawBuild(); });
}

/* ============================================================
   CHANGE YOUR ANSWERS
   Onboarding is a one-off; a life is not. The week moves, a
   shoulder starts hurting, a bar arrives. Every one of those was
   a question the survey asked and then locked, so the only honest
   options were "live with it" or "fill the survey in again".

   Each panel edits the same fields the survey wrote, saves to the
   same profile record, and takes effect immediately — the week
   strip rebuilds, the kit filter changes, Working around updates.
   ============================================================ */
