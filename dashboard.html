.bcard.got .bc-go{color:var(--accent);border-color:var(--accent);box-shadow:none;animation:none}

/* ---------- level up ---------- */
.lvl{padding:15px 0;border-bottom:1px solid var(--line);cursor:pointer}
.lvl:first-of-type{padding-top:2px}
.lvl:last-of-type{border-bottom:none;padding-bottom:2px}
.lvl:active{opacity:.72}
.lv-top{display:flex;align-items:baseline;gap:10px}
.lv-top b{font-size:16px;font-weight:600;letter-spacing:-.015em;flex:1}
.lv-when{font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;
  color:var(--ink3);border:1px solid var(--line2);border-radius:999px;padding:3px 8px;flex:none}
.lv-when.now{color:var(--accent);border-color:var(--accent)}
.lv-un{font-size:13px;color:var(--ink2);margin-top:7px}
.lv-un b{color:var(--accent);font-weight:600}
.lv-list{list-style:none;margin:9px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.lv-list li{font-size:12px;color:var(--ink2);background:rgba(255,255,255,.045);
  border:1px solid var(--line);border-radius:8px;padding:5px 9px}
.lv-list li.more{color:var(--ink3);background:none;border-style:dashed}
.lv-foot{display:flex;align-items:center;gap:9px;margin-top:11px}
.lv-foot .arw{width:15px;height:15px;stroke:var(--ink3);fill:none;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round;margin-left:auto;flex:none}

/* ---------- kit chips ---------- */
.kitrow{display:flex;flex-wrap:wrap;gap:7px}
.kt{font-size:12.5px;font-weight:500;padding:7px 12px;border-radius:999px;
  border:1px dashed var(--line2);color:var(--ink3)}
.kt.has{border-style:solid;border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}

/* ---------- working around ---------- */
.wrow{display:flex;gap:14px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.wrow:last-child{border-bottom:none}
.wrow b{width:64px;flex:none;font-weight:600;color:var(--ink)}
.wrow span{color:var(--ink2);flex:1}
.wrow.flag b{color:var(--red)}

/* ---------- gear rows ---------- */
.gear{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);cursor:pointer}
.gear:last-child{border-bottom:none}
.gear:active{opacity:.7}
.gear .tx{flex:1;min-width:0}
.gear .tx b{font-size:14.5px;font-weight:550;letter-spacing:-.01em;display:block}
.gear .tx small{font-size:12px;color:var(--ink3);display:block;margin-top:3px;line-height:1.4}
.gmeta{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
.gp{font-size:11.5px;font-weight:600;color:var(--ink2);background:rgba(255,255,255,.05);
  border:1px solid var(--line);border-radius:999px;padding:3px 9px}
.gu{font-size:11.5px;font-weight:600;color:var(--accent);background:var(--accent-soft);
  border:1px solid rgba(62,203,168,.28);border-radius:999px;padding:3px 9px}
.gu.zero{color:var(--ink3);background:rgba(255,255,255,.04);border-color:var(--line)}
.gear .arw{width:17px;height:17px;stroke:var(--ink3);fill:none;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- locked movement cards ---------- */
.ex.lk{opacity:.62}
.ex.lk .im{filter:grayscale(1)}
.lock{position:absolute;left:8px;bottom:8px;display:inline-flex;align-items:center;gap:5px;
  font-size:9px;letter-spacing:.09em;text-transform:uppercase;font-weight:600;color:var(--accent-2);
  background:rgba(11,13,15,.62);border:1px solid rgba(217,169,76,.34);border-radius:999px;padding:3px 8px}
.buyrow{display:flex;flex-direction:column;gap:9px;margin-top:20px}
.disclose{font-size:11px;color:var(--ink3);line-height:1.5;margin-top:14px;text-align:center}
.soon{position:absolute;left:8px;bottom:8px;font-size:9px;letter-spacing:.1em;text-transform:uppercase;
  font-weight:600;color:var(--ink3);background:rgba(11,13,15,.55);border:1px solid var(--line);
  border-radius:999px;padding:3px 8px}
.naTag{display:inline-flex;align-items:center;gap:5px;font-size:9.5px;letter-spacing:.1em;
  text-transform:uppercase;font-weight:600;color:var(--ink3);background:rgba(255,255,255,.045);
  border:1px solid var(--line);border-radius:999px;padding:4px 9px}

/* ---------- profile completeness ---------- */
.compl{display:flex;align-items:center;gap:16px}
.compl .tx{flex:1}
.compl .tx b{font-size:16px;font-weight:550;letter-spacing:-.015em;display:block}
.compl .tx p{font-size:12.5px;color:var(--ink2);margin-top:5px;line-height:1.45}
.todo{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);
  cursor:pointer;background:none;border-left:none;border-right:none;border-top:none;width:100%;
  font-family:inherit;color:var(--ink);text-align:left}
.todo:last-child{border-bottom:none}
.todo .n{width:24px;height:24px;border-radius:50%;border:1.5px dashed var(--line2);flex:none;
  display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--ink3);font-weight:600}
.todo.done .n{border:none;background:var(--accent);color:#0C1512}
.todo .tx{flex:1;min-width:0}
.todo .tx b{font-size:14px;font-weight:550;display:block;letter-spacing:-.01em}
.todo .tx small{font-size:11.5px;color:var(--ink3);display:block;margin-top:3px;line-height:1.4}
.todo.done .tx b{color:var(--ink3);text-decoration:line-through;text-decoration-color:var(--line2)}
/* the reward, stated plainly */
.todo .xp{font-size:11.5px;font-weight:700;letter-spacing:.03em;flex:none;
  color:var(--accent);background:var(--accent-soft);border:1px solid var(--accent-dim);
  border-radius:999px;padding:5px 10px}
.todo .xp.got{color:var(--ink3);background:none;border-color:var(--line);font-weight:500}
.xpbar{height:9px;border-radius:999px;background:var(--surface2);overflow:hidden;
  border:1px solid var(--line)}
.xpbar i{display:block;height:100%;width:0;border-radius:999px;
  background:linear-gradient(90deg,var(--accent),var(--neon));
  box-shadow:0 0 14px var(--neon-line);
  transition:width .8s cubic-bezier(.22,1,.36,1)}
.xprow{display:flex;align-items:baseline;gap:10px;margin-top:11px}
.xprow b{font-size:17px;font-weight:600;letter-spacing:-.015em;flex:1}
.xprow span{font-size:15px;font-weight:600;color:var(--accent)}

/* ---------- answer rows ---------- */
.arow{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.arow:last-child{border-bottom:none}
.arow .k{font-size:12.5px;color:var(--ink3);width:112px;flex:none;padding-top:1px}
.arow .v{font-size:13.5px;color:var(--ink);flex:1;line-height:1.45}
.arow .v em{font-style:normal;color:var(--ink3)}

/* ---------- journal ---------- */
.jn{display:flex;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.jn:last-child{border-bottom:none}
.jn .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none;margin-top:6px}
.jn .dot.g{background:var(--accent-2)}
.jn .dot.n{background:var(--line2)}
.jn .tx{flex:1;min-width:0}
.jn .tx b{font-size:13.5px;font-weight:550;display:block;letter-spacing:-.01em}
.jn .tx p{font-size:12.5px;color:var(--ink2);margin-top:3px;line-height:1.45;white-space:pre-wrap}
.jn .tm{font-size:11px;color:var(--ink3);flex:none;padding-top:2px}

/* ---------- empty ---------- */
.empty{text-align:center;padding:26px 18px;border:1px dashed var(--line2);border-radius:15px}
.empty svg{width:26px;height:26px;stroke:var(--ink3);fill:none;stroke-width:1.5;
  stroke-linecap:round;stroke-linejoin:round;margin-bottom:11px}
.empty b{font-size:14px;font-weight:550;display:block;margin-bottom:5px}
.empty p{font-size:12.5px;color:var(--ink3);line-height:1.5}

/* ---------- tab bar ---------- */
#tabs{position:absolute;left:0;right:0;bottom:0;height:calc(var(--tabh) + env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom);
  background:rgba(23,26,30,.86);backdrop-filter:blur(18px) saturate(150%);
  -webkit-backdrop-filter:blur(18px) saturate(150%);
  border-top:1px solid var(--line);display:flex;z-index:30}
.tb{flex:1;background:none;border:none;font-family:inherit;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding-top:4px}
.tb svg{width:22px;height:22px;stroke:var(--ink3);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;transition:stroke .2s}
.tb span{font-size:10px;color:var(--ink3);font-weight:500;letter-spacing:.02em;transition:color .2s}
.tb.on svg{stroke:var(--accent)}
.tb.on span{color:var(--accent)}
.tb .nub{position:absolute;top:6px;width:14px;height:2px;border-radius:2px;background:transparent;transition:background .2s}
.tb.on .nub{background:var(--accent);box-shadow:0 0 12px 1px rgba(255,95,162,.6)}

/* ---------- sheet ---------- */
#scrim{position:absolute;inset:0;background:rgba(6,8,10,.62);backdrop-filter:blur(3px);
  opacity:0;pointer-events:none;transition:opacity .3s;z-index:40}
#scrim.on{opacity:1;pointer-events:auto}
#sheet{position:absolute;left:0;right:0;bottom:0;z-index:50;background:var(--bg2);
  border-top:1px solid var(--line2);border-radius:24px 24px 0 0;
  max-height:88%;display:flex;flex-direction:column;
  transform:translateY(102%);transition:transform .38s cubic-bezier(.22,1,.36,1);
  box-shadow:0 -18px 50px rgba(0,0,0,.5)}
#sheet.on{transform:none}
#sheet .grip{width:38px;height:4px;border-radius:2px;background:var(--line2);margin:11px auto 4px;flex:none}
#sheetBody{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  padding:12px 18px calc(24px + env(safe-area-inset-bottom))}
#sheetBody::-webkit-scrollbar{display:none}
#sheetBody h4{font-size:20px;font-weight:550;letter-spacing:-.02em;line-height:1.2}
#sheetBody .shsub{font-size:13px;color:var(--ink2);margin-top:6px;line-height:1.5}

/* video slot */
.vid{aspect-ratio:16/10;border-radius:15px;background:var(--surface2);border:1px solid var(--line);
  margin:16px 0 0;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;
  cursor:pointer}
.vid img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:.42}
.vid .pb{position:relative;width:54px;height:54px;border-radius:50%;background:var(--accent);
  display:flex;align-items:center;justify-content:center;box-shadow:0 8px 26px rgba(62,203,168,.32)}
.vid .pb svg{width:19px;height:19px;fill:#0C1512;stroke:none;margin-left:3px}
.vid .cap{position:absolute;left:12px;bottom:11px;font-size:11px;color:var(--ink2);
  background:rgba(11,13,15,.66);padding:4px 9px;border-radius:999px;backdrop-filter:blur(6px)}

.cues{margin-top:16px}
.cue{display:flex;gap:11px;padding:11px 0;border-bottom:1px solid var(--line)}
.cue:last-child{border-bottom:none}
.cue .n{width:19px;height:19px;border-radius:50%;background:var(--accent-soft);color:var(--accent);
  font-size:10.5px;font-weight:650;display:flex;align-items:center;justify-content:center;flex:none;margin-top:1px}
.cue p{font-size:13.5px;line-height:1.5;color:var(--ink2)}
.cue.bad .n{background:var(--red-soft);color:var(--red)}

/* forms in sheet */
.fld{margin-top:16px}
.fld label{display:block;font-size:11px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--ink3);font-weight:600;margin-bottom:8px}
.fld input,.fld textarea,.fld select{width:100%;background:rgba(255,255,255,.045);
  border:1px solid var(--line);border-radius:13px;padding:14px;color:var(--ink);
  font-size:15.5px;font-family:inherit;outline:none;-webkit-user-select:text;user-select:text;
  transition:border-color .18s}
.fld textarea{min-height:110px;resize:none;line-height:1.5;font-size:14.5px}
.fld input:focus,.fld textarea:focus{border-color:var(--accent)}
.segs{display:flex;gap:7px}
.seg{flex:1;background:rgba(255,255,255,.035);border:1px solid var(--line);border-radius:12px;
  padding:12px 4px;font-size:13px;color:var(--ink2);font-family:inherit;cursor:pointer;font-weight:500}
.seg.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.sheetcta{margin-top:20px}

/* day / block list */
.blk{margin-top:16px}
.blkh{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:9px}
.blkh b{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:600}
.blkh small{font-size:11.5px;color:var(--ink3)}
.mv{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.030);
  border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:7px;
  cursor:pointer;transition:transform .16s}
.mv:active{transform:scale(.985)}
.mv .th{width:44px;height:44px;border-radius:10px;background:var(--surface2);flex:none;overflow:hidden}
.mv .th img{width:100%;height:100%;object-fit:contain}
.mv .tx{flex:1;min-width:0}
.mv .tx b{font-size:14px;font-weight:550;display:block;letter-spacing:-.01em}
.mv .tx small{font-size:12px;color:var(--ink3);display:block;margin-top:3px}
.mv .rx{font-size:13px;color:var(--accent);font-weight:600;flex:none;letter-spacing:-.01em}

/* toast */
#toast{position:absolute;left:50%;bottom:calc(var(--tabh) + env(safe-area-inset-bottom) + 18px);
  transform:translateX(-50%) translateY(14px);z-index:60;
  background:var(--surface2);border:1px solid var(--line2);border-radius:999px;
  padding:11px 18px;font-size:13px;color:var(--ink);box-shadow:var(--shadow);
  opacity:0;pointer-events:none;transition:opacity .28s,transform .28s;white-space:nowrap;max-width:88%}
#toast.on{opacity:1;transform:translateX(-50%)}
</style>
</head>
<body>

<script>
/* ============================================================
   1 · THE PERSON
   Seeded from Ozzy's real onboarding payload (v6, 10 Aug 2026).
   In the real app this comes out of the store; here it is inline
   so the prototype is one file you can open anywhere.
   ============================================================ */
const A = {
  name:'Ozzy', sex:'m', age:45, heightCm:180, weightKg:88.6, unit:'lb',
  horizon:['kids','nopain','sport'], focus:['lean','strong'],
  activity:'light', tracker:'none', shape:{now:3}, weightTend:'gains',
  where:['homekit'], kit:['kb','bench','mat'],
  /* Onboarding never asks where he lives, so this is set here for now.
     It drives currency and which shop the buy links open — both wrong by
     default for anyone outside the market we happen to hard-code. */
  country:'CA',
  levels:{gym:'New',body:'New'},
  when:'flex', days:4, length:'20', trainDays:[0,1,3,5],
  driver:['lose','doctor','kids'], blockers:['time','life','week3'],
  parq:['joint','other'], pain:['arm','knee','ankle'],
  intensity:'push', checkin:'mon', email:'Ozzy.doy@gmail.com'
};
/* Weight is stored in kilograms and shown in whatever unit he chose. Every
   number on screen goes through here — mixing the two on one screen is the
   fastest way to make a person distrust everything else you show them. */
const U = A.unit;
const disp = kg => Math.round((U==='lb' ? kg*2.20462 : kg)*10)/10;
const toKg = v => { const n=parseFloat(v); if(isNaN(n)||n<=0) return null;
  return Math.round((U==='lb' ? n/2.20462 : n)*10)/10; };

/* ============================================================
   2 · THE PROGRAM
   Four days, twenty minutes, home with a kettlebell, a bench and
   a mat. Brand new to all of it, 45, and carrying a sore arm,
   knee and ankle — so week one is joint-first and nothing loads
   a knee under a bent leg. Every movement here has real artwork.
   ============================================================ */
/* ------------------------------------------------------------
   HIS KIT — the hard boundary on everything below.
   He ticked three things out of fifteen. No band, no bar, no
   dumbbells. Every movement in this file is checked against it.
   ------------------------------------------------------------ */
const OWNED = new Set(['kb','bench','mat']);
const KIT_LABEL = 'one kettlebell, a bench, a mat';

/* Which market the buy links point at, and what currency to print. The
   onboarding formats dates en-GB but we do not actually know where he is —
   set this per user, never guess it in copy. */
const MARKETS = {
  CA:{currency:'$', suffix:' CAD', search:'https://www.amazon.ca/s?k=', name:'Canada'},
  US:{currency:'$', suffix:' USD', search:'https://www.amazon.com/s?k=', name:'United States'},
  GB:{currency:'\u00A3', suffix:'',  search:'https://www.amazon.co.uk/s?k=', name:'United Kingdom'}
};
const MARKET = MARKETS[A.country] || MARKETS.CA;

/* ------------------------------------------------------------
   THE MOVEMENTS
   `img:null` means the artwork does not exist yet. The card still
   renders — as a proper placeholder, never a stick figure — and
   the movement is still programmed, because what he should be
   doing is not decided by which pictures we happen to own.
   Every null here appears in CARDS-TO-MAKE.md.
   ------------------------------------------------------------ */
/* >>> GENERATED MOVEMENTS — do not edit by hand.
   Regenerate with:  node tools/build-spine.mjs && node tools/build-app-data.mjs
   Source of truth:  js/data/exercises.js -> spine/catalog.json
   38 movements, built 2026-08-13. */
const EX = {
  cat_cow:{n:'Cat–Cow',pat:'Mobility',img:null,kit:['mat'],why:'Thirty seconds that decides whether your back joins in for the rest of the session.',cues:['On hands and knees. Wrists under shoulders, knees under hips.','Breathe out and round the spine up. Breathe in and let it sag.','Move one vertebra at a time. Slower is the whole point.'],bad:['Rushing it like a warm-up you have to get through. It is the session, not the queue for it.']},
  hip_90_90:{n:'90/90 Hip Switches',pat:'Mobility',img:null,kit:['mat'],why:'Opens the hip so the hinge comes from the hip and not the lower back.',cues:['Sit with one shin in front at 90°, the other out to the side at 90°.','Keep the chest tall and rotate both knees to the other side.','Go slowly. Stop where it gets sharp, not where it gets hard.'],bad:['Falling onto the hands to get across. Hands on the floor for balance is fine, throwing yourself over is not.']},
  deep_squat_rock:{n:'Deep Squat Rocks',pat:'Mobility',img:'images/exercises/deep_squat_rock.png',kit:[],why:'Opens the ankle and the hip before anything asks them to work.',cues:['Heels down. Put them on a book if they lift — that is the ankle, not a failure.','Hold the deepest squat you own and rock gently side to side.','Chest tall. You are opening the hip, not folding over it.'],bad:['Bouncing at the bottom. Slow rocking beats bounce every time, and your knee will agree.']},
  glute_bridge:{n:'Glute Bridge',pat:'Glutes',img:null,kit:['mat'],why:'Wakes the glutes so your knee stops doing their job.',cues:['On your back, heels close to your bum, toes up.','Drive through the heels and squeeze hard at the top for one full second.','Ribs down. The lift comes from the glutes, not the lower back.'],bad:['Arching the back at the top and calling it height. Less range, more squeeze.']},
  dead_bug:{n:'Dead Bug',pat:'Core',img:'images/exercises/dead_bug.png',kit:['mat'],why:'Teaches the brace you will need the second a kettlebell leaves the floor.',cues:['On your back, arms straight up, knees over hips at 90°.','Press the lower back flat into the mat and keep it there.','Lower one arm and the opposite leg. Only as far as the back stays flat.'],bad:['The lower back lifting off the mat. That is the exercise ending, whatever your limbs are doing.']},
  kb_halo:{n:'Kettlebell Halo',pat:'Mobility',img:null,kit:['kb'],why:'Shoulder prep with the bell in your hands — and the kindest thing you can do for a sore arm before pressing.',cues:['Hold the bell upside down by the horns, close to your chest.','Circle it slowly around your head, close to the skull.','Five one way, five the other. Ribs stay down throughout.'],bad:['Leaning back as it goes behind you. Stand still and let the shoulders do the travelling.']},
  prying_goblet:{n:'Prying Goblet Squat',pat:'Mobility',img:null,kit:['kb'],why:'The bell in front is what lets you sit into a squat your knee is happy with.',cues:['Hold the bell at your chest and sit into the deepest squat you have.','Use the elbows to gently push the knees out, and rock.','Let the weight pull you down. It is a stretch, not a set.'],bad:['Treating it as a squat rep. There is no standing up in a hurry here.']},
  kb_deadlift:{n:'Kettlebell Deadlift',pat:'Hinge',img:null,kit:['kb'],why:'The first movement of the whole program. Everything a kettlebell does later is this, faster.',cues:['Bell on the floor between your feet, feet about hip width.','Push the hips back until your hands reach it. Back stays flat, shins near vertical.','Stand up by driving the floor away and squeezing the glutes at the top.'],bad:['Squatting down to it. Hips back, not hips down — the knees only bend as much as the hips demand.']},
  kb_rdl:{n:'Kettlebell Romanian Deadlift',pat:'Hinge',img:null,kit:['kb'],why:'The hamstring half of the hinge, and the reason your lower back stops taking the load.',cues:['Start standing, bell in both hands in front of your thighs.','Push the hips back and slide the bell down your legs. Soft knees, they do not bend further.','Go until you feel the hamstrings, then stand tall.'],bad:['Rounding the back to get lower. The hamstrings decide the depth, not your ambition.']},
  single_leg_rdl:{n:'Single-Leg RDL',pat:'Hinge',img:'images/exercises/single_leg_rdl.png',kit:[],why:'Hamstrings, balance, and a hip that finally works one side at a time.',cues:['Soft knee on the standing leg. It stays soft, it does not bend more.','Hinge until you feel the hamstring, back leg rising behind you.','Hips stay square to the floor. Do not let the back hip roll open.'],bad:['Rounding the back to reach lower. Stop where the hamstring stops you.']},
  kb_swing:{n:'Kettlebell Swing',pat:'Hinge',img:'images/exercises/kb_swing.png',kit:['kb'],phase:2,why:'The movement the whole thing has been building to. It arrives in week five, not week one.',cues:['Hike the bell back between your legs like a rugby pass.','Snap the hips forward hard. The bell floats to chest height on its own.','Arms are rope. They do not lift anything.'],bad:['Squatting and lifting it with the shoulders. That is not a swing and it is how backs get hurt.']},
  box_squat:{n:'Bench Squat',pat:'Legs',img:null,kit:['bench'],why:'A squat with a floor under it. The bench tells your knee exactly how far it is going.',cues:['Stand in front of the bench, feet a bit wider than hips.','Sit back until you touch it lightly, then stand.','Touch. Do not drop onto it.'],bad:['Going deeper than the bench because it felt fine. Depth is earned in weeks, not in one set.']},
  goblet_squat:{n:'Goblet Squat',pat:'Legs',img:null,kit:['kb'],why:'The counterweight at your chest is what makes a squat knee-friendly for a beginner.',cues:['Hold the bell at chest height, elbows tucked in.','Sit down between the hips, chest tall, to the bench.','Drive up through the whole foot.'],bad:['Letting the elbows drift out and the chest fold. The bell stays glued to your sternum.']},
  bulgarian_split:{n:'Bulgarian Split Squat',pat:'Legs',img:'images/exercises/bulgarian_split.png',kit:['bench'],phase:3,why:'One leg at a time — the fastest way to find and fix a weak side. It waits until the knee says yes.',cues:['Back foot on the bench, front foot a long stride out.','Drop straight down, front thigh towards parallel.','All the weight through the front heel.'],bad:['Starting this before the knee is ready. It is parked until week nine at the earliest.']},
  wall_sit:{n:'Wall Sit',pat:'Legs',img:'images/exercises/wall_sit.png',kit:[],why:'Quad strength with nothing moving — which is why the knee tolerates it when reps do not.',cues:['Back flat on the wall, slide down until the thighs are where the knee is comfortable.','Hands off the thighs.','Breathe. Come out before the form goes.'],bad:['Going to ninety degrees because that is the picture. Go to where it does not hurt.']},
  pushup:{n:'Push-ups',pat:'Push',img:'images/exercises/pushup.png',kit:['bench'],why:'The whole upper body in one movement. Everything scales from here.',cues:['Hands on the bench to start — the higher the hands, the easier it is.','One line from ear to heel. Squeeze the glutes.','Elbows back at about 45°, not flared out to the sides.'],bad:['Hips sagging first. If they do, raise the hands. Do not cut the reps.']},
  kb_floor_press:{n:'Kettlebell Floor Press',pat:'Push',img:null,kit:['kb','mat'],why:'Pressing with a hard stop at the bottom, so the sore shoulder never goes anywhere it does not want to.',cues:['On your back on the mat, knees bent, bell in one hand at your chest.','Press straight up. The bell finishes over the shoulder, not the face.','Lower until the upper arm touches the mat, then go again.'],bad:['Bouncing the elbow off the floor. Touch, pause, press.']},
  kb_press:{n:'Kettlebell Overhead Press',pat:'Press',img:null,kit:['kb'],phase:3,why:'Overhead, once the shoulder and the arm have earned it.',cues:['Bell in the rack position, resting on the forearm, wrist straight.','Press up and slightly back until the arm is by your ear.','Ribs down. The lower back does not help.'],bad:['Pressing through arm pain. This one waits for the GP tick and a quiet shoulder.']},
  single_arm_row:{n:'Single-Arm Row',pat:'Pull',img:null,kit:['kb','bench'],why:'Square hips, drive elbow back, full stretch.',cues:['Square hips, drive elbow back, full stretch.'],bad:[]},
  kb_high_pull:{n:'Kettlebell High Pull',pat:'Pull',img:null,kit:['kb'],phase:3,why:'A swing that finishes in a pull. Upper back work without anything to hang from.',cues:['Swing as normal, then guide the elbow high and back as the bell floats.','The hips still do all the work.'],bad:['Pulling early with the arm. The bell must be weightless before the elbow moves.']},
  suitcase_carry:{n:'Suitcase Carry',pat:'Carry',img:null,kit:['kb'],why:'Grip, core and posture at once, and it looks like nothing. Perfect for a small flat.',cues:['One bell in one hand, hanging by your side. Stand tall.','Walk. Do not lean away from it — resist the tilt.','Swap hands and walk back.'],bad:['Leaning to the other side to balance. Staying vertical IS the exercise.']},

  farmers_carry:{n:'Farmer\'s Carry (no straps)',pat:'Conditioning',img:'images/exercises/farmers_carry.png',kit:['kb'],phase:2,why:'A dumbbell in each hand, no straps — grip is the point. Walk tall, shoulders back, 30-40 m. Set them down when the round is done, not when your grip fails. If they slip early, go lighter. Start 40-50 lb per hand.',cues:['A dumbbell in each hand, no straps — grip is the point. Walk tall, shoulders back, 30-40 m. Set them down when the round is done, not when your grip fails. If they slip early, go lighter. Start 40-50 lb per hand.'],bad:[]},

/* Deterministic, so it does not reshuffle every time the page redraws, and

function todayTodo(){
  const wi = weighIn();
  if(wi.today) return TODOS[0];
  const seed = Math.floor(NOW.getTime() / 86400000);
  return TODOS[1 + (seed % (TODOS.length - 1))];
}

function dayScore(){
  const isTraining = !!todayId;
  const parts = (isTraining ? SCORE_TRAIN : SCORE_REST).map(x=>({...x}));
  const HABITS = HABITS_FOR();
  const habDone = HABITS.filter(h=>S.habits[h.id]).length;
  const got = {
    open:    1,
    ready:   S.readiness ? 1 : 0,
    habits:  HABITS.length ? habDone / HABITS.length : 0,
    note:    (S.notes||[]).some(n=>n.t===0 && (n.k==='note'||n.k==='reply')) ||
             (S.freestyle||[]).some(f=>f.t===0) ? 1 : 0,
    session: todayDone() ? 1 : 0,
    todo:    (S.todos||{})[todayTodo().id] ? 1 : 0

  const earned = parts.reduce((t,p)=>t + p.pts*(got[p.id]||0), 0);
  return {pct: Math.round(earned), parts, got, isTraining};
}

   zero it rendered as 31 Dec 1969. */
function datePlaceholders(){
  const start = T0 - 13*36e5;                 /* this morning, 08:40 */
  (S.notes||[]).forEach(n=>{ if(!n.at) n.at = start; });
  S.weightAt = (S.weightAt||[]).map(v => v || start);
  while(S.weightAt.length < (S.weights||[]).length) S.weightAt.push(start);
}
function load(){ try{ const r=localStorage.getItem(KEY); return r?Object.assign({},seed,JSON.parse(r)):structuredClone(seed);}catch(e){return structuredClone(seed);} }

/* ============================================================
   3b · THEME — read from the spine, applied once, to the root

   The whole switchable-neon feature is this function plus a data file.
   No component knows a colour: they all read var(--neon*), so changing
   the palette can never require touching a screen. That is the entire
   point of doing it before the visual pass rather than after.

   Falls back to the tokens already in the stylesheet if the spine is
   not reachable (opened from a file:// path, or published standalone),
   so the app is never colourless.
   ============================================================ */
const THEME_FALLBACK = {
  palettes:[
    {id:'jade',    name:'Jade',    hint:'The dumbbell green. Where this started.', hex:'#3ECBA8'},
    {id:'miami',   name:'Miami',   hint:'Hot pink. The synthwave one.',            hex:'#FF5FA2'},
    {id:'voltage', name:'Voltage', hint:'Neon yellow. Loudest at night.',          hex:'#FFE24A'},
    {id:'electric',name:'Electric',hint:'Cyan. Coldest of the six.',               hex:'#4FD8FF'},
    {id:'violet',  name:'Violet',  hint:'Purple. Calmest at night.',               hex:'#B57BFF'},
    {id:'acid',    name:'Acid',    hint:'Lime. Turn it up.',                       hex:'#B6FF3D'}
  ],
  slots:[
    {id:'accent',name:'Buttons & rings',hint:'What you tap and what fills up',   default:'jade'},
    {id:'neon',  name:'Glow & edges',   hint:'Rails, rules, the heartbeat',      default:'miami'},
    {id:'coach', name:'Coach Nico',     hint:'Only ever a message from a human', default:'voltage'}
  ]
};
let THEME = THEME_FALLBACK;

function rgba(hex,a){
  const h=hex.replace('#','');
  const n=parseInt(h.length===3?h.split('').map(c=>c+c).join(''):h,16);
  return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;
}
const pal = id => THEME.palettes.find(x=>x.id===id) || THEME.palettes[0];

/* One week, one shuffle. Seeded by the week number so it is stable all week
   instead of re-rolling on every render — a colour scheme that changes while
   you are looking at it is a bug, not a feature. */
function weeklyPick(){
  const wk = Math.floor((NOW - new Date(2026,0,1)) / 6048e5);
  const pool = THEME.palettes.map(p=>p.id);
  const out=[]; let n=wk;
  for(let i=0;i<3;i++){ n=(n*9301+49297)%233280; const j=n%pool.length; out.push(pool.splice(j,1)[0]); }
  return {accent:out[0], neon:out[1], coach:out[2]};
}

function slotChoice(){
  if(S.themeRandom) return weeklyPick();
  const d = Object.fromEntries(THEME.slots.map(s=>[s.id,s.default]));
  return Object.assign(d, S.slots||{});
}

function applyTheme(){
  const c = slotChoice(), r = document.documentElement.style;
  const a = pal(c.accent).hex, n = pal(c.neon).hex, k = pal(c.coach).hex;
  r.setProperty('--accent', a);
  r.setProperty('--accent-soft', rgba(a,.13));
  r.setProperty('--accent-dim',  rgba(a,.30));
  r.setProperty('--neon', n);
  r.setProperty('--neon-soft', rgba(n,.13));
  r.setProperty('--neon-line', rgba(n,.32));
  r.setProperty('--neon-glow', `0 0 22px ${rgba(n,.26)}`);
  r.setProperty('--coach', k);
  r.setProperty('--coach-soft', rgba(k,.13));
  r.setProperty('--coach-line', rgba(k,.34));
  return c;
}
async function loadTheme(){
  try{
    const res=await fetch('spine/theme.json',{cache:'no-cache'});
    if(res.ok){ const t=await res.json(); if(t.palettes&&t.slots) THEME=t; }
  }catch(e){ /* standalone build — the fallback above is already correct */ }
  applyTheme();
}

function greet(){ const h=NOW.getHours(); return h<5?'Still up':h<12?'Morning':h<17?'Afternoon':h<21?'Evening':'Late one'; }

/* THE CLOCK
   Every entry carried d:0, so the feed had nothing to sort by and new
   items landed wherever the array happened to put them — a session logged
   last showed up above the coach reply that came before it.

   The prototype's "now" is fixed at Monday 21:40 for the demo, so a real
   Date.now() would be three days out. This advances the fake clock in real
   time from the moment the page loads, which orders entries correctly and
   prints a believable time next to each one. */
const T0 = NOW.getTime(), BOOT = Date.now();
const nowMs = () => T0 + (Date.now() - BOOT);
const hhmm = ms => new Date(ms).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
function stamp(ms){
  const d = new Date(ms), t = new Date(nowMs());
  const sameDay = d.toDateString() === t.toDateString();
  if (sameDay) return hhmm(ms);
  const days = Math.round((t - d) / 864e5);
  if (days === 1) return 'Yesterday';
  if (days < 7)   return DAYNM[d.getDay()] + ' ' + hhmm(ms);
  return d.toLocaleDateString('en-GB',{day:'numeric',month:'short'});
}

/* THE TRAVELLING LIGHT
   A rounded-rect outline whose dash pattern marches around the perimeter —
   Pac-Man round the edge of the card. Animates stroke-dashoffset and nothing
   else, so the browser never repaints; pathLength normalises the perimeter
   to 100 so the same dash numbers work at any card size.

   NO viewBox and NO calc(): calc() is not valid in an SVG geometry attribute
   and the rect silently collapsed, which is why this was invisible. Without a
   viewBox the SVG's user units ARE CSS pixels, so width="100%" resolves
   against the element and rx="17" stays a true 17px corner.

   Only ever put this on ONE element that is currently asking for attention. */
const travelSvg = (tone) => `<svg class="trav-l ${tone||''}" aria-hidden="true">

</svg>`;

function go(tab, keep){

/* The punch word is picked from what is actually true right now — a
   session waiting, one already done, a rest day, a streak, the hour.
   A line that never changes stops being read by the third day. */
function punch(){
  const done = Object.keys(S.done).length;
  const h = NOW.getHours();
  if (todayId && todayDone())          return "That's done";
  if (todayId && !released(todayId)) return 'Almost ready';
  if (todayId && h >= 21)            return 'One more thing';
  if (todayId)                       return 'Today you train';
  if (done >= 3)                     return 'Three in the bank';
  if (!todayId)                      return 'Rest is training';
  return 'Day one';
}

/* THE HEARTBEAT
   The line runs into the dumbbell, and the dumbbell IS the heart — it takes
   the pulse and jumps. Two CSS animations of identical duration and no delay,
   so they stay locked together without a single line of JavaScript to drift.

   pathLength="100" normalises the trace, so the leading edge of the dash
   reaches the right-hand end at a known fraction of the cycle (82%) whatever
   the drawn size is. That is the number the pump keyframe fires on. Change
   the dash and you must change that number too — they are one mechanism.

   Both are stroke-dashoffset and transform only: composited, no repaint. */
function ecg(){
  const done = Object.keys(S.done).length;
  /* Resting pace, not panic. 3.8s at zero sessions down to ~2.6s on a
     full week — a heartbeat you notice once and then stop noticing. */
  const ms = 3800 - done * 300;
  const pts = '0,17 20,17 26,17 30,5 36,29 42,12 47,17 66,17 72,17 76,11 80,17 100,17';
  return `<svg class="ecg" viewBox="0 0 100 34" aria-hidden="true" style="--beat:${ms}ms">
    <polyline class="ecg-bg" points="${pts}" pathLength="100"/>
    <polyline class="ecg-l"  points="${pts}" pathLength="100"/>
  </svg>`;
}

/* ---- THE MARK, once ---------------------------------------------------
   The header lockup and the calendar's "today" cell are the same drawing at
   two sizes, so the numbers live here and both read them. That is what makes
   the proportions match: not care, but a shared constant.
   ------------------------------------------------------------------- */
const TRI_D = 'M100 23 H286 L150 252 L14 16 H60';
/* onboarding's mark verbatim — same bar, same three plates, same widths */
const DB_PATHS =
  '<path d="M86 65 H174" stroke-width="7" opacity=".55"/>' +
  '<path d="M86 38 V92" stroke-width="12.65"/><path d="M174 38 V92" stroke-width="12.65"/>' +
  '<path d="M66.8 40.7 V89.3" stroke-width="9.9"/><path d="M193.2 40.7 V89.3" stroke-width="9.9"/>' +
  '<path d="M52.4 47.5 V82.5" stroke-width="7.13"/><path d="M207.6 47.5 V82.5" stroke-width="7.13"/>';
/* where the dumbbell sits inside the triangle, in the triangle's own units */
const DB_PLACE = 'translate(41.5,41) scale(0.84)';

/* The whole mark at any size. `db` decides whether the bell is inside it —
   which is exactly the calendar's rule: the triangle marks today, the
   dumbbell marks a training day, and a training day that is today is the
   logo. */
const markSvg = (cls, db) =>
  `<svg class="${cls}" viewBox="0 0 300 268" aria-hidden="true">

  </svg>`;

function header(){
  return `<div id="head">

      <h1 class="name serif">${esc(A.name)}</h1>
      <div class="dt">${dstr()} &middot; week 1</div>
    </div>
    <div class="hmark" style="--beat:${3800 - Object.keys(S.done).length*300}ms">
      <svg class="lockup" viewBox="0 0 300 268" aria-hidden="true">
        <defs>
          <!-- userSpaceOnUse, as in onboarding: on a path with no area an
               objectBoundingBox gradient renders nothing at all in iOS Safari. -->
          <linearGradient id="hdTri" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="300" y2="0">
            <stop offset="0%"   stop-color="var(--neon)"/>
            <stop offset="32%"  stop-color="var(--neon)" stop-opacity=".72"/>

             top-left is the dark segment of a real neon tube, and the two ends

             onboarding's 2.4 because this is rendered at a fifth of the size. -->
        <path class="lk-tri" d="${TRI_D}"/>
        <path class="lk-spark" d="${TRI_D}"/>
        <!-- the dumbbell, inside the triangle rather than beside it -->
        <!-- Two groups, not one. The beat animates the transform property,
             and a CSS transform beats an SVG transform ATTRIBUTE outright:
             with one group the placement would be wiped the moment the pulse
             ran and the dumbbell would jump to the corner. The outer group
             owns the placement, the inner one owns the beat. -->
        <radialGradient id="hdGlow">
          <stop offset="0%"   stop-color="var(--accent)" stop-opacity=".38"/>
          <stop offset="100%" stop-color="var(--accent)" stop-opacity="0"/>

             dumbbell sits inside with air on both sides. Centre of the drawn

        <g transform="${DB_PLACE}"><g class="lk-db">${DB_PATHS}</g></g>

   TAB · TODAY
   The one job of this screen: answer "what am I doing today?"
   before you have to think. Everything else is below the fold
