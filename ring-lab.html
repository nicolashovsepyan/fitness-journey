<!DOCTYPE html>
<html lang="en" class="wm">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#171A1E" />
  <title>Timer ring lab</title>
  <link rel="icon" type="image/png" href="images/timer-icon/timer-192.png" />
  <!--
    TIMER RING LAB. Design the countdown circle the way the logo was
    designed: start from a preset, push every dial, watch it live in all
    three phases, then "Use on my timer". Draws with js/runner/ring.js,
    the same code the timer uses, so the lab cannot lie about the result.
  -->
  <style>
    :root { --bg:#171A1E; --bg-2:#1E232A; --box:#212630; --box-2:#282E38; --line:#2F3640; --text:#ECEFF3; --muted:#A9B2BC; --faint:#858E99;
      --tnum:"SF Mono","Roboto Mono",ui-monospace,monospace; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin:0; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif; }
    body { padding: calc(14px + env(safe-area-inset-top)) 16px calc(110px + env(safe-area-inset-bottom)); max-width: 1100px; margin: 0 auto; }
    a { color: inherit; }
    .top { display:flex; align-items:center; gap: 10px; margin-bottom: 12px; }
    .top a { text-decoration:none; color: var(--muted); font-size: 28px; line-height: 1; }
    .top h1 { margin:0; font-size: 24px; letter-spacing: -0.02em; flex:1; }
    .top h1:after { content:""; display:block; width: 30px; height: 3px; border-radius: 3px; margin-top: 5px; background: var(--wm-neon, #FF5FA2); box-shadow: 0 0 14px var(--wm-neon, #FF5FA2); }
    .wrap { display:grid; gap: 18px; }
    @media (min-width: 860px) { .wrap { grid-template-columns: 1fr 1fr; align-items: start; } .stage { position: sticky; top: 14px; } }
    .stage { background: radial-gradient(120% 90% at 50% 0%, rgba(255,255,255,.04), transparent 70%), var(--bg-2); border: 1px solid var(--line); border-radius: 22px; padding: 14px; }
    .phases { display:flex; gap: 6px; }
    .phases button, .seg button { flex:1; background: var(--bg); border:1px solid var(--line); color: var(--muted); border-radius: 11px; padding: 9px 4px; font-size: 13px; font-weight: 700; cursor:pointer; white-space: nowrap; }
    .phases button.on, .seg button.on { color: var(--text); border-color: var(--wm-accent, #3ECBA8); background: color-mix(in srgb, var(--wm-accent, #3ECBA8) 15%, transparent); }
    .big { display:flex; justify-content:center; padding: 18px 0 6px; }
    .big .timer { width: min(78vw, 330px); height: min(78vw, 330px); position: relative; }
    .trio { display:grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 14px 0 4px; }
    .trio > div { text-align:center; color: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
    .trio .timer { width: 100%; aspect-ratio: 1; height: auto; margin-bottom: 6px; position: relative; }
    .timer .read { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; pointer-events:none; }
    .timer svg { width: 100%; height: 100%; }
    .trio .timer .read .t { font-size: 22px !important; }
    .trio .timer .read .cap { display:none; }
    .lab .fill, .lab .core { transition: none !important; }
    .sec { color: var(--muted); font-size: 11.5px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; margin: 18px 2px 8px; display:flex; justify-content: space-between; }
    .presets { display:grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .pre { background: var(--box); border: 1px solid var(--line); border-radius: 14px; padding: 8px 4px 7px; color: var(--muted); font-size: 11.5px; font-weight: 700; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap: 4px; }
    .pre.on { border-color: var(--wm-accent, #3ECBA8); color: var(--text); }
    .pre .m { width: 62px; height: 62px; } .pre .timer { width: 62px; height: 62px; position: relative; } .pre .read { display:none; }
    .group { background: var(--box); border-radius: 18px; overflow: hidden; display:flex; flex-direction:column; gap: 2px; }
    .ctl { background: var(--box); padding: 11px 14px; display:grid; grid-template-columns: 112px 1fr 46px; align-items:center; gap: 10px; border-top: 1px solid var(--line); }
    .ctl:first-child { border-top: none; }
    .ctl.wide { grid-template-columns: 112px 1fr; }
    .ctl label { font-size: 13.5px; font-weight: 600; }
    .ctl output { font-family: var(--tnum); font-size: 13px; color: var(--muted); text-align: right; }
    input[type=range] { width: 100%; accent-color: var(--wm-accent, #3ECBA8); }
    .seg { display:flex; gap: 5px; } .seg button { padding: 8px 2px; font-size: 12.5px; }
    .tog { justify-self: start; width: 48px; height: 28px; border-radius: 99px; background: var(--box-2); border:1px solid var(--line); position: relative; cursor:pointer; }
    .tog:after { content:""; position:absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--muted); transition: transform .15s; }
    .tog.on { background: color-mix(in srgb, var(--wm-accent, #3ECBA8) 20%, transparent); border-color: var(--wm-accent, #3ECBA8); }
    .tog.on:after { transform: translateX(20px); background: var(--wm-accent, #3ECBA8); }
    .swatches { display:flex; flex-wrap:wrap; gap: 7px; align-items:center; }
    .sw { width: 30px; height: 30px; border-radius: 50%; border: 2px solid transparent; cursor:pointer; background: var(--c); box-shadow: 0 0 10px color-mix(in srgb, var(--c) 40%, transparent); }
    .sw.on { border-color: var(--text); outline: 2px solid var(--c); outline-offset: 1px; }
    .sw.own { position: relative; overflow: hidden; background: conic-gradient(#FF5FA2, #FFE24A, #B6FF3D, #3ECBA8, #4FD8FF, #B57BFF, #FF5FA2); }
    .sw.own input { position:absolute; inset:-6px; opacity: 0; cursor:pointer; }
    .sw i { display:none; }
    .swatches.editing .sw { position: relative; animation: wob .25s ease-in-out infinite alternate; }
    .swatches.editing .sw i { display:flex; position:absolute; top:-6px; right:-6px; width:18px; height:18px; border-radius:50%; background:#0C0F12; color:#fff; font-style:normal; font-size:10px; align-items:center; justify-content:center; border:1px solid var(--line); }
    @keyframes wob { from { transform: rotate(-4deg); } to { transform: rotate(4deg); } }
    .lnk { background:none; border:none; color: var(--wm-accent, #3ECBA8); font-size: 12px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; cursor:pointer; padding: 0; margin-left: 10px; }
    .presets { grid-template-columns: repeat(3, 1fr) !important; }
    .pre .ed { color: var(--wm-neon, #FF5FA2); font-style: normal; font-size: 9px; }
    .pre .live { display:block; color: var(--wm-accent, #3ECBA8); font-size: 10px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
    .why { display:block; color: var(--faint); font-size: 11.5px; font-weight: 500; margin-top: 2px; }
    .hint2 { text-transform: none; letter-spacing: 0; font-weight: 500; color: var(--faint); margin-left: 6px; }
    .saved { color: var(--wm-accent, #3ECBA8); opacity: 0; transition: opacity .2s; text-transform: none; letter-spacing: 0; }
    .saved.on { opacity: 1; }
    .mine { display:flex; flex-wrap:wrap; gap: 6px; }
    .mine button { background: var(--box); border: 1px solid var(--line); color: var(--text); border-radius: 999px; padding: 7px 12px; font-size: 13px; cursor:pointer; }
    .mine button.x { padding: 7px 9px; color: var(--faint); }
    .bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); background: linear-gradient(180deg, transparent, var(--bg) 22px);
      display:flex; gap: 8px; max-width: 1100px; margin: 0 auto; }
    .bar button { flex:1; border:none; border-radius: 14px; padding: 15px 8px; font-size: 15px; font-weight: 700; cursor:pointer; background: var(--box-2); color: var(--text); }
    .bar .use { flex: 1.6; background: var(--wm-accent, #3ECBA8); color: #0C1512; box-shadow: 0 0 22px color-mix(in srgb, var(--wm-accent, #3ECBA8) 35%, transparent); }
    .toast { position: fixed; left: 50%; bottom: calc(90px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--bg-2); border: 1px solid var(--wm-neon, #FF5FA2);
      padding: 11px 18px; border-radius: 999px; font-size: 14px; font-weight: 600; z-index: 9; white-space: nowrap; }
    .hint { color: var(--faint); font-size: 12.5px; margin: 8px 2px 0; line-height: 1.4; }
  </style>
</head>
<body class="lab">
  <div class="top"><a href="index.html?quick" aria-label="Back to the timer">‹</a><h1>Timer ring lab</h1></div>
  <div class="wrap">
    <div class="stage">
      <div class="phases" id="phases"></div>
      <div id="view"></div>
    </div>
    <div>
      <div class="sec"><span>Your 3 designs <small class="hint2">tap one to edit it</small></span><span><span id="saved" class="saved"></span><button class="lnk" id="copy">Copy all 3</button></span></div>
      <div class="presets" id="presets"></div>
      <div id="mineWrap"></div>
      <div id="controls"></div>
      <p class="hint">Your main and glow colours follow your vibe (Timer settings). Pick a fixed colour to break away from them.</p>
    </div>
  </div>
  <div class="bar"><button id="reset">Reset</button><button id="savebtn">Save</button><button class="use" id="use">Use on timer</button></div>

<script type="module">
import { setAdapter } from './js/core/storage.js';
import { LocalAdapter } from './js/adapters/local.js';
import { loadUsers } from './js/users.js';
import { applyWorkTheme } from './js/runner/theme.js';
import { PRESETS, designFor, ringChoice, chooseRing, saveDesign, resetDesign, isEdited, allDesigns, ringHTML, ringBaseCss, setRingProgress } from './js/runner/ring.js';

/* opening the lab marks this phone as the coach's: "Edit designs" shows
   in its Timer look from now on (js/runner/prefs.js isCoachDevice) */
try { localStorage.setItem('fj.coachDevice', '1'); } catch (e) {}
setAdapter(new LocalAdapter());
try { await loadUsers(); } catch (e) {}          // so "your colours" are the signed-in person's
await applyWorkTheme();
ringBaseCss();

const SAVED = 'fj.ringSaved';
/* YOUR THREE DESIGNS. Pick one to edit; every change saves into it at once
   (switching never loses work). "Use on timer" makes it the one your timer
   shows; "Copy all 3" hands Nico's final versions over. */
let cur = ringChoice();
let d = designFor(cur);
let savedT = null;
function autosave() {
  saveDesign(cur, d);
  const el = document.getElementById('saved'); if (el) { el.textContent = 'Saved'; el.classList.add('on'); clearTimeout(savedT); savedT = setTimeout(() => el.classList.remove('on'), 1200); }
  if (cur === ringChoice()) document.querySelectorAll('.pre.on .m').forEach(m => { m.innerHTML = ringHTML('work', d, '-p' + cur); setRingProgress(m.querySelector('.timer'), 0.7); });
}
let phase = 'all';
const $ = s => document.querySelector(s);
const clone = o => JSON.parse(JSON.stringify(o));
const get = path => path.split('.').reduce((o, k) => o[k], d);
const set = (path, v) => { const ks = path.split('.'); const last = ks.pop(); ks.reduce((o, k) => o[k], d)[last] = v; autosave(); draw(); };

/* ---- the controls, as data: [label, path, kind, …] ---- */
/* THE COLOURS: electro only. Your two vibe colours (they follow Timer
   settings), every palette the app has (spine/theme.json), electric green
   and royal blue, and any colour you add. Edit removes the ones you don't
   want; the list is kept on this device. */
const PAL_KEY = 'fj.ringPalette';
let appPalettes = [];
try { const r = await fetch('spine/theme.json'); if (r.ok) appPalettes = (await r.json()).palettes || []; } catch (e) {}
const EXTRA = [{ val: '#39FF14', name: 'Electric green' }, { val: '#3D6BFF', name: 'Royal blue' }];
let editColours = false;
const palPrefs = () => { try { return { hidden: [], custom: [], ...JSON.parse(localStorage.getItem(PAL_KEY) || '{}') }; } catch (e) { return { hidden: [], custom: [] }; } };
const savePal = p => { try { localStorage.setItem(PAL_KEY, JSON.stringify(p)); } catch (e) {} };
function palette(all = false) {
  const p = palPrefs();
  const list = [
    { val: 'accent', name: 'Your main', css: 'var(--wm-accent)' }, { val: 'neon', name: 'Your glow', css: 'var(--wm-neon)' },
    ...appPalettes.map(x => ({ val: x.hex, name: x.name })), ...EXTRA,
    ...p.custom.map(h => ({ val: h, name: 'Mine', custom: true })),
  ].map(c => ({ ...c, css: c.css || c.val }))
   .filter((c, i, a) => a.findIndex(x => x.val.toLowerCase() === c.val.toLowerCase()) === i);
  return all ? list : list.filter(c => !p.hidden.includes(c.val));
}
const GROUPS = [
  ['Colours', [
    ['Work', 'colors.work', 'color'], ['Rest', 'colors.rest', 'color'], ['Get ready', 'colors.ready', 'color'],
  ]],
  ['The ring', [
    ['Style', 'arc.style', 'seg', [['solid', 'Solid'], ['gradient', 'Gradient'], ['segments', 'Segments']]],
    ['Thickness', 'arc.width', 'range', 2, 28, 0.5],
    ['White core', 'arc.core', 'range', 0, 1, 0.01],
    ['Core colour', 'arc.coreColor', 'seg', [['white', 'White'], ['tint', 'Tinted']]],
    ['Core softness', 'arc.coreSoft', 'range', 0, 1, 0.01, d => d.arc.core > 0],
    ['Core brightness', 'arc.coreOpacity', 'range', 0.2, 1, 0.01, d => d.arc.core > 0],
    ['Glow', 'arc.glow', 'range', 0, 2.5, 0.05],
    ['Glare', 'arc.glare', 'toggle', 'Light catching the glass, near 1 o\'clock'],
    ['Glare size', 'arc.glareSize', 'range', 0.4, 2.5, 0.05, d => d.arc.glare],
    ['Ends', 'arc.cap', 'seg', [['round', 'Round'], ['butt', 'Flat']]],
    ['Segments', 'arc.segments', 'range', 12, 120, 1, d => d.arc.style === 'segments'],
    ['Gap', 'arc.gap', 'range', 0.1, 0.8, 0.01, d => d.arc.style === 'segments'],
    ['Gradient to', 'colors.grad', 'color', d => d.arc.style === 'gradient'],
  ]],
  ['The empty part', [
    ['Thickness', 'track.width', 'range', 0, 28, 0.5],
    ['Brightness', 'track.opacity', 'range', 0, 0.3, 0.005],
    ['Glass line', 'track.core', 'toggle'],
  ]],
  ['The dial', [
    ['Ticks', 'ticks.count', 'seg', [[0, 'None'], [12, '12'], [60, '60'], [120, '120']]],
    ['Tick position', 'ticks.position', 'seg', [['outside', 'Outside'], ['inside', 'Inside']], d => d.ticks.count > 0],
    ['Tick length', 'ticks.length', 'range', 2, 14, 0.5],
    ['Tick brightness', 'ticks.opacity', 'range', 0.05, 1, 0.01],
    ['Tick colour', 'ticks.color', 'seg', [['muted', 'Grey'], ['phase', 'Phase']]],
    ['Quarter marks', 'ticks.quarters', 'toggle'],
    ['Sunrays', 'rays', 'range', 0, 0.12, 0.002],
    ['Face', 'face', 'seg', [['none', 'None'], ['disc', 'Disc'], ['glow', 'Glow']]],
    ['Crown', 'crown', 'toggle'],
  ]],
  ['The numbers', [
    ['Font', 'digits.font', 'seg', [['mono', 'Mono'], ['system', 'Sans'], ['rounded', 'Round']]],
    ['Weight', 'digits.weight', 'range', 200, 900, 100],
    ['Size', 'digits.size', 'range', 0.7, 1.35, 0.01],
    ['Glow', 'digits.glow', 'range', 0, 1.6, 0.05],
    ['Colour', 'digits.color', 'seg', [['phase', 'Phase'], ['white', 'White']]],
  ]],
];

function ctl([label, path, kind, ...o]) {
  const showIf = typeof o[o.length - 1] === 'function' ? o.pop() : null;
  if (showIf && !showIf(d)) return '';
  const v = get(path);
  if (kind === 'range') {
    const [min, max, step] = o;
    return `<div class="ctl"><label>${label}</label><input type="range" min="${min}" max="${max}" step="${step}" value="${v}" data-path="${path}"/><output>${(+v).toFixed(step < 0.1 ? 2 : step < 1 ? 1 : 0)}</output></div>`;
  }
  if (kind === 'toggle') return `<div class="ctl wide"><label>${label}${o[0] && typeof o[0] === 'string' ? `<small class="why">${o[0]}</small>` : ''}</label><button class="tog ${v ? 'on' : ''}" data-tog="${path}" aria-label="${label}"></button></div>`;
  if (kind === 'seg') return `<div class="ctl wide"><label>${label}</label><div class="seg">${o[0].map(([val, l]) => `<button class="${String(v) === String(val) ? 'on' : ''}" data-seg="${path}" data-val="${val}">${l}</button>`).join('')}</div></div>`;
  if (kind === 'color') {
    const list = palette();
    const known = list.some(c => c.val.toLowerCase() === String(v).toLowerCase());
    /* a colour in use that has been removed from the list still shows, so the
       design never points at nothing */
    const shown = known ? list : [...list, { val: v, name: 'In use', css: v === 'accent' ? 'var(--wm-accent)' : v === 'neon' ? 'var(--wm-neon)' : v }];
    return `<div class="ctl wide"><label>${label}</label><div class="swatches ${editColours ? 'editing' : ''}">${shown.map(c => `<button class="sw ${String(v).toLowerCase() === c.val.toLowerCase() ? 'on' : ''}" style="--c:${c.css}" ${editColours ? `data-hide="${c.val}"` : `data-col="${path}" data-val="${c.val}"`} title="${c.name}" aria-label="${c.name}">${editColours ? '<i>✕</i>' : ''}</button>`).join('')}
      ${editColours ? '' : `<span class="sw own" title="Add any colour"><input type="color" data-pick="${path}" value="#ff5fa2"/></span>`}</div></div>`;
  }
  return '';
}

function draw() {
  /* stage */
  $('#phases').innerHTML = [['all', 'All 3'], ['ready', 'Get ready'], ['work', 'Work'], ['rest', 'Rest']]
    .map(([p, l]) => `<button class="${phase === p ? 'on' : ''}" data-phase="${p}">${l}</button>`).join('');
  $('#view').innerHTML = phase === 'all'
    ? `<div class="big">${ringHTML('work', d, '-big')}</div><div class="trio">${['ready', 'work', 'rest'].map(p => `<div>${ringHTML(p, d, '-' + p)}${p === 'ready' ? 'Get ready' : p === 'work' ? 'Work' : 'Rest'}</div>`).join('')}</div>`
    : `<div class="big">${ringHTML(phase, d, '-big')}</div>`;
  /* presets */
  $('#presets').innerHTML = PRESETS.map(p => `<button class="pre ${cur === p.id ? 'on' : ''}" data-pre="${p.id}"><span class="m">${ringHTML('work', p.id === cur ? d : designFor(p.id), '-p' + p.id)}</span>${p.name}${isEdited(p.id) ? ' <i class="ed" title="Edited">●</i>' : ''}${ringChoice() === p.id ? '<small class="live">on timer</small>' : ''}</button>`).join('');
  document.querySelectorAll('.pre .timer').forEach(t => setRingProgress(t, 0.7));
  /* my saved designs */
  const mine = [];
  $('#mineWrap').innerHTML = mine.length ? `<div class="sec"><span>My designs</span></div><div class="mine">${mine.map((m, i) => `<span><button data-mine="${i}">${esc(m.name)}</button><button class="x" data-minex="${i}" aria-label="Delete">✕</button></span>`).join('')}</div>` : '';
  /* controls */
  $('#controls').innerHTML = GROUPS.map(([title, rows]) => `<div class="sec"><span>${title}</span>${title === 'Colours' ? `<span>${editColours && palPrefs().hidden.length ? '<button class="lnk" id="palRestore">Bring all back</button> ' : ''}<button class="lnk" id="palEdit">${editColours ? 'Done' : 'Edit colours'}</button></span>` : ''}</div><div class="group">${rows.map(ctl).join('')}</div>`).join('');
  wire();
}
function wire() {
  document.querySelectorAll('[data-phase]').forEach(b => b.onclick = () => { phase = b.dataset.phase; draw(); });
  document.querySelectorAll('[data-pre]').forEach(b => b.onclick = () => { cur = b.dataset.pre; d = designFor(cur); draw(); });
  document.querySelectorAll('input[type=range][data-path]').forEach(r => r.oninput = () => {
    const path = r.dataset.path; const ks = path.split('.'); const last = ks.pop();
    ks.reduce((o, k) => o[k], d)[last] = +r.value; autosave();
    r.nextElementSibling.textContent = (+r.value).toFixed(+r.step < 0.1 ? 2 : +r.step < 1 ? 1 : 0);
    redrawStage();
  });
  document.querySelectorAll('[data-tog]').forEach(b => b.onclick = () => set(b.dataset.tog, !get(b.dataset.tog)));
  document.querySelectorAll('[data-seg]').forEach(b => b.onclick = () => { const v = b.dataset.val; set(b.dataset.seg, /^\d+$/.test(v) ? +v : v); });
  document.querySelectorAll('[data-col]').forEach(b => b.onclick = () => set(b.dataset.col, b.dataset.val));
  /* a picked colour joins the list, so it can be used again (or removed) */
  document.querySelectorAll('[data-pick]').forEach(i => i.onchange = () => {
    const p = palPrefs(); const h = i.value.toLowerCase();
    if (!palette(true).some(c => c.val.toLowerCase() === h)) p.custom.push(h);
    p.hidden = p.hidden.filter(x => x.toLowerCase() !== h); savePal(p);
    set(i.dataset.pick, h);
  });
  $('#palEdit') && ($('#palEdit').onclick = () => { editColours = !editColours; draw(); });
  $('#palRestore') && ($('#palRestore').onclick = () => { const p = palPrefs(); p.hidden = []; savePal(p); draw(); });
  document.querySelectorAll('[data-hide]').forEach(b => b.onclick = () => {
    const p = palPrefs(), v = b.dataset.hide;
    if (palette().length <= 1) return toast('Keep at least one colour');
    if (p.custom.includes(v)) p.custom = p.custom.filter(x => x !== v); else p.hidden.push(v);
    savePal(p); draw();
  });
}
/* sliders only redraw the rings, so the slider under your finger survives */
function redrawStage() {
  const big = $('#view .big'); if (big) big.innerHTML = ringHTML(phase === 'all' ? 'work' : phase, d, '-big');
  document.querySelectorAll('#view .trio > div').forEach((el, i) => { const p = ['ready', 'work', 'rest'][i]; el.innerHTML = ringHTML(p, d, '-' + p) + (p === 'ready' ? 'Get ready' : p === 'work' ? 'Work' : 'Rest'); });
}

/* a running clock so the ring is seen moving, the way it will in a workout */
const fmt = s => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
function loop(t) {
  const frac = 1 - ((t / 14000) % 1);
  document.querySelectorAll('#view .timer').forEach(el => {
    setRingProgress(el, frac);
    const tx = el.querySelector('.t'); if (tx) tx.textContent = fmt(Math.ceil(frac * 60));
    const cap = el.querySelector('.cap'); if (cap) cap.textContent = 'tap to pause';
  });
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* ---- save, copy, use ---- */
const savedList = () => { try { return JSON.parse(localStorage.getItem(SAVED) || '[]'); } catch (e) { return []; } };
const store = l => { try { localStorage.setItem(SAVED, JSON.stringify(l)); } catch (e) {} };
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');
function toast(t) { document.querySelector('.toast')?.remove(); const el = document.createElement('div'); el.className = 'toast'; el.textContent = t; document.body.appendChild(el); setTimeout(() => el.remove(), 2600); }
$('#use').onclick = () => { saveDesign(cur, d); chooseRing(cur); draw(); toast(`${PRESETS.find(p => p.id === cur).name} is on your timer`); };
$('#savebtn').onclick = () => { saveDesign(cur, d); draw(); toast(`${PRESETS.find(p => p.id === cur).name} saved`); };
$('#copy').onclick = async () => {
  const text = JSON.stringify(allDesigns());
  try { await navigator.clipboard.writeText(text); toast('All 3 copied. Paste them to Claude to make them everyone\'s'); } catch (e) { prompt('Copy all 3 designs', text); }
};
$('#reset').onclick = () => {
  if (!confirm(`Put ${PRESETS.find(p => p.id === cur).name} back to how it shipped?`)) return;
  resetDesign(cur); d = designFor(cur); draw(); toast('Back to the original');
};
draw();
</script>
