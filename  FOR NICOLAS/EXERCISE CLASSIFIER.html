<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Exercise classifier — Fitness Journey</title>
<style>
:root{
  --bg:#15181c; --panel:#1c2026; --line:#2b3138; --tx:#e9edf2; --tx2:#96a0ac;
  --ac:#7BE3C4; --ac2:#4fbfa0; --pink:#FF5FA2; --amber:#F2C14E; --bad:#ef6b6b;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);
  font:14px/1.45 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
h1{margin:0;font-size:17px;letter-spacing:-.2px}
.sub{color:var(--tx2);font-size:12px;margin-top:2px}

/* ---- header ---- */
header{position:sticky;top:0;z-index:20;background:var(--panel);
  border-bottom:1px solid var(--line);padding:12px 16px}
.hrow{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.spacer{flex:1}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);
  background:#222831;color:var(--tx);padding:7px 13px}
button:hover{border-color:#3d4650}
button.go{background:var(--ac);color:#0d1114;border-color:transparent;font-weight:650}
button.go:hover{background:var(--ac2)}
button.warn{color:var(--bad)}

/* ---- the three counters ---- */
.counts{display:flex;gap:8px}
.cnt{background:#222831;border:1px solid var(--line);border-radius:8px;
  padding:5px 11px;font-size:12px;min-width:96px}
.cnt b{font-size:16px;display:block;line-height:1.2}
.cnt.beg b{color:var(--ac)} .cnt.int b{color:var(--amber)} .cnt.adv b{color:var(--pink)}
.cnt.over b{color:var(--bad)}
.cnt small{color:var(--tx2)}

/* ---- filters ---- */
.filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:11px}
input[type=search],select,input[type=number],input.link{
  font:inherit;background:#171b20;color:var(--tx);border:1px solid var(--line);
  border-radius:8px;padding:6px 9px}
input[type=search]{min-width:230px}
.chip{font-size:12px;padding:5px 10px;border-radius:99px;background:#222831;
  border:1px solid var(--line);color:var(--tx2);cursor:pointer;user-select:none}
.chip.on{background:var(--ac);color:#0d1114;border-color:transparent;font-weight:600}

/* ---- table ---- */
.wrap{padding:14px 16px 80px}
table{border-collapse:separate;border-spacing:0;width:100%}
th{position:sticky;top:0;background:#191d23;color:var(--tx2);font-size:11px;
  text-transform:uppercase;letter-spacing:.06em;text-align:left;
  padding:8px 8px;border-bottom:1px solid var(--line);z-index:5}
td{padding:6px 8px;border-bottom:1px solid #23282f;vertical-align:middle}
tr.touched td{background:#1a2420}
tr:hover td{background:#1e2329}
.thumb{width:52px;height:38px;object-fit:contain;background:#11151a;
  border-radius:6px;display:block}
.noimg{width:52px;height:38px;border-radius:6px;background:#171b20;
  border:1px dashed #2f353d}
.nm{font-weight:600}
.id{color:#6c7783;font-size:11px;font-family:ui-monospace,Menlo,monospace}
.eq{color:var(--tx2);font-size:11px}
.gymtag{color:var(--amber);font-size:10px;font-weight:700}

/* ---- the tier control ---- */
.tier{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.tier button{border:0;border-radius:0;padding:5px 9px;background:#171b20;
  color:var(--tx2);font-size:12px;font-weight:700;min-width:30px}
.tier button+button{border-left:1px solid var(--line)}
.tier button.on[data-t=""]{background:#39414a;color:var(--tx)}
.tier button.on[data-t="beg"]{background:var(--ac);color:#0d1114}
.tier button.on[data-t="int"]{background:var(--amber);color:#0d1114}
.tier button.on[data-t="adv"]{background:var(--pink);color:#0d1114}

select.fam.guessed{color:var(--tx2);font-style:italic;border-style:dashed}
input.link{width:150px;font-size:12px}
input.link.dead{border-color:var(--bad);color:var(--bad)}
input[type=number]{width:56px}
.miss{color:var(--bad)}

/* ---- ladder view ---- */
.lad{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}
.lcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px}
.lcard h3{margin:0 0 3px;font-size:13px;letter-spacing:.05em;text-transform:uppercase}
.lcard .n{color:var(--tx2);font-size:11px;margin-bottom:9px}
.step{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:13px}
.dot{width:7px;height:7px;border-radius:99px;flex:none;background:#39414a}
.dot.beg{background:var(--ac)} .dot.int{background:var(--amber)} .dot.adv{background:var(--pink)}
.step .d{color:#6c7783;font-size:11px;margin-left:auto}
.empty{color:var(--bad);font-size:12px}

.note{background:#1c2026;border:1px solid var(--line);border-left:3px solid var(--amber);
  border-radius:8px;padding:11px 13px;margin-bottom:14px;font-size:13px;color:var(--tx2)}
.note b{color:var(--tx)}
.hide{display:none}
</style></head><body>

<header>
  <div class="hrow">
    <div>
      <h1>Exercise classifier</h1>
      <div class="sub"><span id="shown">0</span> of <span id="total">0</span> movements ·
        <span id="dirty">0</span> changed</div>
    </div>
    <div class="counts">
      <div class="cnt beg" id="cBeg"><b>0</b><small>Beginner / 15</small></div>
      <div class="cnt int" id="cInt"><b>0</b><small>Intermediate / 15</small></div>
      <div class="cnt adv" id="cAdv"><b>0</b><small>Advanced / 20</small></div>
    </div>
    <div class="spacer"></div>
    <button id="vClassify" class="chip on">Classify</button>
    <button id="vLadders" class="chip">Ladders</button>
    <button class="go" id="save">Save file for Claude</button>
    <button id="load">Load a saved file</button>
    <button class="warn" id="reset">Start over</button>
  </div>

  <div class="filters" id="filters">
    <input type="search" id="q" placeholder="Search name, id or cue…">
    <select id="fFam"><option value="">Every family</option></select>
    <select id="fPat"><option value="">Every pattern</option></select>
    <select id="fLvl"><option value="">Every level</option>
      <option value="beg">beg</option><option value="int">int</option>
      <option value="adv">adv</option><option value="__none">no level set</option></select>
    <span class="chip" data-f="fund">In the fundamentals</span>
    <span class="chip" data-f="nodiff">Missing difficulty</span>
    <span class="chip" data-f="noimg">No picture</span>
    <span class="chip" data-f="deadlink">Link to nowhere</span>
    <span class="chip" data-f="bw">Bodyweight only</span>
    <span class="chip" data-f="touched">I have changed</span>
  </div>
</header>

<div class="wrap">
  <div id="seedNote" class="note hide"></div>

  <div id="viewClassify">
    <table><thead><tr>
      <th style="width:60px"></th><th>Movement</th><th style="width:150px">Family</th>
      <th style="width:96px">Level</th><th style="width:70px">Diff</th>
      <th style="width:132px">Fundamental</th>
      <th style="width:160px">Easier than this</th><th style="width:160px">Harder than this</th>
    </tr></thead><tbody id="tb"></tbody></table>
  </div>

  <div id="viewLadders" class="hide"><div class="lad" id="ladders"></div></div>
</div>

<datalist id="allIds"></datalist>
<input type="file" id="file" accept="application/json" style="display:none">

<script id="payload" type="application/json">{"rows":[{"id":"back_extension_45","name":"45-Degree Back Extension","pattern":"hinge","dbFamily":"","equipment":["machine"],"measure":"reps","level":"beg","diff":2,"easier":"","harder":"","ess":false,"gymOnly":true,"img":true,"badEasier":false,"badHarder":false,"guess":"hinge","seed":"","cues":"Pad just below your hip bones. Bend at the hips and come back up until your body is one straight line — do not arch past that."},{"id":"x90_degree_hspu_negative","name":"90-Degree HSPU Negative","pattern":"push","dbFamily":"planche","equipment":["bw"],"measure":"reps","level":"adv","diff":9,"easier":"handstand_push_up","harder":"","ess":false,"gymOnly":false,"img":false,"badEasier":false,"badHarder":false,"guess":"vpush","seed":"","cues":"Slowly lower from a handstand while \"seesawing\" the body horizontal until you catch a bent-arm planche position (head + chest at 90°). The fusion of HSPU eccentric with planche bottom position. Multi-year skill."},{"id":"hip_90_90","name":"90/90 Hip Switches","pattern":"mobility","dbFamily":"hip","equipment":["bw"],"measure":"reps","level":"beg","diff":1,"easier":"","harder":"","ess":false,"gymOnly":true,"img":false,"badEasier":false,"badHarder":false,"guess":"mobility","seed":"","cues":"Sit on the floor, both knees bent to about 90° — one shin in front of you, the other out to the side. Keep tall and rotate your hips to swap both legs to the other side. Slow and controlled. Opens the hips with zero stress on the knee."},{"id":"ab_wheel_rollout","name":"Ab Wheel Rollout","pattern":"core","dbFamily":"anti-extension","equipment":["abwheel"],"measure":"reps","level":"adv","diff":6,"easier":"long_lever_plank","harder":"dragon_flag","ess":false,"gymOnly":false,"img":false,"badEasier":false,"badHarder":false,"guess":"coredyn","seed":"","cues":"Hips must not sag at extension. Pull from abs — not hip flexors — to return."},{"id":"active_hang","name":"Active Hang","pattern":"pull","dbFamily":"","equipment":["pullupbar"],"measure":"hold","level":"beg","diff":1,"easier":"","harder":"","ess":false,"gymOnly":false,"img":true,"badEasier":false,"badHarder":false,"guess":"carry","seed":"","cues":"Shoulders packed, ribs down."},{"id":"adv_tuck_fl_raise","name":"Adv-Tuck FL Raise","pattern":"pull","dbFamily":"","equipment":["pullupbar"],"measure":"reps","level":"int","diff":6,"easier":"tuck_fl_raise","harder":"single_leg_fl_raise","ess":false,"gymOnly":false,"img":false,"badEasier":false,"badHarder":false,"guess":"hpull","seed":"","cues":"Same raise, advanced-tuck position."},{"id":"adv_tuck_planche","name":"Adv. Tuck Planche","pattern":"push","dbFamily":"planche","equipment":["bw"],"measure":"hold","level":"adv","diff":8,"easier":"open_tuck_planche","harder":"","ess":false,"gymOnly":false,"img":false,"badEasier":false,"badHarder":false,"guess":"hpush","seed":"","cues":"Back flat, legs tuck below hips. 5s max holds with full rest."},{"id":"adv_tuck_front_lever","name":"Advanced-Tuck Front Lever","pattern":"pull","dbFamily":"","equipment":["pullupbar","rings"],"measure":"hold","level":"int","diff":6,"easier":"front_lever_tuck","harder":"single_leg_front_lever","ess":false,"gymOnly":false,"img":false,"badEasier":false,"badHarder":false,"guess":"vpull","seed":"","cues":"Open the tuck — hips extended, flat back, knees still bent."},{"id":"alternating_single_leg_l_sit","name":"Alternating Single-Leg L-Sit","pattern":"core","dbFamily":"lsit","equipment":["bw"],"measure":"reps","level":"beg","diff":3,"easier":"foot_supported_l_sit","harder":"tuck_l_sit","ess":false,"gymOnly":false,"img":false,"badEasier":false,"badHarder":false,"guess":"coredyn","seed":"","cues":"Glutes lifted, arms locked. Lift one foot off the floor, hold a few seconds, tap it down, then lift the other — march the legs (bent-knee or straight-leg style). Builds toward zero foot support."},{"id":"ankle_mobility","name":"Ankle Mobility","pattern":"mobility","dbFamily":"","equipment":["bw"],"measure":"reps","level":"","diff":null,"easier":"","harder":"","ess":false,"gymOnly":false,"img":false,"badEasier":false,"badHarder":false,"guess":"mobility","seed":"","cues":"Knee over toe, heel down."},{"id":"archer_complex","name":"Archer Complex","pattern":"push","dbFamily":"","equipment":["rings"],"measure":"reps","level":"int","diff":6,"easier":"","harder":"","ess":false,"gymOnly":false,"img":false,"badEasier":false,"badHarder":false,"guess":"hpush","seed":"","cues":"Alternating: unilateral ring row right → push-up → ring row left = 1 rep. Scapular control on each row. Hips square. The push-up is the controlled reset between rows. Pull elbow back — not out."},{"id":"archer_pullup","name":"Archer Pull-Up","pattern":"pull","dbFamily":"","equipment":["pullupbar"],"measure":"reps","level":"adv","diff":8,"easier":"wide_pullup","harder":"one_arm_negative","ess":false,"gymOnly":false,"img":false,"badEasier":false,"badHarder":false,"guess":"vpull","seed":"adv","cues":"One arm bends, the other stays straight. Shift side to side."},{"id":"archer_push_up","name":"Archer Push-Up","pattern":"push","dbFamily":"push-up","equipment":["bw"],"measure":"reps","level":"adv","diff":7,"easier":"diamond_push_up","harder":"","ess":false,"gymOnly":false,"img":false,"badEasier":false,"badHarder":false,"guess":"hpush","seed":"","cues":"Shift weight to one arm, other arm straight for balance. Hips square."},{"id":"archer_row","name":"Archer Row","pattern":"pull","dbFamily":"","equipment":["rings"],"measure":"reps","level":"int","diff":6,"easier":"feet_elevated_ring_row","harder":"single_arm_ring_row","ess":false,"gymOnly":false,"img":false,"badEasier":false,"badHarder":false,"guess":"hpull","seed":"","cues":"One arm pulls, the other stays straight out to the side."},{"id":"arm_circles","name":"Arm Circles","pattern":"mobility","dbFamily":"","equipment":["bw"],"measure":"reps","level":"beg","diff":1,"easier":"","harder":"","ess":false,"gymOnly":true,"img":false,"badEasier":false,"badHarder":false,"guess":"mobility","seed":"","cues":"One arm at a time. Ten big slow circles forward, ten backward. Wakes the shoulder up before you load it."},{"id":"around_world_pullup","name":"Around-the-World Pull-Up","pattern":"pull","dbFamily":"","equipment":["pullupbar"],"measure":"reps","level":"adv","diff":8,"easier":"wide_pullup","harder":"one_arm_pullup","ess":false,"gymOnly":false,"img":false,"badEasier":false,"badHarder":false,"guess":"vpull","seed":"","cues":"Arc side to side over the bar in a U shape."},{"id":"assisted_dip","name":"Assisted Dip (machine)","pattern":"push","dbFamily":"dip","equipment":["machine"],"measure":"reps","level":"beg","diff":3,"easier":"bench_dip","harder":"dip","ess":false,"gymOnly":true,"img":false,"badEasier":false,"badHarder":false,"guess":"hpush","seed":"","cues":"Kneel or stand on the pad — the machine takes weight off you. Lean forward a little, lower until your upper arms are level with the floor, press back up. Log the ASSIST weight: lower is stronger."},{"id":"assisted_one_arm_push_up","name":"Assisted One-Arm Push-Up","pattern":"push","dbFamily":"push-up","equipment":["band"],"measure":"reps","level":"adv","diff":8,"easier":"half_one_arm_push_up","harder":"","ess":false,"gymOnly":false,"img":false,"badEasier":false,"badHarder":false,"guess":"hpush","seed":"","cues":"Use a band looped overhead, hooked under the chest to unload some bodyweight, OR free hand resting LIGHTLY on a low surface for balance only (not bearing weight). Working arm does the work."},{"id":"reverse_nordic","name":"Assisted Reverse Nordic Curl","pattern":"quad","dbFamily":"","equipment":["bw","band"],"measure":"reps","level":"","diff":null,"easier":"","harder":"","ess":false,"gymOnly":false,"img":false,"badEasier":false,"badHarder":false,"guess":"squat","seed":"","cues":"Knees-over-toes eccentric; assist with band or hands."},{"id":"australian_pullup","name":"Australian Pull-Up","pattern":"pull","dbFamily":"","equipment":["pullupbar"],"measure":"reps","level":"beg","diff":3,"easier":"incline_row","harder":"wide_inverted_row","ess":false,"gymOnly":false,"img":false,"badEasier":false,"badHarder":false,"guess":"vpull","seed":"","cues":"Bar at hip height, straight body, chest to bar. Feet forward = harder."},{"id":"back_squat","name":"Back Squat","pattern":"quad","dbFamily":"squat","equipment":["bb","rack"],"measure":"reps","level":"int","diff":6,"easier":"goblet_squat","harder":"","ess":false,"gymOnly":false,"img":true,"badEasier":false,"badHarder":false,"guess":"squat","seed":"adv","cues":"Bar on the back, brace, sit between the hips. Hip crease below the knee, knees tracking over the toes."},{"id":"back_to_wall_handstand_hold","name":"Back-to-Wall Handstand Hold","pattern":"push","dbFamily":"handstand","equipment":["bw"],"measure":"hold","level":"int","diff":6,"easier":"feet_on_wall_90_degree","harder":"","ess":false,"gymOnly":false,"img":false,"badEasier":false,"badHarder":false,"guess":"vpush","seed":"","cues":"Kick up facing AWAY from wall. Heels lightly touch wall. Good entry to handstand balance work."},{"id":"band_front_lever","name":"Band-Assisted Front Lever","pattern":"pull","dbFamily":"","equipment":["pullupbar","band"],"measure":"hold","level":"int","diff":4,"easier":"front_lever_tuck","harder":"adv_tuck_front_lever","ess":false,"gymOnly":false,"img":false,"badEasier":false,"badHarder":false,"guess":"vpull","seed":"","cues":"Band under the hips supports the lever. Thinner band to progress."},{"id":"band_muscle_up","name":"Band-Assisted Muscle-Up","pattern":"pull","dbFamily":"","equipment":["pullupbar","band"],"measure":"reps","level":"adv","diff":7,"easier":"negative_muscle_up_bar","harder":"muscle_up_bar","ess":false,"gymOnly":false,"img":false,"badEasier":false,"badHarder":false,"guess":"vpull","seed":"","cues":"Band assists the transition. Grease the whole movement."},{"id":"band_assisted_pullup","name":"Band-Assisted Pull-Up","pattern":"pull","dbFamily":"","equipment":["pullupbar","band"],"measure":"reps","level":"beg","diff":3,"easier":"negative_pullup","harder":"pullup","ess":false,"gymOnly":false,"img":false,"badEasier":false,"badHarder":false,"guess":"vpull","seed":"","cues":"Band under feet/knee removes weight. Step down band thickness to progress."},{"id":"banded_dip","name":"Banded Dip","pattern":"push","dbFamily":"dip","equipment":["dipbars","band"],"measure":"reps","level":"int","diff":4,"easier":"dip_negative","harder":"","ess":false,"gymOnly":false,"img":false,"badEasier":false,"badHarder":false,"guess":"hpush","seed":"","cues":"Loop a resistance band over the parallel bars, knees rest in the band loop. The band assists the press out of the bottom. Choose band tension so you can do 5-8 reps unbroken. Progress by switching to a lighter band."},{"id":"banded_glute_bridge","name":"Banded Glute Bridge","pattern":"glute","dbFamily":"","equipment":["band"],"measure":"reps","level":"","diff":null,"easier":"","harder":"","ess":false,"gymOnly":false,"img":true,"badEasier":false,"badHarder":false,"guess":"hinge","seed":"","cues":"Drive knees out, squeeze top."},{"id":"banded_sidewalk","name":"Banded Lateral Walks","pattern":"glute","dbFamily":"","equipment":["band"],"measure":"hold","level":"","diff":null,"easier":"","harder":"","ess":false,"gymOnly":false,"img":true,"badEasier":false,"badHarder":false,"guess":"hinge","seed":"","cues":"Band at knees, stay low, continuous side-steps."},{"id":"banded_pullapart","name":"Banded Pull-Aparts","pattern":"pull","dbFamily":"","equipment":["band"],"measure":"reps","level":"beg","diff":1,"easier":"","harder":"","ess":false,"gymOnly":false,"img":true,"badEasier":false,"badHarder":false,"guess":"hpull","seed":"","cues":"Straight arms, squeeze blades."},{"id":"banded_tke","name":"Banded Terminal Knee Extension","pattern":"quad","dbFamily":"","equipment":["band","rack"],"measure":"reps","level":"beg","diff":1,"easier":"","harder":"","ess":false,"gymOnly":true,"img":false,"badEasier":false,"badHarder":false,"guess":"squat","seed":"","cues":"Band around the back of your knee, anchored in front. Straighten the knee against the band and squeeze the thigh. Tiny range, big effect — knee-friendly."},{"id":"barbell_curl","name":"Barbell Curl","pattern":"pull","dbFamily":"arm","equipment":["bb"],"measure":"reps","level":"beg","diff":2,"easier":"","harder":"","ess":false,"gymOnly":true,"img":false,"badEasier":false,"badHarder":false,"guess":"hpull","seed":"","cues":"Elbows pinned to your sides. Curl up, lower all the way down under control. If your back is swinging, the bar is too heavy."},{"id":"bear_hold","name":"Bear Hold","pattern":"core","dbFamily":"","equipment":["bw"],"measure":"hold","level":"beg","diff":2,"easier":"bird_dog","harder":"bear_hold_taps","ess":false,"gymOnly":false,"img":false,"badEasier":false,"badHarder":false,"guess":"corestat","seed":"","cues":"Bear-crawl position held still: hands under shoulders, knees hovering an inch off the floor, back flat. Squeeze everything and hold. A held bear crawl — brutal deep-core tension."},{"id":"bear_hold_taps","name":"Bear Hold Taps","pattern":"core","dbFamily":"bear","equipment":["bw"],"measure":"reps","level":"beg","diff":3,"easier":"bear_hold","harder":"bear_limb_lift","ess":false,"gymOnly":false,"img":false,"badEasier":false,"badHarder":false,"guess":"coredyn","seed":"","cues":"From a static bear hold (knees hovering an inch off the floor), slowly tap one hand to the opposite shoulder, then switch. Keep the hips dead-even — no rotation. Anti-rotation under load."},{"id":"bear_limb_lift","name":"Bear Limb Lift","pattern":"core","dbFamily":"bear","equipment":["bw"],"measure":"reps","level":"int","diff":4,"easier":"bear_hold_taps","harder":"bear_opposing_limb_lift","ess":false,"gymOnly":false,"img":false,"badEasier":false,"badHarder":false,"guess":"coredyn","seed":"","cues":"Hold the hovering bear position and lift just one hand OR one foot slightly off the ground, hold briefly, return, then alternate. Two-point stability — fight the urge to shift your weight."},{"id":"bear_opposing_limb_lift","name":"Bear Opposing Limb Lift","pattern":"core","dbFamily":"bear","equipment":["bw"],"measure":"reps","level":"int","diff":4,"easier":"bear_limb_lift","harder":"plank_opposite_arm_leg","ess":false,"gymOnly":false,"img":false,"badEasier":false,"badHarder":false,"guess":"coredyn","seed":"","cues":"From the bear hold, lift the opposing arm and leg (right arm + left leg) at once, hold 2-3 sec, then switch. The hardest bear variation — maximal anti-rotation and balance."},{"id":"bench_dip","name":"Bench Dip","pattern":"push","dbFamily":"dip","equipment":["bench"],"measure":"reps","level":"beg","diff":3,"easier":"","harder":"","ess":false,"gymOnly":false,"img":false,"badEasier":false,"badHarder":false,"guess":"hpush","seed":"","cues":"Hands behind on bench, feet on floor or elevated. Full depth. Great entry-level dip."},{"id":"bench_press","name":"Bench Press","pattern":"push","dbFamily":"press","equipment":["bb","bench","rack"],"measure":"reps","level":"int","diff":6,"easier":"","harder":"","ess":false,"gymOnly":false,"img":true,"badEasier":false,"badHarder":false,"guess":"hpush","seed":"adv","cues":"Shoulder blades pinned to the bench, feet down. Bar to the sternum, elbows about 45 degrees, press to lockout."},{"id":"box_squat","name":"Bench Squat","pattern":"quad","dbFamily":"squat","equipment":["bench"],"measure":"reps","level":"beg","diff":1,"easier":"","harder":"bodyweight_squat","ess":false,"gymOnly":false,"img":false,"badEasier":false,"badHarder":false,"guess":"squat","seed":"","cues":"Stand in front of a bench, feet a bit wider than the hips. Sit back until you touch it lightly, then stand. Touch — do not drop onto it."},{"id":"bent_knee_hollow_hold","name":"Bent-Knee Hollow Hold","pattern":"core","dbFamily":"hollow","equipment":["bw"],"measure":"hold","level":"beg","diff":2,"easier":"dead_bug","harder":"hollow_hold","ess":false,"gymOnly":false,"img":false,"badEasier":false,"badHarder":false,"guess":"corestat","seed":"","cues":"Lift the shoulder blades off the floor, knees bent at 90°, arms extended straight back behind the ears. Low back pressed flat. The easier hollow — keeps the legs light to protect the lower back."},{"id":"bent_over_row","name":"Bent-Over Row","pattern":"pull","dbFamily":"","equipment":["db","bb"],"measure":"reps","level":"int","diff":5,"easier":"seal_row","harder":"single_arm_row","ess":false,"gymOnly":false,"img":true,"badEasier":false,"badHarder":false,"guess":"hpull","seed":"adv","cues":"Hinge over, flat back, row to the ribs. DB or barbell."},{"id":"bicycle_crunch","name":"Bicycle Crunch","pattern":"core","dbFamily":"","equipment":["bw"],"measure":"reps","level":"beg","diff":3,"easier":"russian_twist","harder":"hanging_knee_raise","ess":false,"gymOnly":false,"img":false,"badEasier":false,"badHarder":false,"guess":"aerobic","seed":"","cues":"Lying crunch: opposite elbow to opposite knee in a pedaling motion. Slow and controlled beats fast and sloppy. Obliques + hip flexors."},{"id":"bird_dog","name":"Bird Dog","pattern":"core","dbFamily":"","equipment":["bw"],"measure":"reps","level":"beg","diff":2,"easier":"","harder":"bear_hold","ess":false,"gymOnly":false,"img":true,"badEasier":false,"badHarder":false,"guess":"mobility","seed":"","cues":"On all fours. Extend the right arm forward and the left leg straight back at the same time. Hold 2 sec without letting the hips rotate, then switch sides. Anti-rotation control."},{"id":"bird_dog_crunch","name":"Bird Dog Crunch","pattern":"core","dbFamily":"","equipment":["bw"],"measure":"reps","level":"","diff":null,"easier":"","harder":"","ess":false,"gymOnly":false,"img":true,"badEasier":false,"badHarder":false,"guess":"aerobic","seed":"","cues":"Extend, then draw elbow-to-knee under body."},{"id":"bodyline_drill","name":"Bodyline Drill","pattern":"core","dbFamily":"plank","equipment":["bw"],"measure":"hold","level":"beg","diff":3,"easier":"high_plank","harder":"forearm_plank","ess":false,"gymOnly":false,"img":false,"badEasier":false,"badHarder":false,"guess":"corestat","seed":"","cues":"Face down on floor. Arms straight overhead. Squeeze everything: glutes, core, quads, push armpits toward ears. Body is one rigid plank. The fundamental shape that all handstand work requires."},{"id":"bodyweight_squat","name":"Bodyweight Squat","pattern":"quad","dbFamily":"squat","equipment":["bw"],"measure":"reps","level":"beg","diff":2,"easier":"","harder":"goblet_squat","ess":false,"gymOnly":false,"img":true,"badEasier":false,"badHarder":false,"guess":"squat","seed":"beg","cues":"Feet about shoulder width, sit down between the hips. Hip crease below the knee, chest tall, drive through the whole foot."},{"id":"bottoms_up_kb_hold","name":"Bottoms-Up KB Hold","pattern":"push","dbFamily":"grip-iso","equipment":["db"],"measure":"hold","level":"int","diff":5,"easier":"crushgriphold","harder":"","ess":false,"gymOnly":false,"img":false,"badEasier":true,"badHarder":false,"guess":"hpush","seed":"","cues":"Kettlebell upside-down at shoulder, bell pointing to ceiling. Wrist neutral, elbow tucked. The bell wants to flop — your grip + shoulder stabilizers fight for the line. 20–40 sec each hand. Brutal for shoulder stability + grip."},{"id":"bulgarian_dip","name":"Bulgarian Dip","pattern":"push","dbFamily":"dip","equipment":["rings"],"measure":"reps","level":"adv","diff":8,"easier":"ring_dip","harder":"","ess":false,"gymOnly":false,"img":false,"badEasier":false,"badHarder":false,"guess":"hpush","seed":"","cues":"On rings. From the top of a ring dip, rotate the rings outward and turn the palms forward at the top (Bulgarian press). Adds rotational shoulder stability + tricep load. Slow tempo only."},{"id":"bulgarian_split","name":"Bulgarian Split Squat","pattern":"quad","dbFamily":"","equipment":["db","vest","bench"],"measure":"reps","level":"","diff":null,"easier":"","harder":"","ess":false,"gymOnly":false,"img":true,"badEasier":false,"badHarder":false,"guess":"unilat","seed":"beg","cues":"Front-foot loaded, knee tracks toes."},{"id":"burpee","name":"Burpee","pattern":"full","dbFamily":"","equipment":["bw"],"measure":"reps","level":"int","diff":4,"easier":"full_burpee","harder":"","ess":true,"gymOnly":false,"img":false,"badEasier":false,"badHarder":false,"guess":"fullbody","seed":"","cues":"Squat-jump back-push-up-jump forward-jump + clap overhead. Rhythm is everything."},{"id":"burpee_pull_up","name":"Burpee Pull-Up","pattern":"push","dbFamily":"pull-up","equipment":["pullupbar"],"measure":"reps","level":"int","diff":6,"easier":"full_burpee","harder":"","ess":true,"gymOnly":false,"img":false,"badEasier":false,"badHarder":false,"guess":"fullbody","seed":"","cues":"Full burpee directly below the bar. Use the jump momentum to flow into the pull-up — don't pause between. Pull to chin over bar. Land softly on descent. One continuous fluid motion."},{"id":"cable_rear_delt_fly","name":"Cable Rear-Delt Fly","pattern":"pull","dbFamily":"","equipment":["cable"],"measure":"reps","level":"beg","diff":2,"easier":"","harder":"","ess":false,"gymOnly":true,"img":false,"badEasier":false,"badHarder":false,"guess":"hpull","seed":"","cues":"Cable set at shoulder height. Grab the handle with the opposite hand so the cable crosses your body, arm almost straight. Pull it out and across, away from your body. Constant tension the whole way. One arm at a time."},{"id":"cat_cow","name":"Cat–Cow","pattern":"mobility","dbFamily":"","equipment":["bw"],"measure":"reps","level":"","diff":null,"easier":"","harder":"","ess":false,"gymOnly":false,"img":true,"badEasier":false,"badHarder":false,"guess":"mobility","seed":"int","cues":"Flow spine flexion ↔ extension."},{"id":"chest_press_machine","name":"Chest Press Machine","pattern":"push","dbFamily":"","equipment":["machine"],"measure":"reps","level":"beg","diff":2,"easier":"","harder":"","ess":false,"gymOnly":true,"img":false,"badEasier":false,"badHarder":false,"guess":"hpush","seed":"","cues":"Set the seat so the handles sit level with the middle of your chest. Press out, control the way back. Do not lock out hard."},{"id":"rear_delt_row","name":"Chest-Supported Rear-Delt Row","pattern":"pull","dbFamily":"","equipment":["db","bench"],"measure":"reps","level":"beg","diff":3,"easier":"","harder":"","ess":false,"gymOnly":true,"img":false,"badEasier":false,"badHarder":false,"guess":"hpull","seed":"","cues":"Chest on the incline bench, dumbbells hanging. Row them out WIDE with your elbows flared out to the sides, up toward your chest — not tucked to your ribs. The wide elbow path is what makes it hit the back of the shoulders. Squeeze, lower sl"},{"id":"chest_supported_row","name":"Chest-Supported Row","pattern":"pull","dbFamily":"","equipment":["machine"],"measure":"reps","level":"beg","diff":2,"easier":"","harder":"","ess":false,"gymOnly":true,"img":false,"badEasier":false,"badHarder":false,"guess":"hpull","seed":"","cues":"Chest stays flat on the pad the whole set. Row to your ribs, pause a beat, lower slowly. The pad does the cheating for you."},{"id":"chest_to_bar","name":"Chest-to-Bar Pull-Up","pattern":"pull","dbFamily":"","equipment":["pullupbar"],"measure":"reps","level":"adv","diff":7,"easier":"pullup","harder":"muscle_up_bar","ess":false,"gymOnly":false,"img":true,"badEasier":false,"badHarder":false,"guess":"vpull","seed":"","cues":"Pull higher — sternum to the bar. Muscle-up prep."},{"id":"chest_to_wall_deficit_hspu","name":"Chest-to-Wall Deficit HSPU","pattern":"push","dbFamily":"handstand","equipment":["bw","parallettes"],"measure":"reps","level":"adv","diff":8,"easier":"wall_hspu","harder":"","ess":false,"gymOnly":false,"img":false,"badEasier":false,"badHarder":false,"guess":"vpush","seed":"","cues":"Hands on parallettes facing the wall, chest-to-wall handstand position. Lower your head BELOW the level of your hands (the deficit). Press back up to lockout. Builds the deepest range of motion needed for full HSPU."},{"id":"chest_to_wall_handstand_hold","name":"Chest-to-Wall Handstand Hold","pattern":"push","dbFamily":"handstand","equipment":["bw"],"measure":"hold","level":"int","diff":5,"easier":"wall_handstand","harder":"","ess":false,"gymOnly":false,"img":false,"badEasier":false,"badHarder":false,"guess":"vpush","seed":"","cues":"Face the wall. Walk up into handstand with the chest, thighs and feet near the wall (NOT the back). Locked elbows, elevated scapula. Only the feet touch the wall — body straight line. Trains the same alignment as freestanding handstand with"},{"id":"chin_up","name":"Chin-up","pattern":"pull","dbFamily":"","equipment":["pullupbar"],"measure":"reps","level":"int","diff":4,"easier":"","harder":"","ess":false,"gymOnly":false,"img":true,"badEasier":false,"badHarder":false,"guess":"vpull","seed":"","cues":"Supinated, full ROM."},{"id":"assisted_chinup_top_hold","name":"Chin-Up Top Hold (assisted machine)","pattern":"pull","dbFamily":"","equipment":["machine"],"measure":"hold","level":"beg","diff":3,"easier":"","harder":"negative_pullup","ess":false,"gymOnly":true,"img":false,"badEasier":false,"badHarder":false,"guess":"vpull","seed":"","cues":"Palms facing you. Use the assist machine to get your chin above the bar, then just hold there. Chest up, shoulders down. Log the ASSIST weight: lower is stronger."},{"id":"commando_pullup","name":"Commando Pull-Up","pattern":"pull","dbFamily":"","equipment":["pullupbar"],"measure":"reps","level":"int","diff":6,"easier":"pullup","harder":"archer_pullup","ess":false,"gymOnly":false,"img":false,"badEasier":false,"badHarder":false,"guess":"vpull","seed":"","cues":"Straddle the bar, pull side to side, alternate lead hand."},{"id":"copenhagen_plank","name":"Copenhagen Plank","pattern":"core","dbFamily":"side-plank","equipment":["bench"],"measure":"hold","level":"adv","diff":6,"easier":"star_side_plank","harder":"","ess":false,"gymOnly":false,"img":false,"badEasier":false,"badHarder":false,"guess":"corestat","seed":"","cues":"Top leg on bench, bottom leg floating. Straight body. Insane adductor + core."},{"id":"crunch","name":"Crunch","pattern":"core","dbFamily":"","equipment":["bw"],"measure":"reps","level":"beg","diff":1,"easier":"","harder":"sit_up","ess":false,"gymOnly":false,"img":false,"badEasier":false,"badHarder":false,"guess":"aerobic","seed":"","cues":"Lie on back, knees bent. Curl the shoulder blades off the floor by flexing the abs — don't yank the neck. Lower with control. Top-ab spinal flexion."},{"id":"db_preacher_curl","name":"DB Preacher Curl","pattern":"push","dbFamily":"planche-accessory","equipment":["db","bench"],"measure":"reps","level":"int","diff":4,"easier":"","harder":"","ess":false,"gymOnly":false,"img":false,"badEasier":false,"badHarder":false,"guess":"hpush","seed":"","cues":"Use a preacher bench (or any padded incline). Isolate the bicep — curl with maximum tension and a controlled lower. Focus on the BOTTOM lockout — that is where the bicep tendon takes load. Specifically conditions the bicep tendon against hy"},{"id":"db_pullover","name":"DB Pullover (on bench)","pattern":"pull","dbFamily":"","equipment":["db","bench"],"measure":"reps","level":"beg","diff":3,"easier":"","harder":"","ess":false,"gymOnly":true,"img":false,"badEasier":false,"badHarder":false,"guess":"hpull","seed":"","cues":"Lie back on the bench holding one dumbbell over your chest, elbows slightly bent and fixed. Lower the dumbbell back to about head level only — feel the stretch across your lats and ribs, not deep in the shoulder. Pull it back over your ches"},{"id":"db_shoulder_press","name":"DB Shoulder Press","pattern":"push","dbFamily":"","equipment":["db","bench"],"measure":"reps","level":"beg","diff":3,"easier":"","harder":"","ess":false,"gymOnly":true,"img":false,"badEasier":false,"badHarder":false,"guess":"vpush","seed":"","cues":"Sit tall, a dumbbell in each hand at shoulder height. Press straight overhead, ribs down so you do not arch your back. Lower back to ear height under control."},{"id":"dead_bug","name":"Dead Bug","pattern":"core","dbFamily":"","equipment":["bw"],"measure":"reps","level":"beg","diff":2,"easier":"","harder":"bent_knee_hollow_hold","ess":false,"gymOnly":false,"img":true,"badEasier":false,"badHarder":false,"guess":"coredyn","seed":"beg","cues":"Lie on back, arms up, knees bent to 90°. Press the low back into the floor. Lower the opposite arm and leg toward the floor slowly, then return to center. Brace the whole time."},{"id":"dead_hang","name":"Dead Hang","pattern":"pull","dbFamily":"","equipment":["pullupbar"],"measure":"hold","level":"beg","diff":1,"easier":"","harder":"scap_pullup","ess":false,"gymOnly":false,"img":true,"badEasier":false,"badHarder":false,"guess":"carry","seed":"","cues":"Passive full hang. Decompress the spine, build grip."},{"id":"deadstop_pushup","name":"Dead-Stop Push-up","pattern":"push","dbFamily":"push-up","equipment":["bw"],"measure":"reps","level":"int","diff":5,"easier":"pushup","harder":"","ess":false,"gymOnly":false,"img":true,"badEasier":false,"badHarder":false,"guess":"hpush","seed":"","cues":"Lower all the way to the floor. Lift hands off — full tension release. Reset. Press from zero. No stretch reflex, no momentum. Every rep is a fresh max effort. Brutally effective for pure chest strength."},{"id":"deadlift","name":"Deadlift","pattern":"hinge","dbFamily":"","equipment":["bb"],"measure":"reps","level":"","diff":null,"easier":"","harder":"","ess":false,"gymOnly":false,"img":true,"badEasier":false,"badHarder":false,"guess":"hinge","seed":"int","cues":"Brace, push floor away, neutral spine."},{"id":"decline_push_up","name":"Decline Push-Up","pattern":"push","dbFamily":"push-up","equipment":["bench"],"measure":"reps","level":"int","diff":4,"easier":"pushup","harder":"","ess":false,"gymOnly":false,"img":false,"badEasier":false,"badHarder":false,"guess":"hpush","seed":"","cues":"Feet elevated, lead with chest. Straight body from head to heels."},{"id":"deep_pike_pushup","name":"Deep Parallette Pike Push-Up","pattern":"push","dbFamily":"","equipment":["parallettes","vest"],"measure":"reps","level":"","diff":null,"easier":"","harder":"","ess":false,"gymOnly":false,"img":true,"badEasier":false,"badHarder":false,"guess":"vpush","seed":"","cues":"Hips stacked, deep ROM off parallettes."},{"id":"deep_squat_thoracic","name":"Deep Squat Hold + Chest Opening","pattern":"mobility","dbFamily":"","equipment":["rack"],"measure":"hold","level":"beg","diff":1,"easier":"","harder":"","ess":false,"gymOnly":true,"img":false,"badEasier":false,"badHarder":false,"guess":"mobility","seed":"","cues":"Hold a rack upright or straps and sink into a squat as deep as feels fine — never into pain. Reach the free arm up and behind you and let your chest turn to follow your hand. Swap arms."},{"id":"deep_squat_rock","name":"Deep Squat Rocks","pattern":"mobility","dbFamily":"","equipment":["bw"],"measure":"reps","level":"","diff":null,"easier":"","harder":"","ess":false,"gymOnly":false,"img":true,"badEasier":false,"badHarder":false,"guess":"mobility","seed":"beg","cues":"Sit deep, rock side to side."},{"id":"devil_s_press","name":"Devil's Press","pattern":"push","dbFamily":"","equipment":["db"],"measure":"reps","level":"adv","diff":7,"easier":"db_swing","harder":"","ess":true,"gymOnly":false,"img":false,"badEasier":false,"badHarder":false,"guess":"fullbody","seed":"","cues":"Burpee down, chest touches floor. Explosive hip hinge to snatch both DBs overhead in one motion. Arms stay straight on the swing up. Control the descent — don't drop."},{"id":"diamond_push_up","name":"Diamond Push-Up","pattern":"push","dbFamily":"push-up","equipment":["bw"],"measure":"reps","level":"int","diff":5,"easier":"pushup","harder":"","ess":false,"gymOnly":false,"img":false,"badEasier":false,"badHarder":false,"guess":"hpush","seed":"","cues":"Hands form diamond, elbows track back, squeeze triceps hard at lockout."},{"id":"diamond_push_up_on_kettlebell","name":"Diamond Push-Up on Kettlebell","pattern":"push","dbFamily":"push-up","equipment":["kb"],"measure":"reps","level":"int","diff":6,"easier":"diamond_push_up","harder":"","ess":false,"gymOnly":false,"img":false,"badEasier":false,"badHarder":false,"guess":"hpush","seed":"","cues":"Diamond grip on a single KB handle. Lower deep — the KB elevates your hands giving extra ROM. Elbows track tight. Squeeze hard at top. Bell stability adds a hidden challenge."},{"id":"dip","name":"Dip","pattern":"push","dbFamily":"dip","equipment":["parallettes"],"measure":"reps","level":"int","diff":5,"easier":"banded_dip","harder":"","ess":true,"gymOnly":false,"img":true,"badEasier":false,"badHarder":false,"guess":"hpush","seed":"int","cues":"Slight lean for chest, upright for triceps. Full depth. No shoulder shrug."},{"id":"dip_bottom_hold","name":"Dip Bottom Hold","pattern":"push","dbFamily":"dip","equipment":["dipbars"],"measure":"hold","level":"int","diff":4,"easier":"dip_support_hold","harder":"","ess":false,"gymOnly":false,"img":false,"badEasier":false,"badHarder":false,"guess":"hpush","seed":"","cues":"Bottom of the dip — shoulder below elbow, controlled tension. Hold here to build strength at the hardest position. Start at 5-10s holds, build to 30s."},{"id":"dip_negative","name":"Dip Negative","pattern":"push","dbFamily":"dip","equipment":["dipbars"],"measure":"reps","level":"int","diff":4,"easier":"dip_bottom_hold","harder":"","ess":false,"gymOnly":false,"img":false,"badEasier":false,"badHarder":false,"guess":"hpush","seed":"","cues":"Start at the top of the dip (arms locked). Lower yourself slowly — 4-5 seconds down to the bottom. Step off and reset. Eccentric work builds the strength to press up. 3-5 negatives per set."},{"id":"dip_support_hold","name":"Dip Support Hold","pattern":"push","dbFamily":"dip","equipment":["dipbars"],"measure":"hold","level":"beg","diff":3,"easier":"","harder":"","ess":true,"gymOnly":false,"img":true,"badEasier":false,"badHarder":false,"guess":"hpush","seed":"","cues":"Top of the dip position — arms locked, shoulders depressed and packed, body upright. Hold full bodyweight without bending arms. The entry test for dip work. Build 30-60s before attempting reps."},{"id":"chest_stretch","name":"Doorway Chest Stretch","pattern":"mobility","dbFamily":"","equipment":["bw"],"measure":"hold","level":"","diff":null,"easier":"","harder":"","ess":false,"gymOnly":false,"img":false,"badEasier":false,"badHarder":false,"guess":"mobility","seed":"","cues":"Forearm on frame, rotate away."},{"id":"down_dog_up_dog","name":"Down Dog to Up Dog","pattern":"mobility","dbFamily":"flow","equipment":["bw"],"measure":"reps","level":"beg","diff":1,"easier":"","harder":"down_dog_up_dog_bar","ess":false,"gymOnly":true,"img":true,"badEasier":false,"badHarder":false,"guess":"mobility","seed":"","cues":"Hips high in an upside-down V, then sweep the chest through and forward until the arms are straight. Hold five seconds at each end."},{"id":"down_dog_up_dog_bar","name":"Down Dog to Up Dog (hands on bar)","pattern":"mobility","dbFamily":"flow","equipment":["rack"],"measure":"reps","level":"beg","diff":1,"easier":"down_dog_up_dog","harder":"","ess":false,"gymOnly":true,"img":false,"badEasier":false,"badHarder":false,"guess":"mobility","seed":"","cues":"Same movement with your hands on a hip-height bar instead of the floor. Much easier on the wrists and shoulders."},{"id":"dragon_flag","name":"Dragon Flag (Tuck)","pattern":"core","dbFamily":"dragonflag","equipment":["bench"],"measure":"hold","level":"int","diff":5,"easier":"dragon_flag_candlestick","harder":"tuck_dragon_flag_hold","ess":false,"gymOnly":false,"img":true,"badEasier":false,"badHarder":false,"guess":"corestat","seed":"adv","cues":"From the vertical candlestick, knees tucked, lock the hips so torso and thighs are one rigid line and lower slowly (5-sec negative) until the lower back touches. Slow negatives (reps) OR hold parallel."},{"id":"dragon_flag_candlestick","name":"Dragon Flag Candlestick","pattern":"core","dbFamily":"dragonflag","equipment":["bench"],"measure":"reps","level":"int","diff":4,"easier":"hollow_rocks","harder":"tuck_dragon_flag_hold","ess":false,"gymOnly":false,"img":false,"badEasier":false,"badHarder":false,"guess":"coredyn","seed":"","cues":"Grip a sturdy anchor behind the head. Roll the hips back, kick straight legs vertical (weight on the upper back, not neck), then lower the hips down rolling the spine one vertebra at a time. The hip-lift base."},{"id":"db_rdl","name":"Dumbbell Romanian Deadlift","pattern":"hinge","dbFamily":"","equipment":["db"],"measure":"reps","level":"beg","diff":3,"easier":"","harder":"","ess":false,"gymOnly":true,"img":false,"badEasier":false,"badHarder":false,"guess":"hinge","seed":"","cues":"Push your hips back and slide the dumbbells down the front of your legs. Knees stay almost straight. Stop when you feel the stretch behind your thighs, then stand tall."},{"id":"db_swing","name":"Dumbbell Swing","pattern":"hinge","dbFamily":"","equipment":["db"],"measure":"reps","level":"","diff":null,"easier":"","harder":"","ess":false,"gymOnly":false,"img":true,"badEasier":false,"badHarder":false,"guess":"power","seed":"","cues":"Hip snap, not a squat. (KB→DB)"},{"id":"elephant_walk","name":"Elephant Walk","pattern":"push","dbFamily":"","equipment":["bw"],"measure":"reps","level":"int","diff":5,"easier":"pike_lean","harder":"","ess":true,"gymOnly":false,"img":false,"badEasier":false,"badHarder":false,"guess":"hpush","seed":"","cues":"Start in pike/downward dog. Walk hands backward toward feet, keeping legs as straight as possible and hips high. Alternate hand steps. Bridges pike strength to press to handstand."},{"id":"elevated_feet_plank","name":"Elevated Feet Plank","pattern":"core","dbFamily":"plank","equipment":["bench"],"measure":"hold","level":"int","diff":5,"easier":"high_plank","harder":"single_arm_plank","ess":false,"gymOnly":false,"img":false,"badEasier":false,"badHarder":false,"guess":"corestat","seed":"","cues":"High plank with feet on bench. More load shifts to upper core and shoulders. 30-60 sec."},{"id":"elevated_pike_lean","name":"Elevated Pike Lean","pattern":"push","dbFamily":"pike","equipment":["bench"],"measure":"hold","level":"int","diff":5,"easier":"pike_lean","harder":"","ess":false,"gymOnly":false,"img":false,"badEasier":false,"badHarder":false,"guess":"vpush","seed":"","cues":"Feet elevated on bench. Pike lean forward — more load through the arms due to elevation."},{"id":"elevated_pike_push_up","name":"Elevated Pike Push-Up","pattern":"push","dbFamily":"push-up","equipment":["bench"],"measure":"reps","level":"int","diff":5,"easier":"pike_push_up","harder":"","ess":false,"gymOnly":false,"img":false,"badEasier":false,"badHarder":false,"guess":"vpush","seed":"","cues":"Feet elevated on bench in pike position. Press overhead. Closer to handstand angle than floor pike push-up."},{"id":"explosive_chinup","name":"Explosive Chin-up","pattern":"pull","dbFamily":"","equipment":["pullupbar"],"measure":"reps","level":"int","diff":6,"easier":"","harder":"","ess":false,"gymOnly":false,"img":true,"badEasier":false,"badHarder":false,"guess":"power","seed":"","cues":"Pull fast — chest toward bar."},{"id":"explosive_pullup","name":"Explosive Pull-Up","pattern":"pull","dbFamily":"","equipment":["pullupbar"],"measure":"reps","level":"int","diff":6,"easier":"pullup","harder":"high_pullup","ess":false,"gymOnly":false,"img":false,"badEasier":false,"badHarder":false,"guess":"power","seed":"","cues":"Pull as high and fast as possible — power for the muscle-up."},{"id":"face_pull","name":"Face Pull","pattern":"pull","dbFamily":"","equipment":["cable"],"measure":"reps","level":"beg","diff":2,"easier":"","harder":"","ess":false,"gymOnly":true,"img":false,"badEasier":false,"badHarder":false,"guess":"hpull","seed":"","cues":"Rope at head height. Pull it toward your forehead and let your hands split apart at the end. Light weight, slow, feel it between the shoulder blades."},{"id":"false_grip_pullup","name":"False-Grip Pull-Up","pattern":"pull","dbFamily":"","equipment":["rings"],"measure":"reps","level":"adv","diff":8,"easier":"chest_to_bar","harder":"muscle_up_rings","ess":false,"gymOnly":false,"img":false,"badEasier":false,"badHarder":false,"guess":"vpull","seed":"","cues":"Wrists over the rings (false grip). The ring muscle-up gateway."},{"id":"farmers_carry","name":"Farmer's Carry (no straps)","pattern":"conditioning","dbFamily":"grip","equipment":["db"],"measure":"hold","level":"beg","diff":3,"easier":"","harder":"","ess":false,"gymOnly":true,"img":true,"badEasier":false,"badHarder":false,"guess":"carry","seed":"beg","cues":"A dumbbell in each hand, no straps — grip is the point. Walk tall, shoulders back, 30-40 m. Set them down when the round is done, not when your grip fails. If they slip early, go lighter. Start 40-50 lb per hand."},{"id":"march_in_place","name":"Fast March","pattern":"conditioning","dbFamily":"low-impact","equipment":["bw"],"measure":"hold","level":"beg","diff":1,"easier":"","harder":"","ess":false,"gymOnly":false,"img":false,"badEasier":false,"badHarder":false,"guess":"aerobic","seed":"","cues":"Knees high, arms driving, stay light. Both feet never leave the floor at once — this is the no-impact way to raise a heart rate."},{"id":"feet_on_wall_90_degree","name":"Feet on Wall 90 Degree","pattern":"push","dbFamily":"handstand","equipment":["bw"],"measure":"hold","level":"int","diff":4,"easier":"pike_push_up","harder":"","ess":false,"gymOnly":false,"img":false,"badEasier":false,"badHarder":false,"guess":"vpush","seed":"","cues":"Hands on floor ~1 foot from wall, feet walked up the wall to hip height — body forms a 90° angle. Hold position with shoulders stacked. The L-shape primes the overhead press pattern for HSPU work."},{"id":"feet_elevated_ring_row","name":"Feet-Elevated Ring Row","pattern":"pull","dbFamily":"","equipment":["rings"],"measure":"reps","level":"int","diff":5,"easier":"ring_row","harder":"archer_row","ess":false,"gymOnly":false,"img":false,"badEasier":false,"badHarder":false,"guess":"hpull","seed":"","cues":"Feet up on a box — nearly horizontal, much harder."},{"id":"flutter_kicks","name":"Flutter Kicks","pattern":"core","dbFamily":"","equipment":["bw"],"measure":"reps","level":"beg","diff":2,"easier":"lying_knee_tuck","harder":"scissor_kicks","ess":false,"gymOnly":false,"img":false,"badEasier":false,"badHarder":false,"guess":"coredyn","seed":"","cues":"Legs straight, heels six inches off the floor, low back pressed down. Alternate small fast up-down kicks. Keep the core braced the whole set."},{"id":"foot_supported_l_sit","name":"Foot-Supported L-Sit","pattern":"core","dbFamily":"","equipment":["bw"],"measure":"hold","level":"beg","diff":2,"easier":"","harder":"alternating_single_leg_l_sit","ess":false,"gymOnly":false,"img":false,"badEasier":false,"badHarder":false,"guess":"corestat","seed":"","cues":"Beginner L-sit: hands pressing down on the floor (or parallettes), knees bent or heels lightly touching the floor. Press the shoulders down and lift the chest. Build the compression before going feet-up."},{"id":"forearm_plank","name":"Forearm Plank","pattern":"core","dbFamily":"plank","equipment":["bw"],"measure":"hold","level":"beg","diff":3,"easier":"incline_plank","harder":"rkc_plank","ess":false,"gymOnly":false,"img":true,"badEasier":false,"badHarder":false,"guess":"corestat","seed":"beg","cues":"Elbows under shoulders. Neutral spine. Posterior pelvic tilt. Squeeze glutes. No sagging or piking."},{"id":"handstand","name":"Freestanding Attempts","pattern":"skill","dbFamily":"","equipment":["bw"],"measure":"hold","level":"","diff":null,"easier":"","harder":"","ess":false,"gymOnly":false,"img":true,"badEasier":false,"badHarder":false,"guess":"vpull","seed":"adv","cues":"Kick to balance, ride it as long as you can, bail safely."},{"id":"freestanding_hs","name":"Freestanding HS","pattern":"push","dbFamily":"handstand","equipment":["bw"],"measure":"hold","level":"adv","diff":9,"easier":"wall_handstand","harder":"","ess":true,"gymOnly":false,"img":false,"badEasier":false,"badHarder":false,"guess":"vpush","seed":"","cues":"Balance with finger pressure. Micro-wrist adjustments. Breathe and relax."},{"id":"frog_planche","name":"Frog Planche","pattern":"push","dbFamily":"planche","equipment":["bw"],"measure":"hold","level":"int","diff":6,"easier":"tuck_planche_hold","harder":"","ess":false,"gymOnly":false,"img":false,"badEasier":false,"badHarder":false,"guess":"hpush","seed":"","cues":"Between Tuck and Advanced Tuck. Knees rest lightly on the outside of your elbows while leaning forward. Slowly pull knees away from the arms as you gain strength. The bridge that lets you load planche torque without full bodyweight commitme"},{"id":"frog_stand","name":"Frog Stand","pattern":"push","dbFamily":"planche","equipment":["bw"],"measure":"hold","level":"beg","diff":3,"easier":"bodyline_drill","harder":"","ess":true,"gymOnly":false,"img":false,"badEasier":false,"badHarder":false,"guess":"hpush","seed":"","cues":"Hands shoulder-width, knees resting on elbows/triceps. Lean forward and lift feet. First real planche shape — accessible to beginners. Build to 30s."},{"id":"front_lever_pullup","name":"Front Lever Pull-Up","pattern":"pull","dbFamily":"","equipment":["pullupbar"],"measure":"reps","level":"adv","diff":9,"easier":"front_lever_row","harder":"","ess":false,"gymOnly":false,"img":false,"badEasier":false,"badHarder":false,"guess":"vpull","seed":"","cues":"Pull-up while holding the front-lever line. Extreme."},{"id":"front_lever_row","name":"Front Lever Row","pattern":"pull","dbFamily":"","equipment":["pullupbar"],"measure":"reps","level":"adv","diff":8,"easier":"single_arm_ring_row","harder":"front_lever_pullup","ess":false,"gymOnly":false,"img":false,"badEasier":false,"badHarder":false,"guess":"vpull","seed":"","cues":"From a front-lever line, row the body up to the bar. Elite back."},{"id":"front_lever_tuck","name":"Front Lever Tuck","pattern":"skill","dbFamily":"","equipment":["pullupbar","rings"],"measure":"hold","level":"int","diff":5,"easier":"","harder":"","ess":false,"gymOnly":false,"img":false,"badEasier":false,"badHarder":false,"guess":"vpull","seed":"","cues":"Gentle while forearm heals. Posterior tilt."},{"id":"full_90_degree_hspu","name":"Full 90-Degree HSPU","pattern":"push","dbFamily":"planche","equipment":["bw"],"measure":"reps","level":"adv","diff":10,"easier":"x90_degree_hspu_negative","harder":"","ess":false,"gymOnly":false,"img":false,"badEasier":false,"badHarder":false,"guess":"vpush","seed":"","cues":"Lower from handstand into a bent-arm horizontal hold (the 90° planche position) and press back up to vertical handstand. Combines full HSPU range with planche-tier shoulder strength. The pinnacle of vertical+horizontal push fusion. Endpoint"},{"id":"full_burpee","name":"Full Burpee","pattern":"push","dbFamily":"","equipment":["bw"],"measure":"reps","level":"int","diff":4,"easier":"","harder":"","ess":true,"gymOnly":false,"img":true,"badEasier":false,"badHarder":false,"guess":"fullbody","seed":"beg","cues":"Squat → hands → jump back → chest to floor (full push-up) → jump feet in → squat → explosive jump with arms overhead. One fluid motion. Land soft every rep. No shortcuts — full range is the entire point."},{"id":"full_fl_raise","name":"Full FL Raise","pattern":"pull","dbFamily":"","equipment":["pullupbar"],"measure":"reps","level":"adv","diff":9,"easier":"straddle_fl_raise","harder":"","ess":false,"gymOnly":false,"img":false,"badEasier":false,"badHarder":false,"guess":"hpull","seed":"","cues":"Raise into a full front lever — elite."},{"id":"full_front_lever","name":"Full Front Lever","pattern":"pull","dbFamily":"","equipment":["pullupbar","rings"],"measure":"hold","level":"adv","diff":9,"easier":"straddle_front_lever","harder":"","ess":false,"gymOnly":false,"img":false,"badEasier":false,"badHarder":false,"guess":"vpull","seed":"adv","cues":"Body dead straight and horizontal. The goal hold."},{"id":"full_planche","name":"Full Planche","pattern":"push","dbFamily":"planche","equipment":["bw"],"measure":"hold","level":"adv","diff":10,"easier":"straddle_planche","harder":"","ess":false,"gymOnly":false,"img":false,"badEasier":false,"badHarder":false,"guess":"hpush","seed":"","cues":"Full straight-body planche hold. Legs together, body parallel to floor, shoulders over (and past) wrists. The pinnacle of straight-arm pushing strength. 3-5 second hold = elite. Multi-year skill — wrist conditioning mandatory."},{"id":"german_hang","name":"German Hang","pattern":"pull","dbFamily":"","equipment":["rings","pullupbar"],"measure":"hold","level":"int","diff":6,"easier":"skin_the_cat","harder":"skin_cat_front_support","ess":false,"gymOnly":false,"img":false,"badEasier":false,"badHarder":false,"guess":"carry","seed":"","cues":"Inverted hang, shoulders fully extended behind. Mobility + strength."},{"id":"glute_bridge","name":"Glute Bridge","pattern":"glute","dbFamily":"bridge","equipment":["mat"],"measure":"reps","level":"beg","diff":1,"easier":"","harder":"single_leg_bridge","ess":false,"gymOnly":false,"img":false,"badEasier":false,"badHarder":false,"guess":"hinge","seed":"","cues":"Heels close to your bum, toes up. Drive through the heels and squeeze hard at the top for a full second. Ribs down — the glutes lift, not the lower back."},{"id":"goblet_march","name":"Goblet March","pattern":"core","dbFamily":"anti-extension","equipment":["kb"],"measure":"hold","level":"beg","diff":3,"easier":"","harder":"","ess":false,"gymOnly":false,"img":false,"badEasier":false,"badHarder":false,"guess":"aerobic","seed":"","cues":"Bell at the chest, stand tall. Lift one knee to hip height, hold a beat, put it down. A plank you do standing up."},{"id":"goblet_squat","name":"Goblet Squat","pattern":"quad","dbFamily":"","equipment":["db"],"measure":"reps","level":"","diff":null,"easier":"","harder":"","ess":false,"gymOnly":false,"img":false,"badEasier":false,"badHarder":false,"guess":"squat","seed":"int","cues":"Elbows inside knees, upright torso."},{"id":"half_one_arm_push_up","name":"Half One-Arm Push-Up","pattern":"push","dbFamily":"push-up","equipment":["bw"],"measure":"reps","level":"adv","diff":7,"easier":"archer_push_up","harder":"","ess":false,"gymOnly":false,"img":false,"badEasier":false,"badHarder":false,"guess":"hpush","seed":"","cues":"Working arm shoulder-width, free hand on a low box (so the body angle is steeper than incline but easier than full one-arm). Slow descent on one arm only. The box absorbs less weight as it lowers."},{"id":"handstand_kick_ups","name":"Handstand Kick-Ups","pattern":"push","dbFamily":"handstand","equipment":["bw"],"measure":"reps","level":"int","diff":5,"easier":"wall_walk","harder":"","ess":false,"gymOnly":false,"img":false,"badEasier":false,"badHarder":false,"guess":"vpush","seed":"","cues":"Practice the dynamic entry to freestanding handstand. Kick up, find balance briefly, come down. Reps = entries. Use wall nearby for safety."},{"id":"handstand_push_up","name":"Handstand Push-Up","pattern":"push","dbFamily":"handstand","equipment":["bw"],"measure":"reps","level":"adv","diff":9,"easier":"chest_to_wall_deficit_hspu","harder":"","ess":false,"gymOnly":false,"img":false,"badEasier":false,"badHarder":false,"guess":"vpush","seed":"adv","cues":"Freestanding handstand push-up. From a balanced freestanding handstand, lower head to floor under control, press back to full lockout. No wall, no kick assist. The HSPU benchmark for elite calisthenics. Build to 5 strict."},{"id":"handstand_to_planche_negative","name":"Handstand to Planche Negative","pattern":"push","dbFamily":"planche","equipment":["bw"],"measure":"reps","level":"adv","diff":9,"easier":"straddle_planche","harder":"","ess":false,"gymOnly":false,"img":false,"badEasier":false,"badHarder":false,"guess":"vpush","seed":"","cues":"Start in a solid handstand. Arms locked. Slowly lower the body down through straddle or full layout, attempting to catch and freeze the movement right at the horizontal planche line. The eccentric forces the CNS to adapt to full planche loa"},{"id":"hanging_inverted_hold","name":"Hanging Inverted Hold","pattern":"core","dbFamily":"hang","equipment":["pullupbar"],"measure":"hold","level":"adv","diff":7,"easier":"toes_to_bar","harder":"inverted_candle","ess":false,"gymOnly":false,"img":false,"badEasier":false,"badHarder":false,"guess":"carry","seed":"","cues":"Pull the toes to the bar then keep tilting the hips back until the feet point at the ceiling — body upside down, tucked or straight. Depress the scapula hard. Balance shifts to the upper back and deep core."},{"id":"hanging_knee_raise","name":"Hanging Knee Raise","pattern":"core","dbFamily":"hanging","equipment":["pullupbar"],"measure":"reps","level":"beg","diff":3,"easier":"lying_leg_raise","harder":"hanging_leg_raise","ess":false,"gymOnly":false,"img":true,"badEasier":false,"badHarder":false,"guess":"coredyn","seed":"int","cues":"From dead hang, pull knees to chest. Control the descent. No swinging."},{"id":"hanging_leg_raise","name":"Hanging Leg Raise","pattern":"core","dbFamily":"hanging","equipment":["pullupbar"],"measure":"reps","level":"int","diff":5,"easier":"hanging_knee_raise","harder":"toes_to_bar","ess":false,"gymOnly":false,"img":false,"badEasier":false,"badHarder":false,"guess":"coredyn","seed":"","cues":"No swing. Posterior pelvic tilt at top. Control the descent. Legs straight."},{"id":"high_plank","name":"High Plank","pattern":"core","dbFamily":"plank","equipment":["bw"],"measure":"hold","level":"beg","diff":3,"easier":"forearm_plank","harder":"plankshouldertap","ess":false,"gymOnly":false,"img":false,"badEasier":false,"badHarder":true,"guess":"corestat","seed":"","cues":"Arms straight, wrists under shoulders. Body rigid head to heel. Active shoulders — push the floor away."},{"id":"high_pullup","name":"High Pull-Up","pattern":"pull","dbFamily":"","equipment":["pullupbar"],"measure":"reps","level":"int","diff":6,"easier":"explosive_pullup","harder":"negative_muscle_up_bar","ess":false,"gymOnly":false,"img":false,"badEasier":false,"badHarder":false,"guess":"vpull","seed":"","cues":"Pull to lower-chest / waist height — the height a muscle-up needs."},{"id":"hindu_push_up","name":"Hindu Push-Up","pattern":"push","dbFamily":"push-up","equipment":["bw"],"measure":"reps","level":"int","diff":4,"easier":"pushup","harder":"","ess":false,"gymOnly":false,"img":false,"badEasier":false,"badHarder":false,"guess":"hpush","seed":"","cues":"Start in pike. Arc chest close to ground forward into upward dog, push to lockout. Reverse the arc back to pike. Not a push-up — it's a full shoulder arc wave. Control the spine extension at the top."},{"id":"hip_abduction_machine","name":"Hip Abduction Machine","pattern":"glute","dbFamily":"","equipment":["machine"],"measure":"reps","level":"beg","diff":1,"easier":"","harder":"","ess":false,"gymOnly":true,"img":false,"badEasier":false,"badHarder":false,"guess":"hinge","seed":"","cues":"Pads on the outside of your knees. Push your knees apart, pause, come back slowly. Sit up tall."},{"id":"hip_adduction_machine","name":"Hip Adduction Machine","pattern":"glute","dbFamily":"","equipment":["machine"],"measure":"reps","level":"beg","diff":1,"easier":"","harder":"","ess":false,"gymOnly":true,"img":false,"badEasier":false,"badHarder":false,"guess":"hinge","seed":"","cues":"Flip the pads to the inside of your knees. Squeeze your knees together, pause, let them open back out slowly."},{"id":"hip_cars","name":"Hip CARs","pattern":"mobility","dbFamily":"","equipment":["bw"],"measure":"reps","level":"","diff":null,"easier":"","harder":"","ess":false,"gymOnly":false,"img":true,"badEasier":false,"badHarder":false,"guess":"mobility","seed":"beg","cues":"Slow, controlled full hip circles."},{"id":"hip_thrust","name":"Hip Thrust","pattern":"glute","dbFamily":"","equipment":["bb","bench"],"measure":"reps","level":"","diff":null,"easier":"","harder":"","ess":false,"gymOnly":false,"img":true,"badEasier":false,"badHarder":false,"guess":"hinge","seed":"","cues":"Chin tucked, full lockout, glute squeeze."},{"id":"hip_flexor_stretch","name":"Hip-Flexor Stretch","pattern":"mobility","dbFamily":"","equipment":["bw"],"measure":"hold","level":"","diff":null,"easier":"","harder":"","ess":false,"gymOnly":false,"img":false,"badEasier":false,"badHarder":false,"guess":"mobility","seed":"","cues":"Tall hips, posterior tilt, per side."},{"id":"hollow_body_crunch","name":"Hollow Body Crunch","pattern":"core","dbFamily":"hollow","equipment":["bw"],"measure":"reps","level":"beg","diff":3,"easier":"hollow_hold","harder":"hollow_rocks","ess":false,"gymOnly":false,"img":false,"badEasier":false,"badHarder":false,"guess":"aerobic","seed":"","cues":"From a full hollow hold, crunch the ribs toward the pelvis a few inches and return without losing the hollow line. Constant tension on the deep core — a hollow-position crunch."},{"id":"hollow_hold","name":"Hollow Hold","pattern":"core","dbFamily":"hollow","equipment":["bw"],"measure":"hold","level":"beg","diff":3,"easier":"bent_knee_hollow_hold","harder":"hollow_rocks","ess":false,"gymOnly":false,"img":true,"badEasier":false,"badHarder":false,"guess":"corestat","seed":"int","cues":"Lower back pressed flat. Ribcage closed. Arms overhead. Foundation of all gymnastics."},{"id":"hollow_heels_down","name":"Hollow Hold (heels down)","pattern":"core","dbFamily":"hollow","equipment":["bw"],"measure":"hold","level":"beg","diff":1,"easier":"","harder":"bent_knee_hollow_hold","ess":false,"gymOnly":true,"img":false,"badEasier":false,"badHarder":false,"guess":"corestat","seed":"","cues":"Lie on your back with your heels resting on the floor. Lift only your shoulders off the ground and press your low back flat. Easiest version — nothing should pull on your back."},{"id":"hollow_rocks","name":"Hollow Rocks","pattern":"core","dbFamily":"hollow","equipment":["bw"],"measure":"reps","level":"int","diff":5,"easier":"hollow_hold","harder":"squeeze_loaded_hollow_hold","ess":false,"gymOnly":false,"img":true,"badEasier":false,"badHarder":false,"guess":"coredyn","seed":"int","cues":"From hollow body hold, rock forward and back like a rocking chair. No momentum — all core."},{"id":"hollow_to_v_sit_snap_up","name":"Hollow-to-V-Sit Snap-Up","pattern":"core","dbFamily":"vup","equipment":["bw"],"measure":"reps","level":"adv","diff":6,"easier":"v_up","harder":"","ess":false,"gymOnly":false,"img":false,"badEasier":false,"badHarder":false,"guess":"coredyn","seed":"","cues":"From a low full hollow hold (heels 6 inches up), snap up into a full V-up touching the toes, then drop back into a rock-solid frozen hollow — no floor rest. Elite eccentric core control."},{"id":"horse_stance","name":"Horse Stance","pattern":"quad","dbFamily":"","equipment":["bw"],"measure":"hold","level":"","diff":null,"easier":"","harder":"","ess":false,"gymOnly":false,"img":true,"badEasier":false,"badHarder":false,"guess":"squat","seed":"","cues":"Thighs parallel, isometric hold."},{"id":"ice_cream_maker","name":"Ice Cream Maker","pattern":"pull","dbFamily":"","equipment":["pullupbar"],"measure":"reps","level":"adv","diff":8,"easier":"front_lever_row","harder":"","ess":false,"gymOnly":false,"img":false,"badEasier":false,"badHarder":false,"guess":"hpull","seed":"","cues":"From a front lever, pull to an inverted/pull-up top. Front-lever-to-bar."},{"id":"incline_plank","name":"Incline Plank","pattern":"core","dbFamily":"plank","equipment":["bench"],"measure":"hold","level":"beg","diff":1,"easier":"","harder":"forearm_plank","ess":false,"gymOnly":false,"img":false,"badEasier":false,"badHarder":false,"guess":"corestat","seed":"","cues":"Hands on bench, body straight head to heel. Reduce bench height to progress."},{"id":"incline_push_up","name":"Incline Push-Up","pattern":"push","dbFamily":"push-up","equipment":["bench"],"measure":"reps","level":"beg","diff":2,"easier":"knee_push_up","harder":"","ess":false,"gymOnly":false,"img":false,"badEasier":false,"badHarder":false,"guess":"hpush","seed":"","cues":"Hands on elevated surface. Great entry-level push pattern. Elbows 45°. Chest to bench."},{"id":"incline_row","name":"Incline Row","pattern":"pull","dbFamily":"","equipment":["pullupbar"],"measure":"reps","level":"beg","diff":2,"easier":"","harder":"ring_row","ess":false,"gymOnly":false,"img":false,"badEasier":false,"badHarder":false,"guess":"hpull","seed":"beg","cues":"High bar, body fairly upright. Row chest to bar."},{"id":"inverted_candle","name":"Inverted Candle","pattern":"core","dbFamily":"hang","equipment":["pullupbar"],"measure":"hold","level":"adv","diff":9,"easier":"hanging_inverted_hold","harder":"","ess":false,"gymOnly":false,"img":false,"badEasier":false,"badHarder":false,"guess":"carry","seed":"","cues":"From the inverted hang, lock a straight line shoulders-to-toes (a vertical candle), then slowly lower the straight body toward horizontal, pivoting only at the shoulders. The ultimate suspension test (hanging dragon flag)."},{"id":"jamaican_plank","name":"Jamaican Plank","pattern":"core","dbFamily":"side-plank","equipment":["bw"],"measure":"reps","level":"adv","diff":7,"easier":"star_side_plank","harder":"single_arm_leg_plank","ess":false,"gymOnly":false,"img":false,"badEasier":false,"badHarder":false,"guess":"coredyn","seed":"","cues":"From high plank, rotate into star side plank (top arm + top leg raised), hold 1 sec, rotate back through center plank, then rotate to the other side. Non-stop alternating. Also called alternating star plank or rotating star plank."},{"id":"jump_squat","name":"Jump Squats","pattern":"quad","dbFamily":"","equipment":["bw"],"measure":"reps","level":"","diff":null,"easier":"","harder":"","ess":false,"gymOnly":false,"img":true,"badEasier":false,"badHarder":false,"guess":"power","seed":"beg","cues":"Explode up, soft landing, reset."},{"id":"jumping_pullup","name":"Jumping Pull-Up","pattern":"pull","dbFamily":"","equipment":["pullupbar"],"measure":"reps","level":"beg","diff":3,"easier":"","harder":"pullup","ess":false,"gymOnly":false,"img":false,"badEasier":false,"badHarder":false,"guess":"power","seed":"","cues":"Assist the concentric with a small jump, control the descent."},{"id":"kb_deadlift","name":"Kettlebell Deadlift","pattern":"hinge","dbFamily":"hinge","equipment":["kb"],"measure":"reps","level":"beg","diff":2,"easier":"","harder":"kb_swing","ess":false,"gymOnly":false,"img":false,"badEasier":false,"badHarder":false,"guess":"hinge","seed":"","cues":"Bell on the floor between the feet. Push the hips back until your hands reach it, back flat, shins near vertical. Stand by driving the floor away."},{"id":"kb_floor_press","name":"Kettlebell Floor Press","pattern":"push","dbFamily":"press","equipment":["kb","mat"],"measure":"reps","level":"beg","diff":3,"easier":"","harder":"","ess":false,"gymOnly":false,"img":false,"badEasier":false,"badHarder":false,"guess":"hpush","seed":"","cues":"On your back, knees bent, bell in one hand at the chest. Press to over the shoulder, not over the face. The floor stops the elbow — touch, pause, press."},{"id":"kb_halo","name":"Kettlebell Halo","pattern":"mobility","dbFamily":"shoulder-prep","equipment":["kb"],"measure":"reps","level":"beg","diff":2,"easier":"","harder":"","ess":false,"gymOnly":false,"img":false,"badEasier":false,"badHarder":false,"guess":"mobility","seed":"","cues":"Hold the bell upside down by the horns at the chest. Circle it slowly around the head, close to the skull. Five each way, ribs down."},{"id":"kb_high_pull","name":"Kettlebell High Pull","pattern":"pull","dbFamily":"ballistic","equipment":["kb"],"measure":"reps","level":"int","diff":6,"easier":"kb_swing","harder":"","ess":false,"gymOnly":false,"img":false,"badEasier":false,"badHarder":false,"guess":"hpull","seed":"","cues":"Swing as normal, then guide the elbow high and back as the bell floats. The hips still do all the work — the arm only steers."},{"id":"kb_press","name":"Kettlebell Overhead Press","pattern":"press","dbFamily":"press","equipment":["kb"],"measure":"reps","level":"int","diff":5,"easier":"kb_floor_press","harder":"","ess":false,"gymOnly":false,"img":false,"badEasier":false,"badHarder":false,"guess":"","seed":"","cues":"Bell racked on the forearm, wrist straight. Press up and slightly back until the arm is by the ear. Ribs down; the lower back does not help."},{"id":"kb_rdl","name":"Kettlebell Romanian Deadlift","pattern":"hinge","dbFamily":"hinge","equipment":["kb"],"measure":"reps","level":"beg","diff":3,"easier":"kb_deadlift","harder":"single_leg_rdl","ess":false,"gymOnly":false,"img":false,"badEasier":false,"badHarder":false,"guess":"hinge","seed":"","cues":"Start standing. Push the hips back and slide the bell down the thighs, knees soft and staying soft. Go until the hamstrings stop you."},{"id":"kb_swing","name":"Kettlebell Swing","pattern":"hinge","dbFamily":"","equipment":["kb"],"measure":"reps","level":"beg","diff":4,"easier":"","harder":"","ess":false,"gymOnly":true,"img":true,"badEasier":false,"badHarder":false,"guess":"power","seed":"int","cues":"Snap the hips — the arms are just rope. The bell floats up to chest height from your hips driving forward, not from lifting with your shoulders. Start at 12–16 kg."},{"id":"kick_up_practice","name":"Kick-Up Practice","pattern":"skill","dbFamily":"","equipment":["bw"],"measure":"reps","level":"","diff":null,"easier":"","harder":"","ess":false,"gymOnly":false,"img":false,"badEasier":false,"badHarder":false,"guess":"vpull","seed":"","cues":"Freestanding entries — find the balance point, bail to a cartwheel."},{"id":"knee_push_up","name":"Knee Push-Up","pattern":"push","dbFamily":"push-up","equipment":["bw"],"measure":"reps","level":"beg","diff":2,"easier":"","harder":"","ess":true,"gymOnly":false,"img":false,"badEasier":false,"badHarder":false,"guess":"hpush","seed":"","cues":"From knees, hands shoulder-width, body straight from knees to head. Chest to floor. Lock arms at top. No hip pike — this is a real push-up scaled."},{"id":"kot_calf","name":"KOT Calf Raise","pattern":"calf","dbFamily":"","equipment":["bw"],"measure":"reps","level":"","diff":null,"easier":"","harder":"","ess":false,"gymOnly":false,"img":false,"badEasier":false,"badHarder":false,"guess":"unilat","seed":"","cues":"Knees-over-toes calf, deep stretch."},{"id":"l_sit","name":"L-Sit Hold","pattern":"core","dbFamily":"l-sit","equipment":["parallettes"],"measure":"hold","level":"adv","diff":6,"easier":"one_leg_l_sit","harder":"tuck_v_sit_hold","ess":false,"gymOnly":false,"img":false,"badEasier":false,"badHarder":false,"guess":"corestat","seed":"adv","cues":"Arm lockout, depress scapulae, legs parallel to floor. Build tuck first."},{"id":"l_sit_pullup","name":"L-Sit Pull-up","pattern":"pull","dbFamily":"","equipment":["pullupbar"],"measure":"reps","level":"adv","diff":7,"easier":"","harder":"","ess":false,"gymOnly":false,"img":true,"badEasier":false,"badHarder":false,"guess":"vpull","seed":"","cues":"Hold the L, full pull — back + core."},{"id":"l_sit_push_back_to_planche","name":"L-Sit Push-Back to Planche","pattern":"push","dbFamily":"planche","equipment":["parallettes"],"measure":"reps","level":"adv","diff":8,"easier":"tuck_planche_hold","harder":"","ess":false,"gymOnly":false,"img":false,"badEasier":false,"badHarder":false,"guess":"hpush","seed":"","cues":"Start in L-sit or tuck sit on parallettes. Fluidly push hips backward and upward through a tuck planche, aiming to extend into straddle or full planche for a brief 1-2 second hold. Trains the dynamic entry to planche."},{"id":"lat_pulldown","name":"Lat Pulldown","pattern":"pull","dbFamily":"","equipment":["machine"],"measure":"reps","level":"beg","diff":2,"easier":"","harder":"band_assisted_pullup","ess":false,"gymOnly":true,"img":false,"badEasier":false,"badHarder":false,"guess":"vpull","seed":"","cues":"Sit tall, pull the bar to your upper chest and lead with your elbows, not your hands. Let it back up slowly."},{"id":"lateral_raise","name":"Lateral Raise","pattern":"push","dbFamily":"shoulder","equipment":["db"],"measure":"reps","level":"beg","diff":2,"easier":"","harder":"","ess":false,"gymOnly":true,"img":false,"badEasier":false,"badHarder":false,"guess":"hpush","seed":"","cues":"Light dumbbells. Raise them out to the sides up to shoulder height, elbows soft. Lower slowly. This one is never heavy."},{"id":"leg_swings","name":"Leg Swings","pattern":"mobility","dbFamily":"","equipment":["bw"],"measure":"reps","level":"","diff":null,"easier":"","harder":"","ess":false,"gymOnly":false,"img":false,"badEasier":false,"badHarder":false,"guess":"power","seed":"","cues":"Front-back then lateral, controlled."},{"id":"long_lever_plank","name":"Long-Lever Plank","pattern":"core","dbFamily":"plank","equipment":["bw"],"measure":"hold","level":"int","diff":5,"easier":"forearm_plank","harder":"plank_bodysaw","ess":false,"gymOnly":false,"img":false,"badEasier":false,"badHarder":false,"guess":"corestat","seed":"","cues":"Forearm plank but hands extended further forward. Increases the lever arm dramatically. Pure anti-extension strength."},{"id":"lying_knee_tuck","name":"Lying Knee Tuck","pattern":"core","dbFamily":"","equipment":["bw"],"measure":"reps","level":"beg","diff":1,"easier":"","harder":"reverse_crunch","ess":false,"gymOnly":false,"img":false,"badEasier":false,"badHarder":false,"guess":"coredyn","seed":"","cues":"Lie on back, hands by hips or under the glutes. Draw the knees toward the chest, curling the hips slightly off the floor. Lower-ab entry movement."},{"id":"lying_leg_raise","name":"Lying Leg Raise","pattern":"core","dbFamily":"","equipment":["bw"],"measure":"reps","level":"beg","diff":3,"easier":"reverse_crunch","harder":"hanging_knee_raise","ess":false,"gymOnly":false,"img":false,"badEasier":false,"badHarder":false,"guess":"coredyn","seed":"","cues":"Lie flat, legs straight. Raise the legs to vertical keeping them straight, then lower slowly without letting the heels touch. Hands under the glutes to protect the low back."},{"id":"man_maker","name":"Man-Maker","pattern":"push","dbFamily":"","equipment":["db"],"measure":"reps","level":"adv","diff":8,"easier":"devil_s_press","harder":"","ess":true,"gymOnly":false,"img":true,"badEasier":false,"badHarder":false,"guess":"fullbody","seed":"adv","cues":"Push-up → row right → row left → feet jump in → clean → squat → overhead press. One rep = all 7 steps. Hips square during rows. Drive from legs into the press."},{"id":"mountain_climber","name":"Mountain Climbers","pattern":"conditioning","dbFamily":"plank","equipment":["bw"],"measure":"reps","level":"beg","diff":3,"easier":"high_plank","harder":"bearcrawl","ess":false,"gymOnly":false,"img":true,"badEasier":false,"badHarder":true,"guess":"aerobic","seed":"","cues":"From a high plank, drive the knees to the chest one at a time, fast. Hips stay low, shoulders stacked over hands, core braced. Multi-purpose: plank-hold core + shoulder/push stability + conditioning — used across core, push, and conditionin"},{"id":"muscle_up_bar","name":"Muscle-Up (Bar)","pattern":"pull","dbFamily":"","equipment":["pullupbar"],"measure":"reps","level":"adv","diff":9,"easier":"band_muscle_up","harder":"muscle_up_rings","ess":false,"gymOnly":false,"img":true,"badEasier":false,"badHarder":false,"guess":"vpull","seed":"adv","cues":"Explosive pull, transition elbows over the bar, press out."},{"id":"muscle_up_rings","name":"Muscle-Up (Rings)","pattern":"pull","dbFamily":"","equipment":["rings"],"measure":"reps","level":"adv","diff":9,"easier":"muscle_up_bar","harder":"","ess":false,"gymOnly":false,"img":false,"badEasier":false,"badHarder":false,"guess":"vpull","seed":"","cues":"False grip, deep transition, press to support on rings."},{"id":"navy_seal_burpee","name":"Navy Seal Burpee","pattern":"push","dbFamily":"","equipment":["bw"],"measure":"reps","level":"int","diff":6,"easier":"burpee","harder":"","ess":true,"gymOnly":false,"img":true,"badEasier":false,"badHarder":false,"guess":"fullbody","seed":"adv","cues":"3 push-ups at bottom of each burpee, then jump + clap. Punishing and effective."},{"id":"navy_seal_push_u
