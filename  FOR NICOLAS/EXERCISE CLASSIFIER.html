p_3_pump","name":"Navy Seal Push-Up (3 pump)","pattern":"push","dbFamily":"push-up","equipment":["bw"],"measure":"reps","level":"int","diff":5,"easier":"deadstop_pushup","harder":"","ess":false,"gymOnly":false,"img":false,"badEasier":false,"badHarder":false,"guess":"hpush","seed":"","cues":"At the bottom of each push-up, do 3 small partial pumps (chest stays an inch off floor) before pressing back to lockout. 1 set = 3 pumps + 1 full rep. Time-under-tension at the hardest position. Brutal for chest endurance."},{"id":"negative_muscle_up_bar","name":"Negative Muscle-Up (Bar)","pattern":"pull","dbFamily":"","equipment":["pullupbar"],"measure":"reps","level":"adv","diff":7,"easier":"high_pullup","harder":"muscle_up_bar","ess":false,"gymOnly":false,"img":false,"badEasier":false,"badHarder":false,"guess":"vpull","seed":"","cues":"Start on top of the bar, lower slowly through the transition."},{"id":"negative_pullup","name":"Negative Pull-Up","pattern":"pull","dbFamily":"","equipment":["pullupbar"],"measure":"reps","level":"beg","diff":3,"easier":"band_assisted_pullup","harder":"pullup","ess":false,"gymOnly":false,"img":false,"badEasier":false,"badHarder":false,"guess":"vpull","seed":"beg","cues":"Jump to the top, lower 3-5s. Builds the pull eccentrically."},{"id":"neutral_pullup","name":"Neutral-Grip Pull-Up","pattern":"pull","dbFamily":"","equipment":["pullupbar","rings"],"measure":"reps","level":"int","diff":4,"easier":"band_assisted_pullup","harder":"pullup","ess":false,"gymOnly":false,"img":false,"badEasier":false,"badHarder":false,"guess":"vpull","seed":"","cues":"Palms facing — kindest on the elbows and forearm."},{"id":"nordic_curl","name":"Nordic Curl","pattern":"hamstring","dbFamily":"","equipment":["bw","band"],"measure":"reps","level":"","diff":null,"easier":"","harder":"","ess":false,"gymOnly":false,"img":false,"badEasier":false,"badHarder":false,"guess":"hinge","seed":"int","cues":"Control the eccentric; progress ROM → load."},{"id":"one_arm_hang","name":"One-Arm Hang","pattern":"pull","dbFamily":"","equipment":["pullupbar"],"measure":"hold","level":"adv","diff":7,"easier":"towel_hang","harder":"one_arm_negative","ess":false,"gymOnly":false,"img":false,"badEasier":false,"badHarder":false,"guess":"carry","seed":"","cues":"Hang from one arm 5-10s. Builds toward one-arm pulling."},{"id":"one_arm_negative","name":"One-Arm Negative Pull-Up","pattern":"pull","dbFamily":"","equipment":["pullupbar"],"measure":"reps","level":"adv","diff":9,"easier":"archer_pullup","harder":"one_arm_pullup","ess":false,"gymOnly":false,"img":false,"badEasier":false,"badHarder":false,"guess":"vpull","seed":"","cues":"One arm, slow lower only. Assist gently with the free hand."},{"id":"one_arm_pullup","name":"One-Arm Pull-Up","pattern":"pull","dbFamily":"","equipment":["pullupbar"],"measure":"reps","level":"adv","diff":10,"easier":"one_arm_negative","harder":"","ess":false,"gymOnly":false,"img":false,"badEasier":false,"badHarder":false,"guess":"vpull","seed":"","cues":"The elite pull — full range, one arm."},{"id":"one_arm_push_up","name":"One-Arm Push-Up","pattern":"push","dbFamily":"push-up","equipment":["bw"],"measure":"reps","level":"adv","diff":8,"easier":"assisted_one_arm_push_up","harder":"","ess":false,"gymOnly":false,"img":false,"badEasier":false,"badHarder":false,"guess":"hpush","seed":"adv","cues":"Feet wide, hips square. 3s descent. Master archer push-up first."},{"id":"one_leg_l_sit","name":"One-Leg L-Sit","pattern":"core","dbFamily":"lsit","equipment":["bw"],"measure":"hold","level":"adv","diff":6,"easier":"tuck_l_sit","harder":"l_sit","ess":false,"gymOnly":false,"img":false,"badEasier":false,"badHarder":false,"guess":"corestat","seed":"","cues":"From a tuck L-sit (glutes off floor), keep one knee tucked and extend the other leg dead straight out parallel to the floor, toes pointed. Switch legs. Hold, or do dynamic kick-outs. Bridges tuck → full L-sit."},{"id":"one_leg_v_sit","name":"One-Leg V-Sit","pattern":"core","dbFamily":"vsit","equipment":["bw"],"measure":"hold","level":"adv","diff":7,"easier":"tuck_v_sit_hold","harder":"straddle_v_sit","ess":false,"gymOnly":false,"img":false,"badEasier":false,"badHarder":false,"guess":"corestat","seed":"","cues":"From the high tuck V-sit (leaning back, knees high), keep one knee tucked to the shoulder and kick the other leg straight up high toward the ceiling, above head height. Alternate legs."},{"id":"open_tuck_planche","name":"Open Tuck Planche","pattern":"push","dbFamily":"planche","equipment":["bw"],"measure":"hold","level":"adv","diff":7,"easier":"frog_planche","harder":"","ess":false,"gymOnly":false,"img":false,"badEasier":false,"badHarder":false,"guess":"hpush","seed":"","cues":"Knees off the chest, knees still bent. Lower back should flatten completely — hips no longer protected by the tuck. The jump from this to Adv Tuck is where most people stall; do not skip it."},{"id":"overhead_press","name":"Overhead Press","pattern":"press","dbFamily":"press","equipment":["bb"],"measure":"reps","level":"int","diff":6,"easier":"","harder":"","ess":false,"gymOnly":false,"img":true,"badEasier":false,"badHarder":false,"guess":"","seed":"adv","cues":"Standing and strict. Ribs down, squeeze the glutes, press until the arms are by the ears. No leg drive."},{"id":"shoulder_stretch","name":"Overhead Shoulder Stretch","pattern":"mobility","dbFamily":"","equipment":["bw"],"measure":"hold","level":"","diff":null,"easier":"","harder":"","ess":false,"gymOnly":false,"img":false,"badEasier":false,"badHarder":false,"guess":"mobility","seed":"","cues":"Lat/shoulder stretch, ribs down."},{"id":"pike_compression","name":"Pike Compression Lifts","pattern":"core","dbFamily":"","equipment":["bw"],"measure":"reps","level":"int","diff":4,"easier":"","harder":"","ess":false,"gymOnly":false,"img":false,"badEasier":false,"badHarder":false,"guess":"coredyn","seed":"","cues":"Seated on floor, legs straight. Actively flex hip flexors to fold chest toward legs. Each rep is a muscular contraction — not gravity. THE L-sit/V-sit builder."},{"id":"pike_hold","name":"Pike Hold","pattern":"push","dbFamily":"pike","equipment":["bw"],"measure":"hold","level":"beg","diff":2,"easier":"","harder":"","ess":false,"gymOnly":false,"img":false,"badEasier":false,"badHarder":false,"guess":"vpush","seed":"","cues":"Inverted V position, straight arms, push floor away. Hold position. Builds wrist endurance and shoulder overhead strength."},{"id":"pike_lean","name":"Pike Lean","pattern":"push","dbFamily":"pike","equipment":["bw"],"measure":"hold","level":"int","diff":4,"easier":"pike_hold","harder":"","ess":true,"gymOnly":false,"img":false,"badEasier":false,"badHarder":false,"guess":"vpush","seed":"","cues":"From pike, shift shoulders FORWARD over wrists. No balance assist — pure strength. The further you lean, the harder it gets."},{"id":"pike_lean_on_parallettes","name":"Pike Lean on Parallettes","pattern":"push","dbFamily":"pike","equipment":["parallettes"],"measure":"hold","level":"int","diff":6,"easier":"elevated_pike_lean","harder":"","ess":false,"gymOnly":false,"img":false,"badEasier":false,"badHarder":false,"guess":"vpush","seed":"","cues":"Parallettes allow DEEPER lean = greater forward lean angle = more horizontal load. Far harder than floor version. Directly bridges to planche and handstand strength."},{"id":"pike_pulses","name":"Pike Pulses","pattern":"push","dbFamily":"","equipment":["bw"],"measure":"reps","level":"beg","diff":3,"easier":"","harder":"","ess":true,"gymOnly":false,"img":false,"badEasier":false,"badHarder":false,"guess":"vpush","seed":"","cues":"Sit in pike (legs straight together). Actively pulse torso DOWN toward legs using hip flexors only — not gravity bounce. 20-30 reps. Key compression warm-up before handstand or L-sit work."},{"id":"pike_push_up","name":"Pike Push-Up","pattern":"push","dbFamily":"push-up","equipment":["bw"],"measure":"reps","level":"int","diff":4,"easier":"decline_push_up","harder":"","ess":true,"gymOnly":false,"img":true,"badEasier":false,"badHarder":false,"guess":"vpush","seed":"beg","cues":"Hips high, head goes through arms at bottom, press overhead."},{"id":"planche_lean","name":"Planche Lean","pattern":"push","dbFamily":"planche","equipment":["bw"],"measure":"hold","level":"int","diff":5,"easier":"","harder":"","ess":true,"gymOnly":false,"img":false,"badEasier":false,"badHarder":false,"guess":"hpush","seed":"","cues":"Arms locked, lean forward until shoulders over or past wrists. Go further each week."},{"id":"planche_lean_raises","name":"Planche Lean Raises","pattern":"push","dbFamily":"planche","equipment":["bw"],"measure":"reps","level":"adv","diff":7,"easier":"planche_lean","harder":"","ess":false,"gymOnly":false,"img":false,"badEasier":false,"badHarder":false,"guess":"hpush","seed":"","cues":"Start in a standard planche lean. Press hard through your shoulders WHILE walking or sliding your feet forward — forcing your hips to elevate until your toes lightly float off the floor. The dynamic version of planche lean that introduces t"},{"id":"planche_push_up","name":"Planche Push-Up","pattern":"push","dbFamily":"planche","equipment":["bw"],"measure":"reps","level":"adv","diff":10,"easier":"full_planche","harder":"","ess":false,"gymOnly":false,"img":false,"badEasier":false,"badHarder":false,"guess":"hpush","seed":"","cues":"From a full planche hold, lower body to chest-to-floor maintaining the planche position (no leg drop), press back to the planche. Hardest bodyweight push movement that exists in calisthenics. 1-3 strict reps = elite."},{"id":"plank_bodysaw","name":"Plank Bodysaw","pattern":"core","dbFamily":"plank","equipment":["bw"],"measure":"reps","level":"adv","diff":6,"easier":"long_lever_plank","harder":"single_arm_plank","ess":false,"gymOnly":false,"img":false,"badEasier":false,"badHarder":false,"guess":"coredyn","seed":"","cues":"Forearm plank on sliders or socks. Slide body forward and pull back. Anti-extension at its hardest. Keep hips from sagging."},{"id":"plank_leg_lift","name":"Plank Leg Lift","pattern":"core","dbFamily":"plank","equipment":["bw"],"measure":"reps","level":"int","diff":4,"easier":"forearm_plank","harder":"plank_opposite_arm_leg","ess":false,"gymOnly":false,"img":false,"badEasier":false,"badHarder":false,"guess":"coredyn","seed":"","cues":"Forearm plank. Lift one leg 6 inches — squeeze glute at top. No hip rotation. Hold 2 sec. Alternate."},{"id":"plank_opposite_arm_leg","name":"Plank Opposite Arm + Leg","pattern":"core","dbFamily":"plank","equipment":["bw"],"measure":"reps","level":"int","diff":4,"easier":"plankshouldertap","harder":"long_lever_plank","ess":false,"gymOnly":false,"img":false,"badEasier":true,"badHarder":false,"guess":"coredyn","seed":"","cues":"High plank: extend opposite arm and leg simultaneously. Hold 2 sec at top. Anti-rotation + anti-extension in one movement. Bird-dog in plank position."},{"id":"shoulder_tap","name":"Plank Shoulder Taps","pattern":"core","dbFamily":"plank","equipment":["bw"],"measure":"reps","level":"int","diff":4,"easier":"high_plank","harder":"plank_opposite_arm_leg","ess":false,"gymOnly":false,"img":false,"badEasier":false,"badHarder":false,"guess":"coredyn","seed":"","cues":"High plank. Tap opposite shoulder — fight the rotation. Wider foot stance for more stability."},{"id":"plank_updown","name":"Plank Up-Downs","pattern":"core","dbFamily":"plank","equipment":["bw"],"measure":"reps","level":"int","diff":5,"easier":"high_plank","harder":"single_arm_plank","ess":false,"gymOnly":false,"img":false,"badEasier":false,"badHarder":false,"guess":"coredyn","seed":"","cues":"Start in forearm plank. Press up one hand at a time to high plank, then lower back down one hand at a time. Alternate the leading arm. Fight rotation throughout."},{"id":"press_to_handstand","name":"Press to Handstand","pattern":"push","dbFamily":"handstand","equipment":["bw"],"measure":"reps","level":"adv","diff":10,"easier":"handstand_push_up","harder":"","ess":false,"gymOnly":false,"img":false,"badEasier":false,"badHarder":false,"guess":"vpush","seed":"","cues":"From standing pike (forward fold), press straight into freestanding handstand without jumping or kicking. Pure compression + straight-arm pressing strength. Combines straddle/pike flexibility with planche-tier shoulder strength. Multi-year "},{"id":"prone_ytw","name":"Prone Y-T-W Raise","pattern":"pull","dbFamily":"","equipment":["bench","db"],"measure":"reps","level":"beg","diff":2,"easier":"","harder":"","ess":false,"gymOnly":true,"img":false,"badEasier":false,"badHarder":false,"guess":"hpull","seed":"","cues":"Face down on an incline bench, arms hanging, thumbs up. Raise the arms into a Y overhead, lower. Then straight out to a T, lower. Then bent into a W, lower. That is one rep. No weight or very light — this is for the small muscles that hold "},{"id":"prying_goblet","name":"Prying Goblet Squat","pattern":"mobility","dbFamily":"squat-prep","equipment":["kb"],"measure":"hold","level":"beg","diff":2,"easier":"","harder":"","ess":false,"gymOnly":false,"img":false,"badEasier":false,"badHarder":false,"guess":"mobility","seed":"","cues":"Hold the bell at the chest and sit into the deepest squat you have. Use the elbows to push the knees out, and rock. A stretch, not a set."},{"id":"pseudo_planche_push_up","name":"Pseudo Planche Push-Up","pattern":"push","dbFamily":"planche","equipment":["bw"],"measure":"reps","level":"adv","diff":8,"easier":"planche_lean","harder":"","ess":true,"gymOnly":false,"img":true,"badEasier":false,"badHarder":false,"guess":"hpush","seed":"int","cues":"Hands turned out, lean forward — shoulders over wrists. Maintain hollow body."},{"id":"pull_over","name":"Pull-Over","pattern":"pull","dbFamily":"","equipment":["pullupbar"],"measure":"reps","level":"int","diff":6,"easier":"pullup","harder":"muscle_up_bar","ess":false,"gymOnly":false,"img":false,"badEasier":false,"badHarder":false,"guess":"hpull","seed":"","cues":"Pull, then roll the hips over the bar to support. Transition builder."},{"id":"pullup","name":"Pull-Up","pattern":"pull","dbFamily":"","equipment":["pullupbar"],"measure":"reps","level":"int","diff":5,"easier":"neutral_pullup","harder":"chest_to_bar","ess":false,"gymOnly":false,"img":true,"badEasier":false,"badHarder":false,"guess":"vpull","seed":"int","cues":"Dead-hang start, chin over bar, controlled descent."},{"id":"pushup","name":"Push-ups","pattern":"push","dbFamily":"push-up","equipment":["bw"],"measure":"reps","level":"beg","diff":3,"easier":"incline_push_up","harder":"","ess":true,"gymOnly":false,"img":true,"badEasier":false,"badHarder":false,"guess":"hpush","seed":"beg","cues":"Elbows 45°, chest to floor, protract fully at top. Active core throughout."},{"id":"pushup_on_dumbbells","name":"Push-Ups on Dumbbells","pattern":"push","dbFamily":"push-up","equipment":["db"],"measure":"reps","level":"beg","diff":3,"easier":"incline_push_up","harder":"pushup","ess":false,"gymOnly":true,"img":false,"badEasier":false,"badHarder":false,"guess":"hpush","seed":"","cues":"Hands gripping two dumbbells set on the floor so your wrists stay straight. Body in one line, chest down between them, press back up."},{"id":"reverse_crunch","name":"Reverse Crunch","pattern":"core","dbFamily":"","equipment":["bw"],"measure":"reps","level":"beg","diff":2,"easier":"lying_knee_tuck","harder":"lying_leg_raise","ess":false,"gymOnly":false,"img":false,"badEasier":false,"badHarder":false,"guess":"aerobic","seed":"","cues":"Knees at 90°. Curl the pelvis up toward the ribs — lift the hips off the floor using the lower abs, not a leg swing. Slow eccentric."},{"id":"reverse_fly","name":"Reverse Fly (chest-supported)","pattern":"pull","dbFamily":"","equipment":["db","bench"],"measure":"reps","level":"beg","diff":2,"easier":"","harder":"","ess":false,"gymOnly":true,"img":false,"badEasier":false,"badHarder":false,"guess":"hpull","seed":"","cues":"Chest flat on an incline bench, a light dumbbell in each hand hanging down. Arms almost straight, raise them out to the sides like opening your arms wide. Squeeze the back of your shoulders at the top, lower slowly. Light weight — this is n"},{"id":"ring_dip","name":"Ring Dip","pattern":"push","dbFamily":"dip","equipment":["rings"],"measure":"reps","level":"adv","diff":7,"easier":"dip","harder":"","ess":true,"gymOnly":false,"img":true,"badEasier":false,"badHarder":false,"guess":"hpush","seed":"adv","cues":"Full lockout with RTO. Rings tight to body. Control the descent."},{"id":"ring_dip_knee_raise","name":"Ring Dip + Knee Raise","pattern":"push","dbFamily":"dip","equipment":["rings"],"measure":"reps","level":"adv","diff":7,"easier":"ring_dip","harder":"","ess":false,"gymOnly":false,"img":false,"badEasier":false,"badHarder":false,"guess":"hpush","seed":"","cues":"Full ring dip → hold at top → compress knees to chest. Shoulders packed. RTO at lockout. The knee raise is active compression — not a swing. Link the push and core as one unit."},{"id":"ring_dip_support_hold","name":"Ring Dip Support Hold","pattern":"push","dbFamily":"dip","equipment":["rings"],"measure":"hold","level":"int","diff":6,"easier":"dip_support_hold","harder":"","ess":false,"gymOnly":false,"img":true,"badEasier":false,"badHarder":false,"guess":"hpush","seed":"","cues":"Locked out on the rings, rings turned out, shoulders down. Stillness is the whole exercise."},{"id":"ring_l_sit","name":"Ring L-Sit","pattern":"core","dbFamily":"l-sit","equipment":["rings"],"measure":"hold","level":"adv","diff":7,"easier":"l_sit","harder":"v_sit","ess":false,"gymOnly":false,"img":false,"badEasier":false,"badHarder":false,"guess":"corestat","seed":"","cues":"L-sit on rings. Fight rotation — rings want to turn inward. Much harder than parallettes due to instability. Builds serious core and lat strength."},{"id":"ring_push_up","name":"Ring Push-Up","pattern":"push","dbFamily":"push-up","equipment":["rings"],"measure":"reps","level":"int","diff":5,"easier":"pushup","harder":"","ess":false,"gymOnly":false,"img":false,"badEasier":false, t with 1-3 reps, build slowly."},{"id":"russian_twist","name":"Russian Twist","pattern":"core","dbFamily":"","equipment":["bw"],"measure":"reps","level":"beg","diff":3,"easier":"bicycle_crunch","harder":"windshield_wipers","ess":false,"gymOnly":false,"img":false,"badEasier":false,"badHarder":false,"guess":"coredyn","seed":"","cues":"Sit at 45° lean, feet off floor. Rotate torso side to side. Touch ground each side. Add weight to progress."},{"id":"scap_pullup","name":"Scapular Pull-ups","pattern":"pull","dbFamily":"","equipment":["pullupbar"],"measure":"reps","level":"beg","diff":2,"easier":"","harder":"","ess":false,"gymOnly":false,"img":false,"badEasier":false,"badHarder":false,"guess":"vpull","seed":"","cues":"Depress/retract scaps, arms straight."},{"id":"scissor_kicks","name":"Scissor Kicks","pattern":"core","dbFamily":"","equipment":["bw"],"measure":"reps","level":"beg","diff":2,"easier":"flutter_kicks","harder":"lying_leg_raise","ess":false,"gymOnly":false,"img":false,"badEasier":false,"badHarder":false,"guess":"coredyn","seed":"","cues":"Legs straight, heels off the floor. Cross one leg over the other in a scissor motion, alternating. Low back stays glued to the floor."},{"id":"seal_row","name":"Seal Row","pattern":"pull","dbFamily":"","equipment":["db","bench"],"measure":"reps","level":"int","diff":4,"easier":"","harder":"bent_over_row","ess":false,"gymOnly":false,"img":false,"badEasier":false,"badHarder":false,"guess":"hpull","seed":"","cues":"Prone on a bench, row the dumbbells — no momentum, pure back."},{"id":"seated_cable_row","name":"Seated Cable Row","pattern":"pull","dbFamily":"","equipment":["cable"],"measure":"reps","level":"beg","diff":2,"easier":"","harder":"","ess":false,"gymOnly":true,"img":false,"badEasier":false,"badHarder":false,"guess":"hpull","seed":"","cues":"Chest up, pull the handle to your belly and squeeze your shoulder blades together. Do not lean back to move the weight."},{"id":"seated_knee_tuck_raises","name":"Seated Knee Tuck Raises","pattern":"push","dbFamily":"","equipment":["bw"],"measure":"reps","level":"beg","diff":3,"easier":"","harder":"","ess":true,"gymOnly":false,"img":false,"badEasier":false,"badHarder":false,"guess":"hpush","seed":"","cues":"Sit on floor or parallettes, hands beside hips, arms straight. Pull knees to chest explosively, hold 1-2s at top. Lower with control. Builds the strength needed for L-sit and press to handstand."},{"id":"seated_straight_leg_raises","name":"Seated Straight Leg Raises","pattern":"push","dbFamily":"","equipment":["bw"],"measure":"reps","level":"int","diff":5,"easier":"seated_knee_tuck_raises","harder":"","ess":true,"gymOnly":false,"img":false,"badEasier":false,"badHarder":false,"guess":"hpush","seed":"","cues":"Sit on floor or parallettes, arms straight beside hips, scapula depressed. Raise straight legs up as high as possible. Lower with control. Pure compression strength and active hamstring flexibility."},{"id":"semi_straddle_planche","name":"Semi-Straddle Planche","pattern":"push","dbFamily":"planche","equipment":["bw"],"measure":"hold","level":"adv","diff":8,"easier":"single_leg_planche","harder":"","ess":false,"gymOnly":false,"img":false,"badEasier":false,"badHarder":false,"guess":"hpush","seed":"","cues":"Also called Closed Straddle. Legs spread wide BUT knees bent at 90°. Reduces lever length while training hip abduction. The final bridge before Full Straddle."},{"id":"shorties","name":"Shorties","pattern":"push","dbFamily":"push-up","equipment":["bw"],"measure":"reps","level":"beg","diff":2,"easier":"incline_push_up","harder":"","ess":false,"gymOnly":false,"img":false,"badEasier":false,"badHarder":false,"guess":"hpush","seed":"","cues":"Bottom-half partial push-ups — chest near floor to mid-range, no lockout at top. Continuous tension, deep stretch on the chest, no rest. Alternative: top-half pulses (upper 50%, no chest touch) — different stimulus, less stretch. Both = kil"},{"id":"shoulder_press_machine","name":"Shoulder Press Machine","pattern":"push","dbFamily":"","equipment":["machine"],"measure":"reps","level":"beg","diff":2,"easier":"","harder":"","ess":false,"gymOnly":true,"img":false,"badEasier":false,"badHarder":false,"guess":"vpush","seed":"","cues":"Press straight overhead, ribs down so you do not arch your back. Lower until your hands are about ear height."},{"id":"side_plank","name":"Side Plank","pattern":"core","dbFamily":"side-plank","equipment":["bw"],"measure":"hold","level":"beg","diff":3,"easier":"forearm_plank","harder":"side_plank","ess":false,"gymOnly":false,"img":false,"badEasier":false,"badHarder":false,"guess":"corestat","seed":"","cues":"Knees bent 90°. Hip stacked, not sagging. Free hand on hip or extended up. 30-60 sec per side."},{"id":"incline_side_plank","name":"Side Plank (hand on bar)","pattern":"core","dbFamily":"plank","equipment":["rack"],"measure":"hold","level":"beg","diff":1,"easier":"","harder":"side_plank","ess":false,"gymOnly":true,"img":false,"badEasier":false,"badHarder":false,"guess":"corestat","seed":"","cues":"One hand on a hip-height bar, feet on the floor, body in a straight line. The higher the bar, the easier it is."},{"id":"side_plank_hip_dip","name":"Side Plank Hip Dip","pattern":"core","dbFamily":"side-plank","equipment":["bw"],"measure":"reps","level":"int","diff":5,"easier":"side_plank","harder":"side_plank_leg_raise","ess":false,"gymOnly":false,"img":false,"badEasier":false,"badHarder":false,"guess":"coredyn","seed":"","cues":"Full side plank: lower hip toward floor without touching, drive back up. Oblique-focused. 10-15 reps each side."},{"id":"side_plank_leg_raise","name":"Side Plank Leg Raise","pattern":"core","dbFamily":"side-plank","equipment":["bw"],"measure":"reps","level":"adv","diff":5,"easier":"side_plank_hip_dip","harder":"star_side_plank","ess":false,"gymOnly":false,"img":false,"badEasier":false,"badHarder":false,"guess":"coredyn","seed":"","cues":"Full side plank: raise top leg to hip height and lower with control. Abductors and obliques working simultaneously."},{"id":"single_arm_leg_plank","name":"Single Arm + Leg Plank","pattern":"core","dbFamily":"plank","equipment":["bw"],"measure":"hold","level":"adv","diff":8,"easier":"single_arm_plank","harder":"","ess":false,"gymOnly":false,"img":false,"badEasier":false,"badHarder":false,"guess":"corestat","seed":"","cues":"One arm, opposite leg lifted. Two-point plank. Hardest plank variation. Master single arm before attempting."},{"id":"single_arm_plank","name":"Single Arm Plank","pattern":"core","dbFamily":"plank","equipment":["bw"],"measure":"hold","level":"adv","diff":7,"easier":"elevated_feet_plank","harder":"single_arm_leg_plank","ess":false,"gymOnly":false,"img":false,"badEasier":false,"badHarder":false,"guess":"corestat","seed":"","cues":"High plank — remove one arm. Fight hard to prevent rotation. Start at 10-15 sec per side. Build from there."},{"id":"single_arm_ring_row","name":"Single-Arm Ring Row","pattern":"pull","dbFamily":"","equipment":["rings"],"measure":"reps","level":"adv","diff":6,"easier":"archer_row","harder":"front_lever_row","ess":false,"gymOnly":false,"img":false,"badEasier":false,"badHarder":false,"guess":"hpull","seed":"","cues":"One arm, feet forward. Fight the rotation."},{"id":"single_arm_row","name":"Single-Arm Row","pattern":"pull","dbFamily":"","equipment":["db","rings"],"measure":"reps","level":"int","diff":5,"easier":"","harder":"","ess":false,"gymOnly":false,"img":false,"badEasier":false,"badHarder":false,"guess":"hpull","seed":"","cues":"Square hips, drive elbow back, full stretch."},{"id":"single_leg_bridge","name":"Single-Leg Bridge","pattern":"glute","dbFamily":"","equipment":["bw"],"measure":"reps","level":"","diff":null,"easier":"","harder":"","ess":false,"gymOnly":false,"img":false,"badEasier":false,"badHarder":false,"guess":"hinge","seed":"","cues":"Hips level, full extension."},{"id":"single_leg_dragon_flag","name":"Single-Leg Dragon Flag","pattern":"core","dbFamily":"dragonflag","equipment":["bench ht arms, drive the bar down / hips up with the lats only. The front-lever base."},{"id":"suitcase_carry","name":"Suitcase Carry","pattern":"carry","dbFamily":"carry","equipment":["kb"],"measure":"hold","level":"beg","diff":2,"easier":"","harder":"farmers_carry","ess":false,"gymOnly":false,"img":false,"badEasier":false,"badHarder":false,"guess":"carry","seed":"","cues":"One bell, one hand, hanging by your side. Walk tall and resist the tilt — staying vertical is the exercise, not the walking."},{"id":"superman","name":"Superman","pattern":"core","dbFamily":"","equipment":["bw"],"measure":"reps","level":"beg","diff":2,"easier":"","harder":"","ess":false,"gymOnly":false,"img":false,"badEasier":false,"badHarder":false,"guess":"coredyn","seed":"","cues":"Prone on floor. Simultaneously raise arms, chest, and legs off the ground. Hold 2 sec. Lower with control. Great lower back and posterior chain activation."},{"id":"t_rotation_push_up","name":"T-Rotation Push-Up","pattern":"push","dbFamily":"push-up","equipment":["bw"],"measure":"reps","level":"int","diff":5,"easier":"pushup","harder":"","ess":false,"gymOnly":false,"img":false,"badEasier":false,"badHarder":false,"guess":"hpush","seed":"","cues":"Push-up, then rotate body into a side plank and raise top arm straight up forming a T. Alternate sides. Push + anti-rotation in one movement."},{"id":"thoracic_open","name":"Thoracic Opener","pattern":"mobility","dbFamily":"","equipment":["bw"],"measure":"hold","level":"","diff":null,"easier":"","harder":"","ess":false,"gymOnly":false,"img":false,"badEasier":false,"badHarder":false,"guess":"mobility","seed":"","cues":"Open-book / quadruped reach-through."},{"id":"thoracic_rotation","name":"Thoracic Rotations","pattern":"mobility","dbFamily":"","equipment":["bw"],"measure":"reps","level":"","diff":null,"easier":"","harder":"","ess":false,"gymOnly":false,"img":false,"badEasier":false,"badHarder":false,"guess":"mobility","seed":"","cues":"Quadruped, reach hand to ceiling."},{"id":"t :"Hang from bar. Legs together, rotate side to side. Oblique gold."},{"id":"worlds_greatest_stretch","name":"World's Greatest Stretch","pattern":"mobility","dbFamily":"hip","equipment":["bw"],"measure":"reps","level":"beg","diff":1,"easier":"","harder":"","ess":false,"gymOnly":true,"img":false,"badEasier":false,"badHarder":false,"guess":"mobility","seed":"","cues":"Step one foot forward into a gentle lunge, both hands on the floor inside the front foot. Reach the inside arm up to the ceiling and turn your chest to follow it. Bring it back down, step back, switch sides. Opens hips, chest and back in on"},{"id":"wrist_prep","name":"Wrist Prep Rocks","pattern":"mobility","dbFamily":"","equipment":["bw"],"measure":"reps","level":"","diff":null,"easier":"","harder":"","ess":false,"gymOnly":false,"img":false,"badEasier":false,"badHarder":false,"guess":"mobility","seed":"","cues":"Rock over wrists, all directions."},{"id":"zanetti_db_press","name":"Zanetti DB Press","pattern":"push","dbFamily":"planche-accessory","equipment":["db","bench"],"measure":"reps","level":"int","diff":5,"easier":"","harder":"","ess":false,"gymOnly":false,"img":false,"badEasier":false,"badHarder":false,"guess":"hpush","seed":"","cues":"Lie back on a bench. Hold dumbbells with arms STRAIGHT (elbows locked) at hip level. Raise the weights up to a 45° angle above the hips, then lower slowly. Replicates the exact straight-arm shoulder flexion required for planche. ALTERNATIVE"}],"families":[["squat","Squat"],["hinge","Hinge"],["unilat","Single leg"],["hpush","Horizontal push"],["vpush","Vertical push"],["hpull","Horizontal pull"],["vpull","Vertical pull"],["power","Explosive"],["carry","Carry / grip"],["fullbody","Full body"],["coredyn","Core, dynamic"],["corestat","Core, static"],["mobility","Mobility"],["aerobic","Aerobic"]],"seedMissing":["int: bulgarian_split_loaded","adv: pistol_squat"]}</script>
<script>
'use strict';
const PAY = JSON.parse(document.getElementById('payload').textContent);
const ROWS = PAY.rows, FAMS = PAY.families;
const FAMNAME = Object.fromEntries(FAMS);
const KEY = 'fj.classifier.v1';

/* His decisions, kept apart from the generated data so re-running the build
   script never destroys them. Only what he actually changed is stored. */
let EDITS = {};
try { EDITS = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { EDITS = {}; }

/* First run seeds from the proposed fifty. After that his file is the truth,
   even where he emptied something — otherwise a deletion would come back. */
if (!localStorage.getItem(KEY)) {
  for (const r of ROWS) if (r.seed) EDITS[r.id] = { tier: r.seed };
  save();
}
function save(){ localStorage.setItem(KEY, JSON.stringify(EDITS)); }
function edit(id){ return EDITS[id] || (EDITS[id] = {}); }
function val(r, k){
  const e = EDITS[r.id];
  if (e && e[k] !== undefined) return e[k];
  if (k === 'fam')  return r.guess;
  if (k === 'tier') return '';
  return r[k] === null ? '' : r[k];
}
/* "Changed" means different from what the database says, not merely present.
   A confirmed guess is a decision and has to count as one. */
function touched(r){
  const e = EDITS[r.id]; if (!e) return false;
  return Object.keys(e).some(k => {
    if (k === 'tier') return !!e[k];
    if (k === 'fam')  return e[k] !== r.guess;
    return String(e[k] ?? '') !== String(r[k] ?? '');
  });
}

/* ---- filters ---- */
const F = { q:'', fam:'', pat:'', lvl:'', flags:new Set() };
function match(r){
  if (F.fam && val(r,'fam') !== F.fam) return false;
  if (F.pat && r.pattern !== F.pat) return false;
  if (F.lvl === '__none') { if (val(r,'level')) return false; }
  else if (F.lvl && val(r,'level') !== F.lvl) return false;
  if (F.flags.has('fund')    && !val(r,'tier')) return false;
  if (F.flags.has('nodiff')  && val(r,'diff') !== '') return false;
  if (F.flags.has('noimg')   && r.img) return false;
  if (F.flags.has('bw')      && !(r.equipment.length === 1 && r.equipment[0] === 'bw')) return false;
  if (F.flags.has('deadlink') && !(r.badEasier || r.badHarder)) return false;
  if (F.flags.has('touched') && !touched(r)) return false;
  if (F.q) {
    const s = (r.name + ' ' + r.id + ' ' + r.cues).toLowerCase();
    if (!s.includes(F.q)) return false;
  }
  return true;
}

/* ---- counters ---- */
function counts(){
  const c = { beg:0, int:0, adv:0 };
  for (const r of ROWS) { const t = val(r,'tier'); if (t) c[t]++; }
  const targets = { beg:15, int:15, adv:20 };
  for (const k of ['beg','int','adv']) {
    const el = document.getElementById('c' + k[0].toUpperCase() + k.slice(1));
    el.querySelector('b').textContent = c[k];
    el.classList.toggle('over', c[k] > targets[k]);
  }
  document.getElementById('dirty').textContent = ROWS.filter(touched).length;
}

/* ---- the table ---- */
const tb = document.getElementById('tb');
function render(){
  const list = ROWS.filter(match);
  document.getElementById('shown').textContent = list.length;
  tb.innerHTML = list.map(r => {
    const tier = val(r,'tier'), fam = val(r,'fam');
    const guessed = !(EDITS[r.id] && EDITS[r.id].fam !== undefined);
    return `<tr data-id="${r.id}" class="${touched(r)?'touched':''}">
      <td>${r.img
        ? `<img class="thumb" loading="lazy" src="../images/exercises/${r.id}.png" alt="">`
        : '<div class="noimg"></div>'}</td>
      <td><div class="nm">${esc(r.name)}${r.gymOnly?' <span class="gymtag">GYM</span>':''}</div>
          <div class="id">${r.id}</div>
          <div class="eq">${r.pattern} · ${r.equipment.join(', ')||'—'} · ${r.measure||'—'}</div></td>
      <td><select class="fam ${guessed?'guessed':''}">${
        ['<option value="">—</option>'].concat(FAMS.map(f =>
          `<option value="${f[0]}" ${fam===f[0]?'selected':''}>${f[1]}</option>`)).join('')
      }</select></td>
      <td><select class="lvl"><option value="">—</option>${
        ['beg','int','adv'].map(l => `<option ${val(r,'level')===l?'selected':''}>${l}</option>`).join('')
      }</select></td>
      <td><input type="number" class="diff" min="1" max="10" value="${val(r,'diff')}"></td>
      <td><span class="tier">${
        [['',' — '],['beg','B'],['int','I'],['adv','A']].map(t =>
          `<button data-t="${t[0]}" class="${tier===t[0]?'on':''}">${t[1]}</button>`).join('')
      }</span></td>
      <td><input class="link easier ${r.badEasier?'dead':''}" list="allIds" value="${val(r,'easier')}"></td>
      <td><input class="link harder ${r.badHarder?'dead':''}" list="allIds" value="${val(r,'harder')}"></td>
    </tr>`;
  }).join('');
  counts();
}
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* One listener for the whole table rather than eight per row — three hundred
   rows re-render on every filter keystroke and re-binding each time is what
   makes a page like this feel sticky. */
tb.addEventListener('change', e => {
  const tr = e.target.closest('tr'); if (!tr) return;
  const id = tr.dataset.id, t = e.target;
  if (t.classList.contains('fam'))    { edit(id).fam = t.value; t.classList.remove('guessed'); }
  if (t.classList.contains('lvl'))    edit(id).level = t.value;
  if (t.classList.contains('diff'))   edit(id).diff = t.value === '' ? '' : +t.value;
  if (t.classList.contains('easier')) edit(id).easier = t.value.trim();
  if (t.classList.contains('harder')) edit(id).harder = t.value.trim();
  save();
  tr.classList.toggle('touched', touched(ROWS.find(r => r.id === id)));
  counts();
});
tb.addEventListener('click', e => {
  const b = e.target.closest('.tier button'); if (!b) return;
  const tr = b.closest('tr'), id = tr.dataset.id;
  edit(id).tier = b.dataset.t; save();
  b.parentNode.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
  tr.classList.toggle('touched', touched(ROWS.find(r => r.id === id)));
  counts();
});

/* ---- ladders: what he has actually built, family by family ---- */
function ladders(){
  const box = document.getElementById('ladders');
  box.innerHTML = FAMS.map(([key, label]) => {
    const inFam = ROWS.filter(r => val(r,'fam') === key)
      .sort((a,b) => (val(a,'diff')||99) - (val(b,'diff')||99));
    const fund = inFam.filter(r => val(r,'tier'));
    const body = fund.length
      ? fund.map(r => `<div class="step"><span class="dot ${val(r,'tier')}"></span>
          <span>${esc(r.name)}</span><span class="d">${val(r,'diff')||'?'}</span></div>`).join('')
      : '<div class="empty">Nothing marked as fundamental yet.</div>';
    return `<div class="lcard"><h3>${label}</h3>
      <div class="n">${fund.length} fundamental of ${inFam.length} in this family</div>
      ${body}</div>`;
  }).join('');
}

/* ---- save / load ---- */
document.getElementById('save').onclick = () => {
  const out = {};
  for (const r of ROWS) {
    if (!touched(r)) continue;
    const e = EDITS[r.id], o = {};
    if (e.tier)   o.fundamental = e.tier;
    if (e.fam !== undefined && e.fam !== r.guess) o.family = e.fam;
    if (e.level !== undefined && e.level !== r.level) o.level = e.level;
    if (e.diff  !== undefined && String(e.diff) !== String(r.diff ?? '')) o.diff = e.diff;
    if (e.easier !== undefined && e.easier !== r.easier) o.easier = e.easier;
    if (e.harder !== undefined && e.harder !== r.harder) o.harder = e.harder;
    if (Object.keys(o).length) out[r.id] = o;
  }
  const blob = new Blob([JSON.stringify({
    savedAt: new Date().toISOString(),
    counts: ['beg','int','adv'].reduce((a,k) =>
      (a[k] = ROWS.filter(r => val(r,'tier') === k).length, a), {}),
    changes: out,
  }, null, 2)], { type:'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'classification.json';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
};
document.getElementById('load').onclick = () => document.getElementById('file').click();
document.getElementById('file').onchange = ev => {
  const f = ev.target.files[0]; if (!f) return;
  const fr = new FileReader();
  fr.onload = () => {
    try {
      const j = JSON.parse(fr.result), ch = j.changes || j;
      EDITS = {};
      for (const [id, o] of Object.entries(ch)) {
        const e = EDITS[id] = {};
        if (o.fundamental) e.tier = o.fundamental;
        if (o.family !== undefined) e.fam = o.family;
        if (o.level  !== undefined) e.level = o.level;
        if (o.diff   !== undefined) e.diff = o.diff;
        if (o.easier !== undefined) e.easier = o.easier;
        if (o.harder !== undefined) e.harder = o.harder;
      }
      save(); render(); ladders();
      alert('Loaded ' + Object.keys(ch).length + ' movements.');
    } catch (err) { alert('That file could not be read: ' + err.message); }
  };
  fr.readAsText(f);
};
document.getElementById('reset').onclick = () => {
  if (!confirm('Throw away every change and go back to the proposed fifty?')) return;
  localStorage.removeItem(KEY);
  EDITS = {};
  for (const r of ROWS) if (r.seed) EDITS[r.id] = { tier: r.seed };
  save(); render(); ladders();
};

/* ---- wiring ---- */
const vC = document.getElementById('viewClassify'), vL = document.getElementById('viewLadders');
document.getElementById('vClassify').onclick = () => {
  vC.classList.remove('hide'); vL.classList.add('hide');
  document.getElementById('vClassify').classList.add('on');
  document.getElementById('vLadders').classList.remove('on');
  document.getElementById('filters').classList.remove('hide');
};
document.getElementById('vLadders').onclick = () => {
  ladders();
  vL.classList.remove('hide'); vC.classList.add('hide');
  document.getElementById('vLadders').classList.add('on');
  document.getElementById('vClassify').classList.remove('on');
  document.getElementById('filters').classList.add('hide');
};
document.getElementById('q').oninput = e => { F.q = e.target.value.trim().toLowerCase(); render(); };
document.getElementById('fFam').onchange = e => { F.fam = e.target.value; render(); };
document.getElementById('fPat').onchange = e => { F.pat = e.target.value; render(); };
document.getElementById('fLvl').onchange = e => { F.lvl = e.target.value; render(); };
document.querySelectorAll('.chip[data-f]').forEach(c => c.onclick = () => {
  const k = c.dataset.f;
  F.flags.has(k) ? F.flags.delete(k) : F.flags.add(k);
  c.classList.toggle('on'); render();
});

/* option lists */
document.getElementById('fFam').innerHTML += FAMS
  .map(f => `<option value="${f[0]}">${f[1]}</option>`).join('');
document.getElementById('fPat').innerHTML += [...new Set(ROWS.map(r => r.pattern))]
  .filter(Boolean).sort().map(p => `<option>${p}</option>`).join('');
document.getElementById('allIds').innerHTML = ROWS
  .map(r => `<option value="${r.id}">${esc(r.name)}</option>`).join('');
document.getElementById('total').textContent = ROWS.length;

if (PAY.seedMissing.length) {
  const n = document.getElementById('seedNote');
  n.classList.remove('hide');
  n.innerHTML = '<b>' + PAY.seedMissing.length + ' of the fifty I proposed have no movement ' +
    'in the database yet,</b> so they are not pre-marked below. They are real gaps rather ' +
    'than mistakes — pick the closest movement instead, or tell me to add them:<br>' +
    PAY.seedMissing.map(esc).join(' · ');
}

render();
</script></body></html>
